<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Gleichmäßige und ungleiche Verteilung je nach Linkanzahl</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Warum 2, 4 oder 8 Links? – 8 Hash-Werte auf Links verteilen</text>
<!-- 4 Links -->
<text x="20" y="65" font-size="14" font-weight="bold" fill="#39c86a">4 Links: je 2 von 8 Werten → 1:1:1:1</text>
<g font-size="13" text-anchor="middle" fill="#222">
<rect x="20" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="40" y="101">0</text>
<rect x="64" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="84" y="101">1</text>
<rect x="108" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="128" y="101">2</text>
<rect x="152" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="172" y="101">3</text>
<rect x="196" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="216" y="101">4</text>
<rect x="240" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="260" y="101">5</text>
<rect x="284" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="304" y="101">6</text>
<rect x="328" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="348" y="101">7</text>
</g>
<g font-size="13" text-anchor="middle" fill="#fff">
<rect x="20" y="140" width="84" height="34" rx="4" fill="#39c86a"/><text x="62" y="162">Link 1</text>
<rect x="108" y="140" width="84" height="34" rx="4" fill="#39c86a"/><text x="150" y="162">Link 2</text>
<rect x="196" y="140" width="84" height="34" rx="4" fill="#39c86a"/><text x="238" y="162">Link 3</text>
<rect x="284" y="140" width="84" height="34" rx="4" fill="#39c86a"/><text x="326" y="162">Link 4</text>
</g>
<g stroke="#222" stroke-width="2">
<line x1="40" y1="114" x2="52" y2="140"/><line x1="84" y1="114" x2="72" y2="140"/>
<line x1="128" y1="114" x2="140" y2="140"/><line x1="172" y1="114" x2="160" y2="140"/>
<line x1="216" y1="114" x2="228" y2="140"/><line x1="260" y1="114" x2="248" y2="140"/>
<line x1="304" y1="114" x2="316" y2="140"/><line x1="348" y1="114" x2="336" y2="140"/>
</g>
<text x="194" y="198" text-anchor="middle" font-size="12" fill="#222">je 25 % (bei vielen verschiedenen Flows)</text>
<!-- 3 Links -->
<text x="420" y="65" font-size="14" font-weight="bold" fill="#ff6b6b">3 Links: 8 Werte passen nicht → 3:3:2</text>
<g font-size="13" text-anchor="middle" fill="#222">
<rect x="420" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="440" y="101">0</text>
<rect x="464" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="484" y="101">1</text>
<rect x="508" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="528" y="101">2</text>
<rect x="552" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="572" y="101">3</text>
<rect x="596" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="616" y="101">4</text>
<rect x="640" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="660" y="101">5</text>
<rect x="684" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="704" y="101">6</text>
<rect x="728" y="78" width="40" height="36" rx="4" fill="#ffd23f"/><text x="748" y="101">7</text>
</g>
<g font-size="13" text-anchor="middle" fill="#fff">
<rect x="420" y="140" width="128" height="34" rx="4" fill="#ff6b6b"/><text x="484" y="162">Link 1 (3/8)</text>
<rect x="552" y="140" width="128" height="34" rx="4" fill="#ff6b6b"/><text x="616" y="162">Link 2 (3/8)</text>
<rect x="684" y="140" width="84" height="34" rx="4" fill="#39c86a"/><text x="726" y="162">Link 3</text>
</g>
<g stroke="#222" stroke-width="2">
<line x1="440" y1="114" x2="440" y2="140"/><line x1="484" y1="114" x2="484" y2="140"/><line x1="528" y1="114" x2="528" y2="140"/>
<line x1="572" y1="114" x2="572" y2="140"/><line x1="616" y1="114" x2="616" y2="140"/><line x1="660" y1="114" x2="660" y2="140"/>
<line x1="704" y1="114" x2="704" y2="140"/><line x1="748" y1="114" x2="748" y2="140"/>
</g>
<text x="594" y="198" text-anchor="middle" font-size="12" fill="#222">zwei Links tragen je 37,5 %, einer nur 25 %</text>
<!-- Dominanter Flow -->
<text x="20" y="245" font-size="14" font-weight="bold" fill="#222">Auch bei 4 Links: wenig Varianz in der Hash-Eingabe = Ungleichgewicht</text>
<rect x="20" y="262" width="110" height="60" rx="6" fill="#4a9cff"/><text x="75" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Access-SW</text>
<rect x="420" y="262" width="110" height="60" rx="6" fill="#4a9cff"/><text x="475" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Dist-SW</text>
<line x1="130" y1="270" x2="420" y2="270" stroke="#ff6b6b" stroke-width="7"/>
<line x1="130" y1="286" x2="420" y2="286" stroke="#bbb" stroke-width="2"/>
<line x1="130" y1="300" x2="420" y2="300" stroke="#bbb" stroke-width="2"/>
<line x1="130" y1="314" x2="420" y2="314" stroke="#bbb" stroke-width="2"/>
<text x="275" y="262" text-anchor="middle" font-size="11" fill="#ff6b6b">~90 % des Verkehrs</text>
<rect x="550" y="250" width="235" height="80" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="560" y="272" font-size="12" fill="#222">Methode dst-mac: fast alles geht</text>
<text x="560" y="290" font-size="12" fill="#222">an die MAC des Gateways</text>
<text x="560" y="308" font-size="12" fill="#222">→ gleicher Hash → ein Link</text>
<rect x="20" y="350" width="765" height="85" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<g font-size="12" fill="#222">
<text x="32" y="372">• Bündel mit 2, 4 oder 8 Membern planen (Zweierpotenz, nicht nur „gerade“: 6 Links → 2:2:1:1:1:1)</text>
<text x="32" y="394">• Hash-Eingabe passend zum Verkehr: viele Quellen → src-…, viele Ziele → dst-…, wenige Hosts → L4-Ports</text>
<text x="32" y="416">• Auslastung je Member prüfen: show etherchannel traffic · Methode: show etherchannel load-balance</text>
</g>
</svg>
