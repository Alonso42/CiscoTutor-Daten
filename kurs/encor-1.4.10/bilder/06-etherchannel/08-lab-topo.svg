<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery 6: EtherChannel-Fehler finden und beheben</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Discovery 6: zwei kaputte EtherChannels</text>
<rect x="120" y="50" width="110" height="150" rx="6" fill="#4a9cff"/>
<text x="175" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW1</text>
<text x="175" y="98" text-anchor="middle" font-size="11" fill="#fff">soll: LACP active</text>
<rect x="570" y="50" width="110" height="150" rx="6" fill="#4a9cff"/>
<text x="625" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW2</text>
<text x="625" y="98" text-anchor="middle" font-size="11" fill="#fff">soll: LACP passive</text>
<g font-size="11" fill="#222">
<line x1="230" y1="115" x2="570" y2="115" stroke="#39c86a" stroke-width="4"/>
<line x1="230" y1="135" x2="570" y2="135" stroke="#39c86a" stroke-width="4"/>
<line x1="230" y1="160" x2="570" y2="160" stroke="#b08aff" stroke-width="4"/>
<line x1="230" y1="180" x2="570" y2="180" stroke="#b08aff" stroke-width="4"/>
<text x="236" y="111">E0/0</text><text x="564" y="111" text-anchor="end">E0/0</text>
<text x="236" y="131">E0/1</text><text x="564" y="131" text-anchor="end">E0/1</text>
<text x="236" y="156">E0/2</text><text x="564" y="156" text-anchor="end">E0/2</text>
<text x="236" y="176">E0/3</text><text x="564" y="176" text-anchor="end">E0/3</text>
<text x="400" y="128" text-anchor="middle" font-weight="bold" fill="#39c86a">Po1</text>
<text x="400" y="174" text-anchor="middle" font-weight="bold" fill="#b08aff">Po2</text>
</g>
<rect x="20" y="215" width="80" height="34" rx="3" fill="#eee" stroke="#222"/><text x="60" y="237" text-anchor="middle" font-size="11" fill="#222">PC1 .11</text>
<rect x="700" y="215" width="80" height="34" rx="3" fill="#eee" stroke="#222"/><text x="740" y="237" text-anchor="middle" font-size="11" fill="#222">PC2 .12</text>
<line x1="100" y1="232" x2="150" y2="200" stroke="#222" stroke-width="2"/>
<line x1="700" y1="232" x2="650" y2="200" stroke="#222" stroke-width="2"/>
<text x="400" y="225" text-anchor="middle" font-size="12" fill="#222">Dot1Q-Trunks · PCs in VLAN 11 (10.10.11.0/24) · SW1 E1/0, SW2 E1/0</text>
<!-- Fehler 1 -->
<rect x="20" y="262" width="375" height="175" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<g font-size="12" fill="#222">
<text x="32" y="283" font-weight="bold">Fehler 1: Po2</text>
<text x="32" y="303">SW2: Po2(SD) LACP, E0/2(s) E0/3(s)</text>
<text x="32" y="321">SW1: Po2(SU) Protocol „-“, Member (P)</text>
<text x="32" y="339">→ SW1 statisch (mode on), SW2 LACP</text>
<text x="32" y="361" font-family="monospace" font-size="11">no channel-group 2 mode on</text>
<text x="32" y="377" font-family="monospace" font-size="11">channel-group 2 mode active</text>
<text x="32" y="399">Zusatz im Lab: SW2 Po2 erlaubte VLAN 11</text>
<text x="32" y="415">nicht → no switchport trunk allowed vlan …</text>
<text x="32" y="431" font-size="11">(PC1↔PC2 erst danach erreichbar)</text>
</g>
<!-- Fehler 2 -->
<rect x="405" y="262" width="375" height="175" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<g font-size="12" fill="#222">
<text x="417" y="283" font-weight="bold">Fehler 2: Po1 nur halb</text>
<text x="417" y="303">SW1: Po1 nur E0/1(P)</text>
<text x="417" y="321">SW2: E0/0(s) E0/1(P)</text>
<text x="417" y="339">→ SW1 E0/0: no switchport, kein channel-group</text>
<text x="417" y="361" font-family="monospace" font-size="11">switchport</text>
<text x="417" y="377" font-family="monospace" font-size="11">switchport trunk encapsulation dot1q</text>
<text x="417" y="393" font-family="monospace" font-size="11">switchport mode trunk</text>
<text x="417" y="409" font-family="monospace" font-size="11">channel-group 1 mode active</text>
<text x="417" y="429">Ergebnis: Po1(SU), E0/0(P) E0/1(P)</text>
</g>
</svg>
