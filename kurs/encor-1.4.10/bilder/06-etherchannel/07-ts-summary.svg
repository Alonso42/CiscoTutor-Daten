<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>show etherchannel summary lesen</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">show etherchannel summary richtig lesen</text>
<rect x="20" y="45" width="760" height="120" rx="6" fill="#f7f7f7" stroke="#222"/>
<g font-size="13" font-family="monospace" fill="#222">
<text x="32" y="68">Group  Port-channel  Protocol    Ports</text>
<text x="32" y="86">------+-------------+-----------+---------------------------</text>
<text x="32" y="106">1      Po1(SU)         LACP      Gi1/0/1(P)  Gi1/0/2(H)</text>
<text x="32" y="126">2      Po2(SD)         LACP      Gi1/0/3(s)  Gi1/0/4(s)</text>
<text x="32" y="146">3      Po3(SU)          -        Gi1/0/5(P)  Gi1/0/6(P)</text>
</g>
<rect x="82" y="93" width="62" height="18" fill="none" stroke="#39c86a" stroke-width="2"/>
<rect x="82" y="113" width="62" height="18" fill="none" stroke="#ff6b6b" stroke-width="2"/>
<rect x="210" y="133" width="22" height="18" fill="none" stroke="#b08aff" stroke-width="2"/>
<text x="590" y="106" font-size="11" fill="#222">LACP, 1 aktiv + 1 Standby</text>
<text x="590" y="126" font-size="11" fill="#ff6b6b">nicht gebildet, Member suspendiert</text>
<text x="590" y="146" font-size="11" fill="#222">statisch (mode on)</text>
<!-- Legende -->
<g font-size="12" fill="#222">
<rect x="20" y="180" width="370" height="150" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="32" y="200" font-weight="bold">Port-channel-Status</text>
<text x="32" y="222">S = Layer 2 · R = Layer 3</text>
<text x="32" y="242">U = in use (gut) · D = down (nicht gebildet)</text>
<text x="32" y="262">M = min-links nicht erfüllt</text>
<text x="32" y="282">Gesund: (SU) bzw. (RU)</text>
<text x="32" y="306" font-weight="bold">Protocol-Spalte</text>
<text x="32" y="322">LACP · PAgP · „-“ = mode on (statisch)</text>
<rect x="410" y="180" width="370" height="150" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="422" y="200" font-weight="bold">Member-Flags</text>
<text x="422" y="222">P = bundled in port-channel (nicht „passive“!)</text>
<text x="422" y="242">s = suspended (inkonsistent / Partner ohne LACP)</text>
<text x="422" y="262">I = stand-alone (kein passender Partner)</text>
<text x="422" y="282">H = Hot-Standby (nur LACP)</text>
<text x="422" y="302">D = down · w = waiting · u = unsuitable</text>
<text x="422" y="322">f = failed to allocate aggregator</text>
</g>
<rect x="20" y="342" width="760" height="95" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<g font-size="12" fill="#222">
<text x="32" y="362" font-weight="bold">Diagnose-Reihenfolge</text>
<text x="32" y="382">1 Modi/Protokoll beider Seiten (on gegen LACP? passive/passive?)  2 show interfaces: Speed/Duplex</text>
<text x="32" y="402">3 show interfaces switchport / show run int: Mode, Access-/Native-/Allowed-VLAN, Encapsulation, Layer</text>
<text x="32" y="422">4 err-disabled (channel-misconfig)? → EtherChannel Guard: beide Seiten korrigieren, shut/no shut</text>
</g>
</svg>
