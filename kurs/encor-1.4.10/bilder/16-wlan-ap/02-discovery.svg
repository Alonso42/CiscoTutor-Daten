<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>CAPWAP Discovery: vier Quellen für WLC-Adressen</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Wie lernt ein AP WLC-Adressen?</text>
<rect x="340" y="370" width="120" height="55" rx="8" fill="#4a9cff"/>
<text x="400" y="395" text-anchor="middle" font-size="14" fill="#ffffff">Lightweight AP</text>
<text x="400" y="413" text-anchor="middle" font-size="11" fill="#ffffff">hat IP-Adresse</text>
<g font-size="12" fill="#222">
<rect x="15" y="60" width="180" height="200" rx="8" fill="none" stroke="#39c86a" stroke-width="2"/>
<text x="105" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#39c86a">Subnet Broadcast</text>
<text x="25" y="110">Discovery Request als</text>
<text x="25" y="126">Broadcast im eigenen Subnetz</text>
<text x="25" y="150">Endet am Router, außer:</text>
<text x="25" y="166">ip helper-address +</text>
<text x="25" y="182">ip forward-protocol</text>
<text x="25" y="198">udp 5246 (L3)</text>
<rect x="210" y="60" width="180" height="200" rx="8" fill="none" stroke="#b08aff" stroke-width="2"/>
<text x="300" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#b08aff">Lokal gespeichert</text>
<text x="220" y="110">NVRAM: Primary,</text>
<text x="220" y="126">Secondary, Tertiary</text>
<text x="220" y="150">gelernte Mobility-</text>
<text x="220" y="166">Group-Mitglieder</text>
<text x="220" y="190">überlebt Reboot</text>
<text x="220" y="214">(capwap ap primary-base)</text>
<rect x="405" y="60" width="180" height="200" rx="8" fill="none" stroke="#ffd23f" stroke-width="3"/>
<text x="495" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">DHCP Vendor Option</text>
<text x="415" y="110">IPv4: Option 43</text>
<text x="415" y="126">IPv6: Option 52</text>
<text x="415" y="150">AP sendet Option 60</text>
<text x="415" y="166">(Vendor Class, modell-</text>
<text x="415" y="182">abhängig)</text>
<text x="415" y="206">Liste im DHCP ACK</text>
<text x="415" y="222">→ Unicast Discovery</text>
<rect x="600" y="60" width="185" height="200" rx="8" fill="none" stroke="#ff6b6b" stroke-width="2"/>
<text x="692" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#ff6b6b">DNS</text>
<text x="610" y="110">DHCP Option 6 (DNS-</text>
<text x="610" y="126">Server) + Option 15</text>
<text x="610" y="142">(Domain)</text>
<text x="610" y="166">Lookup:</text>
<text x="610" y="182">CISCO-CAPWAP-</text>
<text x="610" y="198">CONTROLLER.&lt;domain&gt;</text>
<text x="610" y="222">Domain je Scope →</text>
<text x="610" y="238">APs auf WLCs verteilen</text>
</g>
<line x1="105" y1="262" x2="360" y2="368" stroke="#39c86a" stroke-width="2"/>
<line x1="300" y1="262" x2="385" y2="368" stroke="#b08aff" stroke-width="2"/>
<line x1="495" y1="262" x2="415" y2="368" stroke="#ffd23f" stroke-width="3"/>
<line x1="692" y1="262" x2="440" y2="368" stroke="#ff6b6b" stroke-width="2"/>
<text x="400" y="300" text-anchor="middle" font-size="13" fill="#222">Ziel: möglichst viele WLCs sammeln, dann auswählen</text>
</svg>
