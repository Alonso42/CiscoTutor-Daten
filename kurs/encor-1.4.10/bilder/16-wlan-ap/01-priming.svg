<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Universal AP Priming: manuell und automatisch</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Universal AP Priming</text>
<rect x="20" y="55" width="360" height="370" rx="10" fill="none" stroke="#4a9cff" stroke-width="2"/>
<text x="200" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a9cff">1. Manuell (mind. 1 AP)</text>
<rect x="45" y="120" width="70" height="120" rx="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="80" y="170" text-anchor="middle" font-size="12" fill="#222">Smart-</text>
<text x="80" y="186" text-anchor="middle" font-size="12" fill="#222">phone</text>
<text x="80" y="258" text-anchor="middle" font-size="12" fill="#222">AirProvision-App</text>
<circle cx="60" cy="300" r="18" fill="#ffd23f"/>
<text x="60" y="305" text-anchor="middle" font-size="11" fill="#222">GPS</text>
<rect x="88" y="285" width="60" height="30" rx="5" fill="#ffd23f"/>
<text x="118" y="305" text-anchor="middle" font-size="11" fill="#222">MCC</text>
<text x="105" y="340" text-anchor="middle" font-size="11" fill="#222">Standort = GPS-Koordinaten</text>
<text x="105" y="355" text-anchor="middle" font-size="11" fill="#222">+ Mobile Country Code</text>
<line x1="120" y1="180" x2="250" y2="180" stroke="#39c86a" stroke-width="3"/>
<polygon points="250,172 266,180 250,188" fill="#39c86a"/>
<text x="190" y="168" text-anchor="middle" font-size="11" fill="#222">SSID (WPA2-PSK empf.)</text>
<text x="190" y="200" text-anchor="middle" font-size="11" fill="#222">gleiches WLAN</text>
<rect x="268" y="155" width="90" height="50" rx="8" fill="#4a9cff"/>
<text x="313" y="178" text-anchor="middle" font-size="13" fill="#ffffff">AP 1</text>
<text x="313" y="195" text-anchor="middle" font-size="11" fill="#ffffff">geprimt</text>
<text x="200" y="400" text-anchor="middle" font-size="12" fill="#222">Ein bereits auf ein anderes Land geprimter</text>
<text x="200" y="416" text-anchor="middle" font-size="12" fill="#222">AP muss erneut manuell geprimt werden.</text>
<rect x="420" y="55" width="360" height="370" rx="10" fill="none" stroke="#b08aff" stroke-width="2"/>
<text x="600" y="82" text-anchor="middle" font-size="17" font-weight="bold" fill="#b08aff">2. Automatisch (NDP)</text>
<rect x="555" y="120" width="90" height="50" rx="8" fill="#4a9cff"/>
<text x="600" y="143" text-anchor="middle" font-size="13" fill="#ffffff">AP 1</text>
<text x="600" y="160" text-anchor="middle" font-size="11" fill="#ffffff">geprimt</text>
<rect x="445" y="290" width="90" height="50" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="490" y="320" text-anchor="middle" font-size="13" fill="#222">AP 2</text>
<rect x="665" y="290" width="90" height="50" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="710" y="320" text-anchor="middle" font-size="13" fill="#222">AP 3</text>
<line x1="580" y1="172" x2="500" y2="285" stroke="#b08aff" stroke-width="3" stroke-dasharray="8,5"/>
<line x1="620" y1="172" x2="700" y2="285" stroke="#b08aff" stroke-width="3" stroke-dasharray="8,5"/>
<text x="600" y="225" text-anchor="middle" font-size="12" fill="#222">Beacon mit verschlüsseltem</text>
<text x="600" y="241" text-anchor="middle" font-size="12" fill="#222">Domain/Country-Teil</text>
<text x="600" y="380" text-anchor="middle" font-size="12" fill="#222">Nicht geprimte Universal APs der</text>
<text x="600" y="396" text-anchor="middle" font-size="12" fill="#222">RF-Nachbarschaft übernehmen die Werte.</text>
</svg>
