<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>AP Failover per Heartbeat und Backup-Reihenfolge</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">AP Failover</text>
<g font-size="13" text-anchor="middle">
<rect x="40" y="60" width="200" height="40" rx="8" fill="#39c86a"/><text x="140" y="85" fill="#222">Primary-WLC</text>
<rect x="290" y="60" width="200" height="40" rx="8" fill="#ff6b6b"/><text x="390" y="85" fill="#fff">Primary-WLC ausgefallen</text>
<rect x="540" y="60" width="200" height="40" rx="8" fill="#4a9cff"/><text x="640" y="85" fill="#fff">Backup-WLC</text>
<rect x="90" y="220" width="100" height="36" rx="6" fill="#fff" stroke="#222" stroke-width="2"/><text x="140" y="243" fill="#222">AP</text>
<rect x="340" y="220" width="100" height="36" rx="6" fill="#fff" stroke="#222" stroke-width="2"/><text x="390" y="243" fill="#222">AP</text>
<rect x="590" y="220" width="100" height="36" rx="6" fill="#fff" stroke="#222" stroke-width="2"/><text x="640" y="243" fill="#222">AP</text>
</g>
<g stroke-width="2">
<line x1="120" y1="215" x2="120" y2="105" stroke="#222"/><polygon points="115,107 120,100 125,107" fill="#222"/>
<line x1="160" y1="105" x2="160" y2="215" stroke="#39c86a"/><polygon points="155,213 160,220 165,213" fill="#39c86a"/>
<line x1="390" y1="215" x2="390" y2="105" stroke="#222" stroke-dasharray="6,4"/><polygon points="385,107 390,100 395,107" fill="#222"/>
<line x1="640" y1="215" x2="640" y2="105" stroke="#4a9cff"/><polygon points="635,107 640,100 645,107" fill="#4a9cff"/>
</g>
<g font-size="12" fill="#222">
<text x="20" y="150">Heartbeat</text><text x="20" y="166">alle 30 s</text>
<text x="170" y="160">ACK</text>
<text x="400" y="150">kein ACK →</text><text x="400" y="166">bis zu 5 Wieder-</text><text x="400" y="182">holungen</text>
<text x="650" y="150">Join beim</text><text x="650" y="166">nächsten WLC</text>
</g>
<rect x="40" y="290" width="720" height="140" rx="8" fill="none" stroke="#b08aff" stroke-width="2"/>
<text x="60" y="315" font-size="14" font-weight="bold" fill="#222">Reihenfolge nach Ausfall des Primary</text>
<g font-size="13" fill="#222">
<text x="60" y="342">AP-Secondary → AP-Tertiary → WLC-Primary-Backup → WLC-Secondary-Backup → dynamisch (least loaded)</text>
<text x="60" y="368">AP-Priorität 1 Low (Default) … 4 Critical: voller Backup-WLC verdrängt niedrig priorisierte APs</text>
<text x="60" y="394">AP Fallback (Default an): zurück zum Primary, kurze Unterbrechung beim Rejoin</text>
<text x="60" y="418">Primary Discovery Timeout: 30–3600 s, Default 120 s</text>
</g>
</svg>
