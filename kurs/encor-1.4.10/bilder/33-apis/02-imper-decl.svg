<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Imperatives (OpenFlow) und deklaratives (OpFlex) SDN-Modell</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Imperativ vs. deklarativ</text>
<line x1="400" y1="45" x2="400" y2="420" stroke="#ccc" stroke-width="2"/>
<!-- left -->
<text x="200" y="65" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">OpenFlow – imperativ</text>
<rect x="120" y="80" width="160" height="50" rx="8" fill="#4a9cff" fill-opacity="0.25" stroke="#4a9cff" stroke-width="2"/>
<text x="200" y="110" text-anchor="middle" font-size="14" fill="#222">Controller</text>
<line x1="200" y1="132" x2="200" y2="245" stroke="#ff6b6b" stroke-width="3"/>
<polygon points="200,250 192,235 208,235" fill="#ff6b6b"/>
<rect x="40" y="150" width="320" height="80" rx="6" fill="#fff" stroke="#ff6b6b"/>
<text x="55" y="172" font-size="12" fill="#222" font-family="monospace">match dst=10.2.0.0/16, in_port=1</text>
<text x="55" y="192" font-size="12" fill="#222" font-family="monospace">  → output port 3, prio 200</text>
<text x="55" y="212" font-size="12" fill="#222" font-family="monospace">match tcp/23 → drop ...</text>
<rect x="120" y="255" width="160" height="50" fill="#fff" stroke="#222"/>
<text x="200" y="278" text-anchor="middle" font-size="14" fill="#222">Switch</text>
<text x="200" y="296" text-anchor="middle" font-size="12" fill="#222">Flow-Tabelle wird beschrieben</text>
<text x="30" y="340" font-size="13" fill="#222">• Controller sagt WIE: detaillierte Einträge</text>
<text x="30" y="362" font-size="13" fill="#222">• Geräte-Intelligenz kaum genutzt</text>
<text x="30" y="384" font-size="13" fill="#222">• Controller muss jedes Detail kennen</text>
<!-- right -->
<text x="600" y="65" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">OpFlex – deklarativ</text>
<rect x="520" y="80" width="160" height="50" rx="8" fill="#b08aff" fill-opacity="0.25" stroke="#b08aff" stroke-width="2"/>
<text x="600" y="110" text-anchor="middle" font-size="14" fill="#222">Controller (APIC)</text>
<line x1="600" y1="132" x2="600" y2="245" stroke="#39c86a" stroke-width="3"/>
<polygon points="600,250 592,235 608,235" fill="#39c86a"/>
<rect x="440" y="160" width="320" height="55" rx="6" fill="#fff" stroke="#39c86a"/>
<text x="600" y="184" text-anchor="middle" font-size="13" fill="#222">Policy: „Web-Gruppe darf zu App-Gruppe,</text>
<text x="600" y="203" text-anchor="middle" font-size="13" fill="#222">nur TCP 8080“</text>
<rect x="520" y="255" width="160" height="50" fill="#fff" stroke="#222"/>
<text x="600" y="278" text-anchor="middle" font-size="14" fill="#222">Switch</text>
<text x="600" y="296" text-anchor="middle" font-size="12" fill="#222">eigene Control Plane setzt um</text>
<text x="430" y="340" font-size="13" fill="#222">• Controller sagt WAS: abstrakte Policy</text>
<text x="430" y="362" font-size="13" fill="#222">• Gerät rendert Details selbst</text>
<text x="430" y="384" font-size="13" fill="#222">• Controller vertraut dem Gerät</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#222">NETCONF ändert die Konfiguration – OpenFlow ändert direkt die Forwarding-Tabelle</text>
</svg>
