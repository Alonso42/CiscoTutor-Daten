<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>SDN-Schichten mit Northbound- und Southbound-APIs</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">SDN: drei Ebenen, zwei API-Richtungen</text>
<!-- application plane -->
<rect x="140" y="55" width="420" height="80" rx="10" fill="#b08aff" fill-opacity="0.25" stroke="#b08aff" stroke-width="2"/>
<text x="350" y="78" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Application Plane</text>
<rect x="165" y="90" width="110" height="32" rx="5" fill="#fff" stroke="#b08aff"/><text x="220" y="111" text-anchor="middle" font-size="12" fill="#222">Python-Skript</text>
<rect x="295" y="90" width="110" height="32" rx="5" fill="#fff" stroke="#b08aff"/><text x="350" y="111" text-anchor="middle" font-size="12" fill="#222">ITSM / Ticketing</text>
<rect x="425" y="90" width="110" height="32" rx="5" fill="#fff" stroke="#b08aff"/><text x="480" y="111" text-anchor="middle" font-size="12" fill="#222">Monitoring-App</text>
<!-- NB arrow -->
<line x1="350" y1="137" x2="350" y2="183" stroke="#4a9cff" stroke-width="4"/>
<polygon points="350,135 342,150 358,150" fill="#4a9cff"/><polygon points="350,185 342,170 358,170" fill="#4a9cff"/>
<text x="370" y="158" font-size="14" fill="#222" font-weight="bold">Northbound API</text>
<text x="370" y="175" font-size="12" fill="#222">meist REST/JSON, je Controller verschieden (kein Einheitsstandard)</text>
<!-- control plane -->
<rect x="140" y="188" width="420" height="80" rx="10" fill="#4a9cff" fill-opacity="0.2" stroke="#4a9cff" stroke-width="2"/>
<text x="350" y="212" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Control Plane</text>
<text x="350" y="234" text-anchor="middle" font-size="13" fill="#222">SDN-Controller (z. B. Catalyst Center, SD-WAN Manager, APIC)</text>
<text x="350" y="254" text-anchor="middle" font-size="12" fill="#222">zentrale Sicht und Steuerung</text>
<!-- SB arrow -->
<line x1="350" y1="270" x2="350" y2="316" stroke="#39c86a" stroke-width="4"/>
<polygon points="350,268 342,283 358,283" fill="#39c86a"/><polygon points="350,318 342,303 358,303" fill="#39c86a"/>
<text x="370" y="290" font-size="14" fill="#222" font-weight="bold">Southbound API</text>
<text x="370" y="307" font-size="12" fill="#222">OpenFlow · NETCONF · OpFlex (auch SSH/CLI, SNMP)</text>
<!-- data plane -->
<rect x="140" y="322" width="420" height="95" rx="10" fill="#39c86a" fill-opacity="0.18" stroke="#39c86a" stroke-width="2"/>
<text x="350" y="345" text-anchor="middle" font-size="16" fill="#222" font-weight="bold">Data (Forwarding) Plane</text>
<circle cx="220" cy="383" r="20" fill="#fff" stroke="#222"/><text x="220" y="388" text-anchor="middle" font-size="13" fill="#222">R</text>
<rect x="300" y="365" width="55" height="35" fill="#fff" stroke="#222"/><text x="327" y="388" text-anchor="middle" font-size="13" fill="#222">SW</text>
<rect x="395" y="365" width="55" height="35" fill="#fff" stroke="#222"/><text x="422" y="388" text-anchor="middle" font-size="13" fill="#222">SW</text>
<circle cx="490" cy="383" r="20" fill="#fff" stroke="#222"/><text x="490" y="388" text-anchor="middle" font-size="13" fill="#222">R</text>
<!-- side notes -->
<rect x="590" y="70" width="190" height="330" rx="8" fill="#ffd23f" fill-opacity="0.2" stroke="#ffd23f"/>
<text x="600" y="95" font-size="13" fill="#222" font-weight="bold">Merksätze</text>
<text x="600" y="120" font-size="12" fill="#222">Northbound: App ↔ Controller</text>
<text x="600" y="140" font-size="12" fill="#222">Southbound: Controller ↔ Gerät</text>
<text x="600" y="170" font-size="12" fill="#222">OpenFlow (ONF):</text>
<text x="600" y="186" font-size="12" fill="#222">  schreibt Flow-Tabellen</text>
<text x="600" y="210" font-size="12" fill="#222">NETCONF (IETF):</text>
<text x="600" y="226" font-size="12" fill="#222">  Konfiguration, XML, RPC,</text>
<text x="600" y="242" font-size="12" fill="#222">  transaktional</text>
<text x="600" y="266" font-size="12" fill="#222">OpFlex: deklarative Policy,</text>
<text x="600" y="282" font-size="12" fill="#222">  Gerät setzt selbst um</text>
<text x="600" y="312" font-size="12" fill="#222">Traditionell: jede Box hat</text>
<text x="600" y="328" font-size="12" fill="#222">  eigene Control Plane</text>
<text x="600" y="352" font-size="12" fill="#222">SDN: Control Plane</text>
<text x="600" y="368" font-size="12" fill="#222">  zentral im Controller</text>
<text x="30" y="440" font-size="11" fill="#222">Eigene Darstellung nach ENCOR-Kursinhalt</text>
</svg>
