<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>REST-API-Sicherheit: TLS mit Serverzertifikat und Basic Auth</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Zwei Teile der REST-API-Sicherheit</text>
<!-- client -->
<rect x="40" y="110" width="180" height="90" rx="8" fill="#4a9cff" fill-opacity="0.2" stroke="#4a9cff" stroke-width="2"/>
<text x="130" y="145" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Catalyst Center</text>
<text x="130" y="168" text-anchor="middle" font-size="12" fill="#222">HTTPS-Client</text>
<text x="130" y="186" text-anchor="middle" font-size="12" fill="#222">vertraut Root-CA / Self-Signed</text>
<!-- server -->
<rect x="580" y="110" width="180" height="90" rx="8" fill="#b08aff" fill-opacity="0.2" stroke="#b08aff" stroke-width="2"/>
<text x="670" y="145" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Cisco ISE</text>
<text x="670" y="168" text-anchor="middle" font-size="12" fill="#222">HTTPS-Server</text>
<text x="670" y="186" text-anchor="middle" font-size="12" fill="#222">Admin-User mit REST-Rechten</text>
<!-- arrows -->
<line x1="222" y1="130" x2="575" y2="130" stroke="#39c86a" stroke-width="3"/><polygon points="578,130 563,123 563,137" fill="#39c86a"/>
<text x="400" y="122" text-anchor="middle" font-size="13" fill="#222">REST-Request (z. B. TrustSec-Konfiguration)</text>
<line x1="578" y1="180" x2="225" y2="180" stroke="#ffd23f" stroke-width="3"/><polygon points="222,180 237,173 237,187" fill="#ffd23f"/>
<text x="400" y="172" text-anchor="middle" font-size="13" fill="#222">X.509v3-Identitätszertifikat des Servers</text>
<rect x="225" y="140" width="350" height="22" fill="#39c86a" fill-opacity="0.15"/>
<text x="400" y="156" text-anchor="middle" font-size="12" fill="#222">TLS-Tunnel: Daten verschlüsselt</text>
<!-- boxes -->
<rect x="40" y="240" width="345" height="170" rx="8" fill="#fff" stroke="#39c86a" stroke-width="2"/>
<text x="55" y="265" font-size="15" fill="#222" font-weight="bold">1. Kanal schützen (HTTPS/TLS)</text>
<text x="55" y="290" font-size="12" fill="#222">• Mitgeschnittene Daten sind nicht lesbar</text>
<text x="55" y="310" font-size="12" fill="#222">• Server weist sich per Zertifikat aus</text>
<text x="55" y="330" font-size="12" fill="#222">• Client prüft Signatur: Root-CA-Zertifikat</text>
<text x="55" y="348" font-size="12" fill="#222">  installiert oder Self-Signed-Zertifikat selbst</text>
<text x="55" y="372" font-size="12" fill="#222">• Schützt vor Konfiguration an falsches Gerät</text>
<text x="55" y="396" font-size="12" fill="#222">• verify=False im Skript hebelt das aus</text>
<rect x="415" y="240" width="345" height="170" rx="8" fill="#fff" stroke="#ff6b6b" stroke-width="2"/>
<text x="430" y="265" font-size="15" fill="#222" font-weight="bold">2. Client authentifizieren</text>
<text x="430" y="290" font-size="12" fill="#222">• HTTP Basic Auth in JEDEM Request</text>
<text x="430" y="308" font-size="12" font-family="monospace" fill="#222">  Authorization: Basic base64(user:pw)</text>
<text x="430" y="330" font-size="12" fill="#222">• Base64 ist keine Verschlüsselung → nur via TLS</text>
<text x="430" y="352" font-size="12" fill="#222">• Rechte begrenzen: ISE-Admin-Rolle,</text>
<text x="430" y="370" font-size="12" fill="#222">  ASA-Privilege-Level 3 Monitoring /</text>
<text x="430" y="388" font-size="12" fill="#222">  5 GET / 15 PUT, POST, DELETE</text>
<text x="400" y="438" text-anchor="middle" font-size="12" fill="#222">Server prüft den Client (Basic Auth) – Client prüft den Server (Zertifikat)</text>
</svg>
