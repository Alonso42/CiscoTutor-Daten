<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>ToS-Byte, DSCP, IP Precedence und 802.1Q-CoS</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Wo die Markierung steht</text>
<text x="60" y="70" font-size="15" font-weight="bold" fill="#222">IPv4 ToS-Byte / IPv6 Traffic Class (8 Bit)</text>
<g font-size="14" fill="#222" text-anchor="middle">
<text x="105" y="98">7</text><text x="175" y="98">6</text><text x="245" y="98">5</text><text x="315" y="98">4</text><text x="385" y="98">3</text><text x="455" y="98">2</text><text x="525" y="98">1</text><text x="595" y="98">0</text>
<rect x="70" y="105" width="70" height="40" fill="#39c86a" opacity="0.35" stroke="#222"/>
<rect x="140" y="105" width="70" height="40" fill="#39c86a" opacity="0.35" stroke="#222"/>
<rect x="210" y="105" width="70" height="40" fill="#39c86a" opacity="0.35" stroke="#222"/>
<rect x="280" y="105" width="70" height="40" fill="#4a9cff" opacity="0.3" stroke="#222"/>
<rect x="350" y="105" width="70" height="40" fill="#4a9cff" opacity="0.3" stroke="#222"/>
<rect x="420" y="105" width="70" height="40" fill="#4a9cff" opacity="0.3" stroke="#222"/>
<rect x="490" y="105" width="70" height="40" fill="#ffd23f" opacity="0.5" stroke="#222"/>
<rect x="560" y="105" width="70" height="40" fill="#ffd23f" opacity="0.5" stroke="#222"/>
<text x="175" y="131">IP Precedence (3 Bit)</text>
<text x="350" y="124" font-size="12">AF: Drop-Precedence</text><text x="350" y="139" font-size="12">(Bit 4–3)</text><text x="455" y="131" font-size="12">AF: 0</text>
<text x="560" y="131">ECN</text>
<line x1="70" y1="160" x2="490" y2="160" stroke="#222" stroke-width="2"/>
<line x1="70" y1="154" x2="70" y2="166" stroke="#222" stroke-width="2"/><line x1="490" y1="154" x2="490" y2="166" stroke="#222" stroke-width="2"/>
<text x="280" y="182" font-weight="bold">DSCP (6 Bit, 0–63)</text>
<line x1="70" y1="195" x2="280" y2="195" stroke="#39c86a" stroke-width="2"/>
<text x="175" y="213" fill="#39c86a">= Class Selector (CS)</text>
</g>
<text x="650" y="120" font-size="13" fill="#222">ToS-Wert = DSCP × 4</text>
<text x="650" y="140" font-size="13" fill="#222">IPP = DSCP ÷ 8</text>
<text x="650" y="158" font-size="13" fill="#222">(abgerundet)</text>
<!-- Beispiele -->
<text x="60" y="250" font-size="15" font-weight="bold" fill="#222">Rechenbeispiele</text>
<g font-size="14" fill="#222" font-family="monospace">
<text x="60" y="276">EF   = 46 = 101110 → ToS 1011 1000 = 0xB8 (184) → IPP 5</text>
<text x="60" y="298">AF41 = 34 = 100010 → ToS 1000 1000 = 0x88 (136) → IPP 4</text>
<text x="60" y="320">CS6  = 48 = 110000 → ToS 1100 0000 = 0xC0 (192) → IPP 6</text>
</g>
<!-- 802.1Q -->
<text x="60" y="365" font-size="15" font-weight="bold" fill="#222">802.1Q-Tag (Layer 2, nur getaggte Frames)</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="60" y="378" width="160" height="36" fill="#fff" stroke="#222"/><text x="140" y="401">TPID 0x8100 (16)</text>
<rect x="220" y="378" width="110" height="36" fill="#b08aff" opacity="0.45" stroke="#222"/><text x="275" y="401">PCP = CoS (3)</text>
<rect x="330" y="378" width="70" height="36" fill="#fff" stroke="#222"/><text x="365" y="401">DEI (1)</text>
<rect x="400" y="378" width="160" height="36" fill="#fff" stroke="#222"/><text x="480" y="401">VLAN-ID (12)</text>
</g>
<text x="580" y="392" font-size="13" fill="#222">CoS 0–7, geht am Router</text>
<text x="580" y="410" font-size="13" fill="#222">verloren → L3 = Ende-zu-Ende</text>
</svg>
