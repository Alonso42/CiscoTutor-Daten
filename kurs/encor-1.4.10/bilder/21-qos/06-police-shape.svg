<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Policing vs. Shaping und Token Bucket</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Policing schneidet ab – Shaping glättet</text>
<!-- Policing graph -->
<text x="200" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#ff6b6b">Policing</text>
<line x1="50" y1="230" x2="360" y2="230" stroke="#222"/><line x1="50" y1="80" x2="50" y2="230" stroke="#222"/>
<line x1="50" y1="140" x2="360" y2="140" stroke="#4a9cff" stroke-dasharray="6 4"/>
<text x="362" y="144" font-size="12" fill="#4a9cff">CIR</text>
<polyline points="50,220 80,100 110,170 140,90 170,180 200,110 230,175 260,95 290,165 320,120 350,180" fill="none" stroke="#ccc" stroke-width="2"/>
<polyline points="50,220 72,140 98,140 110,170 125,140 155,140 170,180 190,140 213,140 230,175 245,140 275,140 290,165 305,140 335,140 350,180" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="205" y="250" text-anchor="middle" font-size="12" fill="#222">Zeit →</text>
<text x="50" y="275" font-size="13" fill="#222">• Überschuss: drop oder re-mark</text>
<text x="50" y="295" font-size="13" fill="#222">• kein Puffer, kein Delay/Jitter</text>
<text x="50" y="315" font-size="13" fill="#222">• ein- und ausgehend, meist Ingress</text>
<text x="50" y="335" font-size="13" fill="#222">• TCP-Retransmits durch Drops</text>
<!-- Shaping graph -->
<text x="600" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#39c86a">Shaping</text>
<line x1="440" y1="230" x2="750" y2="230" stroke="#222"/><line x1="440" y1="80" x2="440" y2="230" stroke="#222"/>
<line x1="440" y1="140" x2="750" y2="140" stroke="#4a9cff" stroke-dasharray="6 4"/>
<text x="752" y="144" font-size="12" fill="#4a9cff">CIR</text>
<polyline points="440,220 470,100 500,170 530,90 560,180 590,110 620,175 650,95 680,165 710,120 740,180" fill="none" stroke="#ccc" stroke-width="2"/>
<polyline points="440,220 462,142 750,142" fill="none" stroke="#39c86a" stroke-width="2.5"/>
<text x="595" y="250" text-anchor="middle" font-size="12" fill="#222">Zeit →</text>
<text x="440" y="275" font-size="13" fill="#222">• Überschuss wird gepuffert</text>
<text x="440" y="295" font-size="13" fill="#222">• erzeugt Delay und Jitter</text>
<text x="440" y="315" font-size="13" fill="#222">• nur ausgehend (z. B. WAN-Edge → SP)</text>
<text x="440" y="335" font-size="13" fill="#222">• weniger TCP-Retransmits</text>
<!-- Token bucket -->
<rect x="40" y="360" width="720" height="78" rx="8" fill="#ffd23f" opacity="0.18" stroke="#ffd23f"/>
<text x="60" y="385" font-size="15" font-weight="bold" fill="#222">Token Bucket:  CIR = Bc / Tc</text>
<text x="60" y="408" font-size="13" fill="#222">Bc = Committed Burst (Bits pro Intervall) · Tc = Intervall · Be = Excess Burst · PIR = Peak Rate (Two-Rate-Policer)</text>
<text x="60" y="428" font-size="13" fill="#222">Beispiel: CIR 8 Mbps, Tc 10 ms → Bc = 80 000 Bit · Policer-Ergebnis: conform / exceed / violate</text>
</svg>
