<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>QoS-Modelle: Best Effort, IntServ, DiffServ</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Drei QoS-Modelle</text>
<!-- Zeilen mit je 3 Routern -->
<g font-size="14" fill="#222">
<!-- Best Effort -->
<text x="20" y="85" font-size="17" font-weight="bold" fill="#ffd23f" stroke="#222" stroke-width="0.3">Best Effort</text>
<rect x="20" y="95" width="40" height="26" fill="#fff" stroke="#222"/><text x="40" y="113" text-anchor="middle" font-size="11">PC</text>
<line x1="60" y1="108" x2="140" y2="108" stroke="#222"/>
<circle cx="160" cy="108" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="160" y="113" text-anchor="middle">R</text>
<line x1="178" y1="108" x2="240" y2="108" stroke="#222"/>
<circle cx="260" cy="108" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="260" y="113" text-anchor="middle">R</text>
<line x1="278" y1="108" x2="340" y2="108" stroke="#222"/>
<circle cx="360" cy="108" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="113" text-anchor="middle">R</text>
<text x="420" y="100">Alle Pakete gleich: FIFO, keine Markierung.</text>
<text x="420" y="122">+ einfach, skaliert · – keinerlei Garantien</text>
<!-- IntServ -->
<text x="20" y="190" font-size="17" font-weight="bold" fill="#b08aff">IntServ (RSVP)</text>
<rect x="20" y="200" width="40" height="26" fill="#fff" stroke="#222"/><text x="40" y="218" text-anchor="middle" font-size="11">PC</text>
<line x1="60" y1="213" x2="140" y2="213" stroke="#222"/>
<circle cx="160" cy="213" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="160" y="218" text-anchor="middle">R</text>
<line x1="178" y1="213" x2="240" y2="213" stroke="#222"/>
<circle cx="260" cy="213" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="260" y="218" text-anchor="middle">R</text>
<line x1="278" y1="213" x2="340" y2="213" stroke="#222"/>
<circle cx="360" cy="213" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="218" text-anchor="middle">R</text>
<path d="M45 196 C 120 160, 300 160, 360 192" fill="none" stroke="#b08aff" stroke-width="2" stroke-dasharray="6 3"/>
<text x="200" y="168" text-anchor="middle" font-size="12" fill="#b08aff">RSVP PATH/RESV pro Flow</text>
<rect x="140" y="236" width="40" height="16" fill="#b08aff" opacity="0.4"/><rect x="240" y="236" width="40" height="16" fill="#b08aff" opacity="0.4"/><rect x="340" y="236" width="40" height="16" fill="#b08aff" opacity="0.4"/>
<text x="260" y="268" text-anchor="middle" font-size="12">State pro Flow auf jedem Hop</text>
<text x="420" y="205">Anwendung reserviert Ende-zu-Ende vorab.</text>
<text x="420" y="227">+ harte Garantie · – skaliert schlecht</text>
<!-- DiffServ -->
<text x="20" y="315" font-size="17" font-weight="bold" fill="#39c86a">DiffServ (DSCP + PHB)</text>
<rect x="20" y="325" width="40" height="26" fill="#fff" stroke="#222"/><text x="40" y="343" text-anchor="middle" font-size="11">PC</text>
<line x1="60" y1="338" x2="140" y2="338" stroke="#222"/>
<circle cx="160" cy="338" r="18" fill="#fff" stroke="#39c86a" stroke-width="3"/><text x="160" y="343" text-anchor="middle">R</text>
<line x1="178" y1="338" x2="240" y2="338" stroke="#222"/>
<circle cx="260" cy="338" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="260" y="343" text-anchor="middle">R</text>
<line x1="278" y1="338" x2="340" y2="338" stroke="#222"/>
<circle cx="360" cy="338" r="18" fill="#fff" stroke="#222" stroke-width="2"/><text x="360" y="343" text-anchor="middle">R</text>
<text x="160" y="378" text-anchor="middle" font-size="12" fill="#39c86a">Edge: klassifizieren</text>
<text x="160" y="393" text-anchor="middle" font-size="12" fill="#39c86a">+ markieren (EF, AF41 …)</text>
<text x="310" y="378" text-anchor="middle" font-size="12">Core: nur DSCP lesen,</text>
<text x="310" y="393" text-anchor="middle" font-size="12">PHB anwenden</text>
<text x="420" y="330">Klassen statt Flows, keine Signalisierung.</text>
<text x="420" y="352">+ skaliert, Standard · – relative Garantie</text>
</g>
<line x1="20" y1="145" x2="780" y2="145" stroke="#ccc"/>
<line x1="20" y1="285" x2="780" y2="285" stroke="#ccc"/>
</svg>
