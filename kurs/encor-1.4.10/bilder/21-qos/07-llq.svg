<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>LLQ = Priority Queue + CBWFQ, danach Tx-Ring</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Low Latency Queuing (LLQ) am Ausgangsinterface</text>
<rect x="20" y="190" width="90" height="50" rx="6" fill="#fff" stroke="#222"/>
<text x="65" y="212" text-anchor="middle" font-size="13" fill="#222">Pakete</text><text x="65" y="230" text-anchor="middle" font-size="13" fill="#222">ankommend</text>
<rect x="130" y="175" width="90" height="80" rx="6" fill="#b08aff" opacity="0.3" stroke="#222"/>
<text x="175" y="210" text-anchor="middle" font-size="13" fill="#222">Classifier</text><text x="175" y="228" text-anchor="middle" font-size="12" fill="#222">(class-map)</text>
<line x1="110" y1="215" x2="130" y2="215" stroke="#222" stroke-width="2"/>
<!-- queues -->
<g font-size="13" fill="#222">
<rect x="270" y="70" width="230" height="40" fill="#39c86a" opacity="0.35" stroke="#222"/><text x="280" y="95">PQ: Voice (EF) – strict priority</text>
<rect x="270" y="135" width="230" height="36" fill="#4a9cff" opacity="0.25" stroke="#222"/><text x="280" y="158">Video – bandwidth 30 %</text>
<rect x="270" y="190" width="230" height="36" fill="#4a9cff" opacity="0.25" stroke="#222"/><text x="280" y="213">Mission-Critical – bandwidth 20 %</text>
<rect x="270" y="245" width="230" height="36" fill="#4a9cff" opacity="0.25" stroke="#222"/><text x="280" y="268">Bulk – bandwidth 10 %</text>
<rect x="270" y="300" width="230" height="36" fill="#eee" stroke="#222"/><text x="280" y="323">class-default – fair-queue</text>
</g>
<line x1="220" y1="215" x2="270" y2="90" stroke="#222"/><line x1="220" y1="215" x2="270" y2="153" stroke="#222"/>
<line x1="220" y1="215" x2="270" y2="208" stroke="#222"/><line x1="220" y1="215" x2="270" y2="263" stroke="#222"/>
<line x1="220" y1="215" x2="270" y2="318" stroke="#222"/>
<text x="385" y="355" text-anchor="middle" font-size="12" fill="#222">CBWFQ-Queues: Mindestbandbreite bei Stau</text>
<text x="385" y="125" text-anchor="middle" font-size="11" fill="#ff6b6b">bei Stau implizit auf Priority-Rate gepolicet</text>
<!-- scheduler -->
<circle cx="580" cy="215" r="40" fill="#ffd23f" opacity="0.5" stroke="#222"/>
<text x="580" y="212" text-anchor="middle" font-size="13" fill="#222">Scheduler</text><text x="580" y="229" text-anchor="middle" font-size="11" fill="#222">PQ zuerst</text>
<line x1="500" y1="90" x2="545" y2="195" stroke="#39c86a" stroke-width="3"/>
<line x1="500" y1="153" x2="540" y2="205" stroke="#222"/><line x1="500" y1="208" x2="540" y2="213" stroke="#222"/>
<line x1="500" y1="263" x2="542" y2="225" stroke="#222"/><line x1="500" y1="318" x2="548" y2="238" stroke="#222"/>
<rect x="650" y="195" width="80" height="40" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="690" y="220" text-anchor="middle" font-size="13" fill="#222">Tx-Ring</text>
<line x1="620" y1="215" x2="650" y2="215" stroke="#222" stroke-width="2"/>
<line x1="730" y1="215" x2="780" y2="215" stroke="#222" stroke-width="2"/>
<text x="690" y="255" text-anchor="middle" font-size="11" fill="#222">Hardware-FIFO;</text>
<text x="690" y="270" text-anchor="middle" font-size="11" fill="#222">voll → QoS-Queues</text>
<text x="690" y="285" text-anchor="middle" font-size="11" fill="#222">werden aktiv</text>
<text x="40" y="395" font-size="13" fill="#222">Ohne PQ bleibt CBWFQ: Bandbreitengarantie, aber keine Latenzgarantie → nur für Daten.</text>
<text x="40" y="418" font-size="13" fill="#222">PQ allein (klassisches PQ) → Starvation der niedrigen Queues. LLQ kombiniert beides und begrenzt die PQ.</text>
</svg>
