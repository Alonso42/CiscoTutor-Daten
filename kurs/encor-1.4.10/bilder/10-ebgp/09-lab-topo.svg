<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery 11: Single-Homed eBGP</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Lab: Single-Homed eBGP (Provider mit zwei Kunden)</text>
<g stroke="#999" stroke-width="3">
<line x1="400" y1="95" x2="150" y2="200"/>
<line x1="400" y1="95" x2="650" y2="200"/>
</g>
<g font-size="12" fill="#222">
<text x="190" y="135">192.168.1.0/24</text>
<text x="520" y="135">192.168.2.0/24</text>
<text x="300" y="100" text-anchor="end">.10 E0/1</text>
<text x="500" y="100">E0/2 .10</text>
<text x="172" y="232">E0/1 .11</text>
<text x="628" y="232" text-anchor="end">.11 E0/2</text>
</g>
<g font-size="13" font-weight="bold" fill="#222" text-anchor="middle">
<circle cx="400" cy="80" r="26" fill="#f3edff" stroke="#b08aff" stroke-width="2"/><text x="400" y="85">SP1</text>
<circle cx="140" cy="210" r="26" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/><text x="140" y="215">R1</text>
<circle cx="660" cy="210" r="26" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/><text x="660" y="215">R2</text>
</g>
<g font-size="12" fill="#222">
<text x="440" y="66">AS 1 · Lo0 10.0.3.1/24</text>
<text x="40" y="255">AS 100 · Lo0 10.0.1.1/24</text>
<text x="560" y="255">AS 200 · Lo0 10.0.2.1/24</text>
</g>
<g font-size="12" fill="#222">
<rect x="20" y="275" width="375" height="160" rx="10" fill="#f4f4f4" stroke="#999"/>
<text x="32" y="296" font-weight="bold" font-size="13">Konfiguration SP1</text>
<g font-family="monospace">
<text x="32" y="318">router bgp 1</text>
<text x="32" y="336"> neighbor 192.168.1.11 remote-as 100</text>
<text x="32" y="354"> neighbor 192.168.2.11 remote-as 200</text>
<text x="32" y="372"> network 10.0.3.0 mask 255.255.255.0</text>
</g>
<text x="32" y="396">network: nur exakter Treffer in der RIB</text>
<text x="32" y="414">ohne mask: klassenbezogene Maske</text>
<text x="32" y="430">neighbor-Befehle bestimmen die Peers</text>
<rect x="405" y="275" width="375" height="160" rx="10" fill="#eaf3ff" stroke="#4a9cff"/>
<text x="417" y="296" font-weight="bold" font-size="13">Sicht auf R1: show ip bgp</text>
<g font-family="monospace" font-size="11">
<text x="417" y="318" xml:space="preserve">   Network      Next Hop     Path</text>
<text x="417" y="336" xml:space="preserve">*&gt; 10.0.1.0/24  0.0.0.0      i</text>
<text x="417" y="354" xml:space="preserve">*&gt; 10.0.2.0/24  192.168.1.10 1 200 i</text>
<text x="417" y="372" xml:space="preserve">*&gt; 10.0.3.0/24  192.168.1.10 1 i</text>
</g>
<text x="417" y="396">lokal: Next Hop 0.0.0.0, Weight 32768</text>
<text x="417" y="414">gelernt: Weight 0, AS_PATH ab SP1</text>
<text x="417" y="430">show ip bgp summary: PfxRcd 2</text>
</g>
</svg>
