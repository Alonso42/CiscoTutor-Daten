<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Die drei BGP-Datenstrukturen</title>
<defs>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Vom Nachbarn bis in die Routing-Tabelle</text>
<g font-size="13" fill="#222">
<rect x="20" y="55" width="240" height="210" rx="10" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
<text x="35" y="80" font-weight="bold">1  Neighbor Table</text>
<text x="35" y="106">explizit konfigurierte Peers</text>
<text x="35" y="126">(neighbor x remote-as y)</text>
<text x="35" y="150">TCP-Session Port 179</text>
<text x="35" y="174">Zustand, Keepalives</text>
<text x="35" y="198">kein automatisches</text>
<text x="35" y="218">Finden von Nachbarn</text>
<text x="35" y="250" font-family="monospace" font-size="11">show ip bgp summary</text>
<rect x="280" y="55" width="240" height="210" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="295" y="80" font-weight="bold">2  BGP Table</text>
<text x="295" y="106">alle Pfade von allen Peers</text>
<text x="295" y="126">(topology/forwarding DB)</text>
<text x="295" y="150">pro Präfix genau ein</text>
<text x="295" y="170">Best Path (&gt;)</text>
<text x="295" y="194">übrige Pfade bleiben</text>
<text x="295" y="214">als Backup</text>
<text x="295" y="250" font-family="monospace" font-size="11">show ip bgp</text>
<rect x="540" y="55" width="240" height="210" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="555" y="80" font-weight="bold">3  IP Routing Table</text>
<text x="555" y="106">Best Path wird angeboten</text>
<text x="555" y="130">Entscheidung über AD:</text>
<text x="555" y="152">eBGP 20</text>
<text x="555" y="172">iBGP 200</text>
<text x="555" y="196">verliert BGP: Status r</text>
<text x="555" y="216">(RIB-failure)</text>
<text x="555" y="250" font-family="monospace" font-size="11">show ip route bgp</text>
</g>
<line x1="262" y1="160" x2="278" y2="160" stroke="#222" stroke-width="2" marker-end="url(#pf)"/>
<line x1="522" y1="160" x2="538" y2="160" stroke="#222" stroke-width="2" marker-end="url(#pf)"/>
<g font-size="13" fill="#222">
<rect x="20" y="285" width="760" height="145" rx="10" fill="#f4f4f4" stroke="#999"/>
<text x="35" y="308" font-weight="bold">Beispiel R1 (AS 100) im Lab</text>
<text x="35" y="332" font-family="monospace" font-size="12" xml:space="preserve">   Network        Next Hop       Metric LocPrf Weight Path</text>
<text x="35" y="352" font-family="monospace" font-size="12" xml:space="preserve">*&gt; 10.0.1.0/24    0.0.0.0             0         32768 i</text>
<text x="35" y="372" font-family="monospace" font-size="12" xml:space="preserve">*&gt; 10.0.2.0/24    192.168.1.10                      0 1 200 i</text>
<text x="35" y="392" font-family="monospace" font-size="12" xml:space="preserve">*&gt; 10.0.3.0/24    192.168.1.10        0             0 1 i</text>
<text x="35" y="418">Routing-Tabelle danach: B 10.0.2.0/24 [20/0] via 192.168.1.10 (AD 20 / Metrik 0)</text>
</g>
</svg>
