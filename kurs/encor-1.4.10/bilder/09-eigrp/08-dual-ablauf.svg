<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>DUAL bei Ausfall des Successors</title>
<defs>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
</defs>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">DUAL: Successor fällt aus</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="250" y="45" width="300" height="40" rx="8" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/>
<text x="400" y="70">Successor weg oder Metrik schlechter</text>
<polygon points="400,105 530,145 400,185 270,145" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="400" y="141">Feasible Successor</text>
<text x="400" y="158">vorhanden?</text>
<!-- Ja -->
<rect x="20" y="210" width="300" height="100" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="170" y="234" font-weight="bold">Ja: lokale Umschaltung</text>
<text x="170" y="256">FS sofort in die RIB</text>
<text x="170" y="276">Route bleibt passive</text>
<text x="170" y="296">nur Update an die Nachbarn</text>
<!-- Nein -->
<rect x="480" y="210" width="300" height="100" rx="10" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
<text x="630" y="234" font-weight="bold">Nein: Route wird active</text>
<text x="630" y="256">Query (Multicast, zuverlässig)</text>
<text x="630" y="276">an alle Nachbarn</text>
<text x="630" y="296">warten auf alle Replies</text>
<rect x="480" y="330" width="300" height="100" rx="10" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="630" y="352" font-weight="bold">Antworten der Nachbarn</text>
<text x="630" y="373">eigene Metrik (hat loop-freien Weg)</text>
<text x="630" y="392">oder fragt selbst weiter</text>
<text x="630" y="411">oder meldet unreachable</text>
<rect x="20" y="330" width="420" height="100" rx="10" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/>
<text x="230" y="352" font-weight="bold">Stuck in Active (SIA)</text>
<text x="230" y="373">Active Timer Default 3 min</text>
<text x="230" y="392">nach der Hälfte: SIA-Query an säumige Nachbarn</text>
<text x="230" y="411">keine Antwort → Nachbarschaft wird zurückgesetzt</text>
</g>
<g stroke="#222" stroke-width="2" fill="none">
<line x1="400" y1="85" x2="400" y2="103" marker-end="url(#pf)"/>
<line x1="270" y1="145" x2="170" y2="145"/><line x1="170" y1="145" x2="170" y2="208" marker-end="url(#pf)"/>
<line x1="530" y1="145" x2="630" y2="145"/><line x1="630" y1="145" x2="630" y2="208" marker-end="url(#pf)"/>
<line x1="630" y1="310" x2="630" y2="328" marker-end="url(#pf)"/>
<line x1="480" y1="380" x2="442" y2="380" marker-end="url(#pf)"/>
</g>
<g font-size="13" font-weight="bold">
<text x="210" y="138" fill="#39c86a">ja</text>
<text x="570" y="138" fill="#4a9cff">nein</text>
</g>
<text x="622" y="200" text-anchor="end" font-size="11" fill="#222">alle Replies da → neuer Successor, wieder passive</text>
</svg>
