<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>EIGRP-Merkmale rund um DUAL</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">EIGRP – Advanced Distance Vector</text>
<!-- Zentrum -->
<circle cx="400" cy="235" r="78" fill="#e8f8ee" stroke="#39c86a" stroke-width="3"/>
<text x="400" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">DUAL</text>
<text x="400" y="246" text-anchor="middle" font-size="12" fill="#222">loop-frei, schnelle</text>
<text x="400" y="262" text-anchor="middle" font-size="12" fill="#222">Konvergenz, Backup (FS)</text>
<g stroke="#999" stroke-width="2">
<line x1="330" y1="200" x2="240" y2="120"/>
<line x1="470" y1="200" x2="560" y2="120"/>
<line x1="322" y1="240" x2="250" y2="240"/>
<line x1="478" y1="240" x2="550" y2="240"/>
<line x1="330" y1="280" x2="240" y2="355"/>
<line x1="470" y1="280" x2="560" y2="355"/>
</g>
<g font-size="13" fill="#222">
<rect x="40" y="62" width="230" height="70" rx="10" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
<text x="55" y="85" font-weight="bold">Transport</text>
<text x="55" y="104">direkt über IP, Protokoll 88</text>
<text x="55" y="122">RTP: zuverlässig, geordnet</text>
<rect x="530" y="62" width="230" height="70" rx="10" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
<text x="545" y="85" font-weight="bold">Adressierung</text>
<text x="545" y="104">Multicast 224.0.0.10 / FF02::A</text>
<text x="545" y="122">plus Unicast, kein Broadcast</text>
<rect x="30" y="205" width="220" height="70" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="45" y="228" font-weight="bold">Updates</text>
<text x="45" y="247">nicht periodisch, nur</text>
<text x="45" y="265">partial + bounded</text>
<rect x="550" y="205" width="220" height="70" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="565" y="228" font-weight="bold">Load Balancing</text>
<text x="565" y="247">Equal Cost (4 Pfade)</text>
<text x="565" y="265">+ Unequal Cost (variance)</text>
<rect x="40" y="330" width="230" height="70" rx="10" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="55" y="353" font-weight="bold">Classless</text>
<text x="55" y="372">Maske je Präfix: VLSM,</text>
<text x="55" y="390">diskontinuierliche Netze</text>
<rect x="530" y="330" width="230" height="70" rx="10" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="545" y="353" font-weight="bold">Multi-Address-Family</text>
<text x="545" y="372">IPv4 + IPv6 (eigene PDMs)</text>
<text x="545" y="390">früher IPX/AppleTalk, SAF</text>
</g>
<text x="400" y="430" text-anchor="middle" font-size="12" fill="#222">2013 offengelegt, RFC 7868 (2016, informational) · Stub bleibt proprietär · AD 90 intern / 170 extern</text>
</svg>
