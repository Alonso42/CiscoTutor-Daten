<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Bedingungen für eine EIGRP-Nachbarschaft</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">EIGRP-Nachbarschaft: was muss passen?</text>
<!-- Gleichung -->
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="20" y="55" width="140" height="60" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="90" y="80" font-weight="bold">AS-Nummer</text><text x="90" y="100">gleich</text>
<text x="175" y="92" font-size="24" font-weight="bold">+</text>
<rect x="190" y="55" width="140" height="60" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="260" y="80" font-weight="bold">K-Werte</text><text x="260" y="100">gleich</text>
<text x="345" y="92" font-size="24" font-weight="bold">+</text>
<rect x="360" y="55" width="140" height="60" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="430" y="80" font-weight="bold">Subnetz</text><text x="430" y="100">Primäradressen</text>
<text x="515" y="92" font-size="24" font-weight="bold">+</text>
<rect x="530" y="55" width="140" height="60" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="600" y="80" font-weight="bold">Authentisierung</text><text x="600" y="100">Methode + Key</text>
<text x="685" y="92" font-size="24" font-weight="bold">=</text>
<circle cx="740" cy="85" r="36" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
<text x="740" y="82" font-weight="bold">Neighbor</text><text x="740" y="98">up</text>
</g>
<g font-size="13" fill="#222">
<rect x="20" y="140" width="370" height="150" rx="10" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/>
<text x="35" y="165" font-weight="bold">Darf abweichen (anders als OSPF)</text>
<text x="35" y="190">• Hello- und Hold-Timer</text>
<text x="50" y="208">Default 5/15 s, NBMA ≤ T1: 60/180 s</text>
<text x="50" y="226">Hold Time steht im Hello, der Nachbar</text>
<text x="50" y="244">übernimmt sie; passt sich nicht selbst an</text>
<text x="35" y="268">• Router-ID (nur für Loop-Erkennung extern)</text>
<rect x="410" y="140" width="370" height="150" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="425" y="165" font-weight="bold">Typische Fallen</text>
<text x="425" y="190">• Secondary-Adresse: Pakete gehen immer</text>
<text x="440" y="208">von der Primäradresse aus</text>
<text x="425" y="232">• K-Wert-Mismatch: Reset, selbst wenn</text>
<text x="440" y="250">der Wert ungenutzt ist</text>
<text x="425" y="274">• ACL blockiert IP-Protokoll 88</text>
<rect x="20" y="310" width="760" height="120" rx="10" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="35" y="335" font-weight="bold">passive-interface Gi0/1</text>
<text x="35" y="358">Keine Hellos, eingehende EIGRP-Pakete werden ignoriert → keine Nachbarschaft auf dem Interface.</text>
<text x="35" y="380">Das Netz des Interfaces wird trotzdem annonciert (z. B. Benutzer-LAN, Loopback).</text>
<text x="35" y="406">AS-Empfehlung: eigene BGP-AS oder einheitlich 1 · Router-ID ansehen: show ip protocols</text>
</g>
</svg>
