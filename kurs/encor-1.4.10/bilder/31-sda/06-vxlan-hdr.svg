<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>VXLAN-GPO-Header in SD-Access</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">VXLAN-GPO: rund 50 Byte Overhead, VNI und SGT im Header</text>
<g font-size="13" fill="#222">
<rect x="20" y="60" width="130" height="60" fill="#4a9cff" fill-opacity="0.25" stroke="#222"/>
<text x="85" y="85" text-anchor="middle" font-weight="bold">Outer Ethernet</text><text x="85" y="105" text-anchor="middle">14 Byte</text>
<rect x="150" y="60" width="130" height="60" fill="#4a9cff" fill-opacity="0.25" stroke="#222"/>
<text x="215" y="85" text-anchor="middle" font-weight="bold">Outer IP</text><text x="215" y="105" text-anchor="middle">20 Byte</text>
<rect x="280" y="60" width="110" height="60" fill="#4a9cff" fill-opacity="0.25" stroke="#222"/>
<text x="335" y="85" text-anchor="middle" font-weight="bold">UDP</text><text x="335" y="105" text-anchor="middle">8 Byte</text>
<rect x="390" y="60" width="130" height="60" fill="#ffd23f" fill-opacity="0.45" stroke="#222"/>
<text x="455" y="85" text-anchor="middle" font-weight="bold">VXLAN-GPO</text><text x="455" y="105" text-anchor="middle">8 Byte</text>
<rect x="520" y="60" width="260" height="60" fill="#39c86a" fill-opacity="0.22" stroke="#222"/>
<text x="650" y="85" text-anchor="middle" font-weight="bold">Original-Frame</text><text x="650" y="105" text-anchor="middle">innerer Ethernet + IP + Payload</text>
</g>
<text x="270" y="145" text-anchor="middle" font-size="13" fill="#222">Underlay-Teil (14 + 20 + 8 + 8 = 50 Byte)</text>
<line x1="20" y1="130" x2="520" y2="130" stroke="#222"/>
<text x="650" y="145" text-anchor="middle" font-size="13" fill="#222">Overlay-Teil (unverändert)</text>
<!-- details -->
<rect x="150" y="170" width="240" height="120" rx="6" fill="#ffffff" stroke="#4a9cff" stroke-width="2"/>
<text x="160" y="192" font-size="12" fill="#222" font-weight="bold">Outer IP / UDP</text>
<text x="160" y="212" font-size="12" fill="#222">Src-IP = RLOC der Quell-Edge</text>
<text x="160" y="230" font-size="12" fill="#222">Dst-IP = RLOC der Ziel-Edge</text>
<text x="160" y="248" font-size="12" fill="#222">Src-Port = Hash innerer Header</text>
<text x="160" y="266" font-size="12" fill="#222">  (Entropie für ECMP)</text>
<text x="160" y="284" font-size="12" fill="#222">Dst-Port = 4789</text>
<rect x="410" y="170" width="370" height="120" rx="6" fill="#ffffff" stroke="#ffd23f" stroke-width="3"/>
<text x="420" y="192" font-size="12" fill="#222" font-weight="bold">VXLAN-GPO-Header (64 Bit)</text>
<rect x="420" y="205" width="60" height="34" fill="#eeeeee" stroke="#222"/><text x="450" y="227" text-anchor="middle" font-size="11" fill="#222">Flags 8</text>
<rect x="480" y="205" width="110" height="34" fill="#ff6b6b" fill-opacity="0.3" stroke="#222"/><text x="535" y="227" text-anchor="middle" font-size="11" fill="#222">Group ID 16 (SGT)</text>
<rect x="590" y="205" width="130" height="34" fill="#b08aff" fill-opacity="0.3" stroke="#222"/><text x="655" y="227" text-anchor="middle" font-size="11" fill="#222">VNI 24</text>
<rect x="720" y="205" width="50" height="34" fill="#eeeeee" stroke="#222"/><text x="745" y="227" text-anchor="middle" font-size="11" fill="#222">Res 8</text>
<text x="420" y="262" font-size="12" fill="#222">SGT: 16 Bit → ~64.000 Gruppen (Mikro-Segmentierung)</text>
<text x="420" y="280" font-size="12" fill="#222">VNI: 24 Bit → ~16 Mio. Segmente (Makro: VN/VRF)</text>
<!-- L2/L3 VNI -->
<rect x="20" y="310" width="370" height="70" rx="8" fill="#b08aff" fill-opacity="0.12" stroke="#b08aff"/>
<text x="30" y="332" font-size="13" font-weight="bold" fill="#222">L3-VNI ↔ VRF (Virtual Network)</text>
<text x="30" y="352" font-size="12" fill="#222">geroutet zwischen Subnetzen desselben VN</text>
<text x="30" y="370" font-size="12" fill="#222">LISP Instance-ID für IPv4/IPv6-EIDs</text>
<rect x="410" y="310" width="370" height="70" rx="8" fill="#39c86a" fill-opacity="0.12" stroke="#39c86a"/>
<text x="420" y="332" font-size="13" font-weight="bold" fill="#222">L2-VNI ↔ VLAN / Host Pool</text>
<text x="420" y="352" font-size="12" fill="#222">gebridged im selben Subnetz (MAC-EIDs)</text>
<text x="420" y="370" font-size="12" fill="#222">Wireless: AP kapselt mit L2-VNI zur Edge</text>
<text x="400" y="412" text-anchor="middle" font-size="13" fill="#222">Underlay-MTU: Client 1500 + 50 = 1550 Byte nötig → Catalyst Center setzt system mtu 9100</text>
<text x="400" y="434" text-anchor="middle" font-size="12" fill="#222">(mit 802.1Q-Tag im äußeren Header kommen 4 Byte hinzu)</text>
</svg>
