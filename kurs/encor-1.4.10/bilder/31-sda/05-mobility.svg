<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Host-Mobilität in SD-Access</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Host-Umzug: EID bleibt, nur der RLOC ändert sich</text>
<defs><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<rect x="300" y="50" width="200" height="66" rx="8" fill="#b08aff" fill-opacity="0.22" stroke="#222"/>
<text x="400" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Control Plane Node</text>
<text x="400" y="90" text-anchor="middle" font-size="11" fill="#222">vorher: 10.2.1.10 → 12.1.1.1</text>
<text x="400" y="106" text-anchor="middle" font-size="11" fill="#222">nachher: 10.2.1.10 → 12.2.2.1</text>
<rect x="560" y="50" width="200" height="50" rx="8" fill="#ffffff" stroke="#222"/>
<text x="660" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Border 12.0.0.1</text>
<text x="660" y="90" text-anchor="middle" font-size="11" fill="#222">DC 10.10.10.0/24</text>
<rect x="70" y="230" width="170" height="56" rx="8" fill="#ffffff" stroke="#222"/>
<text x="155" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Edge 1 (alt)</text>
<text x="155" y="272" text-anchor="middle" font-size="11" fill="#222">RLOC 12.1.1.1</text>
<rect x="560" y="230" width="170" height="56" rx="8" fill="#ffffff" stroke="#222"/>
<text x="645" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Edge 2 (neu)</text>
<text x="645" y="272" text-anchor="middle" font-size="11" fill="#222">RLOC 12.2.2.1</text>
<rect x="95" y="340" width="120" height="40" rx="6" fill="#ffffff" stroke="#222" stroke-dasharray="4,3"/>
<text x="155" y="365" text-anchor="middle" font-size="12" fill="#222">Host (vorher)</text>
<rect x="585" y="340" width="120" height="40" rx="6" fill="#ffd23f" fill-opacity="0.4" stroke="#222"/>
<text x="645" y="358" text-anchor="middle" font-size="12" fill="#222">Host 10.2.1.10</text>
<text x="645" y="374" text-anchor="middle" font-size="10" fill="#222">gleiche IP, gleiches GW</text>
<line x1="215" y1="360" x2="583" y2="360" stroke="#222" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#p)"/>
<text x="400" y="352" text-anchor="middle" font-size="12" fill="#222">Umzug (wired oder Wireless-Roaming)</text>
<line x1="645" y1="230" x2="495" y2="118" stroke="#39c86a" stroke-width="3" marker-end="url(#p)"/>
<text x="560" y="170" font-size="12" fill="#222"><tspan font-weight="bold">1</tspan> Map-Register (neuer RLOC)</text>
<line x1="305" y1="118" x2="170" y2="228" stroke="#ff6b6b" stroke-width="3" marker-end="url(#p)"/>
<text x="40" y="170" font-size="12" fill="#222"><tspan font-weight="bold">2</tspan> Map-Notify an alte Edge:</text>
<text x="40" y="186" font-size="12" fill="#222">lokalen Eintrag entfernen</text>
<text x="40" y="318" font-size="12" fill="#222"><tspan font-weight="bold">3</tspan> Kommt noch Verkehr mit altem</text>
<text x="40" y="334" font-size="12" fill="#222">Cache an Edge 1 an → SMR an Absender</text>
<text x="400" y="410" text-anchor="middle" font-size="12" fill="#222">SMR (Solicit-Map-Request) zwingt die sendende Edge zu einem neuen Map-Request → aktueller RLOC im Map-Cache</text>
<text x="400" y="432" text-anchor="middle" font-size="12" fill="#222">Anycast Gateway: gleiche SVI-IP und -MAC auf allen Edges → kein ARP/Gateway-Wechsel beim Host</text>
</svg>
