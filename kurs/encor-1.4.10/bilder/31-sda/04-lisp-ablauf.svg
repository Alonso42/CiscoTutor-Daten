<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>LISP in SD-Access: Registrierung, Auflösung, Weiterleitung</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">LISP-Ablauf: Map-Register, Map-Request, Proxy Map-Reply</text>
<rect x="300" y="50" width="200" height="70" rx="8" fill="#b08aff" fill-opacity="0.22" stroke="#222"/>
<text x="400" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Control Plane Node</text>
<text x="400" y="92" text-anchor="middle" font-size="12" fill="#222">HTDB: 10.2.2.2/32 → 2.1.2.1</text>
<text x="400" y="110" text-anchor="middle" font-size="11" fill="#222">MS + MR</text>
<rect x="60" y="230" width="170" height="60" rx="8" fill="#ffffff" stroke="#222"/>
<text x="145" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Edge A (ITR)</text>
<text x="145" y="274" text-anchor="middle" font-size="12" fill="#222">RLOC 1.1.1.1</text>
<rect x="570" y="230" width="170" height="60" rx="8" fill="#ffffff" stroke="#222"/>
<text x="655" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Edge B (ETR)</text>
<text x="655" y="274" text-anchor="middle" font-size="12" fill="#222">RLOC 2.1.2.1</text>
<rect x="85" y="350" width="120" height="40" rx="6" fill="#ffffff" stroke="#222"/>
<text x="145" y="375" text-anchor="middle" font-size="12" fill="#222">Host 10.1.0.1</text>
<rect x="595" y="350" width="120" height="40" rx="6" fill="#ffffff" stroke="#222"/>
<text x="655" y="375" text-anchor="middle" font-size="12" fill="#222">Server 10.2.2.2</text>
<line x1="145" y1="290" x2="145" y2="350" stroke="#222" stroke-width="2"/>
<line x1="655" y1="290" x2="655" y2="350" stroke="#222" stroke-width="2"/>
<defs><marker id="p" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<!-- 1 register -->
<line x1="640" y1="230" x2="490" y2="122" stroke="#39c86a" stroke-width="3" marker-end="url(#p)"/>
<text x="640" y="160" font-size="13" fill="#222"><tspan font-weight="bold">1</tspan> Map-Register</text>
<text x="640" y="177" font-size="11" fill="#222">10.2.2.2 → 2.1.2.1</text>
<!-- 2 request -->
<line x1="150" y1="230" x2="300" y2="110" stroke="#4a9cff" stroke-width="3" marker-end="url(#p)"/>
<text x="40" y="150" font-size="13" fill="#222"><tspan font-weight="bold">2</tspan> Map-Request</text>
<text x="40" y="167" font-size="11" fill="#222">"Wo ist 10.2.2.2?" (an MR)</text>
<!-- 3 reply -->
<line x1="320" y1="122" x2="190" y2="230" stroke="#ffd23f" stroke-width="3" marker-end="url(#p)"/>
<text x="250" y="200" font-size="13" fill="#222"><tspan font-weight="bold">3</tspan> Proxy Map-Reply</text>
<text x="250" y="216" font-size="11" fill="#222">RLOC 2.1.2.1 → Map-Cache</text>
<!-- 4 data -->
<line x1="230" y1="275" x2="568" y2="275" stroke="#ff6b6b" stroke-width="5" marker-end="url(#p)"/>
<text x="400" y="300" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">4</tspan> VXLAN: außen 1.1.1.1 → 2.1.2.1</text>
<text x="400" y="318" text-anchor="middle" font-size="12" fill="#222">innen 10.1.0.1 → 10.2.2.2 (Original-Frame)</text>
<text x="400" y="410" text-anchor="middle" font-size="12" fill="#222">SD-Access: CP Node antwortet selbst (Proxy-Reply). Klassisches LISP: MS leitet den Request an den ETR weiter.</text>
<text x="400" y="432" text-anchor="middle" font-size="12" fill="#222">Kein Eintrag im HTDB → Negative Map-Reply → Verkehr zum External Border (PETR)</text>
</svg>
