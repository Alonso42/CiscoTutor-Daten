<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Makro- und Mikro-Segmentierung in SD-Access</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Zwei Ebenen: Virtual Network (VRF) und Scalable Group (SGT)</text>
<rect x="20" y="50" width="360" height="300" rx="12" fill="#4a9cff" fill-opacity="0.1" stroke="#4a9cff" stroke-width="2"/>
<text x="200" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">VN CAMPUS (VRF, L3-VNI)</text>
<rect x="420" y="50" width="360" height="140" rx="12" fill="#39c86a" fill-opacity="0.12" stroke="#39c86a" stroke-width="2"/>
<text x="600" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">VN IOT (VRF, L3-VNI)</text>
<rect x="420" y="210" width="360" height="140" rx="12" fill="#ff6b6b" fill-opacity="0.1" stroke="#ff6b6b" stroke-width="2"/>
<text x="600" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">VN GUEST (VRF, L3-VNI)</text>
<!-- SGTs in campus -->
<rect x="40" y="95" width="100" height="40" rx="6" fill="#ffffff" stroke="#222"/><text x="90" y="120" text-anchor="middle" font-size="12" fill="#222">SGT Employee</text>
<rect x="150" y="95" width="100" height="40" rx="6" fill="#ffffff" stroke="#222"/><text x="200" y="120" text-anchor="middle" font-size="12" fill="#222">SGT Contractor</text>
<rect x="260" y="95" width="100" height="40" rx="6" fill="#ffffff" stroke="#222"/><text x="310" y="120" text-anchor="middle" font-size="12" fill="#222">SGT Server</text>
<text x="200" y="160" text-anchor="middle" font-size="12" fill="#222">Policy-Matrix (SGACL, Egress-Enforcement)</text>
<g font-size="12" fill="#222">
<rect x="60" y="170" width="280" height="150" fill="#ffffff" stroke="#222"/>
<text x="65" y="190">Quelle \ Ziel</text><text x="190" y="190" text-anchor="middle">Employee</text><text x="290" y="190" text-anchor="middle">Server</text>
<line x1="60" y1="198" x2="340" y2="198" stroke="#222"/>
<text x="65" y="225">Employee</text><text x="190" y="225" text-anchor="middle">permit</text><text x="290" y="225" text-anchor="middle" fill="#222">permit</text>
<text x="65" y="260">Contractor</text><text x="190" y="260" text-anchor="middle">deny</text><text x="290" y="260" text-anchor="middle">permit web</text>
<text x="65" y="295">Server</text><text x="190" y="295" text-anchor="middle">permit</text><text x="290" y="295" text-anchor="middle">permit</text>
<line x1="140" y1="170" x2="140" y2="320" stroke="#222"/><line x1="240" y1="170" x2="240" y2="320" stroke="#222"/>
</g>
<text x="600" y="105" text-anchor="middle" font-size="12" fill="#222">Kameras, Gebäudetechnik</text>
<text x="600" y="125" text-anchor="middle" font-size="12" fill="#222">eigene Routing-Tabelle</text>
<text x="600" y="265" text-anchor="middle" font-size="12" fill="#222">Gäste, nur Internet</text>
<line x1="385" y1="200" x2="415" y2="140" stroke="#ff6b6b" stroke-width="3"/>
<line x1="385" y1="140" x2="415" y2="200" stroke="#ff6b6b" stroke-width="3"/>
<text x="600" y="160" text-anchor="middle" font-size="12" fill="#222">VN↔VN standardmäßig keine Verbindung</text>
<text x="600" y="320" text-anchor="middle" font-size="12" fill="#222">Inter-VN nur über Fusion Router/Firewall</text>
<text x="400" y="385" text-anchor="middle" font-size="13" fill="#222">Makro: VN = VRF · Data Plane: VNI · Control Plane: LISP Instance-ID · außerhalb: VRF-Lite</text>
<text x="400" y="408" text-anchor="middle" font-size="13" fill="#222">Mikro: SGT (16 Bit, von ISE bei Anmeldung) · im VXLAN-GPO-Header · SGACL am Ziel</text>
<text x="400" y="431" text-anchor="middle" font-size="13" fill="#222">Policy hängt an Gruppen, nicht an IP-Adressen oder VLANs</text>
</svg>
