<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>SD-Access: Underlay und Overlay</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Overlay (Fabric) über einem gerouteten Underlay</text>
<!-- Overlay -->
<rect x="40" y="50" width="720" height="140" rx="14" fill="#b08aff" fill-opacity="0.13" stroke="#b08aff" stroke-width="2"/>
<text x="55" y="72" font-size="15" font-weight="bold" fill="#222">Overlay: VNs (VRF) + Host Pools, VXLAN-Tunnel zwischen VTEPs</text>
<rect x="90" y="95" width="110" height="40" rx="6" fill="#ffffff" stroke="#b08aff" stroke-width="2"/>
<text x="145" y="120" text-anchor="middle" font-size="13" fill="#222">Edge 1 (VTEP)</text>
<rect x="345" y="95" width="110" height="40" rx="6" fill="#ffffff" stroke="#b08aff" stroke-width="2"/>
<text x="400" y="120" text-anchor="middle" font-size="13" fill="#222">Edge 2 (VTEP)</text>
<rect x="600" y="95" width="110" height="40" rx="6" fill="#ffffff" stroke="#b08aff" stroke-width="2"/>
<text x="655" y="120" text-anchor="middle" font-size="13" fill="#222">Border (VTEP)</text>
<line x1="200" y1="108" x2="345" y2="108" stroke="#ffd23f" stroke-width="5"/>
<line x1="455" y1="108" x2="600" y2="108" stroke="#ffd23f" stroke-width="5"/>
<path d="M145 135 Q400 185 655 135" fill="none" stroke="#ffd23f" stroke-width="5"/>
<text x="272" y="100" text-anchor="middle" font-size="12" fill="#222">VXLAN</text>
<text x="527" y="100" text-anchor="middle" font-size="12" fill="#222">VXLAN</text>
<text x="400" y="178" text-anchor="middle" font-size="12" fill="#222">Subnetz 10.10.20.0/24 auf allen Edges (Anycast Gateway)</text>
<!-- Underlay -->
<rect x="40" y="225" width="720" height="150" rx="14" fill="#4a9cff" fill-opacity="0.12" stroke="#4a9cff" stroke-width="2"/>
<text x="55" y="247" font-size="15" font-weight="bold" fill="#222">Underlay: Routed Access, IGP (IS-IS empfohlen), ECMP, MTU 9100</text>
<rect x="90" y="300" width="110" height="40" rx="6" fill="#ffffff" stroke="#222"/>
<text x="145" y="318" text-anchor="middle" font-size="13" fill="#222">SW Edge 1</text>
<text x="145" y="334" text-anchor="middle" font-size="11" fill="#222">Lo0 10.255.0.21</text>
<rect x="345" y="300" width="110" height="40" rx="6" fill="#ffffff" stroke="#222"/>
<text x="400" y="318" text-anchor="middle" font-size="13" fill="#222">SW Edge 2</text>
<text x="400" y="334" text-anchor="middle" font-size="11" fill="#222">Lo0 10.255.0.22</text>
<rect x="600" y="300" width="110" height="40" rx="6" fill="#ffffff" stroke="#222"/>
<text x="655" y="318" text-anchor="middle" font-size="13" fill="#222">SW Border</text>
<text x="655" y="334" text-anchor="middle" font-size="11" fill="#222">Lo0 10.255.0.1</text>
<circle cx="272" cy="270" r="17" fill="#ffffff" stroke="#222"/><text x="272" y="275" text-anchor="middle" font-size="12" fill="#222">INT</text>
<circle cx="527" cy="270" r="17" fill="#ffffff" stroke="#222"/><text x="527" y="275" text-anchor="middle" font-size="12" fill="#222">INT</text>
<g stroke="#39c86a" stroke-width="3">
<line x1="200" y1="310" x2="257" y2="278"/><line x1="200" y1="330" x2="512" y2="278"/>
<line x1="345" y1="310" x2="287" y2="278"/><line x1="455" y1="310" x2="512" y2="278"/>
<line x1="600" y1="310" x2="542" y2="278"/><line x1="600" y1="330" x2="287" y2="278"/>
</g>
<text x="400" y="365" text-anchor="middle" font-size="12" fill="#222">INT = Intermediate Node: routet nur IP zwischen RLOCs, kennt weder VNs noch Endpunkte</text>
<!-- dashed mapping -->
<g stroke="#222" stroke-dasharray="5,4">
<line x1="145" y1="135" x2="145" y2="300"/><line x1="400" y1="135" x2="400" y2="300"/><line x1="655" y1="135" x2="655" y2="300"/>
</g>
<text x="400" y="405" text-anchor="middle" font-size="13" fill="#222">Underlay kennt nur RLOCs (Loopbacks) – keine Benutzer-Subnetze.</text>
<text x="400" y="428" text-anchor="middle" font-size="13" fill="#222">Overlay trägt Benutzerverkehr gekapselt; Endgeräte sehen das Underlay nie.</text>
</svg>
