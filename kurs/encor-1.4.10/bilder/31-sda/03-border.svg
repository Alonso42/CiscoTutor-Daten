<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Border-Typen: internal, external, anywhere</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Border Nodes: bekannte vs. unbekannte Netze</text>
<rect x="30" y="55" width="220" height="90" rx="14" fill="#39c86a" fill-opacity="0.18" stroke="#39c86a" stroke-width="2"/>
<text x="140" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Bekannte Netze</text>
<text x="140" y="102" text-anchor="middle" font-size="12" fill="#222">Shared Services, DC</text>
<text x="140" y="120" text-anchor="middle" font-size="12" fill="#222">feste Präfixliste</text>
<rect x="550" y="55" width="220" height="90" rx="14" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="2"/>
<text x="660" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Unbekannte Netze</text>
<text x="660" y="102" text-anchor="middle" font-size="12" fill="#222">Internet, Rest des Unternehmens</text>
<text x="660" y="120" text-anchor="middle" font-size="12" fill="#222">"alles andere" (Default)</text>
<rect x="60" y="180" width="170" height="60" rx="8" fill="#ffffff" stroke="#39c86a" stroke-width="3"/>
<text x="145" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Internal Border</text>
<text x="145" y="226" text-anchor="middle" font-size="11" fill="#222">importiert/registriert Präfixe</text>
<rect x="315" y="180" width="170" height="60" rx="8" fill="#ffffff" stroke="#b08aff" stroke-width="3"/>
<text x="400" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Anywhere Border</text>
<text x="400" y="226" text-anchor="middle" font-size="11" fill="#222">internal + external</text>
<rect x="570" y="180" width="170" height="60" rx="8" fill="#ffffff" stroke="#ff6b6b" stroke-width="3"/>
<text x="655" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">External Border</text>
<text x="655" y="226" text-anchor="middle" font-size="11" fill="#222">Gateway of last resort (PxTR)</text>
<g stroke-width="3">
<line x1="145" y1="145" x2="145" y2="180" stroke="#39c86a"/>
<line x1="655" y1="145" x2="655" y2="180" stroke="#ff6b6b"/>
<line x1="230" y1="120" x2="360" y2="180" stroke="#39c86a"/>
<line x1="570" y1="120" x2="440" y2="180" stroke="#ff6b6b"/>
</g>
<rect x="60" y="275" width="680" height="70" rx="16" fill="#4a9cff" fill-opacity="0.1" stroke="#4a9cff" stroke-width="2" stroke-dasharray="7,5"/>
<text x="400" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Fabric: Edges fragen den Control Plane Node (Map-Request)</text>
<text x="400" y="325" text-anchor="middle" font-size="12" fill="#222">Treffer → direkt zum RLOC; keine Antwort (Negative Map-Reply) → zum External Border</text>
<g stroke="#4a9cff" stroke-width="2"><line x1="145" y1="240" x2="145" y2="275"/><line x1="400" y1="240" x2="400" y2="275"/><line x1="655" y1="240" x2="655" y2="275"/></g>
<text x="400" y="375" text-anchor="middle" font-size="13" fill="#222">Border-Aufgaben: EID-Präfixe per BGP nach außen annoncieren · LISP Instance ↔ VRF (VRF-Lite)</text>
<text x="400" y="398" text-anchor="middle" font-size="13" fill="#222">SGT nach außen erhalten: SXP oder Inline-Tagging (CMD) auf dem Handoff-Link</text>
<text x="400" y="421" text-anchor="middle" font-size="13" fill="#222">EID-Routen stehen nur in der Routing-Tabelle des Borders, nicht im Underlay</text>
</svg>
