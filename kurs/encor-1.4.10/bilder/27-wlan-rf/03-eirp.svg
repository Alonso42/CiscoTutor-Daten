<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>EIRP und Link-Budget</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">EIRP und Link-Budget</text>
<g font-size="14" fill="#222">
<rect x="30" y="70" width="120" height="60" rx="6" fill="#4a9cff"/><text x="90" y="96" text-anchor="middle" fill="#fff">Sender</text><text x="90" y="116" text-anchor="middle" fill="#fff">20 dBm</text>
<line x1="150" y1="100" x2="250" y2="100" stroke="#222" stroke-width="4"/><text x="200" y="90" text-anchor="middle">Kabel −2 dB</text>
<line x1="250" y1="100" x2="250" y2="60" stroke="#222" stroke-width="3"/><polygon points="235,60 265,60 250,40" fill="#b08aff"/><text x="275" y="55">Antenne +6 dBi</text>
<path d="M270 100 Q 420 30 560 100" fill="none" stroke="#ffd23f" stroke-width="3"/>
<path d="M270 100 Q 420 170 560 100" fill="none" stroke="#ffd23f" stroke-width="3"/>
<text x="415" y="105" text-anchor="middle">Pfadverlust −80 dB</text>
<polygon points="580,60 610,60 595,40" fill="#b08aff"/><line x1="595" y1="60" x2="595" y2="100" stroke="#222" stroke-width="3"/>
<text x="615" y="55">+3 dBi</text>
<rect x="640" y="70" width="130" height="60" rx="6" fill="#39c86a"/><text x="705" y="96" text-anchor="middle" fill="#fff">Empfänger</text><text x="705" y="116" text-anchor="middle" fill="#fff">−53 dBm</text>
<rect x="30" y="180" width="740" height="110" rx="8" fill="#fffbea" stroke="#ffd23f"/>
<text x="50" y="208" font-weight="bold">EIRP = Sendeleistung − Kabelverlust + Antennengewinn</text>
<text x="50" y="232">20 dBm − 2 dB + 6 dBi = 24 dBm (≈ 250 mW in Hauptstrahlrichtung)</text>
<text x="50" y="256">Empfang = EIRP − Pfadverlust + Rx-Antenne − Rx-Kabel = 24 − 80 + 3 − 0 = −53 dBm</text>
<text x="50" y="280">SNR bei Noise −95 dBm: −53 − (−95) = 42 dB</text>
<rect x="30" y="305" width="740" height="125" rx="8" fill="#f4f8ff" stroke="#4a9cff"/>
<text x="50" y="332" font-weight="bold">Merke</text>
<text x="50" y="356">• Antennengewinn ist passiv: Energie wird nur gebündelt, nicht erzeugt.</text>
<text x="50" y="378">• Regulierung begrenzt Sendeleistung UND EIRP → bei mehr dBi Leistung senken.</text>
<text x="50" y="400">• Freiraumdämpfung: doppelte Distanz ≈ +6 dB, zehnfache Distanz = +20 dB.</text>
<text x="50" y="422">• Fade Margin = Empfangspegel − Empfängerempfindlichkeit (Reserve).</text>
</g>
</svg>
