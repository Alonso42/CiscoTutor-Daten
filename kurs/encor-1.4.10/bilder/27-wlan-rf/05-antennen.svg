<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Antennen: Strahlungsdiagramme und Beamwidth</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Strahlungsdiagramme</text>
<g font-size="13" fill="#222">
<text x="110" y="62" text-anchor="middle" font-weight="bold">Omni – Azimut (Draufsicht)</text>
<circle cx="110" cy="150" r="70" fill="#eaf3ff" stroke="#4a9cff" stroke-width="3"/><circle cx="110" cy="150" r="5" fill="#222"/>
<text x="110" y="245" text-anchor="middle">360° gleichmäßig</text>
<text x="330" y="62" text-anchor="middle" font-weight="bold">Omni – Elevation (Seite)</text>
<ellipse cx="275" cy="150" rx="50" ry="28" fill="#eaf3ff" stroke="#4a9cff" stroke-width="3"/>
<ellipse cx="385" cy="150" rx="50" ry="28" fill="#eaf3ff" stroke="#4a9cff" stroke-width="3"/>
<line x1="330" y1="110" x2="330" y2="190" stroke="#222" stroke-width="3"/>
<text x="330" y="245" text-anchor="middle">"Donut": mehr dBi = flacher</text>
<text x="590" y="62" text-anchor="middle" font-weight="bold">Richtantenne (Azimut)</text>
<path d="M470 150 Q 600 70 720 150 Q 600 230 470 150 Z" fill="#f4fff7" stroke="#39c86a" stroke-width="3"/>
<ellipse cx="455" cy="150" rx="18" ry="12" fill="#f4fff7" stroke="#39c86a" stroke-width="2"/>
<circle cx="470" cy="150" r="5" fill="#222"/>
<line x1="470" y1="150" x2="700" y2="105" stroke="#ff6b6b" stroke-dasharray="5 4"/><line x1="470" y1="150" x2="700" y2="195" stroke="#ff6b6b" stroke-dasharray="5 4"/>
<text x="610" y="245" text-anchor="middle">Beamwidth zwischen den −3-dB-Punkten</text>
<text x="440" y="185">Rückkeule</text>
<rect x="30" y="270" width="740" height="165" rx="8" fill="#fafafa" stroke="#999"/>
<text x="50" y="296" font-weight="bold">Typ</text><text x="230" y="296" font-weight="bold">Gewinn (Kurs)</text><text x="400" y="296" font-weight="bold">Einsatz</text>
<text x="50" y="320">Dipol / integriert</text><text x="230" y="320">2,14 dBi / ≈ 4 dBi</text><text x="400" y="320">Büro, eine Etage</text>
<text x="50" y="342">High-Gain-Omni</text><text x="230" y="342">5,2 / 12 dBi</text><text x="400" y="342">große Halle (Decke), Mast</text>
<text x="50" y="364">Patch</text><text x="230" y="364">3–4 dBi (typisch 6–9)</text><text x="400" y="364">Wand, langer Raum, über Türen</text>
<text x="50" y="386">Yagi</text><text x="230" y="386">13,5 dBi</text><text x="400" y="386">Korridor, Lagerhalle</text>
<text x="50" y="408">Parabol</text><text x="230" y="408">21 dBi</text><text x="400" y="408">Punkt-zu-Punkt outdoor</text>
<text x="50" y="428" font-size="12">Schmalerer Strahl = höherer Gewinn. Polarisation beider Seiten gleich ausrichten.</text>
</g>
</svg>
