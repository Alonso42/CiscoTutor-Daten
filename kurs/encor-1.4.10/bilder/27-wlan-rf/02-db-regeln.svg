<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Regel der 3 und 10: dBm und mW</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Regel der 3 und 10</text>
<g font-size="14" fill="#222">
<rect x="40" y="55" width="300" height="150" rx="8" fill="#f4fff7" stroke="#39c86a"/>
<text x="60" y="82" font-weight="bold">Relativ (dB)</text>
<text x="60" y="108">+3 dB  → Leistung × 2</text>
<text x="60" y="130">−3 dB  → Leistung ÷ 2</text>
<text x="60" y="152">+10 dB → Leistung × 10</text>
<text x="60" y="174">−10 dB → Leistung ÷ 10</text>
<text x="60" y="196">+6 dB = ×4 · +20 dB = ×100</text>
<rect x="40" y="220" width="300" height="200" rx="8" fill="#f4f8ff" stroke="#4a9cff"/>
<text x="60" y="246" font-weight="bold">Einheiten</text>
<text x="60" y="270">dBm: absolut, Bezug 1 mW</text>
<text x="60" y="292">dBi: Antenne vs. isotrop</text>
<text x="60" y="314">dBd: Antenne vs. Dipol</text>
<text x="60" y="336">dBi = dBd + 2,14</text>
<text x="60" y="362">dBm ± dB = dBm</text>
<text x="60" y="384">dBm − dBm = dB (z. B. SNR)</text>
<text x="60" y="406">mW = 10^(dBm/10)</text>
</g>
<g font-size="14" fill="#222">
<line x1="430" y1="420" x2="430" y2="60" stroke="#222" stroke-width="2"/>
<text x="440" y="58" font-weight="bold">dBm</text><text x="610" y="58" font-weight="bold">mW</text>
<g>
<circle cx="430" cy="405" r="5" fill="#b08aff"/><text x="445" y="410">−10</text><text x="610" y="410">0,1</text>
<circle cx="430" cy="370" r="5" fill="#b08aff"/><text x="445" y="375">0</text><text x="610" y="375">1</text>
<circle cx="430" cy="335" r="5" fill="#b08aff"/><text x="445" y="340">3</text><text x="610" y="340">2</text>
<circle cx="430" cy="300" r="5" fill="#b08aff"/><text x="445" y="305">10</text><text x="610" y="305">10</text>
<circle cx="430" cy="265" r="5" fill="#b08aff"/><text x="445" y="270">17</text><text x="610" y="270">50</text>
<circle cx="430" cy="230" r="5" fill="#b08aff"/><text x="445" y="235">20</text><text x="610" y="235">100 (typischer AP)</text>
<circle cx="430" cy="195" r="5" fill="#b08aff"/><text x="445" y="200">23</text><text x="610" y="200">200</text>
<circle cx="430" cy="160" r="5" fill="#b08aff"/><text x="445" y="165">27</text><text x="610" y="165">500</text>
<circle cx="430" cy="125" r="5" fill="#b08aff"/><text x="445" y="130">30</text><text x="610" y="130">1000 = 1 W</text>
<circle cx="430" cy="90" r="5" fill="#ff6b6b"/><text x="445" y="95">36</text><text x="610" y="95">≈ 4000 = 4 W</text>
</g>
<text x="500" y="440" font-size="12">Beispiel: 36 = 10+10+10+3+3 → 1·10·10·10·2·2 mW</text>
</g>
</svg>
