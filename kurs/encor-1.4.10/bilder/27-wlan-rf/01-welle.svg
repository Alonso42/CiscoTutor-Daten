<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Welle: Wellenlänge, Amplitude, Frequenz</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Eigenschaften einer Funkwelle</text>
<line x1="40" y1="150" x2="560" y2="150" stroke="#999" stroke-dasharray="4 4"/>
<path d="M40 150 C 80 60, 120 60, 160 150 S 240 240, 280 150 S 360 60, 400 150 S 480 240, 520 150" fill="none" stroke="#4a9cff" stroke-width="3"/>
<line x1="100" y1="72" x2="340" y2="72" stroke="#b08aff" stroke-width="2"/>
<line x1="100" y1="64" x2="100" y2="80" stroke="#b08aff" stroke-width="2"/>
<line x1="340" y1="64" x2="340" y2="80" stroke="#b08aff" stroke-width="2"/>
<text x="220" y="62" text-anchor="middle" font-size="14" fill="#222">Wellenlänge λ (ein Zyklus)</text>
<line x1="545" y1="150" x2="545" y2="82" stroke="#ff6b6b" stroke-width="2"/>
<text x="552" y="112" font-size="14" fill="#222">Amplitude</text>
<text x="552" y="128" font-size="12" fill="#222">(Spitze ↔ Nulllinie)</text>
<text x="40" y="270" font-size="14" fill="#222">Frequenz f = Zyklen pro Sekunde (Hz)</text>
<text x="40" y="292" font-size="14" fill="#222">λ = c / f   mit c ≈ 300 000 km/s   →   λ[cm] ≈ 30 / f[GHz]</text>
<text x="40" y="314" font-size="14" fill="#222">Phase: Position im Zyklus (0–360°); 180° versetzt = Auslöschung</text>
<rect x="40" y="335" width="720" height="95" rx="8" fill="#f4f8ff" stroke="#4a9cff"/>
<text x="60" y="360" font-size="15" font-weight="bold" fill="#222">Wellenlängen im WLAN</text>
<rect x="60" y="372" width="250" height="14" fill="#39c86a"/><text x="320" y="384" font-size="13" fill="#222">2,4 GHz ≈ 12,5 cm (größte Reichweite)</text>
<rect x="60" y="392" width="120" height="14" fill="#ffd23f"/><text x="320" y="404" font-size="13" fill="#222">5 GHz ≈ 6 cm</text>
<rect x="60" y="412" width="100" height="14" fill="#ff6b6b"/><text x="320" y="424" font-size="13" fill="#222">6 GHz ≈ 5 cm (mehr Dämpfung, kleinere Zellen)</text>
<text x="600" y="200" font-size="13" fill="#222">höhere Frequenz</text>
<text x="600" y="218" font-size="13" fill="#222">= kürzere Welle</text>
<text x="600" y="236" font-size="13" fill="#222">= mehr Pfadverlust</text>
</svg>
