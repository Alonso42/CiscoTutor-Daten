<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>LAN Automation: Seed, zwei Hops, L2 zu L3</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">LAN Automation für das SD-Access-Underlay</text>
<g font-size="13" fill="#222">
<rect x="20" y="45" width="130" height="40" rx="8" fill="#ffd23f" fill-opacity="0.35" stroke="#222"/>
<text x="85" y="70" text-anchor="middle" font-weight="bold">Catalyst Center</text>
<line x1="85" y1="85" x2="85" y2="108" stroke="#222"/>
<rect x="30" y="110" width="110" height="40" fill="#4a9cff" fill-opacity="0.25" stroke="#4a9cff" stroke-width="2"/>
<text x="85" y="128" text-anchor="middle" font-weight="bold">SW Primary</text><text x="85" y="144" text-anchor="middle" font-size="11">Seed</text>
<rect x="250" y="110" width="110" height="40" fill="#4a9cff" fill-opacity="0.25" stroke="#4a9cff" stroke-width="2"/>
<text x="305" y="128" text-anchor="middle" font-weight="bold">SW Peer</text><text x="305" y="144" text-anchor="middle" font-size="11">Seed</text>
<line x1="140" y1="130" x2="250" y2="130" stroke="#222" stroke-width="2"/>
<rect x="140" y="215" width="110" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="195" y="240" text-anchor="middle">SW Disc-1</text>
<rect x="140" y="310" width="110" height="40" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="195" y="335" text-anchor="middle">SW Disc-2</text>
<rect x="140" y="395" width="110" height="40" fill="#eeeeee" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="195" y="420" text-anchor="middle">SW Disc-3</text>
<line x1="85" y1="150" x2="170" y2="215" stroke="#39c86a" stroke-width="3"/>
<line x1="305" y1="150" x2="220" y2="215" stroke="#39c86a" stroke-width="3"/>
<line x1="195" y1="255" x2="195" y2="310" stroke="#39c86a" stroke-width="3"/>
<line x1="195" y1="350" x2="195" y2="395" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="6 4"/>
<text x="60" y="190" fill="#39c86a" font-weight="bold">Hop 1</text>
<text x="205" y="288" fill="#39c86a" font-weight="bold">Hop 2</text>
<text x="205" y="378" fill="#ff6b6b" font-weight="bold">Hop 3: nicht automatisiert</text>
<rect x="400" y="45" width="385" height="150" rx="8" fill="#39c86a" fill-opacity="0.12" stroke="#39c86a" stroke-width="2"/>
<text x="592" y="67" text-anchor="middle" font-size="15" font-weight="bold">Start LAN Automation</text>
<text x="412" y="91">• temporäre Konfiguration auf dem Seed</text>
<text x="412" y="113">• Seed = DHCP-Server in VLAN 1</text>
<text x="424" y="131">mit Option 43 → Catalyst Center</text>
<text x="412" y="153">• neue Geräte: IP + PnP → Discovery,</text>
<text x="424" y="171">Image-Upgrade, Grundkonfiguration</text>
<rect x="400" y="210" width="385" height="150" rx="8" fill="#4a9cff" fill-opacity="0.12" stroke="#4a9cff" stroke-width="2"/>
<text x="592" y="232" text-anchor="middle" font-size="15" font-weight="bold">Stop LAN Automation</text>
<text x="412" y="256">• permanente Konfiguration</text>
<text x="412" y="278">• Punkt-zu-Punkt-Links L2 → L3</text>
<text x="424" y="296">Reihenfolge: Access → Distribution → Core</text>
<text x="412" y="318">• kurze Unterbrechung, STP-Änderung</text>
<text x="412" y="340">• temporäre Konfiguration entfernen</text>
<rect x="400" y="375" width="385" height="60" rx="8" fill="#eeeeee" stroke="#222"/>
<text x="412" y="398">Größere Netze: mehrere Läufe mit neuem Seed</text>
<text x="412" y="420">Ablauf: Plan → Design → Discover → Provision</text>
</g>
</svg>
