<text x="185" y="156">User-/Geräteprofile</text><text x="185" y="176">Gruppen (SGT)</text><text x="185" y="196">Segmentierung</text><text x="185" y="216">Access Control</text><text x="185" y="236">Application (QoS)</text><text x="185" y="256">Traffic Copy (SPAN)</text>
