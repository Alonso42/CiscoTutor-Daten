<rect x="20" y="55" width="760" height="34" rx="8" fill="#eeeeee" stroke="#222"/>
<text x="400" y="78" text-anchor="middle" font-size="16" fill="#222">Automation + Assurance aus einer Konsole (Appliance, ESXi oder AWS)</text>
