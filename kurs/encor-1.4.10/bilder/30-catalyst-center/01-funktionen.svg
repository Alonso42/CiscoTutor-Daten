<rect x="20" y="340" width="180" height="90" rx="8" fill="#39c86a" fill-opacity="0.15" stroke="#39c86a"/>
<text x="110" y="362" text-anchor="middle" font-weight="bold" font-size="15">NetOps</text><text x="30" y="384">Netz bauen + pflegen</text><text x="30" y="404">manuell → AI-assistiert</text><text x="30" y="422">→ selektiv autonom</text>
