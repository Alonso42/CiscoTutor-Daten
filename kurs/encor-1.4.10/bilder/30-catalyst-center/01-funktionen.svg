<text x="710" y="130" text-anchor="middle" font-size="17" font-weight="bold">Platform</text>
<text x="650" y="156">Intent API (REST)</text><text x="650" y="176">Process Adapter</text><text x="650" y="196">Domain Adapter</text><text x="650" y="216">Multivendor SDK</text><text x="650" y="236">Events/Webhooks</text>
</g>
<text x="400" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Personas / Einsatzsichten</text>
