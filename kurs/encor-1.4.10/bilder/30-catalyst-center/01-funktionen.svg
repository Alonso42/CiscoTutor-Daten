<text x="303" y="362" text-anchor="middle" font-weight="bold" font-size="15">SecOps</text><text x="223" y="384">Endpunkte klassifizieren</text><text x="223" y="404">Policy durchsetzen</text><text x="223" y="422">Zero Trust, PSIRT-Scans</text>
