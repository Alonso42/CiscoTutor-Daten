<text x="340" y="156">Inventory</text><text x="340" y="176">Plug and Play</text><text x="340" y="196">Gerät → Site</text><text x="340" y="216">Templates pushen</text><text x="340" y="236">SWIM-Upgrade</text><text x="340" y="256">Fabric-Domänen</text>
<rect x="485" y="105" width="140" height="190" rx="8" fill="#ffd23f" fill-opacity="0.3" stroke="#222" stroke-width="1.5"/>
<text x="555" y="130" text-anchor="middle" font-size="17" font-weight="bold">Assurance</text>
<text x="495" y="156">Health Scores</text><text x="495" y="176">Issues P1–P4</text><text x="495" y="196">Device/Client 360</text><text x="495" y="216">Path Trace</text><text x="495" y="236">Time Travel</text><text x="495" y="256">AI Analytics, MRE</text>
