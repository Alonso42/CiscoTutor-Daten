<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Assurance: von Telemetrie zu Insights</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Catalyst Center Assurance (AIOps)</text>
<g font-size="13" fill="#222">
<rect x="15" y="45" width="235" height="250" rx="8" fill="#4a9cff" fill-opacity="0.12" stroke="#4a9cff" stroke-width="2"/>
<text x="132" y="67" text-anchor="middle" font-size="15" font-weight="bold">Collection + Ingestion</text>
<text x="25" y="91" font-weight="bold">Netzwerk-Telemetrie</text>
<text x="25" y="111">SNMP (Polling, Traps)</text>
<text x="25" y="129">Syslog</text>
<text x="25" y="147">NetFlow</text>
<text x="25" y="165">Streaming Telemetry</text>
<text x="25" y="183">WLC, AP-Sensoren</text>
<text x="25" y="209" font-weight="bold">Kontextdaten</text>
<text x="25" y="229">AAA/ISE, LDAP, DHCP, DNS</text>
<text x="25" y="247">Topologie, Inventory, Location</text>
<text x="25" y="265">Policy, ITSM</text>
<line x1="252" y1="170" x2="283" y2="170" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="285" y="105" width="200" height="130" rx="8" fill="#b08aff" fill-opacity="0.18" stroke="#b08aff" stroke-width="2"/>
<text x="385" y="130" text-anchor="middle" font-size="15" font-weight="bold">Correlation +</text>
<text x="385" y="148" text-anchor="middle" font-size="15" font-weight="bold">Analysis</text>
<text x="295" y="174">Baselines (ML)</text>
<text x="295" y="194">Machine Reasoning Engine</text>
<text x="295" y="214">Knowledge Packs</text>
<line x1="487" y1="170" x2="518" y2="170" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="45" width="265" height="250" rx="8" fill="#39c86a" fill-opacity="0.12" stroke="#39c86a" stroke-width="2"/>
<text x="652" y="67" text-anchor="middle" font-size="15" font-weight="bold">Visualization + Action</text>
<text x="530" y="91">Health: Overall, Network Device,</text>
<text x="530" y="109">Client, Application</text>
<rect x="530" y="118" width="80" height="22" fill="#ff6b6b" fill-opacity="0.5"/><text x="570" y="134" text-anchor="middle">Poor 1–3</text>
<rect x="615" y="118" width="80" height="22" fill="#ffd23f" fill-opacity="0.7"/><text x="655" y="134" text-anchor="middle">Fair 4–7</text>
<rect x="700" y="118" width="80" height="22" fill="#39c86a" fill-opacity="0.6"/><text x="740" y="134" text-anchor="middle">Good 8–10</text>
<text x="530" y="162">Issues P1 (kritisch) … P4</text>
<text x="530" y="180">Open · Resolved · Ignored</text>
<text x="530" y="198">Device 360 · Client 360 · App 360</text>
<text x="530" y="216">Time Travel (Issues bis 14 Tage)</text>
<text x="530" y="234">Path Trace · Intelligent Capture</text>
<text x="530" y="252">Sensor Tests · Guided Remediation</text>
<text x="530" y="270">APIs für Fremdsysteme</text>
<rect x="15" y="315" width="380" height="120" rx="8" fill="#ffd23f" fill-opacity="0.2" stroke="#222"/>
<text x="205" y="337" text-anchor="middle" font-size="15" font-weight="bold">Issue-Quellen</text>
<text x="28" y="361">• Syslog-basiert (z. B. Link down)</text>
<text x="28" y="383">• Threshold-basiert (z. B. CPU &gt; Schwelle)</text>
<text x="28" y="405">• AI-driven: Abweichung von der Baseline</text>
<text x="40" y="423">(meist Cloud-AI nötig)</text>
<rect x="405" y="315" width="380" height="120" rx="8" fill="#eeeeee" stroke="#222"/>
<text x="595" y="337" text-anchor="middle" font-size="15" font-weight="bold">Cloud AI Network Analytics</text>
<text x="418" y="361">anonymisierte Daten → Kairos-Cloud (AWS)</text>
<text x="418" y="383">nur ausgehend TCP 443, TLS 1.2</text>
<text x="418" y="405">Trends, Heatmap, Site/Peer Comparison</text>
<text x="418" y="425">Lizenz: Catalyst Advantage</text>
