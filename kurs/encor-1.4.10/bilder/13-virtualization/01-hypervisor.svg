<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Klassischer Server, Hypervisor Typ 1 und Typ 2, Container</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">Was liegt unter der Anwendung?</text>
<g font-size="14" font-weight="bold" fill="#222" text-anchor="middle">
<text x="110" y="70">Klassisch</text>
<text x="305" y="70">Typ 1 (bare metal)</text>
<text x="500" y="70">Typ 2 (hosted)</text>
<text x="695" y="70">Container</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="110" y="88">1 OS, 1 App pro Server</text>
<text x="305" y="88">z. B. VMware ESXi</text>
<text x="500" y="88">z. B. VirtualBox</text>
<text x="695" y="88">z. B. Docker</text>
</g>
<g stroke="#222" stroke-width="1">
<rect x="20" y="330" width="180" height="40" fill="#dddddd"/>
<rect x="20" y="290" width="180" height="40" fill="#e6dcff"/>
<rect x="20" y="250" width="180" height="40" fill="#dceaff"/>
<rect x="215" y="330" width="180" height="40" fill="#dddddd"/>
<rect x="215" y="290" width="180" height="40" fill="#ffd23f"/>
<rect x="215" y="250" width="88" height="40" fill="#e6dcff"/>
<rect x="307" y="250" width="88" height="40" fill="#e6dcff"/>
<rect x="215" y="210" width="88" height="40" fill="#dceaff"/>
<rect x="307" y="210" width="88" height="40" fill="#dceaff"/>
<rect x="410" y="330" width="180" height="40" fill="#dddddd"/>
<rect x="410" y="290" width="180" height="40" fill="#e6dcff"/>
<rect x="410" y="250" width="180" height="40" fill="#ffd23f"/>
<rect x="410" y="210" width="88" height="40" fill="#e6dcff"/>
<rect x="502" y="210" width="88" height="40" fill="#e6dcff"/>
<rect x="410" y="170" width="88" height="40" fill="#dceaff"/>
<rect x="502" y="170" width="88" height="40" fill="#dceaff"/>
<rect x="605" y="330" width="180" height="40" fill="#dddddd"/>
<rect x="605" y="290" width="180" height="40" fill="#e6dcff"/>
<rect x="605" y="250" width="180" height="40" fill="#d6f5e0"/>
<rect x="605" y="210" width="88" height="40" fill="#dceaff"/>
<rect x="697" y="210" width="88" height="40" fill="#dceaff"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="110" y="350">Hardware</text>
<text x="110" y="310">Betriebssystem</text>
<text x="110" y="270">Anwendung</text>
<text x="305" y="350">Hardware</text>
<text x="305" y="310" font-weight="bold">Hypervisor</text>
<text x="259" y="270">Gast-OS</text>
<text x="351" y="270">Gast-OS</text>
<text x="259" y="230">App</text>
<text x="351" y="230">App</text>
<text x="500" y="350">Hardware</text>
<text x="500" y="310">Host-OS</text>
<text x="500" y="270" font-weight="bold">Hypervisor (App)</text>
<text x="454" y="230">Gast-OS</text>
<text x="546" y="230">Gast-OS</text>
<text x="454" y="190">App</text>
<text x="546" y="190">App</text>
<text x="695" y="350">Hardware</text>
<text x="695" y="310">Host-OS (Kernel)</text>
<text x="695" y="270" font-weight="bold">Container-Engine</text>
<text x="651" y="230">App + Libs</text>
<text x="741" y="230">App + Libs</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="400">Typ 1: direkt auf der Hardware, Standard im Rechenzentrum. Typ 2: Anwendung auf einem Host-OS, fürs Labor.</text>
<text x="20" y="420">Container: kein Hypervisor, alle teilen den Kernel des Host-OS → klein, startet in Sekunden, schwächer isoliert.</text>
<text x="20" y="440">Virtual Machine Monitor (VMM) = Teil des Hypervisors, der VM-Anweisungen an die echte Hardware weiterreicht.</text>
</g>
</svg>
