<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery 16: GRE-Tunnel von R1 zu R4 über R2 und R3</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Discovery 16: GRE-Tunnel über ein fremdes IP-Netz</text>
<rect x="90" y="110" width="620" height="32" rx="16" fill="#efe8ff" stroke="#b08aff" stroke-width="2"/>
<text x="400" y="131" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Tunnel0 · 172.16.99.0/24 · OSPF Area 0</text>
<g stroke="#222" stroke-width="2">
<line x1="100" y1="142" x2="100" y2="176"/>
<line x1="700" y1="142" x2="700" y2="176"/>
<line x1="124" y1="200" x2="276" y2="200"/>
<line x1="324" y1="200" x2="476" y2="200"/>
<line x1="524" y1="200" x2="676" y2="200"/>
</g>
<g stroke="#222" stroke-width="2">
<circle cx="100" cy="200" r="24" fill="#ffd23f"/>
<circle cx="300" cy="200" r="24" fill="#dddddd"/>
<circle cx="500" cy="200" r="24" fill="#dddddd"/>
<circle cx="700" cy="200" r="24" fill="#ffd23f"/>
</g>
<g font-size="13" fill="#222" text-anchor="middle" dominant-baseline="central" font-weight="bold">
<text x="100" y="200">R1</text>
<text x="300" y="200">R2</text>
<text x="500" y="200">R3</text>
<text x="700" y="200">R4</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="100" y="96">Tu0 172.16.99.1</text>
<text x="700" y="96">Tu0 172.16.99.2</text>
<text x="200" y="222">10.10.1.0/24</text>
<text x="400" y="222">10.10.2.0/24</text>
<text x="600" y="222">10.10.3.0/24</text>
<text x="100" y="246">src 10.10.1.1</text>
<text x="100" y="262">Lo0 172.16.11.1</text>
<text x="100" y="278">LAN 172.16.1.0/24</text>
<text x="700" y="246">src 10.10.3.2</text>
<text x="700" y="262">Lo0 172.16.14.1</text>
<text x="700" y="278">LAN 172.16.4.0/24</text>
<text x="400" y="254">R2/R3: nur 10.0.0.0/8 (EIGRP),</text>
<text x="400" y="270">172.16.x.x ist hier unbekannt</text>
</g>
<text x="40" y="312" font-size="12" font-weight="bold" fill="#222">Paket im Transit (R2/R3 routen nur nach dem äußeren Header):</text>
<g stroke="#222" stroke-width="1">
<rect x="40" y="320" width="250" height="34" fill="#dceaff"/>
<rect x="290" y="320" width="60" height="34" fill="#ffd23f"/>
<rect x="350" y="320" width="270" height="34" fill="#e3f7ea"/>
<rect x="620" y="320" width="140" height="34" fill="#f5f5f5"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="165" y="337">außen 10.10.1.1 → 10.10.3.2</text>
<text x="320" y="337">GRE</text>
<text x="485" y="337">innen 172.16.11.1 → 172.16.14.1</text>
<text x="690" y="337">Daten</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="384">OSPF über Tunnel0: Nachbar FULL/ - (point-to-point); Kosten Tunnel 1000 (BW 100 kbit/s) + Ethernet 10 = 1010.</text>
<text x="20" y="406">Line protocol ohne Keepalive up, sobald Quelle up ist und eine Route zum Ziel 10.10.3.2 existiert.</text>
<text x="20" y="428">Traceroute R1 → 172.16.14.1: ein einziger Hop, angezeigt wird 172.16.99.2 (Tunnel-IP von R4).</text>
</g>
</svg>
