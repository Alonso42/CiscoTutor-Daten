<line x1="510" y1="354" x2="650" y2="354" stroke="#39c86a"/>
</g>
<ellipse cx="400" cy="220" rx="115" ry="36" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
<ellipse cx="400" cy="340" rx="115" ry="36" fill="#f2f2f2" stroke="#222" stroke-width="2"/>
<g stroke-width="3" stroke-dasharray="7 4" fill="none">
<line x1="290" y1="206" x2="510" y2="206" stroke="#4a9cff"/>
<line x1="290" y1="220" x2="510" y2="220" stroke="#ffd23f"/>
<line x1="290" y1="234" x2="510" y2="234" stroke="#39c86a"/>
