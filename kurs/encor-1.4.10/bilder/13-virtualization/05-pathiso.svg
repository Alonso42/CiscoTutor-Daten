<line x1="290" y1="340" x2="510" y2="340"/>
<line x1="290" y1="354" x2="510" y2="354"/>
</g>
<g fill="#ffffff" stroke="#222" stroke-width="2">
<rect x="140" y="70" width="26" height="60" rx="5"/>
<rect x="634" y="70" width="26" height="60" rx="5"/>
<rect x="140" y="190" width="26" height="60" rx="5"/>
<rect x="634" y="190" width="26" height="60" rx="5"/>
<rect x="140" y="310" width="26" height="60" rx="5"/>
<rect x="634" y="310" width="26" height="60" rx="5"/>
</g>
<g font-size="14" font-weight="bold" fill="#222">
<text x="20" y="96">Hop-by-Hop</text>
<text x="20" y="216">Multihop</text>
<text x="20" y="336">Multihop</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="114">VRF-Lite, EVN</text>
<text x="20" y="234">VRF-Lite + GRE</text>
<text x="20" y="354">MPLS VPN</text>
<text x="668" y="96">Campus, eigenes</text>
<text x="668" y="114">IGP (OSPF/EIGRP)</text>
<text x="668" y="216">über fremdes WAN</text>
<text x="668" y="234">oder fremder Core</text>
<text x="668" y="336">groß, über 32 VNs,</text>
<text x="668" y="354">TE/FRR, Any-to-Any</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="400" y="72">direkt verbunden: ein 802.1Q-VLAN bzw. VNET-Tag pro VRF</text>
<text x="400" y="176">IP-Netz ohne VRFs dazwischen: ein GRE-Tunnel pro VRF</text>
<text x="400" y="296">MPLS-Netz: das Label trennt die VRFs</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="408">Device Virtualization = VLAN (L2) und VRF (L3) im Gerät · Data Path Virtualization = Verbindung dazwischen.</text>
<text x="20" y="430">Pro VRF eigene Control Plane (Routingprozess, RIB) und Forwarding Plane (FIB).</text>
</g>
</svg>
