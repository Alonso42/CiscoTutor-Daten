<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Data Path Virtualization: Hop-by-Hop mit 802.1Q, Multihop mit GRE oder MPLS</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222">VRFs zwischen Geräten getrennt halten</text>
