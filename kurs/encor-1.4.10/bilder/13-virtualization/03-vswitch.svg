<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>vNIC, vSwitch und Uplinks im virtualisierten Host</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222">VMs am virtuellen Switch</text>
<rect x="20" y="40" width="500" height="300" fill="#fbfbfb" stroke="#222" stroke-width="2"/>
<text x="32" y="60" font-size="13" font-weight="bold" fill="#222">ESXi-Host</text>
<g stroke="#222" stroke-width="2">
<line x1="100" y1="140" x2="100" y2="200"/>
<line x1="250" y1="140" x2="250" y2="200"/>
<line x1="400" y1="140" x2="400" y2="200"/>
<line x1="170" y1="250" x2="170" y2="290"/>
<line x1="350" y1="250" x2="350" y2="290"/>
<line x1="400" y1="305" x2="600" y2="305"/>
<path d="M 170 320 L 170 332 L 640 332 L 640 330" fill="none"/>
<line x1="680" y1="290" x2="680" y2="190"/>
</g>
<path d="M 115 175 L 235 175" stroke="#39c86a" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
<g stroke="#222" stroke-width="2">
<rect x="40" y="80" width="120" height="60" fill="#dceaff"/>
<rect x="190" y="80" width="120" height="60" fill="#dceaff"/>
<rect x="340" y="80" width="120" height="60" fill="#e6dcff"/>
<rect x="40" y="200" width="440" height="50" fill="#fff6cc"/>
<rect x="120" y="290" width="100" height="30" fill="#dddddd"/>
<rect x="300" y="290" width="100" height="30" fill="#dddddd"/>
<rect x="600" y="290" width="160" height="40" fill="#39c86a"/>
<rect x="600" y="150" width="160" height="40" fill="#4a9cff"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="100" y="100" font-weight="bold">VM1</text>
<text x="100" y="120">VLAN 10</text>
<text x="250" y="100" font-weight="bold">VM2</text>
<text x="250" y="120">VLAN 10</text>
<text x="400" y="100" font-weight="bold">VM3</text>
<text x="400" y="120">VLAN 20</text>
<text x="260" y="215" font-weight="bold">vSwitch</text>
<text x="260" y="234">Port Groups: VLAN 10 · VLAN 20</text>
<text x="170" y="305">vmnic0</text>
<text x="350" y="305">vmnic1</text>
<text x="680" y="310" font-weight="bold">physischer Switch</text>
<text x="680" y="170" fill="#ffffff" font-weight="bold">Router / L3-Switch</text>
</g>
<g font-size="11" fill="#222">
<text x="106" y="160">vNIC</text>
<text x="256" y="160">vNIC</text>
<text x="406" y="160">vNIC</text>
</g>
<text x="175" y="192" font-size="11" fill="#39c86a" text-anchor="middle" font-weight="bold">lokal im Host</text>
<text x="540" y="300" font-size="11" fill="#222" text-anchor="middle">Trunk</text>
<text x="690" y="245" font-size="11" fill="#222">VLAN 10 ↔ 20</text>
<g font-size="13" fill="#222">
<text x="20" y="370">• Die vNIC hängt nicht an einem physischen Port, sondern am vSwitch; Uplinks = physische NICs.</text>
<text x="20" y="394">• Gleiches VLAN auf demselben Host (VM1 → VM2): Frame bleibt im vSwitch, der Uplink wird nicht genutzt.</text>
<text x="20" y="418">• Anderes VLAN (VM1 → VM3): Frame geht getaggt über den 802.1Q-Trunk zum Router/L3-Switch.</text>
<text x="20" y="442">• Standard vSwitch pro Host; Distributed vSwitch zentral über vCenter für viele Hosts.</text>
</g>
</svg>
