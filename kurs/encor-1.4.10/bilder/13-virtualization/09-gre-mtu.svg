<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>GRE: MTU und TCP-MSS berechnen</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#222">GRE: ip mtu und adjust-mss berechnen</text>
<text x="400" y="50" font-size="12" fill="#222" text-anchor="middle">1500 Byte physische MTU</text>
<line x1="40" y1="58" x2="760" y2="58" stroke="#222" stroke-width="1"/>
<g stroke="#222" stroke-width="1">
<rect x="40" y="66" width="110" height="40" fill="#dceaff"/>
<rect x="150" y="66" width="60" height="40" fill="#ffd23f"/>
<rect x="210" y="66" width="90" height="40" fill="#e3f7ea"/>
<rect x="300" y="66" width="90" height="40" fill="#e6dcff"/>
<rect x="390" y="66" width="370" height="40" fill="#f5f5f5"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="95" y="86">äußerer IP 20</text>
<text x="180" y="86">GRE 4</text>
<text x="255" y="86">IP 20</text>
<text x="345" y="86">TCP 20</text>
<text x="575" y="86">Nutzdaten = MSS 1436</text>
</g>
<line x1="210" y1="118" x2="760" y2="118" stroke="#4a9cff" stroke-width="2"/>
<text x="485" y="136" font-size="12" fill="#222" text-anchor="middle">ip mtu = 1500 − 24 = 1476</text>
<line x1="390" y1="148" x2="760" y2="148" stroke="#b08aff" stroke-width="2"/>
<text x="575" y="166" font-size="12" fill="#222" text-anchor="middle">MSS = 1476 − 40 = 1436</text>
<rect x="40" y="190" width="720" height="30" fill="#eeeeee"/>
<g stroke="#222" stroke-width="1" fill="none">
<rect x="40" y="190" width="720" height="150"/>
<line x1="40" y1="220" x2="760" y2="220"/>
<line x1="40" y1="250" x2="760" y2="250"/>
<line x1="40" y1="280" x2="760" y2="280"/>
<line x1="40" y1="310" x2="760" y2="310"/>
<line x1="360" y1="190" x2="360" y2="340"/>
<line x1="490" y1="190" x2="490" y2="340"/>
<line x1="620" y1="190" x2="620" y2="340"/>
</g>
<g font-size="12" fill="#222">
<text x="50" y="210" font-weight="bold">Kapselung</text>
<text x="370" y="210" font-weight="bold">Overhead</text>
<text x="500" y="210" font-weight="bold">ip mtu</text>
<text x="630" y="210" font-weight="bold">adjust-mss</text>
<text x="50" y="240">GRE ohne Optionen</text>
<text x="370" y="240">24 Byte</text>
<text x="500" y="240">1476</text>
<text x="630" y="240">1436</text>
<text x="50" y="270">GRE + Key</text>
<text x="370" y="270">28 Byte</text>
<text x="500" y="270">1472</text>
<text x="630" y="270">1432</text>
<text x="50" y="300">GRE + Key + Checksum + Sequence</text>
<text x="370" y="300">36 Byte</text>
<text x="500" y="300">1464</text>
<text x="630" y="300">1424</text>
<text x="50" y="330">GRE over IPsec (übliche Empfehlung)</text>
<text x="370" y="330">variabel</text>
<text x="500" y="330">1400</text>
<text x="630" y="330">1360</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="372">Befehle am Tunnel-Interface: ip mtu 1400 und ip tcp adjust-mss 1360 (40 = 20 Byte IP + 20 Byte TCP).</text>
<text x="20" y="396">Symptom bei MTU-Problemen: kleiner Ping klappt, große Transfers hängen (DF-Bit, ICMP gefiltert, PMTUD scheitert).</text>
<text x="20" y="420">OSPF über den Tunnel prüft die MTU im DBD-Austausch → Mismatch bleibt in EXSTART/EXCHANGE hängen.</text>
</g>
</svg>
