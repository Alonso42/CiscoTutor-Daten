<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Server-Konsolidierung und vCPU-Sizing ohne Überbuchung</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#222">Konsolidierung</text>
<text x="430" y="30" font-size="16" font-weight="bold" fill="#222">Sizing: 24 Kerne (2 × 12)</text>
<g stroke="#222" stroke-width="1">
<rect x="20" y="55" width="160" height="54" fill="#f2f2f2"/>
<rect x="20" y="125" width="160" height="54" fill="#f2f2f2"/>
<rect x="20" y="195" width="160" height="54" fill="#f2f2f2"/>
<rect x="230" y="75" width="170" height="160" fill="#fff6cc"/>
<rect x="240" y="85" width="150" height="30" fill="#dceaff"/>
<rect x="240" y="120" width="150" height="30" fill="#dceaff"/>
<rect x="240" y="155" width="150" height="30" fill="#dceaff"/>
</g>
<g font-size="12" fill="#222">
<text x="30" y="77" font-weight="bold">E-Mail · Windows</text>
<text x="30" y="97">eigener Server, 20 %</text>
<text x="30" y="147" font-weight="bold">Web · Linux</text>
<text x="30" y="167">eigener Server, 40 %</text>
<text x="30" y="217" font-weight="bold">Datenbank · Linux</text>
<text x="30" y="237">eigener Server, 10 %</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="315" y="100">VM E-Mail</text>
<text x="315" y="135">VM Web</text>
<text x="315" y="170">VM Datenbank</text>
<text x="315" y="205" font-weight="bold">Hypervisor-Host</text>
<text x="315" y="222">Last 20 + 40 + 10 = 70 %</text>
</g>
<line x1="185" y1="152" x2="222" y2="152" stroke="#222" stroke-width="2"/>
<polygon points="230,152 222,147 222,157" fill="#222"/>
<g stroke="#222" stroke-width="1">
<rect x="430" y="55" width="26" height="26" fill="#4a9cff"/>
