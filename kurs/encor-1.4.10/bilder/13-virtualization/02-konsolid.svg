<g font-size="12" fill="#222">
<text x="455" y="143">VM 1: 20 vCPU</text>
<text x="455" y="168">VM 2: 2 vCPU</text>
<text x="455" y="193">VM 3: 2 vCPU</text>
<text x="600" y="143">20 + 2 + 2 = 24</text>
<text x="600" y="168">→ alle Kerne belegt,</text>
<text x="600" y="193">keine vierte VM</text>
<text x="430" y="225">Alternative: 24 VMs mit je 1 vCPU.</text>
<text x="430" y="243">Collaboration-Vorgabe: nicht überbuchen.</text>
</g>
<line x1="20" y1="275" x2="780" y2="275" stroke="#dddddd" stroke-width="1"/>
<g font-size="13" fill="#222">
<text x="20" y="305">• Ein Server pro Anwendung ist stabil, läuft aber oft unter 20 % CPU – 80 % liegen brach.</text>
<text x="20" y="330">• Jeder zusätzliche Server kostet Platz, Strom, Kühlung und Verwaltung.</text>
<text x="20" y="355">• Hypervisor teilt CPU, RAM, Disk und Netzwerk auf; zwölf und mehr VMs pro Host sind üblich.</text>
<text x="20" y="380">• vCPU/vRAM = Anteil der Host-Ressourcen, virtuelle Disk = Datei auf dem Datastore.</text>
<text x="20" y="405">• Gleiche virtuelle Hardware auf Servern verschiedener Hersteller → VMs sind portabel.</text>
<text x="20" y="430">• vCenter verwaltet viele Hosts zentral und ist Voraussetzung für vMotion und Distributed Switch.</text>
</g>
</svg>
