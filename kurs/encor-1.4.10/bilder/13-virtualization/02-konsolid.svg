<g stroke="#222" stroke-width="1">
<rect x="430" y="130" width="16" height="16" fill="#4a9cff"/>
<rect x="430" y="155" width="16" height="16" fill="#39c86a"/>
<rect x="430" y="180" width="16" height="16" fill="#b08aff"/>
