<rect x="720" y="55" width="26" height="26" fill="#4a9cff"/>
<rect x="749" y="55" width="26" height="26" fill="#4a9cff"/>
<rect x="430" y="84" width="26" height="26" fill="#4a9cff"/>
<rect x="459" y="84" width="26" height="26" fill="#4a9cff"/>
<rect x="488" y="84" width="26" height="26" fill="#4a9cff"/>
<rect x="517" y="84" width="26" height="26" fill="#4a9cff"/>
