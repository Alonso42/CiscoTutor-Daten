<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>802.11r Over-the-Air vs Over-the-DS</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">802.11r: Over-the-Air vs. Over-the-DS</text>
<g font-size="13" fill="#222">
<text x="200" y="65" text-anchor="middle" font-weight="bold">Over-the-Air</text>
<text x="600" y="65" text-anchor="middle" font-weight="bold">Over-the-DS</text>
<line x1="400" y1="50" x2="400" y2="440" stroke="#ccc"/>
<rect x="40" y="90" width="90" height="34" rx="5" fill="#4a9cff"/><text x="85" y="112" text-anchor="middle" fill="#fff">aktueller AP</text>
<rect x="270" y="90" width="90" height="34" rx="5" fill="#39c86a"/><text x="315" y="112" text-anchor="middle" fill="#fff">Ziel-AP</text>
<rect x="175" y="320" width="50" height="34" rx="5" fill="#b08aff"/><text x="200" y="342" text-anchor="middle" fill="#fff">Client</text>
<line x1="215" y1="320" x2="305" y2="128" stroke="#222" stroke-width="2"/><polygon points="300,135 307,123 311,138" fill="#222"/>
<text x="265" y="220">1. FT Authentication</text><text x="265" y="238">2. Reassociation</text>
<text x="40" y="390">Client spricht den Ziel-AP direkt</text><text x="40" y="408">über Funk an (meist empfohlen)</text>
<rect x="440" y="90" width="90" height="34" rx="5" fill="#4a9cff"/><text x="485" y="112" text-anchor="middle" fill="#fff">aktueller AP</text>
<rect x="670" y="90" width="90" height="34" rx="5" fill="#39c86a"/><text x="715" y="112" text-anchor="middle" fill="#fff">Ziel-AP</text>
<rect x="540" y="160" width="120" height="30" rx="5" fill="#ffd23f"/><text x="600" y="180" text-anchor="middle">WLC / DS</text>
<line x1="530" y1="115" x2="560" y2="160" stroke="#ff6b6b" stroke-width="2"/><line x1="640" y1="160" x2="680" y2="124" stroke="#ff6b6b" stroke-width="2"/>
<rect x="575" y="320" width="50" height="34" rx="5" fill="#b08aff"/><text x="600" y="342" text-anchor="middle" fill="#fff">Client</text>
<line x1="590" y1="320" x2="495" y2="128" stroke="#ff6b6b" stroke-width="2"/>
<text x="440" y="250">1. FT Action Request an</text><text x="440" y="268">den aktuellen AP → über DS</text>
<line x1="615" y1="320" x2="705" y2="128" stroke="#222" stroke-width="2" stroke-dasharray="6 4"/>
<text x="660" y="250">2. Reassociation</text><text x="660" y="268">beim Ziel-AP</text>
<text x="440" y="390">Vorab-Schlüsselaustausch über das</text><text x="440" y="408">kabelgebundene Distribution System</text>
</g>
</svg>
