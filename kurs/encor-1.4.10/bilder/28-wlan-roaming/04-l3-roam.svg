<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Layer-3-Roaming mit Anchor und Foreign</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Layer-3-Roaming: Client behält seine IP-Adresse</text>
<g font-size="13" fill="#222">
<circle cx="400" cy="90" r="38" fill="#b08aff" fill-opacity="0.2" stroke="#b08aff"/><text x="400" y="86" text-anchor="middle">Routed</text><text x="400" y="102" text-anchor="middle">Core</text>
<rect x="60" y="150" width="200" height="34" rx="6" fill="#4a9cff" fill-opacity="0.15" stroke="#4a9cff"/><text x="160" y="172" text-anchor="middle">VLAN 20 – 10.20.0.0/24</text>
<rect x="540" y="150" width="200" height="34" rx="6" fill="#39c86a" fill-opacity="0.15" stroke="#39c86a"/><text x="640" y="172" text-anchor="middle">VLAN 30 – 10.30.0.0/24</text>
<line x1="260" y1="160" x2="365" y2="105" stroke="#222"/><line x1="540" y1="160" x2="435" y2="105" stroke="#222"/>
<rect x="100" y="210" width="120" height="40" rx="6" fill="#4a9cff"/><text x="160" y="228" text-anchor="middle" fill="#fff">WLC1</text><text x="160" y="244" text-anchor="middle" fill="#fff">Anchor (PoP)</text>
<rect x="580" y="210" width="120" height="40" rx="6" fill="#39c86a"/><text x="640" y="228" text-anchor="middle" fill="#fff">WLC2</text><text x="640" y="244" text-anchor="middle" fill="#fff">Foreign (PoA)</text>
<line x1="220" y1="225" x2="580" y2="225" stroke="#ff6b6b" stroke-width="3"/>
<line x1="220" y1="237" x2="580" y2="237" stroke="#ff6b6b" stroke-width="3"/>
<text x="400" y="216" text-anchor="middle">symmetrischer Mobility-Tunnel (beide Richtungen)</text>
<text x="400" y="257" text-anchor="middle">9800: CAPWAP UDP 16667 · AireOS alt: EoIP (IP 97)</text>
<rect x="610" y="290" width="60" height="26" rx="4" fill="#ffd23f"/><text x="640" y="308" text-anchor="middle">AP-C</text>
<line x1="640" y1="290" x2="640" y2="250" stroke="#999"/>
<rect x="630" y="335" width="20" height="28" rx="3" fill="#b08aff"/><text x="640" y="380" text-anchor="middle">Client 10.20.0.55</text>
<line x1="160" y1="250" x2="160" y2="184" stroke="#4a9cff" stroke-width="2"/>
<text x="20" y="300" font-weight="bold">Ablauf</text>
<text x="20" y="322">1. Mobility-Nachrichten WLC2 ↔ WLC1</text>
<text x="20" y="342">2. WLC1 markiert Eintrag als Anchor</text>
<text x="20" y="362">3. Kopie auf WLC2, markiert als Foreign</text>
<text x="20" y="382">4. Verkehr: Client → WLC2 → Tunnel → WLC1 → VLAN 20</text>
<text x="20" y="410" fill="#c03030">Asymmetrisch (Legacy): Upstream direkt ab WLC2 mit</text>
<text x="20" y="428" fill="#c03030">Quell-IP 10.20.x → uRPF/Firewall verwirft</text>
</g>
</svg>
