<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 800 450" font-family="sans-serif">
<title>Aufbau und Ausführung eines Python-Skripts</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Aufbau eines Skripts: vlan_check.py</text>
<rect x="20" y="55" width="440" height="290" rx="8" fill="#f4f4f4" stroke="#ccc"/>
<g font-size="14" font-family="monospace" fill="#222">
<text x="32" y="82" fill="#ff6b6b" font-weight="bold">#!/usr/bin/env python3</text>
<text x="32" y="110" fill="#888"># prüft, ob VLANs existieren</text>
<text x="32" y="138" fill="#4a9cff">import json</text>
<text x="32" y="172">def vlan_exists(vlan_id):</text>
<text x="32" y="194">    vlans_list = [1, 5, 10, 20]</text>
<text x="32" y="216">    return vlan_id in vlans_list</text>
<text x="32" y="250" fill="#39c86a" font-weight="bold">if __name__ == '__main__':</text>
<text x="32" y="274">    vlans = [5, 8, 10]</text>
<text x="32" y="296">    for vlan in vlans:</text>
<text x="32" y="318">        print(vlan, vlan_exists(vlan))</text>
</g>
<g font-size="13" fill="#222">
<rect x="480" y="62" width="300" height="34" rx="6" fill="#ff6b6b" fill-opacity="0.25"/><text x="490" y="84">Shebang: Zeile 1, Interpreter für ./datei</text>
<rect x="480" y="98" width="300" height="24" rx="6" fill="#dddddd"/><text x="490" y="115">Kommentar: ab # bis Zeilenende</text>
<rect x="480" y="126" width="300" height="24" rx="6" fill="#4a9cff" fill-opacity="0.25"/><text x="490" y="143">Modul laden (sonst NameError)</text>
<rect x="480" y="160" width="300" height="60" rx="6" fill="#b08aff" fill-opacity="0.25"/><text x="490" y="182">Funktion: def … : + eingerückter Rumpf</text><text x="490" y="204">return liefert Wert (sonst None)</text>
<rect x="480" y="236" width="300" height="60" rx="6" fill="#39c86a" fill-opacity="0.25"/><text x="490" y="258">Entry Point: läuft nur bei direktem</text><text x="490" y="280">Start, nicht bei import</text>
</g>
<rect x="20" y="358" width="760" height="78" rx="8" fill="#222"/>
<g font-size="14" font-family="monospace" fill="#ffffff">
<text x="32" y="382">$ python3 vlan_check.py          # immer möglich</text>
<text x="32" y="404">$ chmod +x vlan_check.py; ./vlan_check.py   # braucht Shebang + x-Recht</text>
<text x="32" y="426" fill="#ffd23f">5 True | 8 False | 10 True        (interpretiert, kein Compile-Schritt)</text>
</g>
</svg>
