<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 800 450" font-family="sans-serif">
<title>Python-Datentypen im Überblick</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Python-Datentypen und type()</text>
<g font-size="15" fill="#222">
<rect x="30" y="56" width="740" height="34" fill="#4a9cff" opacity="0.25"/>
<text x="45" y="79" font-weight="bold">Beispielwert</text><text x="260" y="79" font-weight="bold">type() zeigt</text><text x="470" y="79" font-weight="bold">Merkmal</text>
<text x="45" y="116" font-family="monospace">'R1' / "R1"</text><text x="260" y="116" font-family="monospace">&lt;class 'str'&gt;</text><text x="470" y="116">Zeichenfolge, unveränderlich</text>
<text x="45" y="150" font-family="monospace">24</text><text x="260" y="150" font-family="monospace">&lt;class 'int'&gt;</text><text x="470" y="150">ganze Zahl</text>
<text x="45" y="184" font-family="monospace">2.5   (auch 10 / 2)</text><text x="260" y="184" font-family="monospace">&lt;class 'float'&gt;</text><text x="470" y="184">Kommazahl, Ergebnis von /</text>
<text x="45" y="218" font-family="monospace">True / False</text><text x="260" y="218" font-family="monospace">&lt;class 'bool'&gt;</text><text x="470" y="218">Wahrheitswert</text>
<text x="45" y="252" font-family="monospace">['s1', 's2']</text><text x="260" y="252" font-family="monospace">&lt;class 'list'&gt;</text><text x="470" y="252">Index ab 0, veränderbar</text>
<text x="45" y="286" font-family="monospace">{'os': '7.2'}</text><text x="260" y="286" font-family="monospace">&lt;class 'dict'&gt;</text><text x="470" y="286">Schlüssel → Wert, veränderbar</text>
<text x="45" y="320" font-family="monospace">('s1', 's2')</text><text x="260" y="320" font-family="monospace">&lt;class 'tuple'&gt;</text><text x="470" y="320">wie Liste, unveränderlich</text>
<text x="45" y="354" font-family="monospace">None</text><text x="260" y="354" font-family="monospace">&lt;class 'NoneType'&gt;</text><text x="470" y="354">"kein Wert", Rückgabe ohne return</text>
</g>
<g stroke="#ddd"><line x1="30" y1="126" x2="770" y2="126"/><line x1="30" y1="160" x2="770" y2="160"/><line x1="30" y1="194" x2="770" y2="194"/><line x1="30" y1="228" x2="770" y2="228"/><line x1="30" y1="262" x2="770" y2="262"/><line x1="30" y1="296" x2="770" y2="296"/><line x1="30" y1="330" x2="770" y2="330"/></g>
<rect x="30" y="378" width="740" height="56" rx="8" fill="#ffd23f" opacity="0.35"/>
<text x="45" y="401" font-size="14" fill="#222">Umwandeln: int('42') → 42 · str(42) → '42' · float('3') → 3.0 · int(9.99) → 9 · int('10.5') → ValueError</text>
<text x="45" y="423" font-size="14" fill="#222">Falsy: '' · 0 · 0.0 · [] · {} · None  –  alles andere (auch 'False' und ' ') ist True</text>
</svg>
