<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Model-Driven-Programmability-Stack</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Model-Driven Programmability Stack</text>
<g font-size="15" fill="#222">
<text x="30" y="80" font-weight="bold">Apps</text>
<rect x="150" y="58" width="190" height="34" rx="6" fill="#39c86a" opacity="0.3"/><text x="245" y="80" text-anchor="middle">Inventar-Skript</text>
<rect x="350" y="58" width="190" height="34" rx="6" fill="#39c86a" opacity="0.3"/><text x="445" y="80" text-anchor="middle">Provisionierung</text>
<rect x="550" y="58" width="190" height="34" rx="6" fill="#39c86a" opacity="0.3"/><text x="645" y="80" text-anchor="middle">Monitoring</text>
<text x="30" y="130" font-weight="bold">Bindings</text>
<rect x="150" y="108" width="590" height="34" rx="6" fill="#ffd23f" opacity="0.45"/><text x="445" y="130" text-anchor="middle">SDKs / Bibliotheken (ncclient, YDK, requests) – arbeiten am Modell</text>
<text x="30" y="180" font-weight="bold">Protokolle</text>
<rect x="150" y="158" width="190" height="34" rx="6" fill="#4a9cff" opacity="0.3"/><text x="245" y="180" text-anchor="middle">NETCONF</text>
<rect x="350" y="158" width="190" height="34" rx="6" fill="#4a9cff" opacity="0.3"/><text x="445" y="180" text-anchor="middle">RESTCONF</text>
<rect x="550" y="158" width="190" height="34" rx="6" fill="#4a9cff" opacity="0.3"/><text x="645" y="180" text-anchor="middle">gRPC / gNMI</text>
<text x="30" y="230" font-weight="bold">Encoding</text>
<rect x="150" y="208" width="190" height="34" rx="6" fill="#b08aff" opacity="0.3"/><text x="245" y="230" text-anchor="middle">XML</text>
<rect x="350" y="208" width="190" height="34" rx="6" fill="#b08aff" opacity="0.3"/><text x="445" y="230" text-anchor="middle">JSON</text>
<rect x="550" y="208" width="190" height="34" rx="6" fill="#b08aff" opacity="0.3"/><text x="645" y="230" text-anchor="middle">Protocol Buffers</text>
<text x="30" y="280" font-weight="bold">Transport</text>
<rect x="150" y="258" width="140" height="34" rx="6" fill="#ff6b6b" opacity="0.25"/><text x="220" y="280" text-anchor="middle">SSH (830)</text>
<rect x="300" y="258" width="130" height="34" rx="6" fill="#ff6b6b" opacity="0.25"/><text x="365" y="280" text-anchor="middle">TLS</text>
<rect x="440" y="258" width="150" height="34" rx="6" fill="#ff6b6b" opacity="0.25"/><text x="515" y="280" text-anchor="middle">HTTPS (443)</text>
<rect x="600" y="258" width="140" height="34" rx="6" fill="#ff6b6b" opacity="0.25"/><text x="670" y="280" text-anchor="middle">HTTP/2</text>
<text x="30" y="330" font-weight="bold">Modelle</text>
<rect x="150" y="308" width="590" height="34" rx="6" fill="#4a9cff" opacity="0.55"/><text x="445" y="330" text-anchor="middle" font-weight="bold">YANG-Datenmodelle (native, IETF, OpenConfig)</text>
</g>
<rect x="30" y="362" width="740" height="74" rx="8" fill="#ffd23f" opacity="0.3"/>
<g font-size="14" fill="#222">
<text x="45" y="385">Das Modell beschreibt Struktur, Typen und Grenzen – übertragen wird es NICHT.</text>
<text x="45" y="406">Übertragen werden XML-/JSON-/GPB-Dokumente, die dem Modell entsprechen.</text>
<text x="45" y="427">Typische Kombis: NETCONF = XML über SSH · RESTCONF = XML/JSON über HTTPS · gNMI = Protobuf über HTTP/2</text>
</g>
</svg>
