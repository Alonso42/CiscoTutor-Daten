<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>NETCONF-Schichten und Datastores</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">NETCONF: Schichten und Datastores</text>
<g font-size="14" fill="#222">
<rect x="20" y="50" width="130" height="58" rx="6" fill="#39c86a" opacity="0.3"/><text x="85" y="84" text-anchor="middle" font-weight="bold">Content</text>
<rect x="160" y="50" width="300" height="58" rx="6" fill="#39c86a" opacity="0.15"/><text x="172" y="74">XML-Daten nach YANG-Modell</text><text x="172" y="96" font-family="monospace" font-size="12">&lt;native&gt;&lt;hostname&gt;R1&lt;/hostname&gt;…</text>
<rect x="20" y="116" width="130" height="78" rx="6" fill="#4a9cff" opacity="0.3"/><text x="85" y="160" text-anchor="middle" font-weight="bold">Operations</text>
<rect x="160" y="116" width="300" height="78" rx="6" fill="#4a9cff" opacity="0.15"/>
<text x="172" y="138" font-family="monospace" font-size="12">&lt;get&gt; &lt;get-config&gt; &lt;edit-config&gt;</text>
<text x="172" y="158" font-family="monospace" font-size="12">&lt;copy-config&gt; &lt;delete-config&gt;</text>
<text x="172" y="178" font-family="monospace" font-size="12">&lt;lock&gt; &lt;unlock&gt; &lt;commit&gt; &lt;validate&gt;</text>
<rect x="20" y="202" width="130" height="58" rx="6" fill="#b08aff" opacity="0.3"/><text x="85" y="236" text-anchor="middle" font-weight="bold">Messages</text>
<rect x="160" y="202" width="300" height="58" rx="6" fill="#b08aff" opacity="0.15"/><text x="172" y="226" font-family="monospace" font-size="12">&lt;rpc message-id="101"&gt;</text><text x="172" y="246" font-family="monospace" font-size="12">&lt;rpc-reply&gt; &lt;ok/&gt; &lt;rpc-error&gt;</text>
<rect x="20" y="268" width="130" height="58" rx="6" fill="#ff6b6b" opacity="0.3"/><text x="85" y="302" text-anchor="middle" font-weight="bold">Transport</text>
<rect x="160" y="268" width="300" height="58" rx="6" fill="#ff6b6b" opacity="0.15"/><text x="172" y="292">SSH (Pflicht, TCP 830, Subsystem</text><text x="172" y="314">"netconf") · TLS optional</text>
</g>
<g font-size="14" fill="#222">
<text x="630" y="62" text-anchor="middle" font-weight="bold">Datastores</text>
<ellipse cx="630" cy="92" rx="70" ry="14" fill="#ffd23f" opacity="0.6"/><rect x="560" y="92" width="140" height="44" fill="#ffd23f" opacity="0.6"/><ellipse cx="630" cy="136" rx="70" ry="14" fill="#ffd23f" opacity="0.6"/>
<text x="630" y="120" text-anchor="middle" font-weight="bold">candidate</text>
<ellipse cx="630" cy="200" rx="70" ry="14" fill="#39c86a" opacity="0.5"/><rect x="560" y="200" width="140" height="44" fill="#39c86a" opacity="0.5"/><ellipse cx="630" cy="244" rx="70" ry="14" fill="#39c86a" opacity="0.5"/>
<text x="630" y="228" text-anchor="middle" font-weight="bold">running</text>
<ellipse cx="630" cy="308" rx="70" ry="14" fill="#4a9cff" opacity="0.45"/><rect x="560" y="308" width="140" height="44" fill="#4a9cff" opacity="0.45"/><ellipse cx="630" cy="352" rx="70" ry="14" fill="#4a9cff" opacity="0.45"/>
<text x="630" y="336" text-anchor="middle" font-weight="bold">startup</text>
<line x1="630" y1="152" x2="630" y2="184" stroke="#222" stroke-width="2"/><polygon points="624,184 630,194 636,184" fill="#222"/>
<text x="642" y="174" font-family="monospace" font-size="12">&lt;commit&gt;</text>
<line x1="630" y1="260" x2="630" y2="292" stroke="#222" stroke-width="2"/><polygon points="624,292 630,302 636,292" fill="#222"/>
<text x="642" y="282" font-family="monospace" font-size="12">&lt;copy-config&gt;</text>
<text x="715" y="232" font-size="12">immer da,</text><text x="715" y="248" font-size="12">Pflicht</text>
<text x="715" y="120" font-size="12">optional</text>
<text x="715" y="336" font-size="12">beim Boot</text>
</g>
<rect x="20" y="380" width="760" height="58" rx="8" fill="#ffd23f" opacity="0.3"/>
<g font-size="13" fill="#222">
<text x="34" y="402">&lt;get&gt; = Konfiguration + Zustand · &lt;get-config&gt; = nur Konfiguration aus &lt;source&gt; · running kann nicht gelöscht werden</text>
<text x="34" y="424">edit-config operation: merge (Default) · replace · create (Fehler wenn vorhanden) · delete (Fehler wenn fehlt) · remove</text>
</g>
</svg>
