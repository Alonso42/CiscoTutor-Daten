<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Native, IETF und OpenConfig YANG-Modelle</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Arten von YANG-Modellen – Beispiel Interface Gi3</text>
<rect x="15" y="48" width="250" height="300" rx="10" fill="#ff6b6b" opacity="0.15"/>
<rect x="275" y="48" width="250" height="300" rx="10" fill="#4a9cff" opacity="0.15"/>
<rect x="535" y="48" width="250" height="300" rx="10" fill="#39c86a" opacity="0.18"/>
<g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
<text x="140" y="74">Cisco native</text><text x="400" y="74">IETF</text><text x="660" y="74">OpenConfig</text>
</g>
<g font-size="13" fill="#222">
<text x="28" y="100">Herausgeber: Cisco</text>
<text x="28" y="120">Modul: Cisco-IOS-XE-native</text>
<text x="28" y="146">+ jede CLI-Zeile modelliert</text>
<text x="28" y="166">+ CDP, MOP, negotiation, EIGRP</text>
<text x="28" y="186">− nur für diese Plattform</text>
<text x="28" y="216" font-family="monospace">"Cisco-IOS-XE-native:</text>
<text x="28" y="234" font-family="monospace">  GigabitEthernet": {</text>
<text x="28" y="252" font-family="monospace">  "name": "3",</text>
<text x="28" y="270" font-family="monospace">  "ip": {"address":</text>
<text x="28" y="288" font-family="monospace">   {"primary": {...}}},</text>
<text x="28" y="306" font-family="monospace">  "mop": {"enabled": false}</text>
<text x="288" y="100">Herausgeber: IETF (Standard)</text>
<text x="288" y="120">Modul: ietf-interfaces, ietf-ip</text>
<text x="288" y="146">+ herstellerneutral, RFC-Prozess</text>
<text x="288" y="166">− nur Basisdaten: Name, Typ,</text>
<text x="288" y="186">   enabled, IP/Maske, Beschreibung</text>
<text x="288" y="216" font-family="monospace">"ietf-interfaces:interface":{</text>
<text x="288" y="234" font-family="monospace">  "name": "GigabitEthernet3",</text>
<text x="288" y="252" font-family="monospace">  "enabled": true,</text>
<text x="288" y="270" font-family="monospace">  "ietf-ip:ipv4": {</text>
<text x="288" y="288" font-family="monospace">   "address": [{"ip":</text>
<text x="288" y="306" font-family="monospace">     "10.13.0.1", ...}]}}</text>
<text x="548" y="100">Herausgeber: Netzbetreiber</text>
<text x="548" y="120">(von Google gestartet, informell)</text>
<text x="548" y="146">+ herstellerneutral</text>
<text x="548" y="166">+ config UND state im Modell</text>
<text x="548" y="186">+ IPv4 unter subinterfaces</text>
<text x="548" y="216" font-family="monospace">"openconfig-interfaces:</text>
<text x="548" y="234" font-family="monospace">  interface": {</text>
<text x="548" y="252" font-family="monospace">  "config": {"enabled":true},</text>
<text x="548" y="270" font-family="monospace">  "state": {"oper-status":</text>
<text x="548" y="288" font-family="monospace">   "UP", "counters": {...}},</text>
<text x="548" y="306" font-family="monospace">  "subinterfaces": {...}}</text>
</g>
<rect x="15" y="360" width="770" height="78" rx="8" fill="#ffd23f" opacity="0.35"/>
<g font-size="14" fill="#222">
<text x="30" y="384">Modulpräfix im JSON: Top-Knoten immer "modul:knoten"; wechselt das Modul (augment), wieder Präfix → "ietf-ip:ipv4".</text>
<text x="30" y="406">64-Bit-Zähler (uint64) stehen in JSON als String: "in-octets": "407081366" (RFC 7951).</text>
<text x="30" y="428">Wahl: Multivendor-Automatisierung → IETF/OpenConfig · volle Feature-Abdeckung → native.</text>
</g>
</svg>
