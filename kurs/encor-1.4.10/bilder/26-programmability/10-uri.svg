<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Aufbau einer RESTCONF-URI</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">RESTCONF-URI und Aktivierung auf IOS XE</text>
<g font-size="15" font-family="monospace" fill="#222">
<rect x="20" y="56" width="95" height="32" rx="4" fill="#ff6b6b" opacity="0.3"/><text x="28" y="78">https://</text>
<rect x="117" y="56" width="70" height="32" rx="4" fill="#b08aff" opacity="0.3"/><text x="124" y="78">csr1kv</text>
<rect x="189" y="56" width="125" height="32" rx="4" fill="#4a9cff" opacity="0.3"/><text x="196" y="78">/restconf/data</text>
<rect x="316" y="56" width="250" height="32" rx="4" fill="#39c86a" opacity="0.35"/><text x="322" y="78">/ietf-interfaces:interfaces</text>
<rect x="568" y="56" width="212" height="32" rx="4" fill="#ffd23f" opacity="0.5"/><text x="574" y="77" font-size="12">/interface=Loopback0/enabled</text>
</g>
<g font-size="13" fill="#222">
<text x="67" y="108" text-anchor="middle">HTTPS 443</text>
<text x="152" y="108" text-anchor="middle">Gerät</text>
<text x="251" y="108" text-anchor="middle">Root + Datastore</text>
<text x="441" y="108" text-anchor="middle">modul:top-container</text>
<text x="674" y="108" text-anchor="middle">liste=key / leaf</text>
</g>
<g font-size="14" fill="#222">
<text x="20" y="145" font-weight="bold">Regeln</text>
<text x="20" y="168">• erster Knoten immer mit Modulname qualifiziert (modul:knoten)</text>
<text x="20" y="190">• Listeneintrag über Key: interface=GigabitEthernet1 · native: GigabitEthernet=1</text>
<text x="20" y="212">• "/" im Key-Wert als %2F: interface=GigabitEthernet1%2F0%2F1</text>
<text x="20" y="234">• RPCs: POST /restconf/operations/modul:rpc · Query: ?depth=1 · ?fields=name · ?content=config</text>
<text x="20" y="256">• Header: Accept / Content-Type: application/yang-data+json (Default auf IOS XE: XML)</text>
</g>
<rect x="20" y="272" width="370" height="166" rx="8" fill="#4a9cff" opacity="0.15"/>
<text x="35" y="295" font-size="15" font-weight="bold" fill="#222">IOS XE-Konfiguration</text>
<g font-size="13" font-family="monospace" fill="#222">
<text x="35" y="318">aaa new-model</text>
<text x="35" y="336">aaa authentication login default local</text>
<text x="35" y="354">aaa authorization exec default local</text>
<text x="35" y="372">username admin privilege 15 secret …</text>
<text x="35" y="390">ip http secure-server</text>
<text x="35" y="408">restconf          ! NETCONF: netconf-yang</text>
<text x="35" y="426">show platform software yang-management process</text>
</g>
<rect x="410" y="272" width="370" height="166" rx="8" fill="#39c86a" opacity="0.18"/>
<text x="425" y="295" font-size="15" font-weight="bold" fill="#222">RESTCONF vs. NETCONF</text>
<g font-size="13" fill="#222">
<text x="425" y="318">RESTCONF: HTTPS 443, XML/JSON, stateless</text>
<text x="425" y="340">NETCONF: SSH 830, nur XML, sitzungsbasiert</text>
<text x="425" y="362">RESTCONF kennt NICHT: lock, candidate,</text>
<text x="425" y="380">commit, startup, validate, confirmed commit</text>
<text x="425" y="402">beide: YANG-Modelle, RFC 8040 / RFC 6241</text>
<text x="425" y="424">PUT ersetzt ganz · PATCH = merge</text>
</g>
</svg>
