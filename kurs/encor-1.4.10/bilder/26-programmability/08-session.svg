<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Ablauf einer NETCONF-Sitzung</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">NETCONF-Sitzung über SSH (Port 830)</text>
<rect x="60" y="48" width="160" height="44" rx="8" fill="#4a9cff" opacity="0.35"/>
<text x="140" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Client (Manager)</text><text x="140" y="86" text-anchor="middle" font-size="12" fill="#222">ncclient, NSO</text>
<rect x="580" y="48" width="160" height="44" rx="8" fill="#39c86a" opacity="0.35"/>
<text x="660" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Server (Agent)</text><text x="660" y="86" text-anchor="middle" font-size="12" fill="#222">IOS XE: netconf-yang</text>
<line x1="140" y1="92" x2="140" y2="400" stroke="#888" stroke-dasharray="5,4"/>
<line x1="660" y1="92" x2="660" y2="400" stroke="#888" stroke-dasharray="5,4"/>
<g stroke-width="2" font-size="13" fill="#222">
<line x1="140" y1="120" x2="650" y2="120" stroke="#ff6b6b"/><polygon points="650,114 660,120 650,126" fill="#ff6b6b"/>
<text x="400" y="113" text-anchor="middle">1  ssh -p 830 user@host -s netconf (SSH-Subsystem)</text>
<line x1="660" y1="160" x2="150" y2="160" stroke="#39c86a"/><polygon points="150,154 140,160 150,166" fill="#39c86a"/>
<text x="400" y="153" text-anchor="middle">2  &lt;hello&gt; mit allen Capabilities + &lt;session-id&gt;</text>
<line x1="140" y1="200" x2="650" y2="200" stroke="#4a9cff"/><polygon points="650,194 660,200 650,206" fill="#4a9cff"/>
<text x="400" y="193" text-anchor="middle">3  &lt;hello&gt; mit Client-Capabilities (mind. base:1.0)</text>
<line x1="140" y1="240" x2="650" y2="240" stroke="#4a9cff"/><polygon points="650,234 660,240 650,246" fill="#4a9cff"/>
<text x="400" y="233" text-anchor="middle">4  &lt;rpc message-id="101"&gt;&lt;get&gt;&lt;filter type="subtree"&gt;…</text>
<line x1="660" y1="280" x2="150" y2="280" stroke="#39c86a"/><polygon points="150,274 140,280 150,286" fill="#39c86a"/>
<text x="400" y="273" text-anchor="middle">5  &lt;rpc-reply message-id="101"&gt;&lt;data&gt;… (oder &lt;ok/&gt; / &lt;rpc-error&gt;)</text>
<line x1="140" y1="320" x2="650" y2="320" stroke="#4a9cff"/><polygon points="650,314 660,320 650,326" fill="#4a9cff"/>
<text x="400" y="313" text-anchor="middle">6  &lt;rpc&gt;&lt;close-session/&gt;&lt;/rpc&gt;</text>
</g>
<rect x="30" y="345" width="740" height="92" rx="8" fill="#ffd23f" opacity="0.35"/>
<g font-size="13" fill="#222">
<text x="45" y="367" font-weight="bold">Framing</text>
<text x="45" y="387">base:1.0 → jede Nachricht endet mit ]]&gt;]]&gt; (End-of-Message)</text>
<text x="45" y="407">beide Seiten base:1.1 → chunked framing: \n#&lt;Länge&gt;\n … \n##\n</text>
<text x="45" y="427">Session ist stateful; message-id der Antwort = message-id der Anfrage</text>
</g>
</svg>
