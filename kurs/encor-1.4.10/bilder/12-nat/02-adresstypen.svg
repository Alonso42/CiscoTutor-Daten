<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Die vier NAT-Adresstypen als Matrix</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">NAT-Adresstypen: wo steht der Host, von wo wird er gesehen?</text>
<rect x="200" y="50" width="290" height="40" fill="#39c86a"/>
<rect x="490" y="50" width="290" height="40" fill="#4a9cff"/>
<text x="345" y="75" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Local – Sicht von innen</text>
<text x="635" y="75" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Global – Sicht von außen</text>
<rect x="20" y="90" width="180" height="140" fill="#fff6cc"/>
<rect x="20" y="230" width="180" height="140" fill="#f3f0ff"/>
<g font-size="14" font-weight="bold" fill="#222">
<text x="30" y="150">Inside</text>
<text x="30" y="290">Outside</text>
</g>
<g font-size="12" fill="#222">
<text x="30" y="170">unser Host,</text>
<text x="30" y="186">Adresse wird übersetzt</text>
<text x="30" y="310">fremder Host</text>
<text x="30" y="326">(meist im Internet)</text>
</g>
<g stroke="#222" stroke-width="1" fill="none">
<rect x="20" y="50" width="760" height="320"/>
<line x1="20" y1="90" x2="780" y2="90"/>
<line x1="20" y1="230" x2="780" y2="230"/>
<line x1="200" y1="50" x2="200" y2="370"/>
<line x1="490" y1="50" x2="490" y2="370"/>
</g>
<g font-size="15" font-weight="bold" fill="#222">
<text x="212" y="116">Inside Local</text>
<text x="502" y="116">Inside Global</text>
<text x="212" y="256">Outside Local</text>
<text x="502" y="256">Outside Global</text>
</g>
<g font-size="12" fill="#222">
<text x="212" y="140">Adresse am Host (statisch oder DHCP),</text>
<text x="212" y="158">meist RFC 1918</text>
<text x="212" y="190" font-weight="bold">Beispiel: 10.1.1.10</text>
<text x="502" y="140">übersetzte Adresse unseres Hosts –</text>
<text x="502" y="158">so sieht ihn das Internet</text>
<text x="502" y="190" font-weight="bold">Beispiel: 198.51.100.10</text>
<text x="212" y="280">fremder Host, wie unser Netz ihn sieht;</text>
<text x="212" y="298">nur bei Outside-NAT anders als Global</text>
<text x="212" y="330" font-weight="bold">Beispiel Fusion: 172.16.2.20</text>
<text x="502" y="280">echte Adresse des fremden Hosts</text>
<text x="502" y="298">(im Internetfall = Outside Local)</text>
<text x="502" y="330" font-weight="bold">Beispiel: 10.1.1.20 (Firma B)</text>
</g>
<g font-size="13" fill="#222">
<text x="20" y="400">Merkhilfe: Inside/Outside = wo der Host steht · Local/Global = von wo die Adresse gesehen wird.</text>
<text x="20" y="425">Ein Internet-Server sieht als Quelle die Inside Global unseres Hosts.</text>
</g>
</svg>
