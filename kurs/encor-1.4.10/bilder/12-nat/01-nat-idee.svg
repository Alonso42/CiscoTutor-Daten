<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>NAT-Grundidee: Quelladresse wird an der Netzgrenze ersetzt</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#222">NAT: Adressen an der Netzgrenze übersetzen</text>
<rect x="20" y="50" width="290" height="230" fill="#eefaf2" stroke="#39c86a" stroke-width="2"/>
<rect x="490" y="50" width="290" height="230" fill="#eef5ff" stroke="#4a9cff" stroke-width="2"/>
<text x="35" y="72" font-size="13" font-weight="bold" fill="#222">Firmen-LAN (inside, RFC 1918)</text>
<text x="505" y="72" font-size="13" font-weight="bold" fill="#222">Internet (outside)</text>
<line x1="80" y1="190" x2="374" y2="190" stroke="#222" stroke-width="2"/>
<line x1="426" y1="190" x2="700" y2="190" stroke="#222" stroke-width="2"/>
<rect x="40" y="176" width="40" height="28" fill="#ffffff" stroke="#222" stroke-width="2"/>
<rect x="700" y="172" width="40" height="36" fill="#ffffff" stroke="#222" stroke-width="2"/>
<circle cx="400" cy="190" r="26" fill="#ffd23f" stroke="#222" stroke-width="2"/>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="60" y="190">PC</text>
<text x="720" y="190">Srv</text>
<text x="400" y="190" font-weight="bold">NAT</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="60" y="222">10.1.1.100</text>
<text x="720" y="164">209.165.202.131</text>
<text x="345" y="180">inside</text>
<text x="458" y="180">outside</text>
<text x="400" y="236">NAT-Router</text>
</g>
<g font-size="12" fill="#222">
<text x="120" y="96" font-weight="bold">Hinweg →</text>
<rect x="110" y="104" width="190" height="44" fill="#ffffff" stroke="#39c86a" stroke-width="2"/>
<text x="118" y="122">Quelle 10.1.1.100</text>
<text x="118" y="140">Ziel 209.165.202.131</text>
<rect x="500" y="104" width="190" height="44" fill="#ffffff" stroke="#4a9cff" stroke-width="2"/>
<text x="508" y="122" fill="#b06000">Quelle 209.165.201.5</text>
<text x="508" y="140">Ziel 209.165.202.131</text>
<text x="120" y="219" font-weight="bold">← Rückweg</text>
<rect x="110" y="226" width="190" height="44" fill="#ffffff" stroke="#39c86a" stroke-width="2"/>
<rect x="500" y="226" width="190" height="44" fill="#ffffff" stroke="#4a9cff" stroke-width="2"/>
</g>
<g font-size="12" fill="#222">
<text x="118" y="244">Quelle 209.165.202.131</text>
<text x="118" y="262" fill="#b06000">Ziel 10.1.1.100</text>
<text x="508" y="244">Quelle 209.165.202.131</text>
<text x="508" y="262" fill="#b06000">Ziel 209.165.201.5</text>
</g>
<g font-size="13" fill="#222">
<text x="20" y="315">• Private Adressen (10/8, 172.16/12, 192.168/16) sind im Internet nicht routbar.</text>
<text x="20" y="340">• Der Router ersetzt beim Hinweg die Quelle, beim Rückweg das Ziel (Eintrag in der NAT-Tabelle).</text>
<text x="20" y="365">• Welche Netze übersetzt werden, bestimmt die Konfiguration – NAT geht auch intern (Fusion).</text>
<text x="20" y="390">• Vorteile: kein Umnummerieren, Adressen sparen (PAT), interne Topologie verborgen.</text>
<text x="20" y="415">• Nachteile: Ende-zu-Ende gebrochen (eingebettete IPs, IPsec AH), schwerere Rückverfolgung.</text>
</g>
</svg>
