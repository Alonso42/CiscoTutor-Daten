<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Reihenfolge von ACL, Routing und NAT je Richtung, klassisch und NVI</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Reihenfolge der Verarbeitung</text>
<g font-size="14" font-weight="bold" fill="#222">
<text x="20" y="62">Klassisch, Inside → Outside</text>
<text x="20" y="172">Klassisch, Outside → Inside</text>
<text x="20" y="282">NVI (ip nat enable), beide Richtungen</text>
</g>
<g stroke="#222" stroke-width="2">
<rect x="20" y="75" width="170" height="54" fill="#eefaf2"/>
<rect x="215" y="75" width="170" height="54" fill="#eef5ff"/>
<rect x="410" y="75" width="170" height="54" fill="#fff6cc"/>
<rect x="605" y="75" width="170" height="54" fill="#eefaf2"/>
<rect x="20" y="185" width="170" height="54" fill="#eefaf2"/>
<rect x="215" y="185" width="170" height="54" fill="#fff6cc"/>
<rect x="410" y="185" width="170" height="54" fill="#eef5ff"/>
<rect x="20" y="295" width="170" height="54" fill="#eef5ff"/>
<rect x="215" y="295" width="170" height="54" fill="#fff6cc"/>
<rect x="410" y="295" width="170" height="54" fill="#eef5ff"/>
</g>
<g stroke="#222" stroke-width="2">
<line x1="190" y1="102" x2="207" y2="102"/>
<line x1="385" y1="102" x2="402" y2="102"/>
<line x1="580" y1="102" x2="597" y2="102"/>
<line x1="190" y1="212" x2="207" y2="212"/>
<line x1="385" y1="212" x2="402" y2="212"/>
<line x1="190" y1="322" x2="207" y2="322"/>
<line x1="385" y1="322" x2="402" y2="322"/>
</g>
<g fill="#222">
<polygon points="215,102 207,97 207,107"/>
<polygon points="410,102 402,97 402,107"/>
<polygon points="605,102 597,97 597,107"/>
<polygon points="215,212 207,207 207,217"/>
<polygon points="410,212 402,207 402,217"/>
<polygon points="215,322 207,317 207,327"/>
<polygon points="410,322 402,317 402,327"/>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="105" y="97" font-weight="bold">Input-ACL</text>
<text x="105" y="116">sieht Inside Local</text>
<text x="300" y="107" font-weight="bold">Routing</text>
<text x="495" y="97" font-weight="bold">NAT</text>
<text x="495" y="116">Quelle → Inside Global</text>
<text x="690" y="97" font-weight="bold">Output-ACL</text>
<text x="690" y="116">sieht Inside Global</text>
<text x="105" y="207" font-weight="bold">Input-ACL</text>
<text x="105" y="226">Ziel = Inside Global</text>
<text x="300" y="207" font-weight="bold">NAT</text>
<text x="300" y="226">Ziel → Inside Local</text>
<text x="495" y="217" font-weight="bold">Routing</text>
<text x="105" y="327" font-weight="bold">Routing</text>
<text x="300" y="327" font-weight="bold">NAT</text>
<text x="495" y="327" font-weight="bold">Routing</text>
</g>
<g font-size="12" fill="#222">
<text x="605" y="200">Ohne Route nach außen:</text>
<text x="605" y="216">Verwurf schon vor dem NAT,</text>
<text x="605" y="232">die Tabelle bleibt leer.</text>
<text x="605" y="310">symmetrisch: Inside → Inside</text>
<text x="605" y="326">(Hairpin) funktioniert</text>
</g>
<g font-size="13" fill="#222">
<text x="20" y="390">NVI: ip nat source list 10 interface Ethernet0/1 overload – ohne "inside", Interfaces mit ip nat enable.</text>
<text x="20" y="414" font-weight="bold">NVI wird auf Cisco IOS XE nicht unterstützt (ab IOS 12.3(14)T, klassisches IOS).</text>
<text x="20" y="438">Klassisches NAT übersetzt Verkehr zwischen zwei Inside-Interfaces nicht.</text>
</g>
</svg>
