<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>CEF-Lab HQ und BR1: FIB und Adjacency im Verlauf</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Wie sich FIB und Adjacency füllen</text>
<!-- topology -->
<rect x="40" y="55" width="90" height="30" fill="#f5f8ff" stroke="#4a9cff"/><text x="85" y="75" text-anchor="middle" font-size="11" fill="#222">LAN .100.0/24</text>
<line x1="130" y1="70" x2="250" y2="70" stroke="#39c86a" stroke-width="3"/>
<circle cx="285" cy="70" r="32" fill="#4a9cff"/><text x="285" y="76" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">HQ</text>
<line x1="317" y1="70" x2="483" y2="70" stroke="#39c86a" stroke-width="3"/>
<text x="400" y="60" text-anchor="middle" font-size="11" fill="#222">10.10.10.0/30</text>
<text x="330" y="90" font-size="11" fill="#222">Et0/0 .1</text><text x="430" y="90" font-size="11" fill="#222">.2 Et0/0</text>
<circle cx="515" cy="70" r="32" fill="#4a9cff"/><text x="515" y="76" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">BR1</text>
<line x1="547" y1="70" x2="660" y2="70" stroke="#39c86a" stroke-width="3"/>
<rect x="660" y="55" width="100" height="30" fill="#f5f8ff" stroke="#4a9cff"/><text x="710" y="75" text-anchor="middle" font-size="11" fill="#222">LAN .110.0/24</text>
<!-- three columns -->
<g font-size="12" fill="#222">
<rect x="20" y="120" width="245" height="300" rx="8" fill="#fafafa" stroke="#b08aff"/>
<text x="142" y="143" text-anchor="middle" font-size="14" font-weight="bold">1. Ohne Traffic</text>
<text x="32" y="168">FIB: 10.10.10.0/30 attached</text>
<text x="32" y="186">10.10.10.0/32 receive</text>
<text x="32" y="204">10.10.10.1/32 receive</text>
<text x="32" y="222">10.10.10.3/32 receive</text>
<text x="32" y="240">192.168.100.0/24 attached</text>
<text x="32" y="258">127.0.0.0/8 drop</text>
<text x="32" y="276">0.0.0.0/0 no route</text>
<text x="32" y="310" font-weight="bold" fill="#ff6b6b">Adjacency: leer</text>
<text x="32" y="330">(ARP-Tabelle leer)</text>
<rect x="278" y="120" width="245" height="300" rx="8" fill="#fafafa" stroke="#ffd23f"/>
<text x="400" y="143" text-anchor="middle" font-size="14" font-weight="bold">2. ping 10.10.10.2</text>
<text x="290" y="168">Ergebnis: .!!!! (80 %)</text>
<text x="290" y="186">1. Paket: ARP noch offen</text>
<text x="290" y="220" font-weight="bold" fill="#39c86a">Adjacency neu:</text>
<text x="290" y="238">IP Et0/0 10.10.10.2</text>
<text x="290" y="272" font-weight="bold" fill="#39c86a">FIB neu:</text>
<text x="290" y="290">10.10.10.2/32 attached Et0/0</text>
<rect x="536" y="120" width="245" height="300" rx="8" fill="#fafafa" stroke="#39c86a"/>
<text x="658" y="143" text-anchor="middle" font-size="14" font-weight="bold">3. EIGRP aktiv</text>
<text x="548" y="168">RIB: D 192.168.110.0/24</text>
<text x="548" y="186">[90/307200] via 10.10.10.2</text>
<text x="548" y="220" font-weight="bold" fill="#39c86a">FIB neu:</text>
<text x="548" y="238">192.168.110.0/24</text>
<text x="548" y="256">→ 10.10.10.2 Et0/0</text>
<text x="548" y="290" font-weight="bold">Adjacency: unverändert</text>
<text x="548" y="308">(gleicher Next Hop,</text>
<text x="548" y="326">ARP unverändert)</text>
</g>
</svg>
