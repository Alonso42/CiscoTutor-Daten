<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>CEF Load Sharing und Polarisation</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">CEF Load Sharing: per Destination, per Packet, Polarisation</text>
<!-- left: per-dest vs per-packet -->
<rect x="20" y="50" width="360" height="380" rx="8" fill="#fafafa" stroke="#4a9cff"/>
<text x="200" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Zwei gleichwertige Pfade</text>
<circle cx="80" cy="160" r="26" fill="#4a9cff"/><text x="80" y="166" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">R</text>
<line x1="106" y1="150" x2="300" y2="110" stroke="#39c86a" stroke-width="3"/>
<line x1="106" y1="170" x2="300" y2="210" stroke="#b08aff" stroke-width="3"/>
<text x="310" y="114" font-size="12" fill="#222">Pfad A</text><text x="310" y="214" font-size="12" fill="#222">Pfad B</text>
<text x="40" y="260" font-size="13" font-weight="bold" fill="#222">Per Destination (Default)</text>
<text x="40" y="280" font-size="12" fill="#222">Hash über Quell-/Ziel-IP (opt. Ports)</text>
<text x="40" y="298" font-size="12" fill="#222">ein Flow = immer derselbe Pfad, keine</text>
<text x="40" y="316" font-size="12" fill="#222">Umsortierung; wenige Flows → ungleich</text>
<text x="40" y="350" font-size="13" font-weight="bold" fill="#222">Per Packet (ip load-sharing per-packet)</text>
<text x="40" y="370" font-size="12" fill="#222">abwechselnd A, B, A, B …</text>
<text x="40" y="388" font-size="12" fill="#222">gleichmäßig, aber Paket-Reordering</text>
<text x="40" y="406" font-size="12" fill="#ff6b6b">(schlecht für TCP, Voice)</text>
<!-- right: polarization -->
<rect x="400" y="50" width="380" height="380" rx="8" fill="#fafafa" stroke="#ff6b6b"/>
<text x="590" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Polarisation (gleicher Hash überall)</text>
<circle cx="590" cy="120" r="24" fill="#4a9cff"/><text x="590" y="126" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">R1</text>
<circle cx="500" cy="220" r="24" fill="#4a9cff"/><text x="500" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">R2</text>
<circle cx="680" cy="220" r="24" fill="#4a9cff"/><text x="680" y="226" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">R3</text>
<line x1="575" y1="138" x2="512" y2="200" stroke="#39c86a" stroke-width="3"/><text x="505" y="168" font-size="11" fill="#222">Hash = 0</text>
<line x1="605" y1="138" x2="668" y2="200" stroke="#b08aff" stroke-width="3"/><text x="640" y="168" font-size="11" fill="#222">Hash = 1</text>
<line x1="490" y1="244" x2="450" y2="320" stroke="#39c86a" stroke-width="4"/>
<line x1="510" y1="244" x2="550" y2="320" stroke="#ccc" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="670" y1="244" x2="630" y2="320" stroke="#ccc" stroke-width="3" stroke-dasharray="6 4"/>
<line x1="690" y1="244" x2="730" y2="320" stroke="#b08aff" stroke-width="4"/>
<text x="425" y="340" font-size="11" fill="#222">genutzt</text><text x="530" y="340" font-size="11" fill="#ff6b6b">leer</text>
<text x="610" y="340" font-size="11" fill="#ff6b6b">leer</text><text x="715" y="340" font-size="11" fill="#222">genutzt</text>
<text x="415" y="372" font-size="12" fill="#222">R2 bekommt nur Hash-0-Traffic, rechnet gleich</text>
<text x="415" y="390" font-size="12" fill="#222">→ wieder Hash 0 → ein Pfad bleibt leer.</text>
<text x="415" y="412" font-size="12" fill="#39c86a">Abhilfe: universal-Algorithmus mit eigener ID</text>
</svg>
