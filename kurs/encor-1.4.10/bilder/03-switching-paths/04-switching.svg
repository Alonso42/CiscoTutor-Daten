<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Process, Fast und CEF Switching im Vergleich</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Welche Pakete sieht die CPU?</text>
<!-- row helper: packets as small rects -->
<text x="20" y="100" font-size="16" font-weight="bold" fill="#ff6b6b">Process</text>
<text x="20" y="120" font-size="12" fill="#222">jedes Paket</text>
<g fill="#ff6b6b"><rect x="150" y="85" width="50" height="28" rx="4"/><rect x="215" y="85" width="50" height="28" rx="4"/><rect x="280" y="85" width="50" height="28" rx="4"/><rect x="345" y="85" width="50" height="28" rx="4"/><rect x="410" y="85" width="50" height="28" rx="4"/></g>
<text x="490" y="95" font-size="12" fill="#222">alle 5 über die CPU: L2 entfernen, RIB-Lookup</text>
<text x="490" y="112" font-size="12" fill="#222">(rekursiv), ARP, neuen L2-Header + CRC bauen</text>
<text x="20" y="215" font-size="16" font-weight="bold" fill="#ffd23f">Fast</text>
<text x="20" y="235" font-size="12" fill="#222">1. Paket pro Ziel</text>
<rect x="150" y="200" width="50" height="28" rx="4" fill="#ff6b6b"/>
<g fill="#ffd23f"><rect x="215" y="200" width="50" height="28" rx="4"/><rect x="280" y="200" width="50" height="28" rx="4"/><rect x="345" y="200" width="50" height="28" rx="4"/><rect x="410" y="200" width="50" height="28" rx="4"/></g>
<text x="490" y="210" font-size="12" fill="#222">1. Paket process-switched → Cache-Eintrag</text>
<text x="490" y="227" font-size="12" fill="#222">pro Ziel; Rest per Cache (Interrupt, Software)</text>
<text x="20" y="330" font-size="16" font-weight="bold" fill="#39c86a">CEF</text>
<text x="20" y="350" font-size="12" fill="#222">nur Ausnahmen</text>
<g fill="#39c86a"><rect x="150" y="315" width="50" height="28" rx="4"/><rect x="215" y="315" width="50" height="28" rx="4"/><rect x="280" y="315" width="50" height="28" rx="4"/><rect x="345" y="315" width="50" height="28" rx="4"/><rect x="410" y="315" width="50" height="28" rx="4"/></g>
<text x="490" y="325" font-size="12" fill="#222">FIB + Adjacency vorab aus RIB und ARP/ND,</text>
<text x="490" y="342" font-size="12" fill="#222">auch das 1. Paket nutzt CEF (Default)</text>
<g font-size="12" fill="#222"><rect x="150" y="395" width="16" height="16" fill="#ff6b6b"/><text x="172" y="408">über CPU (process)</text>
<rect x="320" y="395" width="16" height="16" fill="#ffd23f"/><text x="342" y="408">Route-Cache</text>
<rect x="460" y="395" width="16" height="16" fill="#39c86a"/><text x="482" y="408">CEF (je nach Plattform ASIC oder RP-CPU)</text></g>
</svg>
