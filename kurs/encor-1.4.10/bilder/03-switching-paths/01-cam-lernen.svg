<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>MAC-Lernen und Weiterleitung im VLAN</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">CAM: lernen aus Quell-MAC, weiterleiten nach Ziel-MAC + VLAN</text>
<!-- CAM table -->
<g font-size="13" fill="#222">
<rect x="500" y="55" width="270" height="170" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="635" y="75" text-anchor="middle" font-weight="bold">CAM-Tabelle</text>
<text x="515" y="98" font-weight="bold">MAC</text><text x="640" y="98" font-weight="bold">Port</text><text x="700" y="98" font-weight="bold">VLAN</text>
<text x="515" y="118">0000.0000.1111</text><text x="645" y="118">1</text><text x="710" y="118">1</text>
<text x="515" y="138">0000.0000.2222</text><text x="645" y="138">2</text><text x="710" y="138">1</text>
<text x="515" y="158" fill="#b08aff">0000.0000.3333</text><text x="645" y="158" fill="#b08aff">3</text><text x="707" y="158" fill="#b08aff">20</text>
<text x="515" y="178">0000.0000.4444</text><text x="645" y="178">4</text><text x="710" y="178">1</text>
<text x="515" y="198">0000.0000.5555</text><text x="645" y="198">5</text><text x="710" y="198">1</text>
<text x="515" y="218">0000.0000.6666</text><text x="645" y="218">6</text><text x="710" y="218">1</text>
</g>
<!-- Switch -->
<rect x="180" y="150" width="140" height="70" rx="6" fill="#4a9cff"/>
<text x="250" y="192" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">SW</text>
<!-- ports left 1,2,3 right 4,5,6 -->
<g stroke-width="3">
<line x1="60" y1="150" x2="180" y2="160" stroke="#ffd23f"/>
<line x1="60" y1="185" x2="180" y2="185" stroke="#39c86a"/>
<line x1="60" y1="225" x2="180" y2="210" stroke="#b08aff"/>
<line x1="320" y1="160" x2="440" y2="150" stroke="#39c86a"/>
<line x1="320" y1="185" x2="440" y2="185" stroke="#ff6b6b"/>
<line x1="320" y1="210" x2="440" y2="225" stroke="#39c86a"/>
</g>
<g font-size="13" fill="#222">
<text x="30" y="155">P1</text><text x="30" y="190">P2</text><text x="20" y="230">P3 (VLAN 20)</text>
<text x="450" y="155">P4</text><text x="450" y="190">P5</text><text x="450" y="230">P6</text>
</g>
<!-- Case A -->
<rect x="30" y="270" width="360" height="160" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<text x="45" y="295" font-size="15" font-weight="bold" fill="#222">Fall A: Unicast an …5555 auf P1</text>
<text x="45" y="320" font-size="13" fill="#222">1. Quell-MAC …1111 + P1 + VLAN 1 lernen/auffrischen</text>
<text x="45" y="342" font-size="13" fill="#222">2. Lookup Ziel …5555 in VLAN 1 → Treffer P5</text>
<text x="45" y="364" font-size="13" fill="#ff6b6b" font-weight="bold">3. Nur aus P5 senden</text>
<text x="45" y="390" font-size="12" fill="#222">Ziel am Eingangsport selbst → Frame verwerfen</text>
<text x="45" y="410" font-size="12" fill="#222">Default-Aging dynamischer Einträge: 300 s</text>
<!-- Case B -->
<rect x="410" y="270" width="360" height="160" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="425" y="295" font-size="15" font-weight="bold" fill="#222">Fall B: Broadcast oder unbekannte MAC</text>
<text x="425" y="320" font-size="13" fill="#222">Flooding im VLAN des Eingangsports</text>
<text x="425" y="342" font-size="13" fill="#222">VLAN 1 auf P1 → P2, P4, P5, P6</text>
<text x="425" y="364" font-size="13" fill="#b08aff">P3 (VLAN 20) bekommt nichts</text>
<text x="425" y="390" font-size="12" fill="#222">Lookup-Schlüssel = MAC + VLAN: …3333 ist für</text>
<text x="425" y="410" font-size="12" fill="#222">VLAN 1 unbekannt → würde in VLAN 1 geflutet</text>
</svg>
