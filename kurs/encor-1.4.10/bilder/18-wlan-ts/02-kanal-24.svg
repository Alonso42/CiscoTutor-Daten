<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>2,4-GHz-Kanäle, Überlappung, CCI und ACI</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">2,4 GHz: 5 MHz Raster, 20 MHz breite Kanäle</text>
<line x1="40" y1="260" x2="760" y2="260" stroke="#222" stroke-width="2"/>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="80" y="278">1</text><text x="125" y="278">2</text><text x="170" y="278">3</text><text x="215" y="278">4</text><text x="260" y="278">5</text><text x="305" y="278">6</text><text x="350" y="278">7</text><text x="395" y="278">8</text><text x="440" y="278">9</text><text x="485" y="278">10</text><text x="530" y="278">11</text><text x="575" y="278">12</text><text x="620" y="278">13</text>
<text x="80" y="294">2412</text><text x="305" y="294">2437</text><text x="530" y="294">2462</text><text x="700" y="294">MHz</text>
</g>
<path d="M-10,260 Q80,90 170,260" fill="#39c86a" opacity="0.45" stroke="#39c86a" stroke-width="2"/>
<path d="M215,260 Q305,90 395,260" fill="#39c86a" opacity="0.45" stroke="#39c86a" stroke-width="2"/>
<path d="M440,260 Q530,90 620,260" fill="#39c86a" opacity="0.45" stroke="#39c86a" stroke-width="2"/>
<path d="M80,260 Q170,130 260,260" fill="#ff6b6b" opacity="0.35" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,4"/>
<g font-size="14" fill="#222" font-weight="bold" text-anchor="middle">
<text x="80" y="160">Kanal 1</text><text x="305" y="160">Kanal 6</text><text x="530" y="160">Kanal 11</text>
<text x="200" y="205" fill="#c0392b">Kanal 3</text>
</g>
<rect x="640" y="70" width="145" height="70" rx="6" fill="#39c86a" opacity="0.25" stroke="#39c86a"/>
<text x="712" y="95" text-anchor="middle" font-size="13" fill="#222">1 / 6 / 11</text>
<text x="712" y="113" text-anchor="middle" font-size="13" fill="#222">überlappen nicht</text>
<text x="712" y="131" text-anchor="middle" font-size="12" fill="#222">(Nordamerika)</text>
<g font-size="13" fill="#222">
<rect x="30" y="320" width="360" height="110" rx="8" fill="#4a9cff" opacity="0.18" stroke="#4a9cff"/>
<text x="45" y="343" font-weight="bold">CCI – Co-Channel Interference</text>
<text x="45" y="363">2 Zellen auf demselben Kanal hören sich</text>
<text x="45" y="381">→ CSMA/CA: teilen sich die Airtime</text>
<text x="45" y="399">→ Durchsatz sinkt, Frames bleiben intakt</text>
<text x="45" y="417">Fix: Kanalplan, Leistung senken, weniger SSIDs</text>
<rect x="410" y="320" width="360" height="110" rx="8" fill="#ff6b6b" opacity="0.18" stroke="#ff6b6b"/>
<text x="425" y="343" font-weight="bold">ACI – Adjacent Channel Interference</text>
<text x="425" y="363">überlappende Nachbarkanäle (z. B. 1 und 3)</text>
<text x="425" y="381">oder sehr nahe APs mit hoher Leistung</text>
<text x="425" y="399">→ wirkt als Rauschen, Frames gehen kaputt</text>
<text x="425" y="417">Fix: nur 1/6/11, Leistung reduzieren</text>
</g>
</svg>
