<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Entscheidungsbaum für das passende WLAN-Deployment</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Welches Deployment passt zum Standort?</text>
<g font-size="13" fill="#222">
  <rect x="290" y="50" width="220" height="40" rx="20" fill="#ffd23f"/><text x="400" y="75" text-anchor="middle" font-weight="bold">Cloud-Management gewollt?</text>
  <line x1="510" y1="70" x2="620" y2="70" stroke="#222" stroke-width="2"/><text x="565" y="63" text-anchor="middle" font-size="12">ja</text>
  <rect x="620" y="52" width="160" height="36" rx="4" fill="#fff8dc" stroke="#e0b400"/><text x="700" y="75" text-anchor="middle">Meraki</text>
  <line x1="400" y1="90" x2="400" y2="120" stroke="#222" stroke-width="2"/><text x="410" y="110" font-size="12">nein</text>
  <rect x="270" y="120" width="260" height="40" rx="20" fill="#ffd23f"/><text x="400" y="145" text-anchor="middle" font-weight="bold">SD-Access-Fabric vorhanden?</text>
  <line x1="530" y1="140" x2="620" y2="140" stroke="#222" stroke-width="2"/><text x="575" y="133" text-anchor="middle" font-size="12">ja</text>
  <rect x="620" y="118" width="160" height="44" rx="4" fill="#f4eeff" stroke="#b08aff"/><text x="700" y="137" text-anchor="middle">Fabric Wireless,</text><text x="700" y="154" text-anchor="middle" font-size="12">klein: EWC auf 9300</text>
  <line x1="400" y1="160" x2="400" y2="190" stroke="#222" stroke-width="2"/><text x="410" y="180" font-size="12">nein</text>
  <rect x="250" y="190" width="300" height="40" rx="20" fill="#ffd23f"/><text x="400" y="215" text-anchor="middle" font-weight="bold">Großer Standort mit eigenem WLC?</text>
  <line x1="550" y1="210" x2="620" y2="210" stroke="#222" stroke-width="2"/><text x="585" y="203" text-anchor="middle" font-size="12">ja</text>
  <rect x="620" y="188" width="160" height="44" rx="4" fill="#eaf3ff" stroke="#4a9cff"/><text x="700" y="207" text-anchor="middle">Centralized</text><text x="700" y="224" text-anchor="middle" font-size="12">9800-40/-80, SSO</text>
  <line x1="400" y1="230" x2="400" y2="260" stroke="#222" stroke-width="2"/><text x="410" y="250" font-size="12">nein (Filiale)</text>
  <rect x="230" y="260" width="340" height="40" rx="20" fill="#ffd23f"/><text x="400" y="285" text-anchor="middle" font-weight="bold">Zentraler WLC über WAN, RTT &lt; 300 ms?</text>
  <line x1="570" y1="280" x2="620" y2="280" stroke="#222" stroke-width="2"/><text x="595" y="273" text-anchor="middle" font-size="12">ja</text>
  <rect x="620" y="258" width="160" height="44" rx="4" fill="#eafaf0" stroke="#39c86a"/><text x="700" y="277" text-anchor="middle">FlexConnect</text><text x="700" y="294" text-anchor="middle" font-size="12">Local Switching</text>
  <line x1="400" y1="300" x2="400" y2="330" stroke="#222" stroke-width="2"/><text x="410" y="320" font-size="12">nein</text>
  <rect x="250" y="330" width="300" height="40" rx="20" fill="#ffd23f"/><text x="400" y="355" text-anchor="middle" font-weight="bold">Mehr als eine Handvoll APs?</text>
  <line x1="550" y1="350" x2="620" y2="350" stroke="#222" stroke-width="2"/><text x="585" y="343" text-anchor="middle" font-size="12">ja</text>
  <rect x="620" y="328" width="160" height="44" rx="4" fill="#eafaf0" stroke="#39c86a"/><text x="700" y="347" text-anchor="middle">EWC auf AP</text><text x="700" y="364" text-anchor="middle" font-size="12">(früher Mobility Express)</text>
  <line x1="400" y1="370" x2="400" y2="395" stroke="#222" stroke-width="2"/><text x="410" y="388" font-size="12">nein</text>
  <rect x="300" y="395" width="200" height="40" rx="4" fill="#f3f3f3" stroke="#999"/><text x="400" y="413" text-anchor="middle">Autonomous APs</text><text x="400" y="429" text-anchor="middle" font-size="12">kein RRM, kein L3-Roaming</text>
</g>
<text x="20" y="420" font-size="11" fill="#555">Vereinfachung:</text>
<text x="20" y="435" font-size="11" fill="#555">reale Entscheidung auch nach Budget/Features</text>
</svg>
