<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Split-MAC und CAPWAP zwischen Lightweight AP und WLC</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Split-MAC: Aufgabenteilung und CAPWAP-Tunnel</text>
<g font-size="13" fill="#222">
  <rect x="30" y="70" width="70" height="40" fill="#ddd" stroke="#222"/><text x="65" y="95" text-anchor="middle">Client</text>
  <rect x="190" y="70" width="110" height="40" rx="20" fill="#fff" stroke="#222" stroke-width="2"/><text x="245" y="95" text-anchor="middle" font-weight="bold">Lightweight AP</text>
  <rect x="560" y="65" width="120" height="50" rx="4" fill="#4a9cff"/><text x="620" y="95" text-anchor="middle" fill="#fff" font-weight="bold">WLC</text>
  <rect x="720" y="72" width="60" height="36" rx="4" fill="#39c86a"/><text x="750" y="95" text-anchor="middle" fill="#fff">SW</text>
  <path d="M100 90 Q145 70 190 90" stroke="#b08aff" stroke-width="3" fill="none"/>
  <text x="145" y="62" text-anchor="middle" font-size="11">802.11</text>
  <!-- Tunnel -->
  <rect x="300" y="72" width="260" height="36" rx="18" fill="#eafaf0" stroke="#39c86a" stroke-width="2"/>
  <text x="430" y="88" text-anchor="middle" font-size="12">CAPWAP-Tunnel (RFC 5415)</text>
  <text x="430" y="103" text-anchor="middle" font-size="11">AP: zufälliger Port → WLC</text>
  <line x1="680" y1="90" x2="720" y2="90" stroke="#222" stroke-width="2"/>
  <text x="700" y="130" text-anchor="middle" font-size="11">802.3 ins</text><text x="700" y="144" text-anchor="middle" font-size="11">Client-VLAN</text>
  <!-- Ports -->
  <rect x="300" y="150" width="125" height="58" rx="6" fill="#fff8dc" stroke="#e0b400"/>
  <text x="362" y="170" text-anchor="middle" font-weight="bold">UDP 5246</text>
  <text x="362" y="186" text-anchor="middle" font-size="12">Control</text>
  <text x="362" y="200" text-anchor="middle" font-size="11">immer DTLS</text>
  <rect x="435" y="150" width="125" height="58" rx="6" fill="#fff8dc" stroke="#e0b400"/>
  <text x="497" y="170" text-anchor="middle" font-weight="bold">UDP 5247</text>
  <text x="497" y="186" text-anchor="middle" font-size="12">Data</text>
  <text x="497" y="200" text-anchor="middle" font-size="11">DTLS optional</text>
  <!-- Tabellen -->
  <rect x="40" y="235" width="340" height="195" rx="8" fill="#ffffff" stroke="#222"/>
  <text x="210" y="258" text-anchor="middle" font-weight="bold">AP: real-time MAC</text>
  <text x="55" y="285">• Beacons und Probe Responses</text>
  <text x="55" y="308">• ACKs und Retransmissions</text>
  <text x="55" y="331">• Queuing / Priorisierung auf dem Funk</text>
  <text x="55" y="354">• 802.11-Verschlüsselung/Entschlüsselung</text>
  <text x="55" y="377">• Kapselung in CAPWAP</text>
  <text x="55" y="400">• Spektrum/RF-Messungen für RRM</text>
  <rect x="420" y="235" width="340" height="195" rx="8" fill="#eaf3ff" stroke="#4a9cff"/>
  <text x="590" y="258" text-anchor="middle" font-weight="bold">WLC: non-real-time MAC</text>
  <text x="435" y="285">• Authentication</text>
  <text x="435" y="308">• Association / Reassociation (Roaming)</text>
  <text x="435" y="331">• Security- und QoS-Policy, ACLs</text>
  <text x="435" y="354">• RRM: Kanal und Sendeleistung</text>
  <text x="435" y="377">• Rogue-Erkennung, wIPS, Konfiguration</text>
  <text x="435" y="400">• Bridging 802.11 → 802.3</text>
</g>
</svg>
