<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Datenflüsse in einem autonomen AP-Netz</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Autonome APs: Welchen Weg nimmt der Verkehr?</text>
<g font-size="13" fill="#222">
  <!-- Router + Switch -->
  <circle cx="400" cy="90" r="26" fill="#4a9cff"/><text x="400" y="95" text-anchor="middle" fill="#fff" font-weight="bold">R</text>
  <text x="440" y="85">Router (Gateway</text><text x="440" y="101">zwischen VLANs)</text>
  <rect x="340" y="160" width="120" height="36" rx="4" fill="#39c86a"/><text x="400" y="183" text-anchor="middle" fill="#fff" font-weight="bold">SW</text>
  <line x1="400" y1="116" x2="400" y2="160" stroke="#222" stroke-width="2"/>
  <!-- Server -->
  <rect x="560" y="164" width="80" height="30" fill="#eee" stroke="#222"/><text x="600" y="184" text-anchor="middle">Server</text>
  <line x1="460" y1="178" x2="560" y2="178" stroke="#222" stroke-width="2"/>
  <!-- APs -->
  <rect x="170" y="270" width="80" height="28" rx="14" fill="#fff" stroke="#222"/><text x="210" y="289" text-anchor="middle">AP 1</text>
  <rect x="550" y="270" width="80" height="28" rx="14" fill="#fff" stroke="#222"/><text x="590" y="289" text-anchor="middle">AP 2</text>
  <line x1="210" y1="270" x2="360" y2="196" stroke="#222" stroke-width="2"/>
  <line x1="590" y1="270" x2="440" y2="196" stroke="#222" stroke-width="2"/>
  <!-- Clients -->
  <rect x="100" y="360" width="50" height="30" fill="#ddd" stroke="#222"/><text x="125" y="380" text-anchor="middle">C1</text>
  <rect x="270" y="360" width="50" height="30" fill="#ddd" stroke="#222"/><text x="295" y="380" text-anchor="middle">C2</text>
  <rect x="565" y="360" width="50" height="30" fill="#ddd" stroke="#222"/><text x="590" y="380" text-anchor="middle">C3</text>
  <!-- A: wireless-to-wired -->
  <path d="M125 360 L195 298 M215 270 L375 196 M460 170 L560 170" stroke="#39c86a" stroke-width="3" fill="none"/>
  <!-- B: same AP -->
  <path d="M140 360 Q210 300 280 360" stroke="#4a9cff" stroke-width="3" stroke-dasharray="7 4" fill="none"/>
  <!-- C: different AP -->
  <path d="M310 360 L235 300 L380 200 L420 200 L580 300 L590 360" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="3 4" fill="none"/>
</g>
<g font-size="12" fill="#222">
  <rect x="20" y="60" width="300" height="140" rx="6" fill="#fafafa" stroke="#bbb"/>
  <line x1="32" y1="82" x2="62" y2="82" stroke="#39c86a" stroke-width="3"/><text x="70" y="86">A: Wireless → Wired (802.11 → 802.3)</text>
  <line x1="32" y1="110" x2="62" y2="110" stroke="#4a9cff" stroke-width="3" stroke-dasharray="7 4"/><text x="70" y="106">B: gleicher AP, gleiches Subnetz:</text><text x="70" y="120">bleibt im AP, Switch unbelastet</text>
  <line x1="32" y1="142" x2="62" y2="142" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="3 4"/><text x="70" y="140">C: verschiedene APs: immer über</text><text x="70" y="154">den Switch (auch gleiches WLAN)</text>
  <text x="32" y="180">Verschiedene VLANs: AP routet nicht →</text><text x="32" y="194">Umweg über den Router</text>
</g>
</svg>
