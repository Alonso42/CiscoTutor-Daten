<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Mobility Express und EWC auf dem AP</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">Controller im AP: Mobility Express (alt) und EWC auf AP (aktuell)</text>
<g font-size="13" fill="#222">
  <rect x="40" y="60" width="720" height="250" rx="8" fill="#f9f9f9" stroke="#999" stroke-dasharray="6 4"/>
  <text x="60" y="82" font-weight="bold">Filiale – APs im selben VLAN (Kurs-Empfehlung)</text>
  <line x1="100" y1="140" x2="700" y2="140" stroke="#222" stroke-width="3"/>
  <rect x="330" y="95" width="140" height="30" rx="4" fill="#39c86a"/><text x="400" y="115" text-anchor="middle" fill="#fff">SW (PoE)</text>
  <line x1="400" y1="125" x2="400" y2="140" stroke="#222" stroke-width="3"/>
  <line x1="180" y1="140" x2="180" y2="190" stroke="#222" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="190" stroke="#222" stroke-width="2"/>
  <line x1="620" y1="140" x2="620" y2="190" stroke="#222" stroke-width="2"/>
  <rect x="110" y="190" width="140" height="70" rx="20" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/>
  <text x="180" y="215" text-anchor="middle" font-weight="bold">Primary AP</text>
  <rect x="130" y="225" width="100" height="24" rx="3" fill="#4a9cff"/><text x="180" y="242" text-anchor="middle" fill="#fff" font-size="12">virtueller WLC</text>
  <rect x="340" y="200" width="120" height="40" rx="20" fill="#fff" stroke="#222"/><text x="400" y="225" text-anchor="middle">Subordinate AP</text>
  <rect x="560" y="200" width="120" height="40" rx="20" fill="#fff" stroke="#222"/><text x="620" y="225" text-anchor="middle">Subordinate AP</text>
  <path d="M250 225 L340 220" stroke="#b08aff" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M250 235 Q420 290 560 225" stroke="#b08aff" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <text x="420" y="290" text-anchor="middle" font-size="12" fill="#7a55d0">steuert per CAPWAP; Daten lokal geswitcht</text>
  <text x="180" y="280" text-anchor="middle" font-size="12">bedient auch Clients</text>
</g>
<g font-size="12" fill="#222">
  <rect x="40" y="325" width="350" height="115" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
  <text x="215" y="346" text-anchor="middle" font-weight="bold" font-size="13">Mobility Express – End-of-Life</text>
  <text x="52" y="368">• AireOS, Primary AP = 802.11ac Wave 2</text>
  <text x="52" y="388">• bis ~100 APs / 2000 Clients (modellabhängig)</text>
  <text x="52" y="408">• Setup: SSID CiscoAirProvision →</text>
  <text x="52" y="424">  mobilityexpress.cisco</text>
  <rect x="410" y="325" width="350" height="115" rx="8" fill="#eafaf0" stroke="#39c86a"/>
  <text x="585" y="346" text-anchor="middle" font-weight="bold" font-size="13">EWC auf Catalyst 9100 AP – aktuell</text>
  <text x="422" y="368">• IOS XE, gleiche Konfig-Logik wie 9800</text>
  <text x="422" y="388">• kleine Standorte ohne Fabric</text>
  <text x="422" y="408">• Failover auf anderen AP mit EWC-Image</text>
  <text x="422" y="424">• Migration zu 9800 möglich</text>
</g>
</svg>
