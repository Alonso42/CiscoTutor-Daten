<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Host anhand der IP-Adresse finden</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Von der IP-Adresse zum Switchport</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<g font-size="13" fill="#222">
<rect x="30" y="70" width="170" height="90" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<text x="115" y="95" text-anchor="middle" font-weight="bold">1. IP bekannt</text>
<text x="115" y="118" text-anchor="middle">10.10.10.182</text>
<text x="115" y="140" text-anchor="middle" font-size="11">Gateway/Subnetz suchen</text>
<rect x="225" y="70" width="170" height="90" rx="8" fill="#f3edff" stroke="#b08aff"/>
<text x="310" y="95" text-anchor="middle" font-weight="bold">2. Gateway</text>
<text x="310" y="118" text-anchor="middle" font-size="11" font-family="monospace">ping 10.10.10.182</text>
<text x="310" y="138" text-anchor="middle" font-size="11" font-family="monospace">show ip arp 10.10.10.182</text>
<rect x="420" y="70" width="170" height="90" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="505" y="95" text-anchor="middle" font-weight="bold">3. MAC → Port</text>
<text x="505" y="118" text-anchor="middle" font-size="11" font-family="monospace">show mac address-table</text>
<text x="505" y="138" text-anchor="middle" font-size="11" font-family="monospace">| include 5300</text>
<rect x="615" y="70" width="160" height="90" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="695" y="95" text-anchor="middle" font-weight="bold">4. Port prüfen</text>
<text x="695" y="118" text-anchor="middle" font-size="11" font-family="monospace">show interfaces status</text>
<text x="695" y="138" text-anchor="middle" font-size="11">Vlan-Spalte: 62 / trunk</text>
</g>
<line x1="200" y1="115" x2="223" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="395" y1="115" x2="418" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="590" y1="115" x2="613" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="695" y1="160" x2="695" y2="210" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="430" y="215" width="345" height="90" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<g font-size="13" fill="#222">
<text x="445" y="240" font-weight="bold">Port ist Trunk / Uplink?</text>
<text x="445" y="263">show cdp neighbors → Nachbar-Switch</text>
<text x="445" y="286">dort Schritt 3 wiederholen</text>
</g>
<path d="M430 260 C 380 260, 505 200, 505 165" stroke="#ff6b6b" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="30" y="215" width="370" height="90" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<g font-size="13" fill="#222">
<text x="45" y="240" font-weight="bold">Endgeräteport gefunden</text>
<text x="45" y="263" font-family="monospace" font-size="12">interface Ethernet0/2</text>
<text x="45" y="283" font-family="monospace" font-size="12"> shutdown</text>
</g>
<rect x="30" y="330" width="745" height="100" rx="8" fill="#fff" stroke="#222"/>
<g font-size="13" fill="#222">
<text x="45" y="355">• Router-on-a-Stick-MAC erscheint am Trunk in jedem VLAN mit Subinterface (eine Zeile pro VLAN)</text>
<text x="45" y="378">• Subinterface-Name ≠ VLAN: E0/0.134 nutzt encapsulation dot1Q 62</text>
<text x="45" y="401">• Mit Router-PCs im Lab hilft CDP; echte PCs senden kein CDP → ARP + MAC-Tabelle</text>
<text x="45" y="424">• Ping „.!!!!“: erstes Paket wartet auf ARP → 80 % (4/5)</text>
</g>
</svg>
