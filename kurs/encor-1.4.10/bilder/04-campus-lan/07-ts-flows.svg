<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Troubleshooting-Abläufe VLAN und Trunk</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Prüfreihenfolge bei VLAN- und Trunk-Problemen</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<text x="30" y="65" font-size="15" font-weight="bold" fill="#4a9cff">A) Keine Verbindung im selben VLAN</text>
<g font-size="12" fill="#222">
<rect x="30" y="80" width="220" height="70" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="140" y="102" text-anchor="middle" font-weight="bold">Port im richtigen VLAN?</text>
<text x="140" y="122" text-anchor="middle" font-family="monospace" font-size="11">show vlan</text>
<text x="140" y="138" text-anchor="middle" font-family="monospace" font-size="11">show mac address-table</text>
<rect x="290" y="80" width="220" height="70" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="400" y="102" text-anchor="middle" font-weight="bold">VLAN in der Datenbank?</text>
<text x="400" y="122" text-anchor="middle" font-family="monospace" font-size="11">show vlan</text>
<text x="400" y="138" text-anchor="middle" font-family="monospace" font-size="11">show interfaces switchport</text>
<rect x="550" y="80" width="220" height="70" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="660" y="102" text-anchor="middle" font-weight="bold">VLAN nicht shutdown?</text>
<text x="660" y="122" text-anchor="middle" font-family="monospace" font-size="11">show vlan (act/lshut)</text>
<text x="40" y="172">Nein → switchport access vlan X</text>
<text x="300" y="172">Nein → vlan X anlegen (Ports sonst inaktiv)</text>
<text x="560" y="172">Nein → no shutdown im VLAN</text>
</g>
<line x1="250" y1="115" x2="288" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="115" x2="548" y2="115" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="225" font-size="15" font-weight="bold" fill="#b08aff">B) Trunk-Probleme (immer: show interfaces trunk)</text>
<g font-size="12" fill="#222">
<rect x="30" y="240" width="220" height="70" rx="8" fill="#f3edff" stroke="#b08aff"/>
<text x="140" y="265" text-anchor="middle" font-weight="bold">Native VLAN gleich?</text>
<text x="140" y="285" text-anchor="middle">CDP: NATIVE_VLAN_MISMATCH</text>
<rect x="290" y="240" width="220" height="70" rx="8" fill="#f3edff" stroke="#b08aff"/>
<text x="400" y="265" text-anchor="middle" font-weight="bold">Trunk-Modi passen?</text>
<text x="400" y="285" text-anchor="middle">Status trunking?</text>
<rect x="550" y="240" width="220" height="70" rx="8" fill="#f3edff" stroke="#b08aff"/>
<text x="660" y="265" text-anchor="middle" font-weight="bold">Allowed VLANs passen?</text>
<text x="660" y="285" text-anchor="middle">beide Seiten prüfen</text>
<text x="40" y="332">Nein → native vlan angleichen</text>
<text x="300" y="332">Nein → beide statisch mode trunk</text>
<text x="560" y="332">Nein → allowed vlan add X</text>
</g>
<line x1="250" y1="275" x2="288" y2="275" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="275" x2="548" y2="275" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="360" width="740" height="70" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<text x="45" y="388" font-size="13" fill="#222">Nach jedem Fix erneut testen (ping) – im Lab gab es zwei Fehler auf demselben Trunk.</text>
<text x="45" y="412" font-size="13" fill="#222">DTP: auto + auto = not-trunking · on + desirable = trunking · Best Practice: statisch + nonegotiate</text>
</svg>
