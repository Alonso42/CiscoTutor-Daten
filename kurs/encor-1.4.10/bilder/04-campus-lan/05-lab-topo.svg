<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery-3-Topologie mit Fehlern</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Lab-Topologie: VLAN 62 = 10.10.10.0/24</text>
<rect x="330" y="80" width="120" height="60" rx="6" fill="#4a9cff"/><text x="390" y="117" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">SW2</text>
<rect x="330" y="260" width="120" height="60" rx="6" fill="#4a9cff"/><text x="390" y="297" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">SW1</text>
<circle cx="660" cy="290" r="38" fill="#b08aff"/><text x="660" y="297" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">R1</text>
<g font-size="12" fill="#222">
<rect x="60" y="60" width="110" height="40" rx="4" fill="#eee" stroke="#222"/><text x="115" y="85" text-anchor="middle">PC1 .10</text>
<rect x="60" y="120" width="110" height="40" rx="4" fill="#eee" stroke="#222"/><text x="115" y="145" text-anchor="middle">PC2 .20</text>
<rect x="60" y="240" width="110" height="40" rx="4" fill="#eee" stroke="#222"/><text x="115" y="265" text-anchor="middle">PC3 .182</text>
<rect x="60" y="300" width="110" height="40" rx="4" fill="#eee" stroke="#222"/><text x="115" y="325" text-anchor="middle">PC4 .40</text>
</g>
<g stroke-width="3">
<line x1="170" y1="80" x2="330" y2="100" stroke="#39c86a"/>
<line x1="170" y1="140" x2="330" y2="120" stroke="#39c86a"/>
<line x1="170" y1="260" x2="330" y2="280" stroke="#39c86a"/>
<line x1="170" y1="320" x2="330" y2="300" stroke="#39c86a"/>
<line x1="390" y1="140" x2="390" y2="260" stroke="#222" stroke-width="5"/>
<line x1="450" y1="290" x2="622" y2="290" stroke="#222" stroke-width="5"/>
</g>
<g font-size="11" fill="#222">
<text x="285" y="92">Et0/1</text><text x="285" y="133">Et0/2</text>
<text x="285" y="272">Et0/2</text><text x="285" y="315">Et0/3</text>
<text x="398" y="158">Et0/0 (desirable)</text><text x="398" y="252">Et0/1 (on)</text>
<text x="455" y="282">Et0/0 trunk</text><text x="560" y="282">E0/0</text>
<text x="545" y="345">E0/0.134 → dot1Q 62</text>
<text x="545" y="362">10.10.10.1/24</text>
<text x="545" y="379">E0/0.21 → 10.10.1.1</text>
</g>
<rect x="470" y="70" width="300" height="120" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="485" y="94" font-size="14" font-weight="bold" fill="#ff6b6b">Fehler auf dem SW1–SW2-Trunk</text>
<g font-size="12" fill="#222">
<text x="485" y="117">1. Native VLAN: SW1 = 1, SW2 = 2</text>
<text x="485" y="135">   → SW2: switchport trunk native vlan 1</text>
<text x="485" y="157">2. SW1 Et0/1 allowed 1-61,63-1000</text>
<text x="485" y="175">   → switchport trunk allowed vlan add 62</text>
</g>
<text x="40" y="400" font-size="13" fill="#222">Access-Ports aller PCs in VLAN 62 („SixtyTwo“) · PC3 isoliert per shutdown auf SW1 Et0/2</text>
<text x="40" y="425" font-size="13" fill="#222">PC1 → PC2 klappt (gleicher Switch), PC1 → PC4 erst nach beiden Fixes</text>
</svg>
