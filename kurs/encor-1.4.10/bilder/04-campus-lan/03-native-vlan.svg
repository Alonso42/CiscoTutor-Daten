<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Native-VLAN-Mismatch</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Native VLAN mismatch: ungetaggte Frames wechseln das VLAN</text>
<rect x="40" y="130" width="80" height="55" rx="4" fill="#eee" stroke="#222"/><text x="80" y="163" text-anchor="middle" font-size="13" fill="#222">PC A</text>
<text x="80" y="205" text-anchor="middle" font-size="12" fill="#39c86a">VLAN 1</text>
<rect x="200" y="120" width="130" height="70" rx="6" fill="#4a9cff"/><text x="265" y="153" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">SW1</text>
<text x="265" y="175" text-anchor="middle" font-size="12" fill="#fff">native vlan 1</text>
<rect x="470" y="120" width="130" height="70" rx="6" fill="#4a9cff"/><text x="535" y="153" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">SW2</text>
<text x="535" y="175" text-anchor="middle" font-size="12" fill="#fff">native vlan 2</text>
<rect x="680" y="130" width="80" height="55" rx="4" fill="#eee" stroke="#222"/><text x="720" y="163" text-anchor="middle" font-size="13" fill="#222">PC B</text>
<text x="720" y="205" text-anchor="middle" font-size="12" fill="#b08aff">VLAN 2</text>
<line x1="120" y1="157" x2="200" y2="157" stroke="#39c86a" stroke-width="3"/>
<line x1="330" y1="157" x2="470" y2="157" stroke="#222" stroke-width="4"/>
<line x1="600" y1="157" x2="680" y2="157" stroke="#b08aff" stroke-width="3"/>
<text x="400" y="145" text-anchor="middle" font-size="13" fill="#222">802.1Q-Trunk</text>
<rect x="345" y="168" width="110" height="24" rx="4" fill="#ffd23f"/><text x="400" y="185" text-anchor="middle" font-size="12" fill="#222">Frame ohne Tag</text>
<g font-size="13" fill="#222">
<text x="60" y="250">1. PC A sendet in VLAN 1 = Native VLAN von SW1 → SW1 sendet ungetaggt</text>
<text x="60" y="275">2. SW2 ordnet ungetaggte Frames seinem Native VLAN 2 zu</text>
<text x="60" y="300" fill="#ff6b6b" font-weight="bold">3. Verkehr „leckt“ von VLAN 1 nach VLAN 2 (VLAN leaking)</text>
</g>
<rect x="40" y="325" width="720" height="105" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="55" y="350" font-size="13" fill="#222" font-weight="bold">Erkennen und beheben</text>
<text x="55" y="372" font-size="12" fill="#222" font-family="monospace">%CDP-4-NATIVE_VLAN_MISMATCH: ... on Ethernet0/1 (1), with SW2 Ethernet0/0 (2)</text>
<text x="55" y="394" font-size="13" fill="#222">lokaler Port (lokales Native VLAN) · Nachbar + dessen Port (dessen Native VLAN)</text>
<text x="55" y="416" font-size="13" fill="#222">Fix: switchport trunk native vlan X auf beiden Seiten gleich · Best Practice: unbenutztes VLAN</text>
</svg>
