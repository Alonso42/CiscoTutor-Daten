<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Optionen für Inter-VLAN-Routing</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Inter-VLAN-Routing: drei Optionen</text>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="135" y="65" font-weight="bold">1. Interface pro VLAN</text>
<text x="400" y="65" font-weight="bold">2. Router on a Stick</text>
<text x="665" y="65" font-weight="bold">3. Layer-3-Switch</text>
</g>
<circle cx="135" cy="115" r="30" fill="#b08aff"/><text x="135" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">R</text>
<rect x="75" y="200" width="120" height="50" rx="6" fill="#4a9cff"/><text x="135" y="231" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">SW</text>
<line x1="120" y1="143" x2="110" y2="200" stroke="#39c86a" stroke-width="3"/>
<line x1="150" y1="143" x2="160" y2="200" stroke="#ffd23f" stroke-width="3"/>
<text x="80" y="178" font-size="11" fill="#222">VLAN 10</text><text x="160" y="178" font-size="11" fill="#222">VLAN 20</text>
<circle cx="400" cy="115" r="30" fill="#b08aff"/><text x="400" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">R</text>
<rect x="340" y="200" width="120" height="50" rx="6" fill="#4a9cff"/><text x="400" y="231" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">SW</text>
<line x1="400" y1="145" x2="400" y2="200" stroke="#222" stroke-width="5"/>
<text x="410" y="170" font-size="11" fill="#222">Trunk</text>
<text x="440" y="100" font-size="11" fill="#222">G0/0.10 dot1Q 10</text>
<text x="440" y="116" font-size="11" fill="#222">G0/0.20 dot1Q 20</text>
<rect x="590" y="160" width="150" height="90" rx="6" fill="#4a9cff"/><text x="665" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">L3-SW</text>
<text x="665" y="212" text-anchor="middle" font-size="12" fill="#fff">ip routing</text>
<text x="665" y="230" text-anchor="middle" font-size="12" fill="#fff">SVI Vlan10 / Vlan20</text>
<g font-size="12" fill="#222">
<rect x="20" y="280" width="235" height="150" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="32" y="303">• je VLAN ein physischer Link</text>
<text x="32" y="325">• Switchports = Access-Ports</text>
<text x="32" y="347">• einfach, aber Ports gehen aus</text>
<text x="32" y="369" font-weight="bold">→ skaliert nicht</text>
<rect x="282" y="280" width="236" height="150" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<text x="294" y="303">• ein Trunk, Subinterfaces</text>
<text x="294" y="325">• Gateway = Subinterface-IP</text>
<text x="294" y="347">• Inter-VLAN-Verkehr läuft</text>
<text x="294" y="365">  zweimal über den Trunk</text>
<text x="294" y="387" font-weight="bold">→ Trunk ist der Engpass</text>
<rect x="545" y="280" width="235" height="150" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="557" y="303">• switcht im VLAN, routet</text>
<text x="557" y="321">  zwischen VLANs (Hardware)</text>
<text x="557" y="343">• Gateway = SVI-IP</text>
<text x="557" y="365">• SVI up nur mit aktivem Port</text>
<text x="557" y="383">  im VLAN (Autostate)</text>
<text x="557" y="405" font-weight="bold">→ am besten skalierbar</text>
</g>
</svg>
