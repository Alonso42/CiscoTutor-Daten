<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Content Security: Secure Email Gateway und Secure Web Appliance</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Content Security: E-Mail und Web</text>
<text x="40" y="70" font-size="16" font-weight="bold" fill="#222">Secure Email Gateway (früher ESA) – SMTP, eingehend</text>
<rect x="40" y="90" width="100" height="44" rx="6" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="2"/>
<text x="90" y="117" text-anchor="middle" font-size="13" fill="#222">Absender</text>
<rect x="250" y="90" width="120" height="44" rx="6" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="310" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Email Gateway</text>
<text x="310" y="126" text-anchor="middle" font-size="11" fill="#222">MTA, MX zeigt hierher</text>
<rect x="520" y="90" width="110" height="44" rx="6" fill="#39c86a" fill-opacity="0.25" stroke="#39c86a" stroke-width="2"/>
<text x="575" y="117" text-anchor="middle" font-size="13" fill="#222">Mailserver</text>
<line x1="142" y1="112" x2="246" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="372" y1="112" x2="516" y2="112" stroke="#39c86a" stroke-width="3" marker-end="url(#a)"/>
<text x="444" y="104" text-anchor="middle" font-size="12" fill="#222">saubere Mail</text>
<text x="310" y="158" text-anchor="middle" font-size="12" fill="#ff6b6b">Malware/Spam → verworfen</text>
<text x="40" y="190" font-size="12" fill="#222">Funktionen: Anti-Spam (Reputation, wenige False Positives) · Antivirus/Outbreak Filters (Zero-Hour) · Blended Attacks · DLP/Verschlüsselung ausgehend</text>
<line x1="20" y1="210" x2="780" y2="210" stroke="#ccc"/>
<text x="40" y="240" font-size="16" font-weight="bold" fill="#222">Secure Web Appliance (früher WSA) – Web-Proxy</text>
<rect x="40" y="290" width="90" height="44" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="85" y="317" text-anchor="middle" font-size="13" fill="#222">PC</text>
<rect x="280" y="290" width="120" height="44" rx="6" fill="#b08aff" fill-opacity="0.3" stroke="#b08aff" stroke-width="2"/>
<text x="340" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Web Appliance</text>
<rect x="590" y="290" width="130" height="44" rx="6" fill="#39c86a" fill-opacity="0.25" stroke="#39c86a" stroke-width="2"/>
<text x="655" y="317" text-anchor="middle" font-size="13" fill="#222">Website</text>
<line x1="132" y1="303" x2="276" y2="303" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="204" y="296" text-anchor="middle" font-size="12" fill="#222">1 Request</text>
<line x1="402" y1="303" x2="586" y2="303" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="494" y="296" text-anchor="middle" font-size="12" fill="#222">2 Proxy-Request</text>
<line x1="586" y1="324" x2="402" y2="324" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="494" y="342" text-anchor="middle" font-size="12" fill="#222">3 Antwort → Malware-Scan</text>
<line x1="276" y1="324" x2="132" y2="324" stroke="#39c86a" stroke-width="3" marker-end="url(#a)"/>
<text x="204" y="342" text-anchor="middle" font-size="12" fill="#222">4 geprüfter Inhalt</text>
<text x="340" y="372" text-anchor="middle" font-size="12" fill="#ff6b6b">verbotene Kategorie (z. B. Glücksspiel) → Block-Seite</text>
<text x="40" y="405" font-size="12" fill="#222">Funktionen: URL-Kategorien und Web-Reputation · AVC · Malware-Schutz · Reporting · Secure Mobility</text>
<text x="40" y="428" font-size="12" fill="#222">Einbindung: explizit (Browser/PAC) oder transparent (WCCP) · DNS-Layer-Schutz ergänzend: Cisco Umbrella</text>
</svg>
