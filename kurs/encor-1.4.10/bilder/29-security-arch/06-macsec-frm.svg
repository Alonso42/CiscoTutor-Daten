<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>MACsec-Frame und MKA-Schlüsselkette</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">MACsec (802.1AE): Frame-Aufbau</text>
<rect x="30" y="80" width="70" height="40" fill="#ffffff" stroke="#222"/><text x="65" y="105" text-anchor="middle" font-size="13" fill="#222">DMAC</text>
<rect x="100" y="80" width="70" height="40" fill="#ffffff" stroke="#222"/><text x="135" y="105" text-anchor="middle" font-size="13" fill="#222">SMAC</text>
<rect x="170" y="80" width="120" height="40" fill="#ffd23f" fill-opacity="0.5" stroke="#222"/><text x="230" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SecTAG</text><text x="230" y="113" text-anchor="middle" font-size="11" fill="#222">0x88E5</text>
<rect x="290" y="80" width="70" height="40" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/><text x="325" y="105" text-anchor="middle" font-size="13" fill="#222">802.1Q</text>
<rect x="360" y="80" width="70" height="40" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/><text x="395" y="105" text-anchor="middle" font-size="13" fill="#222">CMD</text>
<rect x="430" y="80" width="80" height="40" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/><text x="470" y="105" text-anchor="middle" font-size="13" fill="#222">EtherType</text>
<rect x="510" y="80" width="110" height="40" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/><text x="565" y="105" text-anchor="middle" font-size="13" fill="#222">Payload</text>
<rect x="620" y="80" width="70" height="40" fill="#b08aff" fill-opacity="0.4" stroke="#222"/><text x="655" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ICV</text>
<rect x="690" y="80" width="70" height="40" fill="#ffffff" stroke="#222"/><text x="725" y="105" text-anchor="middle" font-size="13" fill="#222">FCS</text>
<line x1="290" y1="140" x2="620" y2="140" stroke="#4a9cff" stroke-width="3"/>
<text x="455" y="158" text-anchor="middle" font-size="13" fill="#222">verschlüsselt (inkl. 802.1Q-Tag und SGT)</text>
<line x1="30" y1="175" x2="620" y2="175" stroke="#b08aff" stroke-width="3"/>
<text x="325" y="193" text-anchor="middle" font-size="13" fill="#222">integritätsgeschützt durch die ICV (MAC-Adressen bleiben lesbar)</text>
<text x="30" y="218" font-size="12" fill="#222">SecTAG: EtherType 0x88E5 · TCI/AN · Short Length · Packet Number (Replay-Schutz) · SCI optional</text>
<line x1="20" y1="235" x2="780" y2="235" stroke="#ccc"/>
<text x="400" y="262" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">MKA (IEEE 802.1X-2010): Schlüsselkette</text>
<rect x="30" y="285" width="150" height="54" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="105" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">802.1X/EAP</text>
<text x="105" y="326" text-anchor="middle" font-size="12" fill="#222">(oder PSK)</text>
<rect x="230" y="285" width="120" height="54" rx="8" fill="#ffd23f" fill-opacity="0.3" stroke="#222"/>
<text x="290" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">MSK</text>
<rect x="400" y="285" width="140" height="54" rx="8" fill="#b08aff" fill-opacity="0.3" stroke="#222"/>
<text x="470" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">CAK + CKN</text>
<text x="470" y="326" text-anchor="middle" font-size="11" fill="#222">Connectivity Assoc. Key</text>
<rect x="590" y="285" width="170" height="54" rx="8" fill="#39c86a" fill-opacity="0.3" stroke="#222"/>
<text x="675" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SAK</text>
<text x="675" y="326" text-anchor="middle" font-size="11" fill="#222">vom Key Server erzeugt</text>
<line x1="182" y1="312" x2="226" y2="312" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="352" y1="312" x2="396" y2="312" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="542" y1="312" x2="586" y2="312" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="372" font-size="13" fill="#222">• Switch (Authenticator) = Key Server, wählt Cipher Suite (Default GCM-AES-128), verteilt die SAK per AES Key Wrap</text>
<text x="30" y="394" font-size="13" fill="#222">• MKPDUs in EAPOL-Frames: Hello alle 2 s, Session-Ende nach 6 s ohne MKPDU</text>
<text x="30" y="416" font-size="13" fill="#222">• hop-by-hop: jedes Gerät entschlüsselt und verschlüsselt neu</text>
<text x="30" y="438" font-size="13" fill="#222">• EAP-Methode muss Schlüssel liefern (EAP-TLS, PEAP …) – EAP-MD5 reicht nicht</text>
</svg>
