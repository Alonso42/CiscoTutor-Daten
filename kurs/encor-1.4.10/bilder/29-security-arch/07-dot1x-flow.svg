<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>802.1X-Rollen und Nachrichtenfluss</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">802.1X: EAPOL links, RADIUS rechts</text>
<rect x="60" y="45" width="120" height="44" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="120" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Supplicant</text><text x="120" y="81" text-anchor="middle" font-size="11" fill="#222">PC</text>
<rect x="340" y="45" width="120" height="44" rx="4" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="400" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Authenticator</text><text x="400" y="81" text-anchor="middle" font-size="11" fill="#222">Switch = RADIUS-Client</text>
<rect x="620" y="45" width="130" height="44" rx="6" fill="#b08aff" fill-opacity="0.3" stroke="#b08aff" stroke-width="2"/>
<text x="685" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Auth-Server</text><text x="685" y="81" text-anchor="middle" font-size="11" fill="#222">Cisco ISE</text>
<line x1="120" y1="92" x2="120" y2="430" stroke="#999" stroke-dasharray="4,4"/>
<line x1="400" y1="92" x2="400" y2="430" stroke="#999" stroke-dasharray="4,4"/>
<line x1="685" y1="92" x2="685" y2="430" stroke="#999" stroke-dasharray="4,4"/>
<line x1="122" y1="118" x2="396" y2="118" stroke="#ffd23f" stroke-width="3" marker-end="url(#a)"/><text x="260" y="112" text-anchor="middle" font-size="12" fill="#222">EAPOL-Start (optional)</text>
<line x1="398" y1="148" x2="124" y2="148" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="260" y="142" text-anchor="middle" font-size="12" fill="#222">EAP-Request/Identity</text>
<line x1="122" y1="178" x2="396" y2="178" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="260" y="172" text-anchor="middle" font-size="12" fill="#222">EAP-Response/Identity</text>
<line x1="402" y1="178" x2="681" y2="178" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="172" text-anchor="middle" font-size="12" fill="#222">RADIUS Access-Request</text>
<line x1="683" y1="212" x2="404" y2="212" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="206" text-anchor="middle" font-size="12" fill="#222">Access-Challenge</text>
<line x1="398" y1="212" x2="124" y2="212" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="260" y="206" text-anchor="middle" font-size="12" fill="#222">EAP-Request (Methode)</text>
<line x1="122" y1="242" x2="396" y2="242" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="260" y="236" text-anchor="middle" font-size="12" fill="#222">EAP-Response</text>
<line x1="402" y1="242" x2="681" y2="242" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="236" text-anchor="middle" font-size="12" fill="#222">Access-Request</text>
<text x="260" y="265" text-anchor="middle" font-size="12" fill="#222">… je nach EAP-Methode mehrere Runden …</text>
<line x1="683" y1="292" x2="404" y2="292" stroke="#39c86a" stroke-width="3" marker-end="url(#a)"/><text x="542" y="286" text-anchor="middle" font-size="12" fill="#222">Access-Accept (+VLAN/dACL/SGT)</text>
<line x1="398" y1="322" x2="124" y2="322" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="260" y="316" text-anchor="middle" font-size="12" fill="#222">EAP-Success</text>
<rect x="335" y="335" width="130" height="28" rx="6" fill="#39c86a" fill-opacity="0.35" stroke="#39c86a"/><text x="400" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Port authorized</text>
<line x1="122" y1="390" x2="396" y2="390" stroke="#ff6b6b" stroke-width="2" marker-end="url(#a)"/><text x="260" y="384" text-anchor="middle" font-size="12" fill="#222">EAPOL-Logoff</text>
<rect x="330" y="400" width="140" height="28" rx="6" fill="#ff6b6b" fill-opacity="0.3" stroke="#ff6b6b"/><text x="400" y="419" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Port unauthorized</text>
<text x="20" y="440" font-size="11" fill="#222">EAPOL: EtherType 0x888E</text>
<text x="560" y="440" font-size="11" fill="#222">EAP unverändert in RADIUS gekapselt</text>
</svg>
