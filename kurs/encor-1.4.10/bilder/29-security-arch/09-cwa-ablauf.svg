<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Central Web Authentication mit ISE</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Central WebAuth (CWA): Portal auf ISE, danach CoA</text>
<rect x="60" y="45" width="110" height="40" rx="6" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="115" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Gast-PC</text>
<rect x="345" y="45" width="110" height="40" rx="4" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/><text x="400" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Switch/WLC</text>
<rect x="630" y="45" width="110" height="40" rx="6" fill="#b08aff" fill-opacity="0.3" stroke="#b08aff" stroke-width="2"/><text x="685" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">ISE (PSN)</text>
<line x1="115" y1="88" x2="115" y2="400" stroke="#999" stroke-dasharray="4,4"/>
<line x1="400" y1="88" x2="400" y2="400" stroke="#999" stroke-dasharray="4,4"/>
<line x1="685" y1="88" x2="685" y2="400" stroke="#999" stroke-dasharray="4,4"/>
<line x1="117" y1="112" x2="396" y2="112" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="258" y="106" text-anchor="middle" font-size="12" fill="#222">1 erster Frame (kein Supplicant)</text>
<line x1="402" y1="112" x2="681" y2="112" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="106" text-anchor="middle" font-size="12" fill="#222">2 MAB Access-Request</text>
<line x1="683" y1="150" x2="404" y2="150" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="138" text-anchor="middle" font-size="12" fill="#222">3 Access-Accept mit</text><text x="542" y="166" text-anchor="middle" font-size="11" fill="#222">url-redirect + url-redirect-acl</text>
<line x1="117" y1="195" x2="396" y2="195" stroke="#222" stroke-width="2" marker-end="url(#a)"/><text x="258" y="189" text-anchor="middle" font-size="12" fill="#222">4 HTTP-Request an beliebige Seite</text>
<line x1="398" y1="222" x2="119" y2="222" stroke="#ffd23f" stroke-width="3" marker-end="url(#a)"/><text x="258" y="240" text-anchor="middle" font-size="12" fill="#222">5 Redirect zum ISE-Gastportal</text>
<line x1="117" y1="270" x2="681" y2="270" stroke="#b08aff" stroke-width="3" marker-end="url(#a)"/><text x="400" y="263" text-anchor="middle" font-size="12" fill="#222">6 Login/AUP auf dem Portal (HTTPS direkt zu ISE)</text>
<line x1="683" y1="305" x2="404" y2="305" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a)"/><text x="542" y="299" text-anchor="middle" font-size="12" fill="#222">7 RADIUS CoA (Reauthenticate)</text>
<line x1="402" y1="335" x2="681" y2="335" stroke="#39c86a" stroke-width="2" marker-end="url(#a)"/><text x="542" y="329" text-anchor="middle" font-size="12" fill="#222">8 erneuter MAB-Request</text>
<line x1="683" y1="365" x2="404" y2="365" stroke="#39c86a" stroke-width="3" marker-end="url(#a)"/><text x="542" y="359" text-anchor="middle" font-size="12" fill="#222">9 Access-Accept: Gastzugang</text>
<rect x="60" y="410" width="680" height="32" rx="6" fill="#ffd23f" fill-opacity="0.2" stroke="#222"/>
<text x="400" y="431" text-anchor="middle" font-size="12" fill="#222">LWA dagegen: Portal/Login am NAD selbst, kein CoA, kein zentraler Audit Trail, Portal-Konfiguration pro Gerät</text>
</svg>
