<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>TrustSec: Classification, Transport, Enforcement</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">TrustSec: drei Funktionsbereiche</text>
<rect x="30" y="170" width="80" height="44" rx="5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="70" y="190" text-anchor="middle" font-size="13" fill="#222">PC</text>
<text x="70" y="206" text-anchor="middle" font-size="11" fill="#222">10.1.10.5</text>
<rect x="170" y="170" width="80" height="44" rx="4" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="210" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SW1</text>
<rect x="360" y="170" width="80" height="44" rx="4" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="400" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SW2</text>
<rect x="550" y="170" width="80" height="44" rx="4" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="590" y="197" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SW3</text>
<rect x="690" y="170" width="90" height="44" rx="5" fill="#39c86a" fill-opacity="0.25" stroke="#39c86a" stroke-width="2"/>
<text x="735" y="190" text-anchor="middle" font-size="13" fill="#222">Server</text>
<text x="735" y="206" text-anchor="middle" font-size="11" fill="#222">SGT 20 (DGT)</text>
<line x1="112" y1="192" x2="166" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<line x1="252" y1="192" x2="356" y2="192" stroke="#ffd23f" stroke-width="4" marker-end="url(#a)"/>
<line x1="442" y1="192" x2="546" y2="192" stroke="#ffd23f" stroke-width="4" marker-end="url(#a)"/>
<line x1="632" y1="192" x2="686" y2="192" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="304" y="182" text-anchor="middle" font-size="12" fill="#222">SGT 10 inline</text>
<text x="494" y="182" text-anchor="middle" font-size="12" fill="#222">SGT 10 inline</text>
<rect x="170" y="70" width="80" height="50" rx="6" fill="#b08aff" fill-opacity="0.3" stroke="#b08aff" stroke-width="2"/>
<text x="210" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">ISE</text>
<line x1="210" y1="122" x2="210" y2="166" stroke="#b08aff" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a)"/>
<text x="220" y="148" font-size="11" fill="#222">SGT 10 im Access-Accept</text>
<rect x="20" y="250" width="240" height="180" rx="10" fill="#4a9cff" fill-opacity="0.08" stroke="#4a9cff"/>
<text x="140" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">1 Classification</text>
<text x="32" y="300" font-size="12" fill="#222">SGT ↔ IP zuordnen (Ingress)</text>
<text x="32" y="322" font-size="12" fill="#222">dynamisch: 802.1X, MAB, WebAuth</text>
<text x="32" y="340" font-size="12" fill="#222">  (ISE liefert das SGT)</text>
<text x="32" y="362" font-size="12" fill="#222">statisch: IP/Subnetz, VLAN, Port</text>
<text x="32" y="380" font-size="12" fill="#222">  (typisch im Data Center)</text>
<rect x="280" y="250" width="240" height="180" rx="10" fill="#ffd23f" fill-opacity="0.12" stroke="#222"/>
<text x="400" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2 Transport</text>
<text x="292" y="300" font-size="12" fill="#222">Inline: Cisco Meta Data</text>
<text x="292" y="318" font-size="12" fill="#222">  EtherType 0x8909, 16-Bit-SGT</text>
<text x="292" y="340" font-size="12" fill="#222">SXP: IP-SGT-Bindings per TCP</text>
<text x="292" y="358" font-size="12" fill="#222">  über Geräte ohne Inline-HW</text>
<text x="292" y="380" font-size="12" fill="#222">  Rollen Speaker → Listener</text>
<text x="292" y="402" font-size="12" fill="#222">optional mit MACsec geschützt</text>
<rect x="540" y="250" width="240" height="180" rx="10" fill="#39c86a" fill-opacity="0.1" stroke="#39c86a"/>
<text x="660" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">3 Enforcement</text>
<text x="552" y="300" font-size="12" fill="#222">meist am Egress (DGT bekannt)</text>
<text x="552" y="322" font-size="12" fill="#222">SGACL auf Switches</text>
<text x="552" y="340" font-size="12" fill="#222">  (Policy zentral aus ISE)</text>
<text x="552" y="362" font-size="12" fill="#222">SGFW auf ASA/Router/FTD</text>
<text x="552" y="380" font-size="12" fill="#222">  (Policy lokal am Gerät)</text>
<text x="552" y="402" font-size="12" fill="#222">Paket trägt nur das Source-SGT</text>
</svg>
