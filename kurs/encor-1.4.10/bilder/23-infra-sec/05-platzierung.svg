<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>ACL-Platzierung im Lab: Standard nahe Ziel, Extended am Internet-Eingang, access-class auf vty</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Platzierung der ACLs auf R1</text>
<g stroke="#222" stroke-width="2">
<line x1="130" y1="120" x2="330" y2="200"/><line x1="130" y1="320" x2="330" y2="230"/><line x1="400" y1="215" x2="560" y2="215"/><line x1="630" y1="215" x2="700" y2="130"/><line x1="630" y1="215" x2="700" y2="310"/>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="50" y="100" width="80" height="40" fill="#f4f4f4" stroke="#222"/><text x="90" y="118">PC1</text><text x="90" y="133">10.10.1.10</text>
<rect x="50" y="300" width="80" height="40" fill="#f4f4f4" stroke="#222"/><text x="90" y="318">SRV1</text><text x="90" y="333">10.10.2.20</text>
<circle cx="365" cy="215" r="35" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="365" y="221" font-size="16" font-weight="bold">R1</text>
<circle cx="595" cy="215" r="35" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="595" y="221" font-size="16" font-weight="bold">R2</text>
<rect x="700" y="110" width="80" height="40" fill="#f4f4f4" stroke="#222"/><text x="740" y="128">PC2</text><text x="740" y="143">.40</text>
<rect x="700" y="290" width="80" height="40" fill="#f4f4f4" stroke="#222"/><text x="740" y="308">SRV2 DNS</text><text x="740" y="323">.30</text>
<text x="480" y="205">198.51.100.0/30</text>
<text x="700" y="225">203.0.113.0/24</text>
<text x="240" y="150">E0/0</text><text x="240" y="300">E0/1</text><text x="420" y="240">E0/3</text>
</g>
<rect x="180" y="255" width="150" height="26" rx="5" fill="#e9f8ef" stroke="#39c86a"/>
<text x="255" y="273" font-size="12" text-anchor="middle" fill="#222">ACL 1 out (Standard)</text>
<rect x="405" y="250" width="160" height="26" rx="5" fill="#eaf3ff" stroke="#4a9cff"/>
<text x="485" y="268" font-size="12" text-anchor="middle" fill="#222">TRAFFIC-FILTER in</text>
<rect x="300" y="140" width="130" height="26" rx="5" fill="#f6f0ff" stroke="#b08aff"/>
<text x="365" y="158" font-size="12" text-anchor="middle" fill="#222">vty: access-class</text>
<g font-size="13" fill="#222">
<rect x="20" y="360" width="760" height="78" rx="8" fill="#fafafa" stroke="#999"/>
<text x="34" y="382">Grün: Standard-ACL 1 (deny host 10.10.1.10, permit any) out an E0/1 – nahe am Ziel, sperrt PC1 nur Richtung SRV1.</text>
<text x="34" y="404">Blau: Extended TRAFFIC-FILTER in an E0/3 – Verkehr aus dem Internet so früh wie möglich filtern.</text>
<text x="34" y="426">Lila: VTY-ACCESS (permit host PC1, deny any log) mit access-class in – gilt für alle Interfaces.</text>
</g>
</svg>
