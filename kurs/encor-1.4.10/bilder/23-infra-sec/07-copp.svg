<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>CoPP: Policy auf der virtuellen Control-Plane-Schnittstelle</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="400" y="30" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Control Plane Policing (CoPP)</text>
<rect x="250" y="50" width="300" height="70" rx="10" fill="#f6f0ff" stroke="#b08aff" stroke-width="2"/>
<text x="400" y="80" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">Route Processor</text>
<text x="400" y="102" font-size="12" text-anchor="middle" fill="#222">Routing · Management · Slow Path</text>
<rect x="300" y="150" width="200" height="40" rx="8" fill="#fff8d9" stroke="#ffd23f" stroke-width="2"/>
<text x="400" y="168" font-size="13" text-anchor="middle" fill="#222">control-plane</text>
<text x="400" y="184" font-size="12" text-anchor="middle" fill="#222">service-policy input …</text>
<line x1="400" y1="150" x2="400" y2="123" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="40" y="230" width="140" height="40" rx="6" fill="#f4f4f4" stroke="#222"/><text x="110" y="255">Gi0/0</text>
<rect x="330" y="230" width="140" height="40" rx="6" fill="#f4f4f4" stroke="#222"/><text x="400" y="255">Gi0/1</text>
<rect x="620" y="230" width="140" height="40" rx="6" fill="#f4f4f4" stroke="#222"/><text x="690" y="255">Gi0/2</text>
</g>
<line x1="110" y1="230" x2="330" y2="192" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<line x1="400" y1="230" x2="400" y2="194" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<line x1="690" y1="230" x2="470" y2="192" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<text x="560" y="215" font-size="12" fill="#222">nur Verkehr zur CPU</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="30" y="300" width="170" height="60" rx="8" fill="#eaf3ff" stroke="#4a9cff"/><text x="115" y="325">1. ACL</text><text x="115" y="345">permit = gehört dazu</text>
<rect x="220" y="300" width="170" height="60" rx="8" fill="#eaf3ff" stroke="#4a9cff"/><text x="305" y="325">2. class-map</text><text x="305" y="345">match access-group</text>
<rect x="410" y="300" width="170" height="60" rx="8" fill="#eaf3ff" stroke="#4a9cff"/><text x="495" y="325">3. policy-map</text><text x="495" y="345">police … drop</text>
<rect x="600" y="300" width="170" height="60" rx="8" fill="#eaf3ff" stroke="#4a9cff"/><text x="685" y="325">4. service-policy</text><text x="685" y="345">input auf control-plane</text>
</g>
<line x1="200" y1="330" x2="218" y2="330" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="390" y1="330" x2="408" y2="330" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="580" y1="330" x2="598" y2="330" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<g font-size="13" fill="#222">
<text x="30" y="392">Interface-ACL: auf jedem Interface nötig, prüft alle Pakete (alle Planes).</text>
<text x="30" y="414">CoPP: einmal konfiguriert, gilt geräteweit, erlaubt Ratenbegrenzung (bps oder pps).</text>
<text x="30" y="436">Prüfen: show policy-map control-plane (conformed / exceeded je Klasse).</text>
</g>
</svg>
