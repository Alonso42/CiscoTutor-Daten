<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Inbound- vs. Outbound-ACL relativ zum Routing-Lookup</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="400" y="34" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">Wo prüft der Router die ACL?</text>
<g font-size="14" fill="#222" text-anchor="middle">
<rect x="20" y="110" width="110" height="50" rx="6" fill="#f4f4f4" stroke="#222"/><text x="75" y="140">Paket kommt an</text>
<rect x="160" y="110" width="120" height="50" rx="6" fill="#e9f8ef" stroke="#39c86a" stroke-width="2"/><text x="220" y="132">Inbound-ACL</text><text x="220" y="150">(ip access-group in)</text>
<rect x="310" y="110" width="150" height="50" rx="6" fill="#fff8d9" stroke="#ffd23f" stroke-width="2"/><text x="385" y="132">Routing-Lookup</text><text x="385" y="150">Ausgangsinterface</text>
<rect x="490" y="110" width="130" height="50" rx="6" fill="#eaf3ff" stroke="#4a9cff" stroke-width="2"/><text x="555" y="132">Outbound-ACL</text><text x="555" y="150">(ip access-group out)</text>
<rect x="650" y="110" width="130" height="50" rx="6" fill="#f4f4f4" stroke="#222"/><text x="715" y="140">Weiterleiten</text>
</g>
<line x1="130" y1="135" x2="158" y2="135" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="280" y1="135" x2="308" y2="135" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="460" y1="135" x2="488" y2="135" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="620" y1="135" x2="648" y2="135" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="220" y1="160" x2="220" y2="218" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<line x1="385" y1="160" x2="385" y2="218" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<line x1="555" y1="160" x2="555" y2="218" stroke="#ff6b6b" stroke-width="2" marker-end="url(#p)"/>
<rect x="160" y="220" width="460" height="46" rx="6" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/>
<text x="390" y="240" font-size="14" text-anchor="middle" fill="#222">deny / kein Treffer / keine Route → verwerfen</text>
<text x="390" y="258" font-size="13" text-anchor="middle" fill="#222">Absender erhält ICMP unreachable (Ping zeigt „U“)</text>
<g font-size="14" fill="#222">
<rect x="40" y="300" width="350" height="125" rx="8" fill="#e9f8ef" stroke="#39c86a"/>
<text x="56" y="326" font-weight="bold">Inbound</text>
<text x="56" y="350">• vor dem Routing geprüft</text>
<text x="56" y="372">• spart Lookup bei verworfenen Paketen</text>
<text x="56" y="394">• Standard-ACL in am LAN sperrt auch</text>
<text x="56" y="414">  Verkehr zum Router selbst</text>
<rect x="410" y="300" width="350" height="125" rx="8" fill="#eaf3ff" stroke="#4a9cff"/>
<text x="426" y="326" font-weight="bold">Outbound</text>
<text x="426" y="350">• erst nach dem Routing geprüft</text>
<text x="426" y="372">• filtert nur Transitverkehr,</text>
<text x="426" y="394">  nicht vom Router erzeugte Pakete</text>
<text x="426" y="414">• 1 ACL pro Protokoll/Richtung/Interface</text>
</g>
</svg>
