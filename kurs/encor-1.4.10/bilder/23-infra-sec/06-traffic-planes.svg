<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Traffic Planes: Fast Path für Transit, Punt zum Route Processor</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="400" y="30" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Was landet auf der CPU?</text>
<rect x="250" y="50" width="300" height="110" rx="10" fill="#f6f0ff" stroke="#b08aff" stroke-width="2"/>
<text x="400" y="76" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Route Processor (CPU)</text>
<text x="400" y="100" font-size="13" text-anchor="middle" fill="#222">OSPF, BGP, ARP · SSH, SNMP, NTP</text>
<text x="400" y="122" font-size="13" text-anchor="middle" fill="#222">wenige Pakete/s verkraftbar</text>
<text x="400" y="144" font-size="13" text-anchor="middle" fill="#222">„slow path“</text>
<rect x="60" y="230" width="680" height="60" rx="10" fill="#e9f8ef" stroke="#39c86a" stroke-width="2"/>
<text x="400" y="257" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Fast Path (CEF / Hardware)</text>
<text x="400" y="278" font-size="13" text-anchor="middle" fill="#222">Transit-Pakete: Data Plane und viele Services-Plane-Pakete</text>
<line x1="20" y1="260" x2="58" y2="260" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="740" y1="260" x2="790" y2="260" stroke="#222" stroke-width="2" marker-end="url(#p)"/>
<line x1="330" y1="230" x2="330" y2="163" stroke="#ff6b6b" stroke-width="3" marker-end="url(#p)"/>
<text x="210" y="200" font-size="14" fill="#222" font-weight="bold">Punt</text>
<text x="210" y="218" font-size="12" fill="#222">Receive-Pakete</text>
<line x1="470" y1="230" x2="470" y2="163" stroke="#ff6b6b" stroke-width="3" marker-end="url(#p)"/>
<text x="485" y="200" font-size="12" fill="#222">Exception-IP / Non-IP</text>
<g font-size="13" fill="#222">
<rect x="20" y="310" width="180" height="120" rx="8" fill="#e9f8ef" stroke="#39c86a"/>
<text x="30" y="332" font-weight="bold">Data Plane</text><text x="30" y="354">Benutzerverkehr</text><text x="30" y="374">Ziel: transit</text>
<rect x="210" y="310" width="180" height="120" rx="8" fill="#eaf3ff" stroke="#4a9cff"/>
<text x="220" y="332" font-weight="bold">Control Plane</text><text x="220" y="354">ARP, OSPF, BGP</text><text x="220" y="374">Ziel: receive</text>
<rect x="400" y="310" width="180" height="120" rx="8" fill="#fff8d9" stroke="#ffd23f"/>
<text x="410" y="332" font-weight="bold">Management Plane</text><text x="410" y="354">SSH, Telnet, SNMP,</text><text x="410" y="374">TFTP, FTP, NTP</text><text x="410" y="394">Ziel: receive</text>
<rect x="590" y="310" width="190" height="120" rx="8" fill="#ffecec" stroke="#ff6b6b"/>
<text x="600" y="332" font-weight="bold">Services Plane</text><text x="600" y="354">GRE, MPLS-VPN, IPsec,</text><text x="600" y="374">QoS („high-touch“)</text><text x="600" y="394">transit oder receive</text>
<text x="600" y="416" font-size="11">Exception: TTL=0, IP-Options</text>
</g>
</svg>
