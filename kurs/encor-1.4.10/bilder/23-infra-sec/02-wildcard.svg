<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Wildcard-Masken: 0 = prüfen, 1 = egal</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" font-size="22" text-anchor="middle" fill="#222" font-weight="bold">Wildcard-Maske: 0-Bit = muss passen, 1-Bit = egal</text>
<g font-family="monospace" font-size="15" fill="#222">
<text x="40" y="80">Adresse  172.16.32.0  = 10101100.00010000.00100000.00000000</text>
<text x="40" y="104">Wildcard 0.0.31.255   = 00000000.00000000.00011111.11111111</text>
</g>
<rect x="372" y="88" width="368" height="22" fill="none" stroke="#ff6b6b" stroke-width="2"/>
<text x="40" y="136" font-size="14" fill="#222">→ die ersten 19 Bits müssen passen: Treffer 172.16.32.0 – 172.16.63.255 (= /19)</text>
<text x="40" y="176" font-size="16" fill="#222" font-weight="bold">Faustregel für Präfixe: Wildcard = 255.255.255.255 − Subnetzmaske</text>
<g font-size="14" fill="#222">
<rect x="40" y="192" width="720" height="30" fill="#eaf3ff"/>
<text x="60" y="212">/24 → 0.0.0.255</text><text x="240" y="212">/27 → 0.0.0.31</text><text x="420" y="212">/30 → 0.0.0.3</text><text x="590" y="212">/20 → 0.0.15.255</text>
</g>
<g font-size="14" fill="#222">
<rect x="40" y="244" width="350" height="80" rx="8" fill="#e9f8ef" stroke="#39c86a"/>
<text x="56" y="270" font-weight="bold">Kurzformen</text>
<text x="56" y="292" font-family="monospace">host 10.1.1.1 = 10.1.1.1 0.0.0.0</text>
<text x="56" y="312" font-family="monospace">any = 0.0.0.0 255.255.255.255</text>
<rect x="410" y="244" width="350" height="80" rx="8" fill="#fff8d9" stroke="#ffd23f"/>
<text x="426" y="270" font-weight="bold">Bereich zusammenfassen</text>
<text x="426" y="292">10.10.8.0 – 10.10.11.255 (4 × /24)</text>
<text x="426" y="312" font-family="monospace">→ 10.10.8.0 0.0.3.255</text>
<rect x="40" y="340" width="720" height="86" rx="8" fill="#ffecec" stroke="#ff6b6b"/>
<text x="56" y="366" font-weight="bold">Typischer Fehler: Subnetzmaske statt Wildcard</text>
<text x="56" y="390" font-family="monospace">access-list 1 permit 10.1.1.0 255.255.255.0</text>
<text x="56" y="412">→ prüft nur das letzte Oktett (= 0); erste drei Oktette egal – nicht das Netz 10.1.1.0/24!</text>
</g>
</svg>
