<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>WPA2 4-Way Handshake und Schlüsselhierarchie</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">4-Way Handshake (EAPOL-Key)</text>
<rect x="40" y="50" width="150" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="115" y="75" text-anchor="middle" font-size="14" fill="#222">Client (Supplicant)</text>
<rect x="410" y="50" width="150" height="40" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="485" y="75" text-anchor="middle" font-size="14" fill="#222">AP/WLC (Authent.)</text>
<line x1="115" y1="90" x2="115" y2="330" stroke="#222" stroke-dasharray="4,4"/>
<line x1="485" y1="90" x2="485" y2="330" stroke="#222" stroke-dasharray="4,4"/>
<g font-size="13" fill="#222">
<text x="20" y="112">PMK</text><text x="495" y="112">PMK</text>
<line x1="480" y1="135" x2="122" y2="135" stroke="#4a9cff" stroke-width="3"/><polygon points="124,130 115,135 124,140" fill="#4a9cff"/>
<text x="300" y="128" text-anchor="middle">1: ANonce</text>
<text x="20" y="168">PTK berechnen</text>
<line x1="120" y1="190" x2="478" y2="190" stroke="#39c86a" stroke-width="3"/><polygon points="476,185 485,190 476,195" fill="#39c86a"/>
<text x="300" y="183" text-anchor="middle">2: SNonce + MIC</text>
<text x="495" y="215">PTK berechnen, MIC prüfen</text>
<line x1="480" y1="245" x2="122" y2="245" stroke="#4a9cff" stroke-width="3"/><polygon points="124,240 115,245 124,250" fill="#4a9cff"/>
<text x="300" y="238" text-anchor="middle">3: ANonce + MIC + GTK (mit KEK verschl.)</text>
<text x="20" y="272">PTK + GTK install.</text>
<line x1="120" y1="300" x2="478" y2="300" stroke="#39c86a" stroke-width="3"/><polygon points="476,295 485,300 476,305" fill="#39c86a"/>
<text x="300" y="293" text-anchor="middle">4: Bestätigung + MIC</text>
<text x="495" y="325">PTK installieren → Port offen</text>
</g>
<rect x="590" y="50" width="195" height="380" rx="8" fill="none" stroke="#b08aff" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="600" y="72" font-weight="bold" font-size="14">Schlüssel</text>
<rect x="600" y="82" width="175" height="50" rx="5" fill="#ffd23f"/>
<text x="608" y="100">PMK (256 bit)</text><text x="608" y="116">PSK: PBKDF2(Pass, SSID)</text><text x="608" y="129">802.1X: aus MSK</text>
<text x="687" y="150" text-anchor="middle">↓ PRF(PMK, ANonce,</text><text x="687" y="164" text-anchor="middle">SNonce, MAC AP, MAC STA)</text>
<rect x="600" y="172" width="175" height="80" rx="5" fill="#4a9cff" opacity="0.5"/>
<text x="608" y="190" font-weight="bold">PTK (pro Client)</text>
<text x="608" y="206">KCK – MIC</text><text x="608" y="222">KEK – GTK verschlüsseln</text><text x="608" y="238">TK – Unicast-Daten</text>
<rect x="600" y="262" width="175" height="54" rx="5" fill="#39c86a" opacity="0.5"/>
<text x="608" y="280" font-weight="bold">GTK (für alle)</text><text x="608" y="296">Broadcast/Multicast</text><text x="608" y="310">Update: Group Key HS</text>
<text x="600" y="345">PSK/PMK geht nie über Funk.</text>
<text x="600" y="365">Falscher PSK → MIC in</text><text x="600" y="380">Nachricht 2 ungültig.</text>
<text x="600" y="405">WPA3: PMF, zusätzlich IGTK</text>
</g>
<text x="40" y="380" font-size="13" fill="#222">Vorher: Open Authentication + Association;</text>
<text x="40" y="398" font-size="13" fill="#222">bei Enterprise zusätzlich EAP und Access-Accept mit PMK.</text>
<text x="40" y="422" font-size="13" fill="#222">WPA2-PSK: mitgeschnittener Handshake erlaubt Offline-Wörterbuchangriff.</text>
</svg>
