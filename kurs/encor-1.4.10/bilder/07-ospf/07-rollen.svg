<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>OSPF-Router-Rollen im Multiarea-Design</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Router-Rollen: Backbone, intern, ABR, ASBR</text>
<rect x="200" y="50" width="400" height="140" rx="14" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="400" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Area 0</text>
<rect x="30" y="230" width="300" height="150" rx="14" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="60" y="370" font-size="14" font-weight="bold" fill="#222">Area 1</text>
<rect x="470" y="230" width="300" height="150" rx="14" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="720" y="370" font-size="14" font-weight="bold" fill="#222">Area 2</text>
<ellipse cx="730" cy="110" rx="55" ry="32" fill="#f7f7f7" stroke="#222"/>
<text x="730" y="106" text-anchor="middle" font-size="12" fill="#222">Internet /</text>
<text x="730" y="122" text-anchor="middle" font-size="12" fill="#222">EIGRP</text>
<g stroke="#222" stroke-width="2.5">
<line x1="330" y1="120" x2="470" y2="120"/>
<line x1="330" y1="120" x2="260" y2="215"/>
<line x1="470" y1="120" x2="540" y2="215"/>
<line x1="260" y1="215" x2="140" y2="300"/>
<line x1="540" y1="215" x2="660" y2="300"/>
<line x1="470" y1="120" x2="580" y2="120"/>
<line x1="580" y1="120" x2="675" y2="110"/>
</g>
<circle cx="330" cy="120" r="24" fill="#39c86a"/><text x="330" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">C1</text>
<circle cx="470" cy="120" r="24" fill="#39c86a"/><text x="470" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">C2</text>
<circle cx="580" cy="120" r="24" fill="#ffd23f"/><text x="580" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">GW</text>
<circle cx="260" cy="215" r="24" fill="#b08aff"/><text x="260" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">D1</text>
<circle cx="540" cy="215" r="24" fill="#b08aff"/><text x="540" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">D2</text>
<circle cx="140" cy="300" r="24" fill="#4a9cff"/><text x="140" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">A1</text>
<circle cx="660" cy="300" r="24" fill="#4a9cff"/><text x="660" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">A2</text>
<g font-size="11" fill="#222">
<text x="345" y="160">interne Backbone-Router</text>
<text x="565" y="160">ASBR</text>
<text x="165" y="235">ABR</text>
<text x="600" y="235">ABR</text>
<text x="75" y="340">interner Router</text>
<text x="620" y="340">interner Router</text>
</g>
<rect x="30" y="395" width="740" height="45" rx="8" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="42" y="414" font-size="12" fill="#222">A1 → A2: immer Area 1 → Area 0 → Area 2 (O IA). ABR: je Area eine LSDB, Summarization, muss an Area 0.</text>
<text x="42" y="432" font-size="12" fill="#222">ASBR: redistribute oder default-information originate. Empfehlung: Router in max. 3 Areas, ABR ideal in 2.</text>
</svg>
