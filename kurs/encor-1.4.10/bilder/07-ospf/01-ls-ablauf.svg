<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>OSPF als Link-State-Protokoll: Ablauf und Hierarchie</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
</defs>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Link-State in fünf Schritten</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="20" y="60" width="135" height="80" rx="8" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="87" y="85" font-weight="bold">1 Hello</text>
<text x="87" y="104">Nachbarn finden</text>
<text x="87" y="122">224.0.0.5</text>
<rect x="175" y="60" width="135" height="80" rx="8" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="242" y="85" font-weight="bold">2 LSAs</text>
<text x="242" y="104">statt Routing-</text>
<text x="242" y="122">tabellen senden</text>
<rect x="330" y="60" width="135" height="80" rx="8" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="397" y="85" font-weight="bold">3 Flooding</text>
<text x="397" y="104">an alle Router</text>
<text x="397" y="122">der Area</text>
<rect x="485" y="60" width="135" height="80" rx="8" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="552" y="85" font-weight="bold">4 LSDB</text>
<text x="552" y="104">identisch auf</text>
<text x="552" y="122">allen Routern</text>
<rect x="640" y="60" width="140" height="80" rx="8" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="710" y="85" font-weight="bold">5 SPF (Dijkstra)</text>
<text x="710" y="104">eigener Baum</text>
<text x="710" y="122">→ Routingtabelle</text>
</g>
<g stroke="#222" stroke-width="2" marker-end="url(#a)">
<line x1="155" y1="100" x2="173" y2="100"/>
<line x1="310" y1="100" x2="328" y2="100"/>
<line x1="465" y1="100" x2="483" y2="100"/>
<line x1="620" y1="100" x2="638" y2="100"/>
</g>
<text x="400" y="168" text-anchor="middle" font-size="13" fill="#222">LSAs sofort bei Änderung · sonst Refresh alle 30 min · IP-Protokoll 89, eigene Bestätigung (LSAck)</text>
<!-- Hierarchie -->
<rect x="20" y="190" width="760" height="245" rx="12" fill="none" stroke="#222" stroke-dasharray="6 4"/>
<text x="35" y="212" font-size="14" font-weight="bold" fill="#222">Autonomous System (OSPF-Domain, gemeinsame Verwaltung)</text>
<ellipse cx="400" cy="275" rx="170" ry="45" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="400" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Area 0 (Backbone)</text>
<text x="400" y="290" text-anchor="middle" font-size="12" fill="#222">muss zusammenhängend sein</text>
<ellipse cx="160" cy="380" rx="120" ry="40" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="160" y="385" text-anchor="middle" font-size="14" fill="#222">Area 1</text>
<ellipse cx="400" cy="390" rx="110" ry="35" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="400" y="395" text-anchor="middle" font-size="14" fill="#222">Area 2</text>
<ellipse cx="640" cy="380" rx="120" ry="40" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="640" y="385" text-anchor="middle" font-size="14" fill="#222">Area 3</text>
<g stroke="#222" stroke-width="2">
<line x1="250" y1="355" x2="300" y2="305"/>
<line x1="400" y1="355" x2="400" y2="320"/>
<line x1="550" y1="355" x2="500" y2="305"/>
</g>
<line x1="250" y1="390" x2="290" y2="390" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="5 4"/>
<text x="270" y="425" text-anchor="middle" font-size="11" fill="#ff6b6b">keine direkte Kopplung</text>
<text x="690" y="250" font-size="12" fill="#222">jede Area hängt</text>
<text x="690" y="266" font-size="12" fill="#222">direkt an Area 0</text>
</svg>
