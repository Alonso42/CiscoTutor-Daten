<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Hello-Paket: Felder und Übereinstimmungspflicht</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Hello-Paket (an 224.0.0.5)</text>
<g font-size="13" fill="#222">
<rect x="40" y="55" width="300" height="34" fill="#f7f7f7" stroke="#222"/><text x="55" y="77">Router-ID</text>
<rect x="40" y="89" width="300" height="34" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/><text x="55" y="111">Hello-/Dead-Intervall  ★</text>
<rect x="40" y="123" width="300" height="34" fill="#f7f7f7" stroke="#222"/><text x="55" y="145">Neighbors (gesehene RIDs)</text>
<rect x="40" y="157" width="300" height="34" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/><text x="55" y="179">Area-ID  ★</text>
<rect x="40" y="191" width="300" height="34" fill="#f7f7f7" stroke="#222"/><text x="55" y="213">Router Priority (0–255)</text>
<rect x="40" y="225" width="300" height="34" fill="#f7f7f7" stroke="#222"/><text x="55" y="247">DR- und BDR-Adresse</text>
<rect x="40" y="259" width="300" height="34" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/><text x="55" y="281">Authentifizierung  ★</text>
<rect x="40" y="293" width="300" height="34" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/><text x="55" y="315">Stub-Area-Flag  ★</text>
<rect x="40" y="327" width="300" height="34" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/><text x="55" y="349">(Netzmaske, außer auf P2P)  ★</text>
</g>
<text x="40" y="385" font-size="12" fill="#ff6b6b">★ muss bei beiden Nachbarn gleich sein, sonst keine Nachbarschaft</text>
<text x="40" y="405" font-size="12" fill="#222">Bidirektional, sobald die eigene RID in „Neighbors“ steht (2-WAY).</text>
<text x="40" y="425" font-size="12" fill="#222">Defaults Broadcast/P2P: Hello 10 s, Dead 40 s (4 × Hello).</text>
<!-- MTU-Fall -->
<text x="590" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Sonderfall MTU</text>
<line x1="470" y1="140" x2="710" y2="140" stroke="#222" stroke-width="3"/>
<circle cx="450" cy="140" r="28" fill="#4a9cff"/><text x="450" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">R1</text>
<circle cx="730" cy="140" r="28" fill="#4a9cff"/><text x="730" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">R3</text>
<text x="450" y="190" text-anchor="middle" font-size="12" fill="#222">MTU 1500</text>
<text x="730" y="190" text-anchor="middle" font-size="12" fill="#222">MTU 1400</text>
<text x="590" y="125" text-anchor="middle" font-size="12" fill="#39c86a" font-weight="bold">Hellos: ok ✓</text>
<text x="590" y="165" text-anchor="middle" font-size="12" fill="#ff6b6b" font-weight="bold">DBD: scheitert ✗</text>
<rect x="400" y="215" width="380" height="120" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="412" y="238">MTU steht im DBD, nicht im Hello.</text>
<text x="412" y="258">Router mit kleinerer MTU loggt:</text>
<text x="412" y="278" font-family="monospace">Nbr 1.1.1.1 has larger interface MTU</text>
<text x="412" y="300">Kleinere Seite hängt in EXSTART,</text>
<text x="412" y="320">größere pendelt INIT ↔ EXCHANGE.</text>
</g>
<text x="590" y="365" text-anchor="middle" font-size="13" fill="#222">Fix: MTU angleichen</text>
<text x="590" y="385" text-anchor="middle" font-size="12" fill="#222">(Notlösung: ip ospf mtu-ignore)</text>
</svg>
