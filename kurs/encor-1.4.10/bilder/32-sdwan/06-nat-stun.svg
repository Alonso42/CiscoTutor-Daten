<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Private und public IP-Adressen bei NAT</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Private (pre-NAT) und Public (post-NAT) Adresse</text>
<rect x="300" y="50" width="200" height="55" rx="8" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/>
<text x="400" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SD-WAN Controller</text>
<text x="400" y="92" text-anchor="middle" font-size="11" fill="#222">Color: public</text>
<text x="520" y="70" font-size="12" fill="#222">private IP: 10.100.100.10</text>
<text x="520" y="90" font-size="12" fill="#222">public IP: 64.100.100.10</text>
<line x1="400" y1="105" x2="400" y2="150" stroke="#222" stroke-width="2"/>
<rect x="340" y="150" width="120" height="40" rx="4" fill="#ff6b6b" fill-opacity="0.25" stroke="#222"/>
<text x="400" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">NAT/Firewall</text>
<text x="475" y="175" font-size="11" fill="#222">10.100.100.10 → 64.100.100.10</text>
<ellipse cx="250" cy="260" rx="90" ry="32" fill="#ffd23f" fill-opacity="0.3" stroke="#222"/><text x="250" y="265" text-anchor="middle" font-size="13" fill="#222">MPLS</text>
<ellipse cx="550" cy="260" rx="90" ry="32" fill="#39c86a" fill-opacity="0.25" stroke="#222"/><text x="550" y="265" text-anchor="middle" font-size="13" fill="#222">Internet</text>
<line x1="380" y1="190" x2="280" y2="230" stroke="#222" stroke-width="2"/>
<line x1="420" y1="190" x2="520" y2="230" stroke="#222" stroke-width="2"/>
<circle cx="400" cy="350" r="28" fill="#39c86a" fill-opacity="0.3" stroke="#222"/><text x="400" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R</text>
<line x1="378" y1="335" x2="270" y2="290" stroke="#ffd23f" stroke-width="3"/>
<line x1="422" y1="335" x2="530" y2="290" stroke="#39c86a" stroke-width="3"/>
<text x="60" y="335" font-size="12" fill="#222">mpls (private Color)</text>
<text x="60" y="353" font-size="12" fill="#222">private = public = 10.20.10.5</text>
<text x="560" y="335" font-size="12" fill="#222">biz-internet (public Color)</text>
<text x="560" y="353" font-size="12" fill="#222">private = public = 64.10.10.5</text>
<rect x="40" y="395" width="720" height="45" rx="6" fill="#b08aff" fill-opacity="0.2" stroke="#222"/>
<text x="400" y="413" text-anchor="middle" font-size="12" fill="#222">Validator = STUN-Server: meldet jedem Gerät seine übersetzte Adresse. Ohne NAT: private = public.</text>
<text x="400" y="431" text-anchor="middle" font-size="12" fill="#222">Controller hat public Color → Edge erreicht ihn über beide Transporte unter 64.100.100.10.</text>
</svg>
