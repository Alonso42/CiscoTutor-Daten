<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Catalyst SD-WAN: vier Planes und ihre Komponenten</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Catalyst SD-WAN: Planes und Komponenten</text>
<!-- management -->
<rect x="40" y="50" width="220" height="80" rx="8" fill="#ffd23f" fill-opacity="0.35" stroke="#222"/>
<text x="150" y="72" text-anchor="middle" font-size="12" fill="#222">Management Plane</text>
<text x="150" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SD-WAN Manager</text>
<text x="150" y="112" text-anchor="middle" font-size="11" fill="#222">(vManage) GUI, Templates, API</text>
<!-- orchestration -->
<rect x="290" y="50" width="220" height="80" rx="8" fill="#b08aff" fill-opacity="0.3" stroke="#222"/>
<text x="400" y="72" text-anchor="middle" font-size="12" fill="#222">Orchestration Plane</text>
<text x="400" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SD-WAN Validator</text>
<text x="400" y="112" text-anchor="middle" font-size="11" fill="#222">(vBond) Auth, NAT-Traversal</text>
<!-- control -->
<rect x="540" y="50" width="220" height="80" rx="8" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/>
<text x="650" y="72" text-anchor="middle" font-size="12" fill="#222">Control Plane</text>
<text x="650" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SD-WAN Controller</text>
<text x="650" y="112" text-anchor="middle" font-size="11" fill="#222">(vSmart) OMP, Control Policy</text>
<!-- transport cloud -->
<ellipse cx="400" cy="250" rx="170" ry="45" fill="#ffffff" stroke="#222" stroke-dasharray="6,4"/>
<text x="400" y="245" text-anchor="middle" font-size="13" fill="#222">Underlay: MPLS, Internet, LTE/5G</text>
<text x="400" y="263" text-anchor="middle" font-size="11" fill="#222">(beliebiger Transport)</text>
<!-- control connections -->
<g stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5,4" fill="none">
<line x1="150" y1="130" x2="160" y2="345"/>
<line x1="650" y1="130" x2="160" y2="345"/>
<line x1="650" y1="130" x2="640" y2="345"/>
<line x1="150" y1="130" x2="640" y2="345"/>
<line x1="400" y1="130" x2="160" y2="345"/>
</g>
<text x="250" y="170" font-size="11" fill="#ff6b6b">DTLS/TLS-Control-Verbindungen</text>
<text x="470" y="170" font-size="11" fill="#ff6b6b">OMP läuft darin</text>
<!-- edges -->
<circle cx="160" cy="370" r="26" fill="#39c86a" fill-opacity="0.3" stroke="#222"/>
<text x="160" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R</text>
<circle cx="640" cy="370" r="26" fill="#39c86a" fill-opacity="0.3" stroke="#222"/>
<text x="640" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R</text>
<text x="160" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">WAN Edge (Branch)</text>
<text x="640" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">WAN Edge (DC/Cloud)</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#222">Data Plane: WAN Edges (vEdge/cEdge) – IPsec-Tunnel + BFD direkt zwischen den Sites</text>
<line x1="186" y1="370" x2="614" y2="370" stroke="#39c86a" stroke-width="5"/>
<text x="400" y="362" text-anchor="middle" font-size="11" fill="#222">IPsec-Tunnel (Daten, ohne IKE)</text>
<text x="400" y="395" text-anchor="middle" font-size="11" fill="#222">Controller leiten keinen Datenverkehr weiter</text>
</svg>
