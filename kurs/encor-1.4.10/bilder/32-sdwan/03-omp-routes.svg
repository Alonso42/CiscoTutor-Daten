<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>OMP als Route Reflector und die drei Routentypen</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">OMP: Controller reflektiert, Edges tunneln direkt</text>
<rect x="300" y="50" width="200" height="60" rx="8" fill="#4a9cff" fill-opacity="0.3" stroke="#222"/>
<text x="400" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SD-WAN Controller</text>
<text x="400" y="95" text-anchor="middle" font-size="11" fill="#222">wendet Control Policy an</text>
<circle cx="130" cy="230" r="28" fill="#39c86a" fill-opacity="0.3" stroke="#222"/><text x="130" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R</text>
<text x="130" y="280" text-anchor="middle" font-size="12" fill="#222">Edge A (Site 100)</text>
<circle cx="670" cy="230" r="28" fill="#39c86a" fill-opacity="0.3" stroke="#222"/><text x="670" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R</text>
<text x="670" y="280" text-anchor="middle" font-size="12" fill="#222">Edge B (Site 200)</text>
<g stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4"><line x1="150" y1="210" x2="320" y2="110"/><line x1="650" y1="210" x2="480" y2="110"/></g>
<text x="170" y="150" font-size="11" fill="#ff6b6b">OMP-Update</text>
<text x="560" y="150" font-size="11" fill="#ff6b6b">reflektiertes Update</text>
<line x1="160" y1="230" x2="640" y2="230" stroke="#39c86a" stroke-width="5"/>
<text x="400" y="222" text-anchor="middle" font-size="12" fill="#222">IPsec + BFD (Daten fließen nie über den Controller)</text>
<!-- table -->
<g font-size="12" fill="#222">
<rect x="30" y="305" width="740" height="30" fill="#4a9cff" fill-opacity="0.2" stroke="#222"/>
<text x="45" y="325" font-weight="bold">Routentyp</text><text x="215" y="325" font-weight="bold">Was wird annonciert?</text><text x="500" y="325" font-weight="bold">Wichtige Attribute</text>
<rect x="30" y="335" width="740" height="35" fill="#ffffff" stroke="#222"/>
<text x="45" y="357">OMP route (vRoute)</text><text x="215" y="357">LAN-Prefixe (connected, static, OSPF, BGP ...)</text><text x="500" y="357">TLOC (Next Hop), Site-ID, VPN, Tag</text>
<rect x="30" y="370" width="740" height="35" fill="#ffffff" stroke="#222"/>
<text x="45" y="392">TLOC route</text><text x="215" y="392">Transport-Endpunkte der Edge</text><text x="500" y="392">private/public IP, Color, Encryption Key</text>
<rect x="30" y="405" width="740" height="35" fill="#ffffff" stroke="#222"/>
<text x="45" y="427">Service route</text><text x="215" y="427">Dienste am Standort (Firewall, IPS)</text><text x="500" y="427">Originator System-IP, TLOC, VPN-Label</text>
</g>
</svg>
