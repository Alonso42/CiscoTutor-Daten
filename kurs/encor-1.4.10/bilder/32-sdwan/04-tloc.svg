<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>TLOC: System-IP, Color, Encapsulation</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">TLOC = (System-IP, Color, Encapsulation)</text>
<circle cx="400" cy="300" r="34" fill="#39c86a" fill-opacity="0.3" stroke="#222"/>
<text x="400" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">R</text>
<text x="400" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">WAN Edge, System-IP 1.1.1.1 (fest, Loopback "system" in VPN 0)</text>
<ellipse cx="170" cy="110" rx="120" ry="40" fill="#ffffff" stroke="#222"/><text x="170" y="115" text-anchor="middle" font-size="13" fill="#222">Metro Ethernet</text>
<ellipse cx="630" cy="110" rx="120" ry="40" fill="#ffffff" stroke="#222"/><text x="630" y="115" text-anchor="middle" font-size="13" fill="#222">Internet</text>
<line x1="375" y1="278" x2="200" y2="148" stroke="#b08aff" stroke-width="3"/>
<line x1="425" y1="278" x2="600" y2="148" stroke="#4a9cff" stroke-width="3"/>
<rect x="40" y="185" width="240" height="80" rx="8" fill="#b08aff" fill-opacity="0.2" stroke="#222"/>
<text x="160" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">TLOC 1</text>
<text x="160" y="226" text-anchor="middle" font-size="12" fill="#222">1.1.1.1 | metro-ethernet | ipsec</text>
<text x="160" y="246" text-anchor="middle" font-size="11" fill="#222">Interface-IP 184.168.0.69</text>
<rect x="520" y="185" width="240" height="80" rx="8" fill="#4a9cff" fill-opacity="0.2" stroke="#222"/>
<text x="640" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">TLOC 2</text>
<text x="640" y="226" text-anchor="middle" font-size="12" fill="#222">1.1.1.1 | biz-internet | ipsec</text>
<text x="640" y="246" text-anchor="middle" font-size="11" fill="#222">Interface-IP 75.1.1.1</text>
<rect x="60" y="385" width="680" height="50" rx="6" fill="#ffd23f" fill-opacity="0.3" stroke="#222"/>
<text x="400" y="405" text-anchor="middle" font-size="12" fill="#222">Warum System-IP statt Interface-IP? Interface-Adressen ändern sich (DHCP, Kartentausch).</text>
<text x="400" y="424" text-anchor="middle" font-size="12" fill="#222">Zusätzlich trägt jede TLOC-Route private (pre-NAT) und public (post-NAT) IP/Port.</text>
</svg>
