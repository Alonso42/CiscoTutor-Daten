<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>HSRP Object Tracking: Uplink-Ausfall senkt die Priorität</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#222">Object Tracking: Uplink-Ausfall senkt die Priorität</text>
<line x1="230" y1="126" x2="340" y2="88" stroke="#39c86a" stroke-width="5"/>
<line x1="380" y1="240" x2="240" y2="172" stroke="#39c86a" stroke-width="5"/>
<line x1="570" y1="126" x2="460" y2="88" stroke="#222" stroke-width="2"/>
<line x1="420" y1="240" x2="560" y2="172" stroke="#999999" stroke-width="2"/>
<line x1="400" y1="266" x2="400" y2="320" stroke="#39c86a" stroke-width="5"/>
<g stroke="#ff6b6b" stroke-width="4">
<line x1="505" y1="97" x2="525" y2="117"/>
<line x1="525" y1="97" x2="505" y2="117"/>
</g>
<ellipse cx="400" cy="75" rx="70" ry="25" fill="#4a9cff" stroke="#222" stroke-width="2"/>
<circle cx="230" cy="150" r="24" fill="#ffffff" stroke="#222" stroke-width="2"/>
<circle cx="570" cy="150" r="24" fill="#ffffff" stroke="#222" stroke-width="2"/>
<rect x="370" y="240" width="60" height="26" fill="#39c86a" stroke="#222" stroke-width="2"/>
<rect x="380" y="320" width="40" height="28" fill="#ffffff" stroke="#222" stroke-width="2"/>
<g font-size="14" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="400" y="75" fill="#ffffff" font-weight="bold">Core</text>
<text x="230" y="150" font-weight="bold">R1</text>
<text x="570" y="150" font-weight="bold">R2</text>
<text x="400" y="253" font-size="12">SW</text>
<text x="400" y="334" font-size="12">PC1</text>
</g>
<g font-size="13" fill="#222">
<text x="195" y="146" text-anchor="end" font-weight="bold">R1: Prio 100</text>
<text x="195" y="163" text-anchor="end">preempt → wird Active</text>
<text x="605" y="146" font-weight="bold">R2: Prio 110 → 90</text>
<text x="605" y="163">vorher Active</text>
<text x="534" y="108" fill="#ff6b6b" font-weight="bold">Et0/0 down</text>
</g>
<line x1="600" y1="45" x2="635" y2="45" stroke="#39c86a" stroke-width="5"/>
<text x="645" y="50" font-size="12" fill="#222">neuer Pfad über R1</text>
<rect x="20" y="365" width="360" height="72" fill="#fff9e0" stroke="#ffd23f" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="30" y="386">Rechnung: 110 − 20 = 90 &lt; 100 → R1 übernimmt</text>
<text x="30" y="404">Voraussetzung: preempt auf R1 (HSRP-Default aus)</text>
<text x="30" y="422">Default decrement 10: 110 − 10 = 100 (Gleichstand!)</text>
</g>
<rect x="440" y="290" width="345" height="145" fill="#f5f5f5" stroke="#222" stroke-width="1"/>
<g font-size="12" fill="#222" font-family="monospace">
<text x="450" y="312">R2(config)#</text>
<text x="450" y="331">track 1 interface Et0/0 line-protocol</text>
<text x="450" y="350">interface Ethernet0/1</text>
<text x="450" y="369"> standby 10 ip 192.168.10.1</text>
<text x="450" y="388"> standby 10 priority 110</text>
<text x="450" y="407"> standby 10 preempt</text>
<text x="450" y="426"> standby 10 track 1 decrement 20</text>
</g>
</svg>
