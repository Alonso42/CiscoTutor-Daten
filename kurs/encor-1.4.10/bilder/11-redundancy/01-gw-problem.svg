<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Ohne FHRP: Ein Default Gateway ist ein Single Point of Failure</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#222">Ohne FHRP: Der Host kennt nur ein Gateway</text>
<g stroke="#222" stroke-width="2">
<line x1="400" y1="94" x2="236" y2="154"/>
<line x1="400" y1="94" x2="564" y2="154"/>
<line x1="220" y1="194" x2="220" y2="275"/>
<line x1="580" y1="194" x2="580" y2="275"/>
<line x1="250" y1="290" x2="550" y2="290"/>
<line x1="220" y1="305" x2="220" y2="365"/>
<line x1="580" y1="305" x2="580" y2="365"/>
</g>
<g stroke="#ff6b6b" stroke-width="4">
<line x1="208" y1="223" x2="232" y2="247"/>
<line x1="232" y1="223" x2="208" y2="247"/>
</g>
<g fill="#ffffff" stroke="#222" stroke-width="2">
<circle cx="400" cy="70" r="24" fill="#4a9cff"/>
<circle cx="220" cy="170" r="24"/>
<circle cx="580" cy="170" r="24"/>
<rect x="190" y="275" width="60" height="30" fill="#39c86a"/>
<rect x="550" y="275" width="60" height="30" fill="#39c86a"/>
<rect x="200" y="365" width="40" height="30"/>
<rect x="560" y="365" width="40" height="30"/>
</g>
<g font-size="14" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="400" y="70" fill="#ffffff" font-weight="bold">Core</text>
<text x="220" y="170" font-weight="bold">A</text>
<text x="580" y="170" font-weight="bold">B</text>
<text x="220" y="290">SW</text>
<text x="580" y="290">SW</text>
<text x="220" y="380" font-size="12">PC1</text>
<text x="580" y="380" font-size="12">PC2</text>
</g>
<g font-size="13" fill="#222">
<text x="185" y="166" text-anchor="end" font-weight="bold">Router A</text>
<text x="185" y="183" text-anchor="end">10.1.10.1</text>
<text x="615" y="166" font-weight="bold">Router B</text>
<text x="615" y="183">10.1.10.2</text>
<text x="250" y="378">10.1.10.23</text>
<text x="250" y="395">GW = 10.1.10.1</text>
<text x="610" y="378">10.1.10.34</text>
<text x="610" y="395">GW = 10.1.10.1</text>
<text x="244" y="240" fill="#ff6b6b" font-weight="bold">Ausfall</text>
</g>
<rect x="20" y="215" width="160" height="48" fill="#fff4f4" stroke="#ff6b6b" stroke-width="2"/>
<text x="100" y="235" font-size="12" fill="#222" text-anchor="middle">Ein Gateway =</text>
<text x="100" y="252" font-size="12" fill="#222" text-anchor="middle">Single Point of Failure</text>
<rect x="625" y="215" width="160" height="48" fill="#f3f0ff" stroke="#b08aff" stroke-width="2"/>
<text x="705" y="235" font-size="12" fill="#222" text-anchor="middle">Router B wäre da,</text>
<text x="705" y="252" font-size="12" fill="#222" text-anchor="middle">wird aber nicht genutzt</text>
<text x="400" y="430" font-size="13" fill="#222" text-anchor="middle">Das IGP zwischen den Routern konvergiert – die Hosts senden trotzdem weiter an 10.1.10.1.</text>
</svg>
