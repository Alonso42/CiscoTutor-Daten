<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>VRRP Master Down Interval und Skew Time je Priorität</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">VRRP: Wann erklärt ein Backup den Master für tot?</text>
<text x="400" y="56" font-size="14" fill="#222" text-anchor="middle">Master Down Interval = 3 × Advertisement Interval + Skew Time</text>
<text x="400" y="78" font-size="14" fill="#222" text-anchor="middle">Skew Time = (256 − Priorität) / 256 s   (VRRPv2, Intervall 1 s)</text>
<g fill="#dddddd">
<rect x="170" y="100" width="360" height="24"/>
<rect x="170" y="140" width="360" height="24"/>
<rect x="170" y="180" width="360" height="24"/>
<rect x="170" y="220" width="360" height="24"/>
<rect x="170" y="260" width="360" height="24"/>
</g>
<rect x="530" y="100" width="1" height="24" fill="#39c86a"/>
<rect x="530" y="140" width="26" height="24" fill="#4a9cff"/>
<rect x="530" y="180" width="68" height="24" fill="#ffd23f"/>
<rect x="530" y="220" width="73" height="24" fill="#ffd23f"/>
<rect x="530" y="260" width="120" height="24" fill="#ff6b6b"/>
<g font-size="13" fill="#222" text-anchor="end">
<text x="160" y="117">Prio 254</text>
<text x="160" y="157">Prio 200</text>
<text x="160" y="197">Prio 110</text>
<text x="160" y="237">Prio 100</text>
<text x="160" y="277">Prio 1</text>
</g>
<g font-size="13" fill="#222">
<text x="545" y="117">3,008 s</text>
<text x="566" y="157">3,219 s</text>
<text x="608" y="197">3,570 s</text>
<text x="613" y="237">3,609 s</text>
<text x="660" y="277">3,996 s</text>
</g>
<line x1="170" y1="296" x2="650" y2="296" stroke="#222" stroke-width="1"/>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="170" y="314">0 s</text>
<text x="290" y="314">1 s</text>
<text x="410" y="314">2 s</text>
<text x="530" y="314">3 s</text>
<text x="650" y="314">4 s</text>
</g>
<text x="350" y="117" font-size="12" fill="#222" text-anchor="middle">3 × 1 s (grau) + Skew (farbig)</text>
<g font-size="13" fill="#222">
<text x="20" y="352">Höhere Priorität → kürzere Wartezeit → dieser Backup übernimmt zuerst.</text>
<text x="20" y="376">Lab: Backup R1 (Prio 100) zeigt 3.609 sec, Master R2 (Prio 110) 3.570 sec.</text>
<text x="20" y="400">Priorität 255 = Owner (VIP = eigene IP), 0 = Master tritt sofort zurück.</text>
<text x="20" y="424">Nur der Master sendet: 224.0.0.18, IP-Protokoll 112, alle 1 s – Preempt ist Default an.</text>
</g>
</svg>
