<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>StackWise Virtual: zwei Chassis als ein logischer Switch</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Stacking: zwei Chassis, ein logischer Switch</text>
<g stroke="#222" stroke-width="2">
<line x1="120" y1="150" x2="200" y2="80"/>
<line x1="350" y1="150" x2="270" y2="80"/>
</g>
<g stroke="#39c86a" stroke-width="4">
<line x1="120" y1="190" x2="205" y2="320"/>
<line x1="350" y1="190" x2="265" y2="320"/>
</g>
<g stroke="#b08aff" stroke-width="4">
<line x1="180" y1="160" x2="290" y2="160"/>
<line x1="180" y1="172" x2="290" y2="172"/>
</g>
<line x1="180" y1="184" x2="290" y2="184" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
<ellipse cx="235" cy="300" rx="60" ry="10" fill="none" stroke="#222" stroke-width="2"/>
<ellipse cx="235" cy="60" rx="70" ry="24" fill="#4a9cff" stroke="#222" stroke-width="2"/>
<g stroke="#222" stroke-width="2">
<rect x="60" y="150" width="120" height="40" fill="#e3f7ea"/>
<rect x="290" y="150" width="120" height="40" fill="#e3f7ea"/>
<rect x="175" y="320" width="120" height="36" fill="#ffffff"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="235" y="60" fill="#ffffff" font-weight="bold" font-size="14">Core</text>
<text x="120" y="170" font-weight="bold">9500-1 Active</text>
<text x="350" y="170" font-weight="bold">9500-2 Standby</text>
<text x="235" y="338">Access-Switch</text>
</g>
<g font-size="12" fill="#222">
<text x="235" y="142" text-anchor="middle" font-weight="bold" fill="#b08aff">SVL</text>
<text x="235" y="206" text-anchor="middle" fill="#ff6b6b">DAD</text>
<text x="305" y="305" font-weight="bold">MEC</text>
<text x="235" y="385" text-anchor="middle">ein Port-Channel zu beiden Chassis</text>
<text x="235" y="405" text-anchor="middle">beide Links aktiv, kein STP-Block</text>
</g>
<line x1="470" y1="50" x2="470" y2="430" stroke="#dddddd" stroke-width="1"/>
<text x="490" y="62" font-size="14" font-weight="bold" fill="#222">StackWise Virtual (2 Chassis)</text>
<g font-size="12" fill="#222">
<text x="490" y="86">• genau 2 Switches, z. B. Catalyst 9500</text>
<text x="490" y="106">• gekoppelt über Ethernet-Ports (SVL)</text>
<text x="490" y="126">• eine Control Plane, Standby per SSO</text>
<text x="490" y="146">• ein SVI pro VLAN → kein FHRP nötig</text>
<text x="490" y="166">• Uplinks als MEC, STP blockiert nichts</text>
<text x="490" y="186">• DAD erkennt Split-Brain nach SVL-Ausfall</text>
</g>
<text x="490" y="232" font-size="14" font-weight="bold" fill="#222">StackWise-480 (Catalyst 9300)</text>
<g font-size="12" fill="#222">
<text x="490" y="256">• bis zu 8 Switches per Stack-Kabel</text>
<text x="490" y="276">• Active + Standby (SSO) + Member</text>
<text x="490" y="296">• alle Member leiten Daten weiter</text>
<text x="490" y="316">• neuer Switch mit höherer Priorität</text>
<text x="502" y="334">verdrängt den laufenden Active nicht</text>
</g>
<text x="490" y="425" font-size="11" fill="#222">Ergänzung – nicht im Kurs, aber ENCOR 1.1.b</text>
</svg>
