<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Abbildung IPv4-Multicast auf Ethernet-MAC</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">IP-Gruppe → MAC: 01:00:5E + 0-Bit + untere 23 Bit</text>
<text x="40" y="75" font-size="15" fill="#222">IP (32 Bit):</text>
<rect x="150" y="55" width="80" height="30" fill="#ddd" stroke="#222"/><text x="190" y="76" text-anchor="middle" font-size="13" fill="#222">1110</text>
<rect x="230" y="55" width="100" height="30" fill="#ff6b6b" opacity="0.5" stroke="#222"/><text x="280" y="76" text-anchor="middle" font-size="13" fill="#222">5 Bit</text>
<rect x="330" y="55" width="420" height="30" fill="#39c86a" opacity="0.5" stroke="#222"/><text x="540" y="76" text-anchor="middle" font-size="13" fill="#222">untere 23 Bit</text>
<text x="280" y="105" text-anchor="middle" font-size="12" fill="#ff6b6b">gehen verloren</text>
<text x="40" y="160" font-size="15" fill="#222">MAC (48 Bit):</text>
<rect x="150" y="140" width="160" height="30" fill="#4a9cff" opacity="0.4" stroke="#222"/><text x="230" y="161" text-anchor="middle" font-size="13" fill="#222">01:00:5E (24 Bit)</text>
<rect x="310" y="140" width="20" height="30" fill="#ffd23f" stroke="#222"/><text x="320" y="161" text-anchor="middle" font-size="13" fill="#222">0</text>
<rect x="330" y="140" width="420" height="30" fill="#39c86a" opacity="0.5" stroke="#222"/><text x="540" y="161" text-anchor="middle" font-size="13" fill="#222">untere 23 Bit der IP</text>
<line x1="540" y1="85" x2="540" y2="140" stroke="#39c86a" stroke-width="2"/>
<text x="400" y="215" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Rechenweg (Beispiel 239.130.5.10)</text>
<g font-size="14" fill="#222">
<text x="60" y="245">1. Zweites Oktett: 130 = 1000 0010 → oberstes Bit streichen → 000 0010 = 0x02</text>
<text x="60" y="270">2. Drittes und viertes Oktett unverändert: 5 = 0x05, 10 = 0x0A</text>
<text x="60" y="295">3. Ergebnis: 01:00:5E:02:05:0A</text>
</g>
<text x="400" y="340" text-anchor="middle" font-size="15" fill="#b08aff" font-weight="bold">5 verlorene Bit → 2^5 = 32 IP-Gruppen pro MAC-Adresse (32:1)</text>
<text x="400" y="365" text-anchor="middle" font-size="13" fill="#222">224.1.1.1, 225.1.1.1, 239.1.1.1, 224.129.1.1, 239.129.1.1 … → alle 01:00:5E:01:01:01</text>
<text x="400" y="390" text-anchor="middle" font-size="13" fill="#222">Folge: Ein Host-NIC nimmt evtl. fremde Gruppen an; die IP-Schicht verwirft sie.</text>
<text x="400" y="420" text-anchor="middle" font-size="13" fill="#4a9cff">Tipp: Nur das 2. Oktett muss umgerechnet werden (Wert mod 128).</text>
</svg>
