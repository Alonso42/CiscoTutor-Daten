<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>MSDP zwischen Domänen und Anycast-RP</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" fill="#222" font-weight="bold">MSDP: RPs tauschen aktive Quellen aus (Source-Active)</text>
<!-- interdomain -->
<ellipse cx="200" cy="140" rx="150" ry="80" fill="#4a9cff" opacity="0.12" stroke="#4a9cff"/>
<ellipse cx="600" cy="140" rx="150" ry="80" fill="#39c86a" opacity="0.12" stroke="#39c86a"/>
<text x="200" y="80" text-anchor="middle" font-size="13" fill="#222">PIM-SM-Domäne A (AS 65001)</text>
<text x="600" y="80" text-anchor="middle" font-size="13" fill="#222">PIM-SM-Domäne B (AS 65002)</text>
<rect x="80" y="135" width="60" height="28" fill="#fff" stroke="#222"/><text x="110" y="154" text-anchor="middle" font-size="12" fill="#222">Quelle</text>
<circle cx="280" cy="150" r="24" fill="#ffd23f" stroke="#222" stroke-width="2"/><text x="280" y="155" text-anchor="middle" font-size="12" fill="#222">RP-A</text>
<circle cx="520" cy="150" r="24" fill="#ffd23f" stroke="#222" stroke-width="2"/><text x="520" y="155" text-anchor="middle" font-size="12" fill="#222">RP-B</text>
<rect x="640" y="135" width="70" height="28" fill="#fff" stroke="#222"/><text x="675" y="154" text-anchor="middle" font-size="12" fill="#222">Empfänger</text>
<line x1="140" y1="149" x2="256" y2="150" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="198" y="140" text-anchor="middle" font-size="11" fill="#ff6b6b">Register</text>
<line x1="304" y1="150" x2="496" y2="150" stroke="#b08aff" stroke-width="4"/>
<text x="400" y="140" text-anchor="middle" font-size="12" fill="#b08aff">MSDP-Peering (TCP 639)</text>
<text x="400" y="172" text-anchor="middle" font-size="12" fill="#b08aff">SA (S,G, Originator-RP)</text>
<line x1="544" y1="150" x2="640" y2="149" stroke="#4a9cff" stroke-width="2"/>
<text x="592" y="140" text-anchor="middle" font-size="11" fill="#4a9cff">(*,G)</text>
<text x="400" y="205" text-anchor="middle" font-size="12" fill="#222">RP-B hat (*,G) mit nicht-leerer OIL → (S,G)-Join zur Quelle über den BGP/MBGP-Pfad</text>
<!-- anycast -->
<rect x="40" y="240" width="720" height="190" fill="#ffd23f" opacity="0.1" stroke="#ffd23f"/>
<text x="400" y="265" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Anycast-RP innerhalb einer Domäne</text>
<circle cx="200" cy="320" r="26" fill="#ffd23f" stroke="#222" stroke-width="2"/><text x="200" y="325" text-anchor="middle" font-size="12" fill="#222">RP1</text>
<circle cx="600" cy="320" r="26" fill="#ffd23f" stroke="#222" stroke-width="2"/><text x="600" y="325" text-anchor="middle" font-size="12" fill="#222">RP2</text>
<text x="200" y="365" text-anchor="middle" font-size="12" fill="#222">Lo1 10.255.255.1/32 (gleich)</text>
<text x="200" y="383" text-anchor="middle" font-size="12" fill="#222">Lo0 10.0.0.1 (eindeutig)</text>
<text x="600" y="365" text-anchor="middle" font-size="12" fill="#222">Lo1 10.255.255.1/32 (gleich)</text>
<text x="600" y="383" text-anchor="middle" font-size="12" fill="#222">Lo0 10.0.0.2 (eindeutig)</text>
<line x1="226" y1="320" x2="574" y2="320" stroke="#b08aff" stroke-width="4"/>
<text x="400" y="310" text-anchor="middle" font-size="12" fill="#b08aff">MSDP über Lo0 (connect-source, originator-id)</text>
<text x="400" y="412" text-anchor="middle" font-size="12" fill="#222">Router nutzen RP 10.255.255.1 → IGP wählt den nächsten RP; fällt einer aus, konvergiert das IGP zum anderen.</text>
</svg>
