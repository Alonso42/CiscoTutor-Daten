<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Cisco Enterprise Architecture: die vier Module</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Enterprise Architecture: vier Module</text>
<!-- Campus -->
<rect x="20" y="50" width="180" height="370" rx="8" fill="#39c86a" fill-opacity="0.2" stroke="#222"/>
<text x="110" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Enterprise Campus</text>
<rect x="40" y="88" width="140" height="28" rx="4" fill="#ffffff" stroke="#222"/><text x="110" y="107" text-anchor="middle" font-size="12" fill="#222">Access</text>
<rect x="40" y="128" width="140" height="28" rx="4" fill="#ffffff" stroke="#222"/><text x="110" y="147" text-anchor="middle" font-size="12" fill="#222">Distribution</text>
<rect x="40" y="168" width="140" height="28" rx="4" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="110" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Core</text>
<rect x="40" y="250" width="140" height="80" rx="4" fill="#ffffff" stroke="#222" stroke-dasharray="5,3"/>
<text x="110" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Data Center</text>
<text x="110" y="288" text-anchor="middle" font-size="11" fill="#222">App, File, Mail, DNS</text>
<text x="110" y="304" text-anchor="middle" font-size="11" fill="#222">Management</text>
<text x="110" y="320" text-anchor="middle" font-size="11" fill="#222">Spine-Leaf</text>
<line x1="110" y1="196" x2="110" y2="250" stroke="#222" stroke-width="2"/>
<text x="110" y="370" text-anchor="middle" font-size="11" fill="#222">Gebäude / Gelände</text>
<text x="110" y="386" text-anchor="middle" font-size="11" fill="#222">z. B. Universität</text>
<!-- Edge -->
<rect x="225" y="50" width="190" height="370" rx="8" fill="#4a9cff" fill-opacity="0.2" stroke="#222"/>
<text x="320" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Enterprise Edge</text>
<rect x="245" y="95" width="150" height="80" rx="4" fill="#ffffff" stroke="#222"/>
<text x="320" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Internet Edge</text>
<text x="320" y="133" text-anchor="middle" font-size="11" fill="#222">ein/mehrere ISPs</text>
<text x="320" y="149" text-anchor="middle" font-size="11" fill="#222">Remote-Access- und</text>
<text x="320" y="165" text-anchor="middle" font-size="11" fill="#222">Site-to-Site-VPN</text>
<rect x="245" y="230" width="150" height="80" rx="4" fill="#ffffff" stroke="#222"/>
<text x="320" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">WAN Edge</text>
<text x="320" y="268" text-anchor="middle" font-size="11" fill="#222">MPLS, Metro Ethernet,</text>
<text x="320" y="284" text-anchor="middle" font-size="11" fill="#222">SONET (eingekauft)</text>
<line x1="180" y1="182" x2="245" y2="135" stroke="#222" stroke-width="2"/>
<line x1="180" y1="182" x2="245" y2="270" stroke="#222" stroke-width="2"/>
<text x="320" y="370" text-anchor="middle" font-size="11" fill="#222">Anbindung an den Campus</text>
<text x="320" y="386" text-anchor="middle" font-size="11" fill="#222">über dessen Core</text>
<!-- SP Edge -->
<rect x="440" y="50" width="150" height="370" rx="8" fill="#b08aff" fill-opacity="0.2" stroke="#222"/>
<text x="515" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Service Provider</text>
<text x="515" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Edge</text>
<ellipse cx="515" cy="135" rx="55" ry="24" fill="#ffffff" stroke="#222"/><text x="515" y="140" text-anchor="middle" font-size="12" fill="#222">ISP</text>
<ellipse cx="515" cy="235" rx="55" ry="24" fill="#ffffff" stroke="#222"/><text x="515" y="240" text-anchor="middle" font-size="12" fill="#222">Metro Ethernet</text>
<ellipse cx="515" cy="300" rx="55" ry="24" fill="#ffffff" stroke="#222"/><text x="515" y="305" text-anchor="middle" font-size="12" fill="#222">MPLS</text>
<line x1="395" y1="135" x2="460" y2="135" stroke="#222" stroke-width="2"/>
<line x1="395" y1="260" x2="460" y2="240" stroke="#222" stroke-width="2"/>
<line x1="395" y1="280" x2="460" y2="300" stroke="#222" stroke-width="2"/>
<text x="515" y="370" text-anchor="middle" font-size="11" fill="#222">Funktionen bestimmt</text>
<text x="515" y="386" text-anchor="middle" font-size="11" fill="#222">durch Service-Verträge</text>
<!-- Remote -->
<rect x="615" y="50" width="165" height="370" rx="8" fill="#ffd23f" fill-opacity="0.25" stroke="#222"/>
<text x="697" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Remote Locations</text>
<rect x="635" y="115" width="125" height="40" rx="4" fill="#ffffff" stroke="#222"/><text x="697" y="140" text-anchor="middle" font-size="12" fill="#222">Teleworker</text>
<rect x="635" y="215" width="125" height="40" rx="4" fill="#ffffff" stroke="#222"/><text x="697" y="240" text-anchor="middle" font-size="12" fill="#222">Branch Office</text>
<rect x="635" y="280" width="125" height="40" rx="4" fill="#ffffff" stroke="#222"/><text x="697" y="298" text-anchor="middle" font-size="11" fill="#222">Branch / entferntes</text><text x="697" y="313" text-anchor="middle" font-size="11" fill="#222">Rechenzentrum</text>
<line x1="570" y1="135" x2="635" y2="135" stroke="#222" stroke-width="2"/>
<line x1="570" y1="235" x2="635" y2="235" stroke="#222" stroke-width="2"/>
<line x1="570" y1="300" x2="635" y2="300" stroke="#222" stroke-width="2"/>
<line x1="560" y1="145" x2="635" y2="225" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="697" y="370" text-anchor="middle" font-size="11" fill="#222">geografisch entfernte</text>
<text x="697" y="386" text-anchor="middle" font-size="11" fill="#222">Teile des Unternehmens</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#222">Fehler bleiben im Modul isoliert; Änderungen und Dienste (Security, QoS) werden modulweise umgesetzt.</text>
</svg>
