<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Campus-Schichten Access, Distribution, Core und Collapsed Core</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Campus-Schichten und ihre Rollen</text>
<!-- three tier -->
<text x="250" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Three-Tier</text>
<rect x="150" y="70" width="80" height="32" rx="4" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="190" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Core</text>
<rect x="270" y="70" width="80" height="32" rx="4" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="310" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Core</text>
<rect x="60" y="170" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="95" y="190" text-anchor="middle" font-size="11" fill="#222">Dist</text>
<rect x="150" y="170" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="185" y="190" text-anchor="middle" font-size="11" fill="#222">Dist</text>
<rect x="280" y="170" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="315" y="190" text-anchor="middle" font-size="11" fill="#222">Dist</text>
<rect x="370" y="170" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="405" y="190" text-anchor="middle" font-size="11" fill="#222">Dist</text>
<g stroke="#222" stroke-width="1.5">
<line x1="190" y1="102" x2="95" y2="170"/><line x1="190" y1="102" x2="185" y2="170"/><line x1="190" y1="102" x2="315" y2="170"/><line x1="190" y1="102" x2="405" y2="170"/>
<line x1="310" y1="102" x2="95" y2="170"/><line x1="310" y1="102" x2="185" y2="170"/><line x1="310" y1="102" x2="315" y2="170"/><line x1="310" y1="102" x2="405" y2="170"/>
<line x1="230" y1="86" x2="270" y2="86"/>
</g>
<g fill="#39c86a" fill-opacity="0.35" stroke="#222">
<rect x="50" y="260" width="50" height="26" rx="3"/><rect x="115" y="260" width="50" height="26" rx="3"/><rect x="180" y="260" width="50" height="26" rx="3"/>
<rect x="270" y="260" width="50" height="26" rx="3"/><rect x="335" y="260" width="50" height="26" rx="3"/><rect x="400" y="260" width="50" height="26" rx="3"/>
</g>
<g font-size="10" text-anchor="middle" fill="#222"><text x="75" y="277">Acc</text><text x="140" y="277">Acc</text><text x="205" y="277">Acc</text><text x="295" y="277">Acc</text><text x="360" y="277">Acc</text><text x="425" y="277">Acc</text></g>
<g stroke="#222" stroke-width="1.2">
<line x1="75" y1="260" x2="95" y2="200"/><line x1="75" y1="260" x2="185" y2="200"/><line x1="140" y1="260" x2="95" y2="200"/><line x1="140" y1="260" x2="185" y2="200"/><line x1="205" y1="260" x2="95" y2="200"/><line x1="205" y1="260" x2="185" y2="200"/>
<line x1="295" y1="260" x2="315" y2="200"/><line x1="295" y1="260" x2="405" y2="200"/><line x1="360" y1="260" x2="315" y2="200"/><line x1="360" y1="260" x2="405" y2="200"/><line x1="425" y1="260" x2="315" y2="200"/><line x1="425" y1="260" x2="405" y2="200"/>
</g>
<text x="140" y="305" text-anchor="middle" font-size="11" fill="#222">Building Block 1</text>
<text x="360" y="305" text-anchor="middle" font-size="11" fill="#222">Building Block 2</text>
<!-- role boxes -->
<rect x="480" y="62" width="300" height="70" rx="6" fill="#ffd23f" fill-opacity="0.25" stroke="#222"/>
<text x="490" y="80" font-size="13" font-weight="bold" fill="#222">Core (Backbone)</text>
<text x="490" y="97" font-size="11" fill="#222">schnell, always-on, schnelle Konvergenz</text>
<text x="490" y="113" font-size="11" fill="#222">keine Policies, keine Nutzer/Server direkt</text>
<text x="490" y="127" font-size="11" fill="#222">verbindet Blöcke, Data Center, Edge</text>
<rect x="480" y="145" width="300" height="86" rx="6" fill="#4a9cff" fill-opacity="0.2" stroke="#222"/>
<text x="490" y="163" font-size="13" font-weight="bold" fill="#222">Distribution</text>
<text x="490" y="180" font-size="11" fill="#222">Service-/Control-Grenze, L2/L3-Grenze</text>
<text x="490" y="196" font-size="11" fill="#222">Summarization, Redistribution, Filter, QoS</text>
<text x="490" y="212" font-size="11" fill="#222">terminiert Access-VLANs, FHRP</text>
<text x="490" y="226" font-size="11" fill="#222">ECMP zu beiden Core-Switches</text>
<rect x="480" y="244" width="300" height="70" rx="6" fill="#39c86a" fill-opacity="0.2" stroke="#222"/>
<text x="490" y="262" font-size="13" font-weight="bold" fill="#222">Access</text>
<text x="490" y="279" font-size="11" fill="#222">Endgeräte, IP-Telefone, APs (eine Ebene weiter)</text>
<text x="490" y="295" font-size="11" fill="#222">PoE, VLANs, Security – sehr funktionsreich</text>
<text x="490" y="309" font-size="11" fill="#222">Self-healing/-defending/-optimizing/-aware</text>
<!-- collapsed -->
<rect x="20" y="335" width="760" height="100" rx="8" fill="#b08aff" fill-opacity="0.15" stroke="#222" stroke-dasharray="6,4"/>
<text x="40" y="358" font-size="14" font-weight="bold" fill="#222">Collapsed Core (Two-Tier)</text>
<rect x="60" y="372" width="120" height="30" rx="4" fill="#ffd23f" fill-opacity="0.5" stroke="#222"/><text x="120" y="392" text-anchor="middle" font-size="11" fill="#222">Core + Dist</text>
<rect x="200" y="372" width="120" height="30" rx="4" fill="#ffd23f" fill-opacity="0.5" stroke="#222"/><text x="260" y="392" text-anchor="middle" font-size="11" fill="#222">Core + Dist</text>
<text x="350" y="380" font-size="12" fill="#222">Ein Gebäude oder benachbarte Gebäude mit genug Glasfaser.</text>
<text x="350" y="398" font-size="12" fill="#222">Schichten = Rollen, nicht Anzahl Geräte; große Netze auch</text>
<text x="350" y="416" font-size="12" fill="#222">vier oder mehr physische Stufen (erweiterter Core).</text>
</svg>
