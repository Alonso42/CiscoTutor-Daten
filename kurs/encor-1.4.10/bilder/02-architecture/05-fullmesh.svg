<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Vollvermaschung ohne Core vs. Design mit Core</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Warum ein eigener Core?</text>
<!-- full mesh 3 blocks -->
<text x="200" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Ohne Core: Full Mesh (3 Blöcke)</text>
<g fill="#4a9cff" fill-opacity="0.35" stroke="#222">
<rect x="60" y="90" width="50" height="26" rx="3"/><rect x="60" y="150" width="50" height="26" rx="3"/>
<rect x="290" y="90" width="50" height="26" rx="3"/><rect x="290" y="150" width="50" height="26" rx="3"/>
<rect x="150" y="250" width="50" height="26" rx="3"/><rect x="210" y="250" width="50" height="26" rx="3"/>
</g>
<g stroke="#222" stroke-width="2"><line x1="85" y1="116" x2="85" y2="150"/><line x1="315" y1="116" x2="315" y2="150"/><line x1="200" y1="263" x2="210" y2="263"/></g>
<g stroke="#ff6b6b" stroke-width="1.2">
<line x1="110" y1="103" x2="290" y2="103"/><line x1="110" y1="103" x2="290" y2="163"/><line x1="110" y1="163" x2="290" y2="103"/><line x1="110" y1="163" x2="290" y2="163"/>
<line x1="85" y1="176" x2="175" y2="250"/><line x1="85" y1="176" x2="235" y2="250"/><line x1="100" y1="116" x2="175" y2="250"/><line x1="100" y1="116" x2="235" y2="250"/>
<line x1="315" y1="176" x2="175" y2="250"/><line x1="315" y1="176" x2="235" y2="250"/><line x1="300" y1="116" x2="175" y2="250"/><line x1="300" y1="116" x2="235" y2="250"/>
</g>
<text x="200" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Links = B × (N − 2) = 3 × 4 = 12</text>
<text x="200" y="323" text-anchor="middle" font-size="11" fill="#222">B = Blöcke, N = alle Distribution-Switches (2 pro Block)</text>
<!-- table -->
<rect x="50" y="340" width="300" height="100" fill="#ffffff" stroke="#222"/>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="100" y="358" font-weight="bold">B</text><text x="200" y="358" font-weight="bold">N</text><text x="300" y="358" font-weight="bold">Links</text>
<text x="100" y="376">2</text><text x="200" y="376">4</text><text x="300" y="376">4</text>
<text x="100" y="392">3</text><text x="200" y="392">6</text><text x="300" y="392">12</text>
<text x="100" y="408">4</text><text x="200" y="408">8</text><text x="300" y="408">24</text>
<text x="100" y="424">5</text><text x="200" y="424">10</text><text x="300" y="424">40</text>
</g>
<line x1="50" y1="363" x2="350" y2="363" stroke="#222"/>
<line x1="400" y1="50" x2="400" y2="440" stroke="#222" stroke-dasharray="4,4"/>
<!-- with core -->
<text x="600" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Mit Core: Stern</text>
<rect x="520" y="85" width="60" height="30" rx="4" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="550" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Core</text>
<rect x="620" y="85" width="60" height="30" rx="4" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="650" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Core</text>
<g fill="#4a9cff" fill-opacity="0.35" stroke="#222">
<rect x="430" y="220" width="44" height="26" rx="3"/><rect x="480" y="220" width="44" height="26" rx="3"/>
<rect x="556" y="220" width="44" height="26" rx="3"/><rect x="606" y="220" width="44" height="26" rx="3"/>
<rect x="682" y="220" width="44" height="26" rx="3"/><rect x="732" y="220" width="44" height="26" rx="3"/>
</g>
<g stroke="#39c86a" stroke-width="1.5">
<line x1="550" y1="115" x2="452" y2="220"/><line x1="550" y1="115" x2="502" y2="220"/><line x1="550" y1="115" x2="578" y2="220"/><line x1="550" y1="115" x2="628" y2="220"/><line x1="550" y1="115" x2="704" y2="220"/><line x1="550" y1="115" x2="754" y2="220"/>
<line x1="650" y1="115" x2="452" y2="220"/><line x1="650" y1="115" x2="502" y2="220"/><line x1="650" y1="115" x2="578" y2="220"/><line x1="650" y1="115" x2="628" y2="220"/><line x1="650" y1="115" x2="704" y2="220"/><line x1="650" y1="115" x2="754" y2="220"/>
</g>
<text x="600" y="275" text-anchor="middle" font-size="12" fill="#222">neuer Block = nur Links zu den Core-Switches</text>
<text x="420" y="320" font-size="12" fill="#222">• Wachstum ohne Umbau bestehender Blöcke</text>
<text x="420" y="340" font-size="12" fill="#222">• weniger Routing-Nachbarn je Switch</text>
<text x="420" y="360" font-size="12" fill="#222">• weniger Risiko bei Moves/Adds/Changes</text>
<text x="420" y="380" font-size="12" fill="#222">• ab 3+ Distribution-Blöcken: L3-LAN-Core</text>
<text x="420" y="400" font-size="12" fill="#222">• Core oft umkonfiguriert? → zu wenig modular</text>
</svg>
