<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Drei Distribution-Modelle: Traditional, Simplified, SD-Access</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Distribution-Layer-Modelle</text>
<!-- Traditional -->
<rect x="15" y="45" width="250" height="390" rx="8" fill="#ffffff" stroke="#222"/>
<text x="140" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Traditional</text>
<rect x="45" y="85" width="70" height="28" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="80" y="104" text-anchor="middle" font-size="11" fill="#222">Dist A</text>
<rect x="165" y="85" width="70" height="28" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="200" y="104" text-anchor="middle" font-size="11" fill="#222">Dist B</text>
<line x1="115" y1="99" x2="165" y2="99" stroke="#222" stroke-width="2"/>
<text x="140" y="92" text-anchor="middle" font-size="9" fill="#222">L3</text>
<rect x="60" y="180" width="60" height="26" rx="3" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="90" y="197" text-anchor="middle" font-size="10" fill="#222">Acc 1</text>
<rect x="160" y="180" width="60" height="26" rx="3" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="190" y="197" text-anchor="middle" font-size="10" fill="#222">Acc 2</text>
<g stroke="#222" stroke-width="1.5"><line x1="90" y1="180" x2="80" y2="113"/><line x1="90" y1="180" x2="200" y2="113"/><line x1="190" y1="180" x2="80" y2="113"/><line x1="190" y1="180" x2="200" y2="113"/></g>
<text x="90" y="222" text-anchor="middle" font-size="10" fill="#222">VLAN 10</text>
<text x="190" y="222" text-anchor="middle" font-size="10" fill="#222">VLAN 20</text>
<text x="140" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#39c86a">loop-free: VLAN pro Switch</text>
<text x="25" y="275" font-size="11" fill="#222">• zwei eigenständige Switches</text>
<text x="25" y="293" font-size="11" fill="#222">• Gateway per HSRP / VRRP / GLBP</text>
<text x="25" y="311" font-size="11" fill="#222">• HSRP/VRRP: Host nutzt 1 Uplink</text>
<text x="25" y="329" font-size="11" fill="#222">• GLBP nur ohne Schleifen sinnvoll</text>
<text x="25" y="347" font-size="11" fill="#222">• Timer-Tuning kostet CPU</text>
<text x="25" y="372" font-size="11" font-weight="bold" fill="#ff6b6b">looped (VLAN über mehrere</text>
<text x="25" y="388" font-size="11" font-weight="bold" fill="#ff6b6b">Access-Switches): STP blockiert,</text>
<text x="25" y="404" font-size="11" font-weight="bold" fill="#ff6b6b">weniger Bandbreite, langsamer</text>
<!-- Simplified -->
<rect x="275" y="45" width="250" height="390" rx="8" fill="#ffffff" stroke="#222"/>
<text x="400" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Simplified</text>
<rect x="310" y="80" width="180" height="40" rx="8" fill="#b08aff" fill-opacity="0.2" stroke="#222" stroke-dasharray="5,3"/>
<rect x="320" y="86" width="70" height="28" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="355" y="105" text-anchor="middle" font-size="11" fill="#222">Dist A</text>
<rect x="410" y="86" width="70" height="28" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="445" y="105" text-anchor="middle" font-size="11" fill="#222">Dist B</text>
<text x="400" y="135" text-anchor="middle" font-size="10" fill="#222">ein logischer Switch</text>
<rect x="320" y="180" width="60" height="26" rx="3" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="350" y="197" text-anchor="middle" font-size="10" fill="#222">Acc 1</text>
<rect x="420" y="180" width="60" height="26" rx="3" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="450" y="197" text-anchor="middle" font-size="10" fill="#222">Acc 2</text>
<g stroke="#39c86a" stroke-width="3"><line x1="350" y1="180" x2="355" y2="120"/><line x1="350" y1="180" x2="445" y2="120"/><line x1="450" y1="180" x2="355" y2="120"/><line x1="450" y1="180" x2="445" y2="120"/></g>
<ellipse cx="350" cy="160" rx="22" ry="6" fill="none" stroke="#222"/>
<ellipse cx="450" cy="160" rx="22" ry="6" fill="none" stroke="#222"/>
<text x="400" y="222" text-anchor="middle" font-size="10" fill="#222">VLAN 10 auch auf beiden</text>
<text x="400" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#39c86a">MEC: alle Uplinks aktiv</text>
<text x="285" y="275" font-size="11" fill="#222">• Stack oder StackWise Virtual</text>
<text x="285" y="293" font-size="11" fill="#222">  (früher VSS); Einzel-Chassis</text>
<text x="285" y="311" font-size="11" fill="#222">  nur weniger bevorzugt</text>
<text x="285" y="329" font-size="11" fill="#222">• kein FHRP: ein logisches SVI</text>
<text x="285" y="347" font-size="11" fill="#222">• EtherChannel bis 8 Links,</text>
<text x="285" y="365" font-size="11" fill="#222">  Failover unter 1 Sekunde</text>
<text x="285" y="383" font-size="11" fill="#222">• Hub-and-Spoke, 1 DR pro VLAN</text>
<text x="285" y="401" font-size="11" fill="#222">• weniger Geräte zu verwalten</text>
<!-- SDA -->
<rect x="535" y="45" width="250" height="390" rx="8" fill="#ffffff" stroke="#222"/>
<text x="660" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SD-Access</text>
<rect x="560" y="85" width="200" height="34" rx="6" fill="#ffd23f" fill-opacity="0.45" stroke="#222"/>
<text x="660" y="107" text-anchor="middle" font-size="12" fill="#222">Overlay (virtuelle Netze)</text>
<rect x="560" y="150" width="200" height="34" rx="6" fill="#4a9cff" fill-opacity="0.25" stroke="#222"/>
<text x="660" y="172" text-anchor="middle" font-size="12" fill="#222">Underlay (Routed Access)</text>
<line x1="660" y1="119" x2="660" y2="150" stroke="#222" stroke-width="2" stroke-dasharray="4,3"/>
<text x="660" y="215" text-anchor="middle" font-size="11" fill="#222">L2-Grenzen des Routed Access</text>
<text x="660" y="231" text-anchor="middle" font-size="11" fill="#222">werden überwunden</text>
<text x="545" y="275" font-size="11" fill="#222">• Fabric automatisiert auf</text>
<text x="545" y="293" font-size="11" fill="#222">  bestehendem L3-Access</text>
<text x="545" y="311" font-size="11" fill="#222">• Segmentierung nach Identität</text>
<text x="545" y="329" font-size="11" fill="#222">  und Gruppe (TrustSec, SGT)</text>
<text x="545" y="347" font-size="11" fill="#222">• Anycast Gateway auf allen</text>
<text x="545" y="365" font-size="11" fill="#222">  Edges: kein FHRP, kein STP</text>
<text x="545" y="383" font-size="11" fill="#222">  im Underlay</text>
</svg>
