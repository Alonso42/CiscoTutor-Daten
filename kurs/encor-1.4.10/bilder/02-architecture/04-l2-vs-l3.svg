<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Layer-2-Access vs. Routed Access</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Layer-2-Access vs. Routed Access</text>
<!-- left -->
<text x="200" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Layer-2-Access (looped)</text>
<rect x="80" y="80" width="90" height="34" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="125" y="102" text-anchor="middle" font-size="12" fill="#222">Dist 1</text>
<rect x="230" y="80" width="90" height="34" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="275" y="102" text-anchor="middle" font-size="12" fill="#222">Dist 2</text>
<line x1="170" y1="97" x2="230" y2="97" stroke="#222" stroke-width="2"/>
<rect x="60" y="230" width="90" height="34" rx="4" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="105" y="252" text-anchor="middle" font-size="12" fill="#222">Access 1</text>
<rect x="250" y="230" width="90" height="34" rx="4" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="295" y="252" text-anchor="middle" font-size="12" fill="#222">Access 2</text>
<line x1="105" y1="230" x2="125" y2="114" stroke="#222" stroke-width="2"/>
<line x1="105" y1="230" x2="275" y2="114" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4"/>
<line x1="295" y1="230" x2="275" y2="114" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4"/>
<line x1="295" y1="230" x2="125" y2="114" stroke="#222" stroke-width="2"/>
<text x="125" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">STP Root (VLAN 10)</text>
<text x="215" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#ff6b6b">STP BLK</text>
<line x1="30" y1="140" x2="370" y2="140" stroke="#b08aff" stroke-width="2" stroke-dasharray="3,3"/>
<text x="372" y="137" text-anchor="end" font-size="11" fill="#222">L3</text>
<text x="372" y="156" text-anchor="end" font-size="11" fill="#222">L2</text>
<text x="200" y="295" text-anchor="middle" font-size="12" fill="#222">VLAN 10 auf Access 1 und Access 2</text>
<text x="40" y="330" font-size="12" fill="#222">• Gateway (SVI + FHRP) auf der Distribution</text>
<text x="40" y="350" font-size="12" fill="#222">• VLAN kann mehrere Access-Switches überspannen</text>
<text x="40" y="370" font-size="12" fill="#222">  (möglich, aber nicht empfohlen)</text>
<text x="40" y="390" font-size="12" fill="#222">• STP blockiert etwa die Hälfte der Uplinks</text>
<text x="40" y="410" font-size="12" fill="#222">• traditionell, günstiger</text>
<line x1="400" y1="50" x2="400" y2="430" stroke="#222" stroke-dasharray="4,4"/>
<!-- right -->
<text x="600" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Routed Access</text>
<rect x="480" y="80" width="90" height="34" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="525" y="102" text-anchor="middle" font-size="12" fill="#222">Dist 1</text>
<rect x="630" y="80" width="90" height="34" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="675" y="102" text-anchor="middle" font-size="12" fill="#222">Dist 2</text>
<line x1="570" y1="97" x2="630" y2="97" stroke="#222" stroke-width="2"/>
<rect x="460" y="230" width="90" height="34" rx="4" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="505" y="252" text-anchor="middle" font-size="12" fill="#222">Access 1</text>
<rect x="650" y="230" width="90" height="34" rx="4" fill="#39c86a" fill-opacity="0.35" stroke="#222"/><text x="695" y="252" text-anchor="middle" font-size="12" fill="#222">Access 2</text>
<g stroke="#39c86a" stroke-width="3">
<line x1="505" y1="230" x2="525" y2="114"/><line x1="505" y1="230" x2="675" y2="114"/>
<line x1="695" y1="230" x2="675" y2="114"/><line x1="695" y1="230" x2="525" y2="114"/>
</g>
<text x="600" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">ECMP – alle aktiv</text>
<line x1="430" y1="275" x2="770" y2="275" stroke="#b08aff" stroke-width="2" stroke-dasharray="3,3"/>
<text x="772" y="272" text-anchor="end" font-size="11" fill="#222">L3</text>
<text x="772" y="291" text-anchor="end" font-size="11" fill="#222">L2</text>
<text x="505" y="295" text-anchor="middle" font-size="12" fill="#222">VLAN 10</text>
<text x="695" y="295" text-anchor="middle" font-size="12" fill="#222">VLAN 20</text>
<text x="440" y="330" font-size="12" fill="#222">• Gateway auf dem Access-Switch, kein FHRP</text>
<text x="440" y="350" font-size="12" fill="#222">• geroutete Uplinks, kein STP-Blocking</text>
<text x="440" y="370" font-size="12" fill="#222">• jedes VLAN ist lokal (kein Spanning)</text>
<text x="440" y="390" font-size="12" fill="#222">• Verkehrstrennung (Gast/intern) planen:</text>
<text x="440" y="410" font-size="12" fill="#222">  VRF-Lite oder SD-Access</text>
</svg>
