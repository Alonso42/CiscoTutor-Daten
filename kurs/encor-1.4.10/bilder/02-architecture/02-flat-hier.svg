<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Flaches Netz vs. hierarchisches Netz</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Flaches vs. hierarchisches Netz</text>
<!-- flat -->
<text x="200" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Flat Network</text>
<rect x="30" y="75" width="340" height="300" rx="10" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-dasharray="6,4"/>
<text x="200" y="95" text-anchor="middle" font-size="12" fill="#222">eine Broadcast-Domäne, ein Subnetz</text>
<rect x="160" y="190" width="80" height="34" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="200" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SW</text>
<g fill="#ffffff" stroke="#222">
<rect x="50" y="120" width="40" height="24"/><rect x="50" y="200" width="40" height="24"/><rect x="50" y="280" width="40" height="24"/>
<rect x="310" y="120" width="40" height="24"/><rect x="310" y="200" width="40" height="24"/><rect x="310" y="280" width="40" height="24"/>
<rect x="130" y="320" width="40" height="24"/><rect x="230" y="320" width="40" height="24"/>
</g>
<g stroke="#222" stroke-width="1.5">
<line x1="90" y1="132" x2="160" y2="200"/><line x1="90" y1="212" x2="160" y2="207"/><line x1="90" y1="292" x2="160" y2="220"/>
<line x1="310" y1="132" x2="240" y2="200"/><line x1="310" y1="212" x2="240" y2="207"/><line x1="310" y1="292" x2="240" y2="220"/>
<line x1="150" y1="320" x2="185" y2="224"/><line x1="250" y1="320" x2="215" y2="224"/>
</g>
<text x="200" y="400" text-anchor="middle" font-size="12" fill="#222">Jeder Broadcast erreicht jeden Host und kostet</text>
<text x="200" y="416" text-anchor="middle" font-size="12" fill="#222">dort CPU-Zeit – bei Hunderten Hosts langsam.</text>
<!-- hierarchical -->
<text x="600" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Hierarchisches Netz</text>
<circle cx="600" cy="115" r="22" fill="#ffd23f" fill-opacity="0.6" stroke="#222"/><text x="600" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">L3</text>
<rect x="430" y="180" width="160" height="190" rx="10" fill="#39c86a" fill-opacity="0.15" stroke="#39c86a" stroke-dasharray="6,4"/>
<rect x="610" y="180" width="160" height="190" rx="10" fill="#b08aff" fill-opacity="0.15" stroke="#b08aff" stroke-dasharray="6,4"/>
<text x="510" y="198" text-anchor="middle" font-size="11" fill="#222">Subnetz A</text>
<text x="690" y="198" text-anchor="middle" font-size="11" fill="#222">Subnetz B</text>
<rect x="475" y="220" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="510" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">SW</text>
<rect x="655" y="220" width="70" height="30" rx="4" fill="#4a9cff" fill-opacity="0.35" stroke="#222"/><text x="690" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">SW</text>
<line x1="585" y1="132" x2="515" y2="220" stroke="#222" stroke-width="2"/>
<line x1="615" y1="132" x2="685" y2="220" stroke="#222" stroke-width="2"/>
<g fill="#ffffff" stroke="#222">
<rect x="445" y="300" width="36" height="22"/><rect x="492" y="300" width="36" height="22"/><rect x="539" y="300" width="36" height="22"/>
<rect x="625" y="300" width="36" height="22"/><rect x="672" y="300" width="36" height="22"/><rect x="719" y="300" width="36" height="22"/>
</g>
<g stroke="#222" stroke-width="1.5">
<line x1="463" y1="300" x2="500" y2="250"/><line x1="510" y1="300" x2="510" y2="250"/><line x1="557" y1="300" x2="520" y2="250"/>
<line x1="643" y1="300" x2="680" y2="250"/><line x1="690" y1="300" x2="690" y2="250"/><line x1="737" y1="300" x2="700" y2="250"/>
</g>
<text x="600" y="168" text-anchor="middle" font-size="11" fill="#ff6b6b" font-weight="bold">Broadcasts enden hier</text>
<text x="600" y="400" text-anchor="middle" font-size="12" fill="#222">Router oder L3-Switch segmentiert das Netz:</text>
<text x="600" y="416" text-anchor="middle" font-size="12" fill="#222">Erweiterung betrifft nur direkt verbundene Geräte.</text>
</svg>
