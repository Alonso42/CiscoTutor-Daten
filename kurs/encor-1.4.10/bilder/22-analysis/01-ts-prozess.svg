<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Troubleshooting-Prozess</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Strukturierter Troubleshooting-Prozess</text>
<rect x="30" y="185" width="130" height="75" rx="8" fill="#ffd23f"/>
<text x="95" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Define</text>
<text x="95" y="230" text-anchor="middle" font-size="12" fill="#222">Problem beschreiben,</text>
<text x="95" y="248" text-anchor="middle" font-size="12" fill="#222">reproduzieren</text>
<line x1="160" y1="220" x2="205" y2="220" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="210" y="60" width="380" height="330" rx="12" fill="#4a9cff" opacity="0.12" stroke="#4a9cff"/>
<text x="400" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a9cff">Diagnose (iterativ – hier fließt die meiste Zeit)</text>
<rect x="240" y="95" width="320" height="40" rx="6" fill="#ffffff" stroke="#4a9cff"/>
<text x="400" y="120" text-anchor="middle" font-size="14" fill="#222">1 Gather information (beobachten, testen)</text>
<rect x="240" y="150" width="320" height="40" rx="6" fill="#ffffff" stroke="#4a9cff"/>
<text x="400" y="175" text-anchor="middle" font-size="14" fill="#222">2 Analyze (gegen Baseline/Doku vergleichen)</text>
<rect x="240" y="205" width="320" height="40" rx="6" fill="#ffffff" stroke="#4a9cff"/>
<text x="400" y="230" text-anchor="middle" font-size="14" fill="#222">3 Eliminate potential causes</text>
<rect x="240" y="260" width="320" height="40" rx="6" fill="#ffffff" stroke="#4a9cff"/>
<text x="400" y="285" text-anchor="middle" font-size="14" fill="#222">4 Propose hypothesis (wahrscheinlichste)</text>
<rect x="240" y="315" width="320" height="40" rx="6" fill="#ffffff" stroke="#4a9cff"/>
<text x="400" y="340" text-anchor="middle" font-size="14" fill="#222">5 Test hypothesis</text>
<path d="M240,335 C200,335 200,115 236,115" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="196" y="300" font-size="12" fill="#ff6b6b" transform="rotate(-90 196 300)">widerlegt → mehr Infos</text>
<line x1="590" y1="335" x2="630" y2="335" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="635" y="300" width="145" height="70" rx="8" fill="#39c86a"/>
<text x="707" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Solve</text>
<text x="707" y="343" text-anchor="middle" font-size="12" fill="#222">Ursache beheben,</text>
<text x="707" y="359" text-anchor="middle" font-size="12" fill="#222">verifizieren, dokumentieren</text>
<rect x="620" y="110" width="165" height="120" rx="8" fill="#b08aff" opacity="0.2" stroke="#b08aff"/>
<text x="702" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Lösung vs. Workaround</text>
<text x="630" y="155" font-size="12" fill="#222">Lösung: beseitigt die</text>
<text x="630" y="171" font-size="12" fill="#222">Root Cause</text>
<text x="630" y="195" font-size="12" fill="#222">Workaround: lindert nur</text>
<text x="630" y="211" font-size="12" fill="#222">die Symptome</text>
<text x="400" y="420" text-anchor="middle" font-size="13" fill="#222">Nutzer meldet Symptome – der Troubleshooter sucht die Ursache. Strukturiert = übergebbar und fortsetzbar.</text>
</svg>
