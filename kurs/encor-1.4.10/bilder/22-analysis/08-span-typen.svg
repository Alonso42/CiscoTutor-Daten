<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>SPAN, RSPAN und ERSPAN</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ffd23f"/></marker></defs>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Verkehr spiegeln: Local SPAN, RSPAN, ERSPAN</text>
<text x="20" y="62" font-size="15" font-weight="bold" fill="#4a9cff">Local SPAN</text>
<rect x="60" y="75" width="50" height="30" fill="#ffffff" stroke="#222"/><text x="85" y="95" text-anchor="middle" font-size="11" fill="#222">PC</text>
<rect x="250" y="70" width="80" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="290" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SW</text>
<rect x="470" y="75" width="70" height="30" fill="#ffffff" stroke="#222"/><text x="505" y="95" text-anchor="middle" font-size="11" fill="#222">Sniffer</text>
<line x1="110" y1="90" x2="250" y2="90" stroke="#222"/><text x="180" y="84" text-anchor="middle" font-size="11" fill="#222">Source Gi0/1 (rx/tx/both)</text>
<line x1="330" y1="90" x2="465" y2="90" stroke="#ffd23f" stroke-width="3" marker-end="url(#o)"/><text x="400" y="84" text-anchor="middle" font-size="11" fill="#222">Destination Gi0/2</text>
<text x="570" y="85" font-size="12" fill="#222">gleicher Switch</text>
<text x="570" y="102" font-size="12" fill="#222">Zielport = kein normaler Port</text>
<text x="20" y="160" font-size="15" font-weight="bold" fill="#39c86a">RSPAN</text>
<rect x="40" y="175" width="50" height="30" fill="#ffffff" stroke="#222"/><text x="65" y="195" text-anchor="middle" font-size="11" fill="#222">PC</text>
<rect x="150" y="170" width="70" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="185" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SW1</text>
<rect x="320" y="170" width="70" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="355" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SW-T</text>
<rect x="490" y="170" width="70" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="525" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">SW2</text>
<rect x="610" y="175" width="70" height="30" fill="#ffffff" stroke="#222"/><text x="645" y="195" text-anchor="middle" font-size="11" fill="#222">Sniffer</text>
<line x1="90" y1="190" x2="150" y2="190" stroke="#222"/>
<line x1="220" y1="190" x2="320" y2="190" stroke="#39c86a" stroke-width="5"/><line x1="390" y1="190" x2="490" y2="190" stroke="#39c86a" stroke-width="5"/>
<line x1="560" y1="190" x2="605" y2="190" stroke="#ffd23f" stroke-width="3" marker-end="url(#o)"/>
<text x="355" y="232" text-anchor="middle" font-size="12" fill="#222">RSPAN-VLAN 100 (remote-span) auf allen Switches im Pfad, über L2-Trunks</text>
<text x="185" y="250" text-anchor="middle" font-size="11" fill="#222">source session</text>
<text x="525" y="250" text-anchor="middle" font-size="11" fill="#222">destination session</text>
<text x="20" y="295" font-size="15" font-weight="bold" fill="#b08aff">ERSPAN</text>
<rect x="40" y="310" width="50" height="30" fill="#ffffff" stroke="#222"/><text x="65" y="330" text-anchor="middle" font-size="11" fill="#222">PC</text>
<rect x="140" y="305" width="80" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="180" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Switch-1</text>
<ellipse cx="355" cy="325" rx="85" ry="30" fill="#b08aff" opacity="0.2" stroke="#b08aff"/><text x="355" y="330" text-anchor="middle" font-size="13" fill="#222">Layer-3-Netz</text>
<rect x="490" y="305" width="80" height="40" rx="4" fill="#ffffff" stroke="#222" stroke-width="2"/><text x="530" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Switch-2</text>
<rect x="620" y="310" width="70" height="30" fill="#ffffff" stroke="#222"/><text x="655" y="330" text-anchor="middle" font-size="11" fill="#222">Sniffer</text>
<line x1="90" y1="325" x2="140" y2="325" stroke="#222"/><line x1="220" y1="325" x2="270" y2="325" stroke="#b08aff" stroke-width="3"/><line x1="440" y1="325" x2="490" y2="325" stroke="#b08aff" stroke-width="3"/>
<line x1="570" y1="325" x2="615" y2="325" stroke="#ffd23f" stroke-width="3" marker-end="url(#o)"/>
<rect x="140" y="360" width="190" height="70" rx="4" fill="#f2f2f2" stroke="#999"/>
<text x="150" y="378" font-size="11" font-family="monospace" fill="#222">erspan-source</text>
<text x="150" y="394" font-size="11" font-family="monospace" fill="#222"> erspan-id 1</text>
<text x="150" y="410" font-size="11" font-family="monospace" fill="#222"> ip address 2.2.2.2</text>
<text x="150" y="426" font-size="11" font-family="monospace" fill="#222"> origin ip address 1.1.1.1</text>
<text x="355" y="378" text-anchor="middle" font-size="12" fill="#222">GRE-gekapselt, routbar</text>
<text x="355" y="396" text-anchor="middle" font-size="12" fill="#222">SIP 1.1.1.1 · DIP 2.2.2.2 · ID 1</text>
<rect x="470" y="360" width="200" height="70" rx="4" fill="#f2f2f2" stroke="#999"/>
<text x="480" y="378" font-size="11" font-family="monospace" fill="#222">erspan-destination</text>
<text x="480" y="394" font-size="11" font-family="monospace" fill="#222"> erspan-id 1 (gleich)</text>
<text x="480" y="410" font-size="11" font-family="monospace" fill="#222"> ip address 2.2.2.2</text>
<text x="480" y="426" font-size="11" font-family="monospace" fill="#222"> (lokale IP von Switch-2)</text>
</svg>
