<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Interface-Fehlerzähler</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">show interfaces: Zähler und typische Ursachen</text>
<g font-size="13" fill="#222">
<rect x="30" y="50" width="740" height="28" fill="#4a9cff" opacity="0.25"/>
<text x="40" y="69" font-weight="bold">Zähler</text><text x="250" y="69" font-weight="bold">typische Ursache</text>
<text x="40" y="98" font-family="monospace">CRC</text><text x="250" y="98">FCS falsch: Kabel, EMI, defekter Port – oder Full-Duplex-Seite bei Mismatch</text>
<text x="40" y="122" font-family="monospace">runts</text><text x="250" y="122">Frames &lt; 64 Byte (Kollisionsreste, Duplex-Mismatch)</text>
<text x="40" y="146" font-family="monospace">giants</text><text x="250" y="146">Frames &gt; erlaubte Größe (MTU/Jumbo-Mismatch)</text>
<text x="40" y="170" font-family="monospace">late collisions</text><text x="250" y="170">Kollision nach 64 Byte → Duplex-Mismatch (Half-Seite) oder Kabel zu lang</text>
<text x="40" y="194" font-family="monospace">collisions</text><text x="250" y="194">nur bei Half-Duplex normal</text>
<text x="40" y="218" font-family="monospace">input queue drops</text><text x="250" y="218">CPU bekommt mehr Pakete, als sie verarbeiten kann</text>
<text x="40" y="242" font-family="monospace">output drops</text><text x="250" y="242">Ausgangsqueue voll → Stau auf dem Link</text>
<text x="40" y="266" font-family="monospace">ignored/overrun</text><text x="250" y="266">Hardware-Puffer erschöpft (Bursts)</text>
</g>
<rect x="30" y="290" width="740" height="145" rx="10" fill="#ffd23f" opacity="0.18" stroke="#ffd23f"/>
<text x="400" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Duplex-Mismatch erkennen</text>
<rect x="80" y="335" width="70" height="44" rx="6" fill="#ffffff" stroke="#222"/><text x="115" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SW1</text>
<rect x="650" y="335" width="70" height="44" rx="6" fill="#ffffff" stroke="#222"/><text x="685" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">SW2</text>
<line x1="150" y1="357" x2="650" y2="357" stroke="#ff6b6b" stroke-width="3"/>
<text x="160" y="345" font-size="13" fill="#222">full duplex</text>
<text x="640" y="345" font-size="13" fill="#222" text-anchor="end">half duplex</text>
<text x="160" y="400" font-size="13" fill="#ff6b6b">zählt CRC-Fehler und runts</text>
<text x="640" y="400" font-size="13" fill="#ff6b6b" text-anchor="end">zählt late collisions</text>
<text x="400" y="425" text-anchor="middle" font-size="12" fill="#222">Link ist up/up, aber langsam – Lösung: beide Seiten gleich (am besten beide auto oder beide fest)</text>
</svg>
