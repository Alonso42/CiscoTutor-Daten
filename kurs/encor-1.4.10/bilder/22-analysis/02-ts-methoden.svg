<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Troubleshooting-Methoden</title>
<rect width="800" height="450" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Troubleshooting-Methoden</text>
<g font-size="13" fill="#222">
<rect x="200" y="55" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="76" text-anchor="middle">7 Application</text>
<rect x="200" y="87" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="108" text-anchor="middle">6 Presentation</text>
<rect x="200" y="119" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="140" text-anchor="middle">5 Session</text>
<rect x="200" y="151" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="172" text-anchor="middle">4 Transport</text>
<rect x="200" y="183" width="160" height="32" fill="#ffd23f" stroke="#999"/><text x="280" y="204" text-anchor="middle">3 Network (Ping)</text>
<rect x="200" y="215" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="236" text-anchor="middle">2 Data Link</text>
<rect x="200" y="247" width="160" height="32" fill="#f2f2f2" stroke="#999"/><text x="280" y="268" text-anchor="middle">1 Physical</text>
</g>
<line x1="170" y1="62" x2="170" y2="272" stroke="#4a9cff" stroke-width="4" marker-end="url(#a)"/>
<text x="160" y="170" font-size="14" font-weight="bold" fill="#4a9cff" text-anchor="end">Top-down</text>
<text x="160" y="188" font-size="11" fill="#222" text-anchor="end">ab Anwendung</text>
<line x1="390" y1="272" x2="390" y2="62" stroke="#39c86a" stroke-width="4" marker-end="url(#a)"/>
<text x="400" y="80" font-size="14" font-weight="bold" fill="#39c86a">Bottom-up</text>
<text x="400" y="96" font-size="11" fill="#222">ab Kabel – gründlich, langsam</text>
<line x1="365" y1="199" x2="460" y2="140" stroke="#b08aff" stroke-width="3" marker-end="url(#a)"/>
<line x1="365" y1="199" x2="460" y2="255" stroke="#b08aff" stroke-width="3" marker-end="url(#a)"/>
<text x="470" y="190" font-size="14" font-weight="bold" fill="#b08aff">Divide and conquer</text>
<text x="470" y="207" font-size="11" fill="#222">Start in der Mitte: Test ok → aufwärts,</text>
<text x="470" y="222" font-size="11" fill="#222">Test fehlgeschlagen → abwärts</text>
<rect x="30" y="310" width="240" height="120" rx="8" fill="#4a9cff" opacity="0.12" stroke="#4a9cff"/>
<text x="150" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Follow the traffic path</text>
<text x="45" y="357" font-size="12" fill="#222">Pfad Hop für Hop prüfen</text>
<text x="45" y="377" font-size="12" fill="#222">(Routing-Tabelle, traceroute,</text>
<text x="45" y="397" font-size="12" fill="#222">ACLs auf jedem Gerät)</text>
<rect x="285" y="310" width="240" height="120" rx="8" fill="#ffd23f" opacity="0.2" stroke="#ffd23f"/>
<text x="405" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Compare / spot differences</text>
<text x="300" y="357" font-size="12" fill="#222">funktionierende Referenz mit</text>
<text x="300" y="377" font-size="12" fill="#222">defektem Gerät/Konfig vergleichen</text>
<text x="300" y="397" font-size="12" fill="#222">(auch Baseline-Vergleich)</text>
<rect x="540" y="310" width="230" height="120" rx="8" fill="#ff6b6b" opacity="0.15" stroke="#ff6b6b"/>
<text x="655" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Swap components</text>
<text x="555" y="357" font-size="12" fill="#222">Kabel/Modul/Gerät gegen bekannt</text>
<text x="555" y="377" font-size="12" fill="#222">gutes tauschen – isoliert Hardware,</text>
<text x="555" y="397" font-size="12" fill="#222">erklärt nicht immer die Ursache</text>
</svg>
