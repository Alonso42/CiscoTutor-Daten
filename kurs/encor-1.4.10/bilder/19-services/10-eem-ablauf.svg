<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>EEM-Architektur und Applet</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Embedded Event Manager: Ereignis → Policy → Aktionen</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="55" width="170" height="175" rx="8" fill="#4a9cff" opacity="0.3" stroke="#4a9cff"/>
<text x="105" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Event Detectors</text>
<g font-size="12" fill="#222"><text x="30" y="100">syslog (Regex)</text><text x="30" y="118">cli (Regex)</text><text x="30" y="136">timer (watchdog/cron)</text><text x="30" y="154">track, interface</text><text x="30" y="172">snmp, ipsla, netflow</text><text x="30" y="190">routing, oir</text><text x="30" y="208">none (manuell)</text></g>
<line x1="192" y1="140" x2="240" y2="140" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="245" y="105" width="120" height="70" rx="8" fill="#ffd23f"/><text x="305" y="137" text-anchor="middle" font-size="14" fill="#222">EEM Server</text><text x="305" y="155" text-anchor="middle" font-size="11" fill="#222">ordnet zu</text>
<line x1="367" y1="140" x2="415" y2="140" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="420" y="55" width="160" height="175" rx="8" fill="#b08aff" opacity="0.35" stroke="#b08aff"/>
<text x="500" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Policies</text>
<text x="430" y="105" font-size="12" fill="#222">Applet: in der CLI</text><text x="430" y="123" font-size="12" fill="#222">event + actions</text>
<text x="430" y="155" font-size="12" fill="#222">Tcl-Skript: mächtiger,</text><text x="430" y="173" font-size="12" fill="#222">Datei im Flash</text>
<line x1="582" y1="140" x2="620" y2="140" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="625" y="55" width="155" height="175" rx="8" fill="#39c86a" opacity="0.35" stroke="#39c86a"/>
<text x="702" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Actions</text>
<g font-size="12" fill="#222"><text x="635" y="100">cli command</text><text x="635" y="118">syslog msg</text><text x="635" y="136">mail</text><text x="635" y="154">snmp-trap</text><text x="635" y="172">reload</text><text x="635" y="190">info / puts</text></g>
<rect x="20" y="250" width="500" height="180" rx="8" fill="#f4f4f4" stroke="#222"/>
<g font-family="monospace" font-size="12" fill="#222">
<text x="30" y="272">event manager applet UPLINK-WATCH</text>
<text x="30" y="292"> event syslog pattern "Ethernet0/0, changed state to down"</text>
<text x="30" y="312"> action 1.0 cli command "enable"</text>
<text x="30" y="332"> action 2.0 cli command "show ip route | append flash:rt"</text>
<text x="30" y="352"> action 3.0 syslog priority critical msg "Uplink down"</text>
</g>
<text x="30" y="380" font-size="12" fill="#222">Applet-CLI startet im User EXEC → zuerst "enable"</text>
<text x="30" y="398" font-size="12" fill="#222">läuft über eine VTY-Sitzung; Default maxrun 20 s</text>
<text x="30" y="416" font-size="12" fill="#ff6b6b">Labels werden als Text sortiert: "10" läuft vor "2"!</text>
<rect x="540" y="250" width="240" height="180" rx="8" fill="none" stroke="#222"/>
<text x="550" y="272" font-size="13" font-weight="bold" fill="#222">Prüfen</text>
<g font-size="11" fill="#222"><text x="550" y="294">show event manager policy</text><text x="560" y="309">registered</text><text x="550" y="331">debug event manager action cli</text><text x="550" y="353">event manager run NAME</text><text x="560" y="368">(nur bei event none)</text><text x="550" y="390">$_cli_result = letzte Ausgabe</text><text x="550" y="410">$_syslog_msg = Auslöser</text></g>
</svg>
