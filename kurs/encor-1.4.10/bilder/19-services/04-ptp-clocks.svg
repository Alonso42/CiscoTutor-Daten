<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>PTP-Clock-Typen</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">PTP (IEEE 1588): Clock-Typen in einer Domäne</text>
<g stroke="#222" stroke-width="1.5">
<line x1="250" y1="95" x2="250" y2="160"/><line x1="550" y1="95" x2="420" y2="160" stroke-dasharray="6 4"/>
<line x1="250" y1="200" x2="150" y2="280"/><line x1="250" y1="200" x2="350" y2="280"/>
<line x1="350" y1="320" x2="350" y2="370"/>
</g>
<rect x="190" y="55" width="120" height="40" rx="6" fill="#ffd23f"/><text x="250" y="72" text-anchor="middle" font-size="12" fill="#222">Grandmaster 1</text><text x="250" y="88" text-anchor="middle" font-size="11" fill="#222">GPS</text>
<rect x="490" y="55" width="120" height="40" rx="6" fill="#ffd23f" opacity="0.6"/><text x="550" y="72" text-anchor="middle" font-size="12" fill="#222">Grandmaster 2</text><text x="550" y="88" text-anchor="middle" font-size="11" fill="#222">Reserve</text>
<rect x="170" y="160" width="160" height="40" fill="#4a9cff"/><text x="250" y="185" text-anchor="middle" font-size="13" fill="#fff">SW Boundary Clock</text>
<text x="262" y="150" font-size="10" fill="#222">Secondary-Port</text>
<text x="262" y="218" font-size="10" fill="#222">Primary-Ports</text>
<rect x="80" y="280" width="140" height="40" fill="#b08aff"/><text x="150" y="305" text-anchor="middle" font-size="12" fill="#fff">Ordinary Clock</text>
<rect x="280" y="280" width="140" height="40" fill="#39c86a"/><text x="350" y="300" text-anchor="middle" font-size="12" fill="#222">SW Transparent</text><text x="350" y="314" text-anchor="middle" font-size="11" fill="#222">Clock</text>
<rect x="290" y="370" width="120" height="35" fill="#b08aff"/><text x="350" y="392" text-anchor="middle" font-size="12" fill="#fff">Ordinary Clock</text>
<text x="430" y="345" font-size="11" fill="#222">+ Verweilzeit im Correction Field</text>
<rect x="470" y="130" width="315" height="285" rx="8" fill="none" stroke="#222"/>
<text x="480" y="152" font-size="13" font-weight="bold" fill="#222">Grandmaster:</text><text x="580" y="152" font-size="12" fill="#222">beste Zeitquelle (BMCA)</text>
<text x="480" y="177" font-size="13" font-weight="bold" fill="#222">Ordinary:</text><text x="560" y="177" font-size="12" fill="#222">1 PTP-Port, Endgerät</text>
<text x="480" y="202" font-size="13" font-weight="bold" fill="#222">Boundary:</text><text x="560" y="202" font-size="12" fill="#222">terminiert PTP, syncht</text>
<text x="560" y="218" font-size="12" fill="#222">upstream, versorgt downstream</text>
<text x="480" y="243" font-size="13" font-weight="bold" fill="#222">Transparent:</text><text x="580" y="243" font-size="12" fill="#222">leitet weiter, korrigiert</text>
<text x="580" y="259" font-size="12" fill="#222">Durchlaufzeit</text>
<text x="480" y="284" font-size="12" fill="#222">E2E-TC: nur Verweilzeit im Switch</text>
<text x="480" y="302" font-size="12" fill="#222">P2P-TC: + Link-Delay zum Nachbarn</text>
<text x="480" y="327" font-size="12" fill="#222">Domäne: Default 0, falsche Domäne</text>
<text x="480" y="343" font-size="12" fill="#222">wird von Boundary Clock verworfen</text>
<text x="480" y="368" font-size="12" fill="#222">Messages: Announce, Sync, Follow_Up,</text>
<text x="480" y="384" font-size="12" fill="#222">Delay_Req/Resp, Pdelay_Req/Resp</text>
<text x="480" y="405" font-size="12" fill="#39c86a">Genauigkeit: Sub-Mikrosekunde</text>
</svg>
