<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>NTP-Betriebsmodi</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">NTP-Modi und ihre Befehle</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="55" width="240" height="370" rx="10" fill="none" stroke="#39c86a" stroke-width="2"/>
<text x="140" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Client / Server</text>
<circle cx="140" cy="130" r="24" fill="#39c86a"/><text x="140" y="135" text-anchor="middle" font-size="13" fill="#222">Server</text>
<circle cx="140" cy="250" r="24" fill="#4a9cff"/><text x="140" y="255" text-anchor="middle" font-size="13" fill="#fff">Client</text>
<line x1="150" y1="226" x2="150" y2="156" stroke="#222" marker-end="url(#a)"/><text x="160" y="195" font-size="11" fill="#222">Poll</text>
<line x1="130" y1="156" x2="130" y2="226" stroke="#222" marker-end="url(#a)"/><text x="70" y="195" font-size="11" fill="#222">Antwort</text>
<text x="35" y="310" font-size="12" fill="#222">Client: ntp server 10.1.1.1</text>
<text x="35" y="330" font-size="12" fill="#222">Server: nichts nötig bzw.</text>
<text x="35" y="350" font-size="12" fill="#222">ntp master [stratum]</text>
<text x="35" y="375" font-size="12" fill="#222">Cisco-Client beantwortet</text>
<text x="35" y="393" font-size="12" fill="#222">selbst wieder Anfragen.</text>
<rect x="280" y="55" width="240" height="370" rx="10" fill="none" stroke="#b08aff" stroke-width="2"/>
<text x="400" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Peer (symmetric)</text>
<circle cx="335" cy="180" r="24" fill="#b08aff"/><text x="335" y="185" text-anchor="middle" font-size="12" fill="#fff">Core1</text>
<circle cx="465" cy="180" r="24" fill="#b08aff"/><text x="465" y="185" text-anchor="middle" font-size="12" fill="#fff">Core2</text>
<line x1="362" y1="172" x2="436" y2="172" stroke="#222" marker-end="url(#a)"/>
<line x1="438" y1="190" x2="364" y2="190" stroke="#222" marker-end="url(#a)"/>
<text x="295" y="310" font-size="12" fill="#222">ntp peer 10.0.0.2</text>
<text x="295" y="335" font-size="12" fill="#222">Gleichrangige Server als</text>
<text x="295" y="353" font-size="12" fill="#222">gegenseitiges Backup;</text>
<text x="295" y="371" font-size="12" fill="#222">Zeit fließt in beide</text>
<text x="295" y="389" font-size="12" fill="#222">Richtungen (push-pull).</text>
<rect x="540" y="55" width="240" height="370" rx="10" fill="none" stroke="#ffd23f" stroke-width="2"/>
<text x="660" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Broadcast</text>
<circle cx="660" cy="130" r="24" fill="#ffd23f"/><text x="660" y="135" text-anchor="middle" font-size="12" fill="#222">Server</text>
<line x1="660" y1="155" x2="590" y2="235" stroke="#222" marker-end="url(#a)"/>
<line x1="660" y1="155" x2="660" y2="235" stroke="#222" marker-end="url(#a)"/>
<line x1="660" y1="155" x2="730" y2="235" stroke="#222" marker-end="url(#a)"/>
<rect x="570" y="240" width="40" height="25" fill="#4a9cff"/><rect x="640" y="240" width="40" height="25" fill="#4a9cff"/><rect x="710" y="240" width="40" height="25" fill="#4a9cff"/>
<text x="555" y="300" font-size="12" fill="#222">Server-IF: ntp broadcast</text>
<text x="555" y="320" font-size="12" fill="#222">Client-IF: ntp broadcast client</text>
<text x="555" y="345" font-size="12" fill="#222">nur im selben Subnetz,</text>
<text x="555" y="363" font-size="12" fill="#222">einfache Konfiguration,</text>
<text x="555" y="381" font-size="12" fill="#ff6b6b">etwas ungenauer (einseitig)</text>
</svg>
