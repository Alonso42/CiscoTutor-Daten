<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>NetFlow Flow-Erkennung und Export</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">NetFlow: vom Paket zum Report</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect x="20" y="60" width="200" height="200" rx="8" fill="none" stroke="#4a9cff" stroke-width="2"/>
<text x="120" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Key Fields (klassisch 7)</text>
<g font-size="12" fill="#222"><text x="35" y="105">Quell-IP</text><text x="35" y="125">Ziel-IP</text><text x="35" y="145">Quellport</text><text x="35" y="165">Zielport</text><text x="35" y="185">L3-Protokoll</text><text x="35" y="205">ToS</text><text x="35" y="225">Input-Interface</text></g>
<text x="120" y="250" text-anchor="middle" font-size="11" fill="#ff6b6b">ein Feld anders = neuer Flow</text>
<line x1="222" y1="160" x2="285" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="290" y="60" width="220" height="200" rx="8" fill="#ffd23f" opacity="0.4" stroke="#222"/>
<text x="400" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">NetFlow-Cache</text>
<g font-size="11" font-family="monospace" fill="#222"><text x="300" y="110">10.10.10.10→10.20.20.10</text><text x="300" y="125">ICMP dport 2048  5 pkts</text><text x="300" y="150">10.10.10.10→10.20.20.10</text><text x="300" y="165">TCP 45288→23  30 pkts</text></g>
<text x="300" y="195" font-size="11" fill="#222">non-key: Bytes, Pakete, Zeit-</text><text x="300" y="210" font-size="11" fill="#222">stempel, Next Hop, Out-IF, TCP-Flags</text>
<text x="300" y="240" font-size="11" fill="#222">ICMP: Zielport = Typ·256 + Code</text>
<line x1="512" y1="160" x2="575" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<text x="543" y="150" text-anchor="middle" font-size="10" fill="#222">UDP</text>
<rect x="580" y="90" width="90" height="140" fill="#39c86a"/><text x="625" y="150" text-anchor="middle" font-size="13" fill="#222">Collector</text><text x="625" y="168" text-anchor="middle" font-size="11" fill="#222">speichert</text>
<line x1="672" y1="160" x2="695" y2="160" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
<rect x="698" y="90" width="85" height="140" fill="#b08aff"/><text x="740" y="150" text-anchor="middle" font-size="13" fill="#fff">Analyzer</text><text x="740" y="168" text-anchor="middle" font-size="11" fill="#fff">Reports</text>
<rect x="20" y="290" width="380" height="140" rx="8" fill="none" stroke="#222"/>
<text x="35" y="313" font-size="14" font-weight="bold" fill="#222">Export-Auslöser (Aging)</text>
<g font-size="12" fill="#222"><text x="35" y="338">• inaktiv &gt; Inactive Timer (Default 15 s)</text><text x="35" y="360">• aktiv &gt; Active Timer (Default 30 min)</text><text x="35" y="382">• TCP FIN oder RST</text><text x="35" y="404">• Cache voll (Emergency/Watermark)</text></g>
<rect x="420" y="290" width="360" height="140" rx="8" fill="none" stroke="#222"/>
<text x="435" y="313" font-size="14" font-weight="bold" fill="#222">Exportformate</text>
<g font-size="12" fill="#222"><text x="435" y="338">v5: festes Format, nur IPv4</text><text x="435" y="360">v9: Templates (ID) → IPv6, MPLS, Multicast</text><text x="435" y="382">IPFIX (v10): IETF-Standard, RFC 7011</text><text x="435" y="404">Push durch Gerät, nicht Polling wie SNMP</text></g>
</svg>
