<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>RADIUS und TACACS+ im Vergleich</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">RADIUS vs. TACACS+</text>
<rect x="200" y="55" width="280" height="36" rx="6" fill="#4a9cff" fill-opacity="0.35"/>
<rect x="490" y="55" width="280" height="36" rx="6" fill="#b08aff" fill-opacity="0.35"/>
<g font-size="15" fill="#222">
<text x="340" y="79" text-anchor="middle" font-weight="bold">RADIUS</text>
<text x="630" y="79" text-anchor="middle" font-weight="bold">TACACS+</text>
<text x="30" y="125" font-weight="bold">Standard</text>
<text x="210" y="125">offen (RFC 2865/2866)</text>
<text x="500" y="125">Cisco (heute RFC 8907)</text>
<text x="30" y="170" font-weight="bold">Transport</text>
<text x="210" y="170">UDP 1812 + 1813</text>
<text x="210" y="188" font-size="12">(alt: 1645 + 1646)</text>
<text x="500" y="170">TCP 49</text>
<text x="30" y="225" font-weight="bold">AAA-Trennung</text>
<text x="210" y="225">Authc + Authz kombiniert,</text>
<text x="210" y="243">Accounting getrennt</text>
<text x="500" y="225">alle drei getrennt</text>
<text x="30" y="285" font-weight="bold">Verschlüsselung</text>
<text x="210" y="285">nur das Passwort</text>
<text x="500" y="285">gesamter Body</text>
<text x="500" y="303" font-size="12">(Header im Klartext)</text>
<text x="30" y="345" font-weight="bold">Befehls-</text>
<text x="30" y="363" font-weight="bold">autorisierung</text>
<text x="210" y="352">nein (alles oder nichts)</text>
<text x="500" y="352">ja, pro Befehl</text>
<text x="30" y="410" font-weight="bold">Typischer Einsatz</text>
<text x="210" y="410">Network Access (802.1X, VPN)</text>
<text x="500" y="410">Device Administration (CLI)</text>
</g>
<g stroke="#cccccc">
<line x1="25" y1="145" x2="775" y2="145"/><line x1="25" y1="200" x2="775" y2="200"/>
<line x1="25" y1="262" x2="775" y2="262"/><line x1="25" y1="322" x2="775" y2="322"/>
<line x1="25" y1="385" x2="775" y2="385"/>
</g>
</svg>
