<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Method List: Fallback nur bei ERROR</title>
<defs><marker id="k" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">aaa authentication login default group tacacs+ local</text>
<rect x="60" y="80" width="200" height="70" rx="10" fill="#b08aff" fill-opacity="0.3" stroke="#b08aff" stroke-width="2"/>
<text x="160" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Methode 1</text>
<text x="160" y="132" text-anchor="middle" font-size="14" fill="#222">group tacacs+</text>
<rect x="300" y="80" width="200" height="70" rx="10" fill="#4a9cff" fill-opacity="0.3" stroke="#4a9cff" stroke-width="2"/>
<text x="400" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Methode 2</text>
<text x="400" y="132" text-anchor="middle" font-size="14" fill="#222">local</text>
<rect x="540" y="80" width="200" height="70" rx="10" fill="#ff6b6b" fill-opacity="0.3" stroke="#ff6b6b" stroke-width="2"/>
<text x="640" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Ende der Liste</text>
<text x="640" y="132" text-anchor="middle" font-size="14" fill="#222">Zugang verweigert</text>
<line x1="260" y1="115" x2="298" y2="115" stroke="#ffd23f" stroke-width="4" marker-end="url(#k)"/>
<line x1="500" y1="115" x2="538" y2="115" stroke="#ffd23f" stroke-width="4" marker-end="url(#k)"/>
<text x="280" y="70" text-anchor="middle" font-size="13" fill="#222">ERROR</text>
<text x="520" y="70" text-anchor="middle" font-size="13" fill="#222">ERROR</text>
<line x1="160" y1="150" x2="160" y2="218" stroke="#39c86a" stroke-width="3" marker-end="url(#k)"/>
<line x1="400" y1="150" x2="400" y2="218" stroke="#39c86a" stroke-width="3" marker-end="url(#k)"/>
<rect x="60" y="222" width="440" height="40" rx="8" fill="#39c86a" fill-opacity="0.3"/>
<text x="280" y="248" text-anchor="middle" font-size="15" fill="#222">PASS → angemeldet</text>
<line x1="210" y1="150" x2="250" y2="300" stroke="#ff6b6b" stroke-width="3" marker-end="url(#k)"/>
<rect x="150" y="305" width="250" height="40" rx="8" fill="#ff6b6b" fill-opacity="0.3"/>
<text x="275" y="331" text-anchor="middle" font-size="15" fill="#222">FAIL → abgelehnt, KEIN Fallback</text>
<rect x="40" y="370" width="720" height="62" rx="10" fill="#ffd23f" fill-opacity="0.25" stroke="#ffd23f"/>
<text x="400" y="395" text-anchor="middle" font-size="14" fill="#222">ERROR = Server antwortet nicht (Timeout, nicht erreichbar)</text>
<text x="400" y="418" text-anchor="middle" font-size="14" fill="#222">FAIL = Server antwortet "Reject" (falsches Passwort, unbekannter Benutzer)</text>
</svg>
