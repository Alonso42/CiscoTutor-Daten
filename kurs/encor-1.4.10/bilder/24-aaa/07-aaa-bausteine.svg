<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>AAA-Konfiguration: Server, Gruppe, Method List, Line</title>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Vier Bausteine – jeder verweist auf den vorherigen</text>
<g font-family="monospace" font-size="12" fill="#222">
<rect x="20" y="70" width="180" height="150" rx="10" fill="#4a9cff" fill-opacity="0.2" stroke="#4a9cff" stroke-width="2"/>
<text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">1 Server</text>
<text x="30" y="125">tacacs server TACSRV</text>
<text x="38" y="145">address ipv4 10.1.1.2</text>
<text x="38" y="165">key SecretTAC</text>
<text x="30" y="200" font-family="sans-serif" font-size="11">(radius server ... analog)</text>
<rect x="215" y="70" width="180" height="150" rx="10" fill="#b08aff" fill-opacity="0.2" stroke="#b08aff" stroke-width="2"/>
<text x="305" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">2 Server-Gruppe</text>
<text x="222" y="125">aaa group server</text>
<text x="230" y="143">tacacs+ TACGRP</text>
<text x="230" y="165">server name TACSRV</text>
<rect x="410" y="70" width="180" height="150" rx="10" fill="#ffd23f" fill-opacity="0.3" stroke="#ffd23f" stroke-width="2"/>
<text x="500" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">3 Method List</text>
<text x="417" y="125">aaa authentication</text>
<text x="425" y="143">login VTY</text>
<text x="425" y="161">group TACGRP local</text>
<rect x="605" y="70" width="180" height="150" rx="10" fill="#39c86a" fill-opacity="0.2" stroke="#39c86a" stroke-width="2"/>
<text x="695" y="95" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">4 Line</text>
<text x="612" y="125">line vty 0 4</text>
<text x="620" y="145">login</text>
<text x="620" y="163">authentication VTY</text>
</g>
<line x1="200" y1="145" x2="213" y2="145" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
<line x1="395" y1="145" x2="408" y2="145" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
<line x1="590" y1="145" x2="603" y2="145" stroke="#222" stroke-width="2" marker-end="url(#b)"/>
<rect x="20" y="250" width="765" height="170" rx="10" fill="#ffffff" stroke="#cccccc"/>
<g font-size="14" fill="#222">
<text x="40" y="280" font-weight="bold">Merksätze</text>
<text x="40" y="308">• Vorher: aaa new-model und ein lokaler Benutzer (username ... secret ...)</text>
<text x="40" y="333">• Liste "default": gilt automatisch auf allen Lines ohne eigene Liste</text>
<text x="40" y="358">• Benannte Liste: wirkt erst nach "login authentication NAME" unter der Line</text>
<text x="40" y="383">• group radius / group tacacs+ = alle Server dieses Typs; group NAME = nur diese Gruppe</text>
<text x="40" y="408">• "key" muss auf Router und Server identisch sein</text>
</g>
</svg>
