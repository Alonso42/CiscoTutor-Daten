<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Passwort- und Hash-Typen in IOS</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Passwort-Typen in der Konfiguration</text>
<text x="400" y="60" text-anchor="middle" font-size="14" fill="#222">Die Zahl vor dem Wert zeigt das Verfahren, z. B. "enable secret 9 $9$..."</text>
<g font-size="14" fill="#222">
<text x="40" y="96" font-weight="bold">Typ</text>
<text x="110" y="96" font-weight="bold">Verfahren</text>
<text x="330" y="96" font-weight="bold">entsteht durch</text>
<text x="640" y="96" font-weight="bold">Bewertung</text>
</g>
<g font-size="14" fill="#222">
<rect x="30" y="108" width="740" height="50" rx="6" fill="#ff6b6b" fill-opacity="0.25"/>
<text x="48" y="139" font-size="20" font-weight="bold">0</text>
<text x="110" y="139">Klartext</text>
<text x="330" y="139">password cisco (ohne Verschlüsselung)</text>
<text x="640" y="139" font-weight="bold">lesbar</text>
<rect x="30" y="166" width="740" height="50" rx="6" fill="#ff6b6b" fill-opacity="0.25"/>
<text x="48" y="197" font-size="20" font-weight="bold">7</text>
<text x="110" y="197">Vigenère (umkehrbar)</text>
<text x="330" y="197">service password-encryption</text>
<text x="640" y="197" font-weight="bold">trivial knackbar</text>
<rect x="30" y="224" width="740" height="50" rx="6" fill="#ffd23f" fill-opacity="0.35"/>
<text x="48" y="255" font-size="20" font-weight="bold">5</text>
<text x="110" y="255">MD5-Hash (gesalzen)</text>
<text x="330" y="255">secret ... / algorithm-type md5</text>
<text x="640" y="255" font-weight="bold">veraltet</text>
<rect x="30" y="282" width="740" height="50" rx="6" fill="#39c86a" fill-opacity="0.25"/>
<text x="48" y="313" font-size="20" font-weight="bold">8</text>
<text x="110" y="313">PBKDF2 mit SHA-256</text>
<text x="330" y="313">algorithm-type sha256 secret ...</text>
<text x="640" y="313" font-weight="bold">gut</text>
<rect x="30" y="340" width="740" height="50" rx="6" fill="#39c86a" fill-opacity="0.45"/>
<text x="48" y="371" font-size="20" font-weight="bold">9</text>
<text x="110" y="371">scrypt</text>
<text x="330" y="371">algorithm-type scrypt secret ...</text>
<text x="640" y="371" font-weight="bold">am stärksten</text>
</g>
<text x="400" y="425" text-anchor="middle" font-size="13" fill="#222">service password-encryption wirkt nur auf "password"-Einträge, nie auf "secret"-Einträge.</text>
</svg>
