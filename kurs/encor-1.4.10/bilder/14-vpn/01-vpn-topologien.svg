<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Logische VPN-Topologien: Point-to-Point, Hub-and-Spoke, Full Mesh</title>
<rect width="800" height="450" fill="#ffffff"/>
<g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
<text x="130" y="35">Point-to-Point</text>
<text x="400" y="35">Hub-and-Spoke</text>
<text x="670" y="35">Full Mesh</text>
</g>
<g stroke="#4a9cff" stroke-width="3">
<line x1="130" y1="130" x2="130" y2="300"/>
</g>
<g stroke="#39c86a" stroke-width="3">
<line x1="400" y1="200" x2="320" y2="110"/>
<line x1="400" y1="200" x2="480" y2="110"/>
<line x1="400" y1="200" x2="320" y2="300"/>
<line x1="400" y1="200" x2="480" y2="300"/>
</g>
<g stroke="#b08aff" stroke-width="3">
<line x1="610" y1="110" x2="730" y2="110"/>
<line x1="610" y1="110" x2="610" y2="300"/>
<line x1="610" y1="110" x2="730" y2="300"/>
<line x1="730" y1="110" x2="610" y2="300"/>
<line x1="730" y1="110" x2="730" y2="300"/>
<line x1="610" y1="300" x2="730" y2="300"/>
</g>
<g fill="#ffffff" stroke="#222" stroke-width="2">
<circle cx="130" cy="130" r="22"/><circle cx="130" cy="300" r="22"/>
<circle cx="400" cy="200" r="26" fill="#ffd23f"/>
<circle cx="320" cy="110" r="22"/><circle cx="480" cy="110" r="22"/>
<circle cx="320" cy="300" r="22"/><circle cx="480" cy="300" r="22"/>
<circle cx="610" cy="110" r="22"/><circle cx="730" cy="110" r="22"/>
<circle cx="610" cy="300" r="22"/><circle cx="730" cy="300" r="22"/>
</g>
<g font-size="14" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="130" y="130">A</text><text x="130" y="300">B</text>
<text x="400" y="200" font-weight="bold">Hub</text>
<text x="320" y="110">S1</text><text x="480" y="110">S2</text>
<text x="320" y="300">S3</text><text x="480" y="300">S4</text>
<text x="610" y="110">A</text><text x="730" y="110">B</text>
<text x="610" y="300">C</text><text x="730" y="300">D</text>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="130" y="360">1 Tunnel pro Standortpaar</text>
<text x="130" y="380">mehrere P2P-Links möglich</text>
<text x="400" y="360">n − 1 Tunnel (hier 4)</text>
<text x="400" y="380">Spoke ↔ Spoke nur über den Hub</text>
<text x="670" y="360">n·(n − 1)/2 Tunnel (hier 6)</text>
<text x="670" y="380">any-to-any, direkte Pfade</text>
</g>
<text x="400" y="425" font-size="13" fill="#222" text-anchor="middle">Kombinationen: Partial Mesh · Tiered Hub-and-Spoke · Joined Hub-and-Spoke</text>
</svg>
