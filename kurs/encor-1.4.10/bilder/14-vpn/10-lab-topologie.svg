<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery 17: Static-VTI-Lab zwischen R2 und R3</title>
<rect width="800" height="450" fill="#ffffff"/>
<ellipse cx="400" cy="230" rx="170" ry="90" fill="#eeeeee" stroke="#999" stroke-dasharray="6 4"/>
<text x="400" y="300" font-size="13" fill="#222" text-anchor="middle">Transit "Internet" (R1)</text>
<path d="M190 175 Q400 60 610 175" fill="none" stroke="#4a9cff" stroke-width="10" opacity="0.45"/>
<text x="400" y="105" font-size="13" fill="#222" text-anchor="middle">Tunnel0 – static VTI (ESP, AES-128 / SHA-1)</text>
<g stroke="#222" stroke-width="2">
<line x1="70" y1="230" x2="190" y2="230"/>
<line x1="190" y1="230" x2="400" y2="230"/>
<line x1="400" y1="230" x2="610" y2="230"/>
<line x1="610" y1="230" x2="730" y2="230"/>
</g>
<g fill="#ffffff" stroke="#222" stroke-width="2">
<rect x="40" y="215" width="40" height="30"/>
<circle cx="190" cy="230" r="26"/>
<circle cx="400" cy="230" r="26"/>
<circle cx="610" cy="230" r="26"/>
<rect x="720" y="215" width="40" height="30"/>
</g>
<g font-size="14" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="60" y="230">PC1</text><text x="190" y="230">R2</text><text x="400" y="230">R1</text><text x="610" y="230">R3</text><text x="740" y="230">PC2</text>
</g>
<g font-size="12" fill="#222" text-anchor="middle">
<text x="130" y="265">10.10.1.0/24</text>
<text x="60" y="270">.11</text><text x="170" y="270">E0/1 .1</text>
<text x="300" y="265">172.17.1.0/24</text>
<text x="225" y="200">E0/0 .2</text><text x="370" y="200">.1</text>
<text x="500" y="265">172.18.4.0/24</text>
<text x="430" y="200">.1</text><text x="575" y="200">E0/0 .2</text>
<text x="670" y="265">10.10.2.0/24</text>
<text x="635" y="290">E0/1 .1</text><text x="740" y="270">.12</text>
</g>
<g font-size="12" fill="#222">
<text x="30" y="355">R2 (wird konfiguriert): Tunnel0 = ip unnumbered E0/0, source E0/0, destination 172.18.4.2,</text>
<text x="30" y="375">tunnel mode ipsec ipv4, tunnel protection ipsec profile MYPROFILE, ip route 10.10.2.0/24 Tunnel0.</text>
<text x="30" y="400">Erwartung: show crypto ipsec sa → encaps/decaps steigen je ping-Befehl (5 Echos) um 5; Tunnel0 up/up.</text>
<text x="30" y="425">R3 ist vorkonfiguriert (spiegelbildlich), R1 routet nur die äußeren Pakete 172.17.1.2 ↔ 172.18.4.2.</text>
</g>
</svg>
