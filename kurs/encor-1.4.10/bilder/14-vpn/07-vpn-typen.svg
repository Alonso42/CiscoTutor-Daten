<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>IPsec-VPN-Typen auf Cisco IOS: VTI, DMVPN, FlexVPN</title>
<rect width="800" height="450" fill="#ffffff"/>
<g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
<text x="135" y="32">Static VTI</text><text x="400" y="32">DMVPN</text><text x="665" y="32">FlexVPN</text>
</g>
<line x1="268" y1="15" x2="268" y2="300" stroke="#ccc"/><line x1="532" y1="15" x2="532" y2="300" stroke="#ccc"/>
<line x1="60" y1="150" x2="210" y2="150" stroke="#4a9cff" stroke-width="8" opacity="0.6"/>
<g stroke="#39c86a" stroke-width="6" opacity="0.6">
<line x1="400" y1="90" x2="320" y2="230"/><line x1="400" y1="90" x2="400" y2="230"/><line x1="400" y1="90" x2="480" y2="230"/>
</g>
<line x1="320" y1="230" x2="400" y2="230" stroke="#ffd23f" stroke-width="5" stroke-dasharray="8 5"/>
<g stroke="#b08aff" stroke-width="6" opacity="0.6">
<line x1="600" y1="150" x2="730" y2="80"/><line x1="600" y1="150" x2="730" y2="150"/><line x1="600" y1="150" x2="730" y2="225"/>
</g>
<g fill="#ffffff" stroke="#222" stroke-width="2">
<circle cx="60" cy="150" r="20"/><circle cx="210" cy="150" r="20"/>
<circle cx="400" cy="90" r="22" fill="#ffd23f"/><circle cx="320" cy="230" r="18"/><circle cx="400" cy="230" r="18"/><circle cx="480" cy="230" r="18"/>
<circle cx="600" cy="150" r="22" fill="#ffd23f"/><circle cx="730" cy="80" r="18"/><circle cx="730" cy="150" r="18"/>
<rect x="712" y="212" width="36" height="26"/>
</g>
<g font-size="12" fill="#222" text-anchor="middle" dominant-baseline="central">
<text x="60" y="150">R1</text><text x="210" y="150">R2</text>
<text x="400" y="90">Hub</text><text x="320" y="230">S1</text><text x="400" y="230">S2</text><text x="480" y="230">S3</text>
<text x="600" y="150">Hub</text><text x="730" y="80">Site</text><text x="730" y="150">Site</text><text x="730" y="225">PC</text>
</g>
<g font-size="11" fill="#222" text-anchor="middle">
<text x="135" y="138">tunnel mode ipsec ipv4</text>
<text x="360" y="252">dynamisch S1↔S2</text>
<text x="730" y="255">Remote Access</text>
</g>
<g font-size="12" fill="#222">
<text x="20" y="325">• Routbares Tunnelinterface</text>
<text x="20" y="345">• 1 Tunnel pro Peer</text>
<text x="20" y="365">• Unicast + Multicast,</text>
<text x="32" y="383">Routing-Protokolle</text>
<text x="20" y="403">• Standard für P2P und</text>
<text x="32" y="421">kleine Hub-and-Spoke</text>
<text x="285" y="325">• mGRE + NHRP + IPsec</text>
<text x="285" y="345">• Spoke-zu-Spoke-Tunnel</text>
<text x="297" y="363">nur bei Bedarf</text>
<text x="285" y="383">• Zero-Touch für neue Spokes</text>
<text x="285" y="403">• für große Partial/Full Mesh</text>
<text x="550" y="325">• basiert auf IKEv2</text>
<text x="550" y="345">• Site-to-Site und Remote</text>
<text x="562" y="363">Access am selben Headend</text>
<text x="550" y="383">• Policies per AAA/RADIUS</text>
<text x="550" y="403">• Fremdhersteller/iOS/Android</text>
</g>
</svg>
