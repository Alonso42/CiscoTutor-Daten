<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>ESP im Transport Mode und im Tunnel Mode</title>
<rect width="800" height="450" fill="#ffffff"/>
<text x="20" y="35" font-size="17" font-weight="bold" fill="#222">ESP Transport Mode</text>
<g stroke="#222" stroke-width="1.5" font-size="13">
<rect x="130" y="50" width="100" height="40" fill="#dddddd"/>
<rect x="230" y="50" width="100" height="40" fill="#ffd23f"/>
<rect x="330" y="50" width="200" height="40" fill="#39c86a" opacity="0.6"/>
<rect x="530" y="50" width="100" height="40" fill="#ffd23f"/>
<rect x="630" y="50" width="100" height="40" fill="#ffd23f"/>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="180" y="75">IP-Header</text><text x="280" y="75">ESP-Header</text><text x="430" y="75">TCP/UDP + Daten</text>
<text x="580" y="75">ESP-Trailer</text><text x="680" y="75">ESP-Auth</text>
</g>
<line x1="330" y1="105" x2="630" y2="105" stroke="#4a9cff" stroke-width="4"/>
<text x="480" y="122" font-size="12" fill="#222" text-anchor="middle">verschlüsselt</text>
<line x1="230" y1="135" x2="630" y2="135" stroke="#b08aff" stroke-width="4"/>
<text x="430" y="152" font-size="12" fill="#222" text-anchor="middle">authentisiert (ICV im ESP-Auth)</text>
<text x="20" y="200" font-size="17" font-weight="bold" fill="#222">ESP Tunnel Mode (Cisco-Default)</text>
<g stroke="#222" stroke-width="1.5">
<rect x="30" y="215" width="100" height="40" fill="#ff6b6b" opacity="0.6"/>
<rect x="130" y="215" width="100" height="40" fill="#ffd23f"/>
<rect x="230" y="215" width="100" height="40" fill="#dddddd"/>
<rect x="330" y="215" width="200" height="40" fill="#39c86a" opacity="0.6"/>
<rect x="530" y="215" width="100" height="40" fill="#ffd23f"/>
<rect x="630" y="215" width="100" height="40" fill="#ffd23f"/>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="80" y="240">Neuer IP-Hdr</text><text x="180" y="240">ESP-Header</text><text x="280" y="240">Orig. IP-Hdr</text>
<text x="430" y="240">TCP/UDP + Daten</text><text x="580" y="240">ESP-Trailer</text><text x="680" y="240">ESP-Auth</text>
</g>
<line x1="230" y1="270" x2="630" y2="270" stroke="#4a9cff" stroke-width="4"/>
<text x="430" y="287" font-size="12" fill="#222" text-anchor="middle">verschlüsselt (inkl. Original-IP-Header)</text>
<line x1="130" y1="300" x2="630" y2="300" stroke="#b08aff" stroke-width="4"/>
<text x="380" y="317" font-size="12" fill="#222" text-anchor="middle">authentisiert – der neue äußere IP-Header nicht</text>
<g font-size="13" fill="#222">
<text x="30" y="355">Neuer IP-Header: Quelle/Ziel = VPN-Gateways (Tunnelendpunkte), +20 Byte gegenüber Transport Mode.</text>
<text x="30" y="378">ESP-Header: SPI + Sequenznummer (Anti-Replay). ESP-Trailer: Padding, Pad Length, Next Header.</text>
<text x="30" y="401">AH (IP 51) würde zusätzlich die festen Felder des äußeren IP-Headers prüfen → bricht bei NAT.</text>
<text x="30" y="424">ESP = IP-Protokoll 50; hinter NAT wird ESP per NAT-T in UDP 4500 gekapselt.</text>
</g>
</svg>
