<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>OSPF-Kosten und Referenzbandbreite</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">OSPF-Kosten = Referenzbandbreite ÷ Interface-Bandbreite</text>
<rect x="150" y="48" width="500" height="44" rx="8" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<text x="400" y="76" text-anchor="middle" font-size="14" fill="#222">ganzzahlig abgeschnitten · Minimum 1 · Maximum 65535 (16 Bit)</text>
<!-- Tabelle -->
<g font-size="13" fill="#222">
<rect x="30" y="110" width="740" height="28" fill="#4a9cff"/>
<text x="45" y="129" fill="#fff" font-weight="bold">Interface</text>
<text x="260" y="129" fill="#fff" font-weight="bold">Ref. 100 Mbit/s (Default)</text>
<text x="460" y="129" fill="#fff" font-weight="bold">Ref. 10 Gbit/s</text>
<text x="620" y="129" fill="#fff" font-weight="bold">Ref. 100 Gbit/s</text>
<text x="45" y="162">T1 1,544 Mbit/s</text><text x="260" y="162">64</text><text x="460" y="162">6476</text><text x="620" y="162">64766</text>
<text x="45" y="190">Ethernet 10 Mbit/s</text><text x="260" y="190">10</text><text x="460" y="190">1000</text><text x="620" y="190">10000</text>
<rect x="30" y="198" width="740" height="112" fill="#ffecec" opacity="0.6"/>
<text x="45" y="218">Fast Ethernet</text><text x="260" y="218" font-weight="bold">1</text><text x="460" y="218">100</text><text x="620" y="218">1000</text>
<text x="45" y="246">Gigabit Ethernet</text><text x="260" y="246" font-weight="bold">1</text><text x="460" y="246">10</text><text x="620" y="246">100</text>
<text x="45" y="274">10 Gigabit Ethernet</text><text x="260" y="274" font-weight="bold">1</text><text x="460" y="274">1</text><text x="620" y="274">10</text>
<text x="45" y="302">100 Gigabit Ethernet</text><text x="260" y="302" font-weight="bold">1</text><text x="460" y="302">1</text><text x="620" y="302">1</text>
</g>
<text x="320" y="260" font-size="12" fill="#ff6b6b" font-weight="bold">alles 1 →</text>
<text x="320" y="276" font-size="12" fill="#ff6b6b" font-weight="bold">keine Unter-</text>
<text x="320" y="292" font-size="12" fill="#ff6b6b" font-weight="bold">scheidung</text>
<!-- Merk -->
<g font-size="13" fill="#222">
<rect x="30" y="325" width="360" height="110" rx="10" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="45" y="350" font-weight="bold">Anpassen</text>
<text x="45" y="372" font-family="monospace" font-size="12">auto-cost reference-bandwidth 10000</text>
<text x="45" y="390">(Mbit/s, auf ALLEN Routern gleich)</text>
<text x="45" y="410" font-family="monospace" font-size="12">ip ospf cost 1-65535</text>
<text x="45" y="428">(je Interface, überschreibt Formel)</text>
<rect x="410" y="325" width="360" height="110" rx="10" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="425" y="350" font-weight="bold">Falle: zu hohe Referenz</text>
<text x="425" y="372">Langsame Links stoßen an 65535</text>
<text x="425" y="392">und sind untereinander gleich.</text>
<text x="425" y="414">Kosten zählen nur ausgehend,</text>
<text x="425" y="432">Pfad = Summe der Ausgänge.</text>
</g>
</svg>
