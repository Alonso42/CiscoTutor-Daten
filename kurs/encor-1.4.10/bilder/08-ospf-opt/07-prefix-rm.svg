<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Prefix-Lists und Route-Maps auswerten</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
</defs>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Prefix-List und Route-Map: Auswertungslogik</text>
<!-- Prefix list -->
<text x="200" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Prefix-List: Netz + Länge</text>
<g font-size="12" fill="#222">
<rect x="20" y="70" width="360" height="24" fill="#4a9cff"/>
<text x="28" y="87" fill="#fff" font-weight="bold">Eintrag</text><text x="210" y="87" fill="#fff" font-weight="bold">erlaubte Längen</text>
<text x="28" y="114" font-family="monospace">10.0.0.0/16</text><text x="210" y="114">genau /16</text>
<text x="28" y="138" font-family="monospace">10.0.0.0/8 le 16</text><text x="210" y="138">/8 bis /16</text>
<text x="28" y="162" font-family="monospace">10.0.0.0/8 ge 24</text><text x="210" y="162">/24 bis /32</text>
<text x="28" y="186" font-family="monospace">10.0.0.0/8 ge 24 le 24</text><text x="210" y="186">nur /24</text>
<text x="28" y="210" font-family="monospace">0.0.0.0/0 le 32</text><text x="210" y="210">alles</text>
<text x="28" y="234" font-family="monospace">0.0.0.0/0</text><text x="210" y="234">nur Default-Route</text>
</g>
<rect x="20" y="248" width="360" height="90" rx="8" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="30" y="268">Regel: len &lt; ge ≤ le ≤ 32</text>
<text x="30" y="288">seq automatisch 5, 10, 15 …</text>
<text x="30" y="308">erster Treffer entscheidet, Baumsuche</text>
<text x="30" y="328">am Ende implizites deny</text>
</g>
<!-- Route-map -->
<text x="600" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Route-Map: von oben nach unten</text>
<g font-size="12" fill="#222">
<rect x="420" y="70" width="360" height="74" rx="8" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="430" y="90" font-family="monospace">route-map RM permit 10</text>
<text x="430" y="110" font-family="monospace"> match ip address A1 A2</text>
<text x="640" y="110" fill="#4a9cff" font-weight="bold">A1 ODER A2</text>
<text x="430" y="130" font-family="monospace"> set metric-type type-1</text>
<rect x="420" y="160" width="360" height="74" rx="8" fill="#ffecec" stroke="#ff6b6b" stroke-width="2"/>
<text x="430" y="180" font-family="monospace">route-map RM deny 20</text>
<text x="430" y="200" font-family="monospace"> match ip address A3</text>
<text x="430" y="220" font-family="monospace"> match interface e0/0</text>
<text x="640" y="210" fill="#ff6b6b" font-weight="bold">A3 UND e0/0</text>
<rect x="420" y="250" width="360" height="40" rx="8" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="430" y="275" font-family="monospace">route-map RM permit 30</text>
<text x="640" y="275" fill="#39c86a" font-weight="bold">ohne match = alles</text>
<rect x="420" y="300" width="360" height="38" rx="8" fill="#f7f7f7" stroke="#222"/>
<text x="430" y="324">(implizites deny am Ende)</text>
</g>
<g stroke="#222" stroke-width="2" marker-end="url(#a)">
<line x1="410" y1="144" x2="410" y2="158"/>
<line x1="410" y1="234" x2="410" y2="248"/>
<line x1="410" y1="290" x2="410" y2="298"/>
</g>
<rect x="20" y="352" width="760" height="85" rx="8" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="32" y="374">• permit + Treffer: Route verwenden, set-Befehle anwenden, Ende · deny + Treffer: Route verwerfen, Ende</text>
<text x="32" y="394">• neue Route-Map ohne Nummer bekommt seq 10 · no route-map RM (ohne Nummer) löscht die ganze Map</text>
<text x="32" y="414">• Einsatz: Redistribution, PBR, BGP, distribute-list route-map … in</text>
<text x="32" y="432">• match ip route-source (OSPF): RID des LSA-Erzeugers</text>
</g>
</svg>
