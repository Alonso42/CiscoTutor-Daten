<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>OSPF-Filter: wo sie wirken</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
</defs>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Filtern in OSPF: LSA-Grenze oder nur lokale RIB?</text>
<rect x="20" y="50" width="230" height="170" rx="12" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="32" y="72" font-size="13" font-weight="bold" fill="#222">Area 1 (R2: 192.168.2.0/24)</text>
<rect x="285" y="50" width="230" height="170" rx="12" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="400" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Area 0 (R4)</text>
<rect x="550" y="50" width="230" height="170" rx="12" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="768" y="72" text-anchor="end" font-size="13" font-weight="bold" fill="#222">Area 2 (R3)</text>
<circle cx="400" cy="235" r="28" fill="#ffd23f"/><text x="400" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R1</text>
<text x="440" y="250" font-size="11" fill="#222">ABR</text>
<!-- out -->
<g stroke-width="3" marker-end="url(#a)">
<line x1="150" y1="110" x2="350" y2="110" stroke="#ff6b6b"/>
<line x1="150" y1="110" x2="620" y2="160" stroke="#ff6b6b" stroke-dasharray="6 4"/>
</g>
<text x="250" y="102" text-anchor="middle" font-size="11" fill="#222">✗ Typ 3</text>
<text x="590" y="182" font-size="11" fill="#222">✗ Typ 3</text>
<rect x="30" y="140" width="210" height="70" rx="6" fill="#fff" stroke="#ff6b6b"/>
<g font-size="11" fill="#222">
<text x="38" y="158" font-family="monospace">area 1 filter-list</text>
<text x="38" y="172" font-family="monospace"> prefix FROM_R2 out</text>
<text x="38" y="192">→ fehlt in ALLEN anderen Areas</text>
</g>
<rect x="295" y="140" width="210" height="70" rx="6" fill="#fff" stroke="#ff6b6b"/>
<g font-size="11" fill="#222">
<text x="303" y="158" font-family="monospace">area 0 filter-list</text>
<text x="303" y="172" font-family="monospace"> prefix FROM_R2 in</text>
<text x="303" y="192">→ fehlt nur in Area 0</text>
</g>
<!-- Tabelle -->
<g font-size="12" fill="#222">
<rect x="20" y="275" width="760" height="24" fill="#4a9cff"/>
<text x="30" y="292" fill="#fff" font-weight="bold">Werkzeug</text><text x="330" y="292" fill="#fff" font-weight="bold">Ort</text><text x="420" y="292" fill="#fff" font-weight="bold">LSDB geändert?</text><text x="560" y="292" fill="#fff" font-weight="bold">Wirkung</text>
<text x="30" y="318">area X filter-list prefix NAME in|out</text><text x="330" y="318">ABR</text><text x="420" y="318">ja (Typ 3)</text><text x="560" y="318">Präfix nicht in Ziel-Areas</text>
<text x="30" y="340">area X range … not-advertise</text><text x="330" y="340">ABR</text><text x="420" y="340">ja (Typ 3)</text><text x="560" y="340">ganzer Bereich unterdrückt</text>
<text x="30" y="362">summary-address … not-advertise</text><text x="330" y="362">ASBR</text><text x="420" y="362">ja (Typ 5)</text><text x="560" y="362">externe LSA entfällt überall</text>
<text x="30" y="384">distribute-list … in</text><text x="330" y="384">jeder</text><text x="420" y="384" fill="#ff6b6b" font-weight="bold">nein</text><text x="560" y="384">nur eigene RIB, Black-Hole-Risiko</text>
<text x="30" y="406">distribute-list … out</text><text x="330" y="406">ASBR</text><text x="420" y="406">ja (Typ 5)</text><text x="560" y="406">nur redistributierte Routen</text>
</g>
<text x="20" y="435" font-size="12" fill="#222">Gleiche LSDB in der Area nötig: LSA-Filter nur an Area-Grenzen/ASBR, sonst nur lokal. Danach: clear ip ospf process.</text>
</svg>
