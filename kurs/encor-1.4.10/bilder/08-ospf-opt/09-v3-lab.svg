<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Discovery 10: OSPFv3-Topologie und AF-Kosten</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Discovery 10: OSPFv3 mit IPv4- und IPv6-AF</text>
<rect x="20" y="50" width="300" height="200" rx="12" fill="#e8f8ee" stroke="#39c86a" stroke-width="2"/>
<text x="32" y="72" font-size="13" font-weight="bold" fill="#222">Area 0</text>
<rect x="400" y="45" width="380" height="120" rx="12" fill="#e8f1ff" stroke="#4a9cff" stroke-width="2"/>
<text x="768" y="67" text-anchor="end" font-size="13" font-weight="bold" fill="#222">Area 1</text>
<rect x="400" y="180" width="380" height="110" rx="12" fill="#f3edff" stroke="#b08aff" stroke-width="2"/>
<text x="768" y="280" text-anchor="end" font-size="13" font-weight="bold" fill="#222">Area 2</text>
<line x1="95" y1="160" x2="300" y2="160" stroke="#222" stroke-width="3"/>
<line x1="325" y1="148" x2="555" y2="100" stroke="#ffd23f" stroke-width="4"/>
<line x1="325" y1="172" x2="555" y2="230" stroke="#222" stroke-width="3"/>
<circle cx="70" cy="160" r="25" fill="#39c86a"/><text x="70" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">R4</text>
<circle cx="320" cy="160" r="27" fill="#ffd23f"/><text x="320" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R1</text>
<circle cx="580" cy="100" r="25" fill="#4a9cff"/><text x="580" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">R2</text>
<circle cx="580" cy="235" r="25" fill="#b08aff"/><text x="580" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">R3</text>
<g font-size="11" fill="#222">
<text x="40" y="205">Lo 2001:DB8:0:44::1/64</text>
<text x="120" y="150">Eth0/0 · 2001:DB8:0:14::/64</text>
<text x="120" y="180">172.16.14.0 · Kosten 10</text>
<text x="250" y="205">ABR</text>
<text x="190" y="225">Lo1 209.165.201.1/32</text>
<text x="190" y="240">(Internet-Simulation)</text>
<text x="360" y="88">Ser2/0 · 2001:DB8:0:12::/64</text>
<text x="370" y="103">IPv4 64 · IPv6 200</text>
<text x="615" y="95">2001:DB8:0:22::1/64</text>
<text x="615" y="110">+ 2001:DB8:0:220–22F::/64</text>
<text x="370" y="250">Eth0/1 · 2001:DB8:0:13::/64</text>
<text x="615" y="240">2001:DB8:0:33::1/64</text>
</g>
<rect x="20" y="300" width="370" height="140" rx="10" fill="#f7f7f7" stroke="#222"/>
<g font-size="11" fill="#222" font-family="monospace">
<text x="30" y="320">router ospfv3 1</text>
<text x="30" y="337"> address-family ipv6 unicast</text>
<text x="30" y="354">  area 1 range 2001:DB8:0:220::/60</text>
<text x="30" y="371">  default-information originate</text>
<text x="30" y="388"> address-family ipv4 unicast</text>
<text x="30" y="405">  default-information originate</text>
<text x="30" y="422">interface Serial2/0</text>
<text x="30" y="437"> ospfv3 1 ipv6 cost 200</text>
</g>
<rect x="410" y="300" width="370" height="140" rx="10" fill="#fff8d6" stroke="#ffd23f" stroke-width="2"/>
<g font-size="12" fill="#222">
<text x="422" y="322" font-weight="bold">Wirkung</text>
<text x="422" y="344">16 × /64 → eine OI-Route /60</text>
<text x="422" y="364">O*E2 0.0.0.0/0 und OE2 ::/0 (tag 1)</text>
<text x="422" y="388">R4 → 2001:DB8:0:22::/64:</text>
<text x="422" y="406">vorher 10 + 64 + 1 = 75</text>
<text x="422" y="424">nachher 10 + 200 + 1 = 211 (IPv4 bleibt 75)</text>
</g>
</svg>
