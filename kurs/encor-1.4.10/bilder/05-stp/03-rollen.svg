<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Root Port, Designated Port und Nondesignated Port bestimmen</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Port-Rollen im Dreieck (alle Links Kosten 100)</text>
<!-- links -->
<line x1="150" y1="95" x2="420" y2="95" stroke="#39c86a" stroke-width="4"/>
<line x1="105" y1="120" x2="105" y2="320" stroke="#39c86a" stroke-width="4"/>
<line x1="150" y1="330" x2="440" y2="115" stroke="#39c86a" stroke-width="4"/>
<line x1="150" y1="352" x2="455" y2="125" stroke="#bbb" stroke-width="4" stroke-dasharray="7 5"/>
<!-- switches -->
<rect x="60" y="70" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="105" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW1</text>
<text x="105" y="58" text-anchor="middle" font-size="11" fill="#222">32769 · aabb.cc00.4600</text>
<rect x="420" y="70" width="90" height="50" rx="6" fill="#39c86a"/>
<text x="465" y="101" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW2</text>
<text x="465" y="58" text-anchor="middle" font-size="11" fill="#222">Root · 32769 · aabb.cc00.4500</text>
<rect x="60" y="320" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="105" y="351" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW3</text>
<text x="105" y="392" text-anchor="middle" font-size="11" fill="#222">32769 · aabb.cc00.5000</text>
<!-- port labels -->
<g font-size="11" font-weight="bold">
<text x="155" y="88" fill="#4a9cff">E0/0 ROOT</text>
<text x="350" y="88" fill="#39c86a">E0/2 DESG</text>
<text x="112" y="140" fill="#39c86a">E0/1 DESG</text>
<text x="98" y="305" text-anchor="end" fill="#ff6b6b">E0/3 NONDESG</text>
<text x="160" y="318" fill="#4a9cff">E0/1 ROOT</text>
<text x="160" y="378" fill="#ff6b6b">E0/2 NONDESG</text>
<text x="452" y="142" fill="#39c86a">E0/1 DESG · 128.2</text>
<text x="468" y="158" fill="#39c86a">E0/3 DESG · 128.4</text>
</g>
<!-- Erklaerung -->
<rect x="560" y="170" width="225" height="265" rx="8" fill="#f7f7f7" stroke="#222"/>
<g font-size="12" fill="#222">
<text x="572" y="192" font-weight="bold">1 Root Bridge</text>
<text x="572" y="210">gleiche Prio → SW2 kleinste MAC</text>
<text x="572" y="226">→ alle Ports designated</text>
<text x="572" y="252" font-weight="bold">2 Root Ports</text>
<text x="572" y="270">SW1: direkt 100 &lt; über SW3 200</text>
<text x="572" y="286">SW3: zwei Links zu SW2, gleiche</text>
<text x="572" y="302">Kosten + gleiche Sender-BID →</text>
<text x="572" y="318">Sender-Port-ID 128.2 &lt; 128.4</text>
<text x="572" y="344" font-weight="bold">3 Designated (SW1–SW3)</text>
<text x="572" y="362">beide 100 zur Root → kleinere</text>
<text x="572" y="378">BID gewinnt: SW1 (…4600)</text>
<text x="572" y="404" font-weight="bold">Rest = nondesignated</text>
<text x="572" y="422">SW3 E0/2 und E0/3 blockieren</text>
</g>
<rect x="20" y="410" width="520" height="30" rx="6" fill="#fffbe6" stroke="#ffd23f"/>
<text x="30" y="430" font-size="12" fill="#222">Tie-Breaker: Root Path Cost → Sender-BID → Sender-Port-ID (niedriger gewinnt)</text>
</svg>
