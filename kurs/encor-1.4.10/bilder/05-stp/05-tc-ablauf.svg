<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Topology Change bei 802.1D und RSTP</title>
<rect width="800" height="450" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker></defs>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Topology Change: 802.1D gegen RSTP</text>
<line x1="400" y1="45" x2="400" y2="440" stroke="#ccc" stroke-width="2"/>
<!-- links 802.1D -->
<text x="200" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">802.1D (über die Root)</text>
<rect x="150" y="75" width="100" height="40" rx="6" fill="#39c86a"/><text x="200" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Root</text>
<rect x="150" y="185" width="100" height="40" rx="6" fill="#4a9cff"/><text x="200" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">SW B</text>
<rect x="150" y="295" width="100" height="40" rx="6" fill="#4a9cff"/><text x="200" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">SW C</text>
<line x1="200" y1="115" x2="200" y2="185" stroke="#222" stroke-width="3"/>
<line x1="200" y1="225" x2="200" y2="295" stroke="#222" stroke-width="3"/>
<line x1="250" y1="315" x2="330" y2="315" stroke="#222" stroke-width="3"/>
<text x="318" y="307" font-size="20" fill="#ff6b6b">✕</text>
<text x="300" y="340" font-size="11" fill="#222">Link down</text>
<line x1="185" y1="292" x2="185" y2="230" stroke="#ffd23f" stroke-width="3" marker-end="url(#a)"/>
<text x="40" y="262" font-size="11" fill="#222">① TCN auf Root Port</text>
<line x1="215" y1="230" x2="215" y2="292" stroke="#b08aff" stroke-width="3" marker-end="url(#a)"/>
<text x="222" y="262" font-size="11" fill="#222">② TCA-Bit zurück</text>
<line x1="185" y1="182" x2="185" y2="120" stroke="#ffd23f" stroke-width="3" marker-end="url(#a)"/>
<text x="40" y="152" font-size="11" fill="#222">③ B leitet TCN weiter</text>
<line x1="215" y1="120" x2="215" y2="182" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a)"/>
<text x="222" y="152" font-size="11" fill="#222">④ Root: TC-Bit an alle</text>
<rect x="20" y="360" width="365" height="78" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="32" y="382" font-size="12" fill="#222">• Root setzt TC für Max Age + FD = 35 s</text>
<text x="32" y="402" font-size="12" fill="#222">• Empfänger: MAC-Aging auf 15 s verkürzt</text>
<text x="32" y="422" font-size="12" fill="#222">• Auslöser: Link down ODER Port wird forwarding</text>
<!-- rechts RSTP -->
<text x="600" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">RSTP (Auslöser flutet selbst)</text>
<rect x="555" y="75" width="90" height="38" rx="6" fill="#39c86a"/><text x="600" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">SW1 Root</text>
<rect x="440" y="160" width="80" height="36" rx="6" fill="#4a9cff"/><text x="480" y="183" text-anchor="middle" font-size="13" fill="#fff">SW2</text>
<rect x="680" y="160" width="80" height="36" rx="6" fill="#4a9cff"/><text x="720" y="183" text-anchor="middle" font-size="13" fill="#fff">SW3</text>
<rect x="440" y="260" width="80" height="36" rx="6" fill="#4a9cff"/><text x="480" y="283" text-anchor="middle" font-size="13" fill="#fff">SW4</text>
<rect x="680" y="260" width="80" height="36" rx="6" fill="#4a9cff"/><text x="720" y="283" text-anchor="middle" font-size="13" fill="#fff">SW5</text>
<line x1="575" y1="113" x2="490" y2="160" stroke="#222" stroke-width="3"/>
<line x1="625" y1="113" x2="710" y2="160" stroke="#222" stroke-width="3"/>
<line x1="480" y1="196" x2="480" y2="260" stroke="#222" stroke-width="3"/>
<line x1="720" y1="196" x2="720" y2="260" stroke="#39c86a" stroke-width="3"/>
<line x1="520" y1="278" x2="680" y2="278" stroke="#222" stroke-width="3"/>
<text x="590" y="285" font-size="20" fill="#ff6b6b">✕</text>
<line x1="735" y1="258" x2="735" y2="200" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a)"/>
<text x="742" y="232" font-size="11" fill="#ff6b6b">TC</text>
<line x1="700" y1="158" x2="640" y2="118" stroke="#ff6b6b" stroke-width="3" marker-end="url(#a)"/>
<text x="672" y="128" font-size="11" fill="#ff6b6b">TC</text>
<text x="600" y="322" text-anchor="middle" font-size="11" fill="#222">SW4–SW5 fällt aus → SW5 schaltet Alternate zu SW3 frei</text>
<rect x="415" y="335" width="365" height="103" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="427" y="356" font-size="12" fill="#222">• TC nur, wenn ein Nonedge-Port forwarding wird</text>
<text x="427" y="375" font-size="12" fill="#222">• Linkverlust allein ist keine TC</text>
<text x="427" y="394" font-size="12" fill="#222">• TC-Bit auf Designated- und Root Port, kein TCN</text>
<text x="427" y="413" font-size="12" fill="#222">• Empfänger flusht MACs aller Ports außer Eingang</text>
<text x="427" y="432" font-size="12" fill="#222">• Edge-/PortFast-Ports: keine TC, kein Flush</text>
</svg>
