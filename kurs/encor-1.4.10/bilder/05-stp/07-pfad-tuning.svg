<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Root Port beeinflussen: Kosten lokal, Port-Priorität beim Nachbarn</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Welcher Link wird Root Port von SW3?</text>
<rect x="320" y="55" width="160" height="50" rx="6" fill="#39c86a"/>
<text x="400" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW2 (Root)</text>
<rect x="320" y="200" width="160" height="50" rx="6" fill="#4a9cff"/>
<text x="400" y="231" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW3</text>
<line x1="360" y1="105" x2="360" y2="200" stroke="#39c86a" stroke-width="4"/>
<line x1="440" y1="105" x2="440" y2="200" stroke="#bbb" stroke-width="4" stroke-dasharray="7 5"/>
<g font-size="12" fill="#222">
<text x="352" y="122" text-anchor="end">E0/1 · Port-ID 128.2</text>
<text x="352" y="192" text-anchor="end">E0/1 · Kosten 100 → Root</text>
<text x="448" y="122">E0/3 · Port-ID 128.4</text>
<text x="448" y="192">E0/2 · Kosten 100 → Altn/BLK</text>
</g>
<text x="400" y="272" text-anchor="middle" font-size="12" fill="#222">Kosten gleich (100), Sender-BID gleich (beides SW2) → kleinere Sender-Port-ID 128.2 gewinnt</text>
<rect x="20" y="292" width="370" height="145" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<text x="32" y="314" font-size="14" font-weight="bold" fill="#222">Variante A: Kosten (auf SW3 selbst)</text>
<g font-size="12" font-family="monospace" fill="#222">
<text x="32" y="338">SW3(config)# interface e0/2</text>
<text x="32" y="356">SW3(config-if)# spanning-tree vlan 1 cost 16</text>
</g>
<text x="32" y="382" font-size="12" fill="#222">Root Path Cost über E0/2 = 16 &lt; 100</text>
<text x="32" y="402" font-size="12" fill="#222">→ E0/2 wird Root Port, E0/1 blockiert</text>
<text x="32" y="424" font-size="11" fill="#222">wirkt auf den eigenen Root-Port-Vergleich</text>
<rect x="410" y="292" width="370" height="145" rx="8" fill="#fffbe6" stroke="#ffd23f"/>
<text x="422" y="314" font-size="14" font-weight="bold" fill="#222">Variante B: Port-Priorität (auf SW2)</text>
<g font-size="12" font-family="monospace" fill="#222">
<text x="422" y="338">SW2(config)# interface e0/3</text>
<text x="422" y="356">SW2(config-if)# spanning-tree vlan 1</text>
<text x="422" y="372">                 port-priority 64</text>
</g>
<text x="422" y="396" font-size="12" fill="#222">SW2 sendet nun Port-ID 64.4 &lt; 128.2</text>
<text x="422" y="414" font-size="12" fill="#222">→ SW3 wählt E0/2 als Root Port</text>
<text x="422" y="430" font-size="11" fill="#222">Default 128, Schritte 16 (0–240), wirkt beim Nachbarn</text>
</svg>
