<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>MST-Fallstrick: Pruning und Access-Links zwischen Switches</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MST-Falle: Instanz blockiert den einzigen Weg eines VLANs</text>
<!-- Fall 1 -->
<text x="20" y="62" font-size="14" font-weight="bold" fill="#222">Fall A: VLAN 10 und 20 beide in MST1, Links getrennt (Pruning oder Access)</text>
<rect x="60" y="80" width="90" height="80" rx="6" fill="#4a9cff"/><text x="105" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">SW-A</text>
<rect x="470" y="80" width="90" height="80" rx="6" fill="#4a9cff"/><text x="515" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">SW-B</text>
<line x1="150" y1="98" x2="470" y2="98" stroke="#ffd23f" stroke-width="4"/>
<line x1="150" y1="142" x2="470" y2="142" stroke="#39c86a" stroke-width="4"/>
<text x="310" y="91" text-anchor="middle" font-size="12" fill="#222">nur VLAN 10 erlaubt</text>
<text x="310" y="160" text-anchor="middle" font-size="12" fill="#222">nur VLAN 20 erlaubt</text>
<text x="440" y="107" font-size="22" fill="#ff6b6b">✕</text>
<rect x="590" y="80" width="190" height="80" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="600" y="100" font-size="12" fill="#222">MST1 läuft auf beiden</text>
<text x="600" y="117" font-size="12" fill="#222">Links, sieht eine Schleife</text>
<text x="600" y="134" font-size="12" fill="#222">und blockiert einen →</text>
<text x="600" y="151" font-size="12" fill="#ff6b6b" font-weight="bold">VLAN 10 unterbrochen</text>
<!-- Fall 2 -->
<text x="20" y="200" font-size="14" font-weight="bold" fill="#222">Fall B: Access-Links, VLAN 10 → MST0 (IST), VLAN 20 → MST1</text>
<rect x="60" y="218" width="90" height="80" rx="6" fill="#4a9cff"/><text x="105" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">SW-A</text>
<rect x="470" y="218" width="90" height="80" rx="6" fill="#4a9cff"/><text x="515" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">SW-B</text>
<line x1="150" y1="236" x2="470" y2="236" stroke="#b08aff" stroke-width="4"/>
<line x1="150" y1="280" x2="470" y2="280" stroke="#ffd23f" stroke-width="4"/>
<text x="310" y="229" text-anchor="middle" font-size="12" fill="#222">Access VLAN 20 (MST1) · IST-BPDU</text>
<text x="310" y="298" text-anchor="middle" font-size="12" fill="#222">Access VLAN 10 (MST0) · IST-BPDU</text>
<text x="440" y="289" font-size="22" fill="#ff6b6b">✕</text>
<rect x="590" y="218" width="190" height="80" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="600" y="238" font-size="12" fill="#222">Nur eine BPDU (IST) für</text>
<text x="600" y="255" font-size="12" fill="#222">alle Instanzen → MST0 sieht</text>
<text x="600" y="272" font-size="12" fill="#222">beide Links, blockiert einen</text>
<text x="600" y="289" font-size="12" fill="#ff6b6b" font-weight="bold">→ VLAN 10 unterbrochen</text>
<!-- Regeln -->
<rect x="20" y="325" width="760" height="110" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="35" y="350" font-size="14" font-weight="bold" fill="#222">Best Practice MST</text>
<g font-size="13" fill="#222">
<text x="35" y="375">• Switches nur über Trunks verbinden, keine Access-Links zwischen Switches</text>
<text x="35" y="397">• Kein manuelles VLAN-Pruning auf Trunks (jede Instanz läuft auf jedem Link, anders als PVST+)</text>
<text x="35" y="419">• Keine Nutz-VLANs auf die IST (MST0) mappen – die IST ist auf allen Ports aktiv</text>
</g>
</svg>
