<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>Layer-2-Schleife und die STP-Lösung</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Redundanz ohne STP = Bridging Loop</text>
<!-- oben: ohne STP -->
<text x="20" y="62" font-size="14" font-weight="bold" fill="#ff6b6b">Ohne STP</text>
<rect x="30" y="95" width="60" height="40" rx="3" fill="#eee" stroke="#222"/>
<text x="60" y="120" text-anchor="middle" font-size="13" fill="#222">Host X</text>
<rect x="200" y="90" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="245" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW A</text>
<rect x="470" y="90" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="515" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW B</text>
<rect x="680" y="95" width="60" height="40" rx="3" fill="#eee" stroke="#222"/>
<text x="710" y="120" text-anchor="middle" font-size="13" fill="#222">Host Y</text>
<line x1="90" y1="115" x2="200" y2="115" stroke="#222" stroke-width="3"/>
<line x1="560" y1="115" x2="680" y2="115" stroke="#222" stroke-width="3"/>
<line x1="290" y1="102" x2="470" y2="102" stroke="#ff6b6b" stroke-width="3"/>
<line x1="290" y1="128" x2="470" y2="128" stroke="#ff6b6b" stroke-width="3"/>
<path d="M300 85 C 380 60, 400 60, 460 85" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M460 145 C 400 170, 380 170, 300 145" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
<text x="380" y="62" text-anchor="middle" font-size="12" fill="#ff6b6b">Frame kreist (kein TTL)</text>
<rect x="30" y="185" width="235" height="78" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="42" y="207" font-size="14" font-weight="bold" fill="#222">1 Broadcast-Sturm</text>
<text x="42" y="228" font-size="12" fill="#222">Broadcasts werden endlos</text>
<text x="42" y="246" font-size="12" fill="#222">geflutet und vervielfacht</text>
<rect x="282" y="185" width="235" height="78" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="294" y="207" font-size="14" font-weight="bold" fill="#222">2 Mehrfachzustellung</text>
<text x="294" y="228" font-size="12" fill="#222">Host Y erhält denselben</text>
<text x="294" y="246" font-size="12" fill="#222">Unicast mehrmals</text>
<rect x="534" y="185" width="235" height="78" rx="8" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="546" y="207" font-size="14" font-weight="bold" fill="#222">3 MAC-Tabelle instabil</text>
<text x="546" y="228" font-size="12" fill="#222">MAC von Host X springt</text>
<text x="546" y="246" font-size="12" fill="#222">zwischen den Ports hin und her</text>
<!-- unten: mit STP -->
<text x="20" y="300" font-size="14" font-weight="bold" fill="#39c86a">Mit STP</text>
<rect x="200" y="320" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="245" y="351" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW A</text>
<rect x="470" y="320" width="90" height="50" rx="6" fill="#4a9cff"/>
<text x="515" y="351" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">SW B</text>
<line x1="290" y1="332" x2="470" y2="332" stroke="#39c86a" stroke-width="3"/>
<line x1="290" y1="358" x2="470" y2="358" stroke="#bbb" stroke-width="3" stroke-dasharray="6 4"/>
<text x="380" y="326" text-anchor="middle" font-size="12" fill="#222">aktiv (forwarding)</text>
<line x1="447" y1="350" x2="461" y2="366" stroke="#ff6b6b" stroke-width="3"/>
<line x1="461" y1="350" x2="447" y2="366" stroke="#ff6b6b" stroke-width="3"/>
<text x="380" y="385" text-anchor="middle" font-size="12" fill="#222">Port auf SW B blockiert (Standby)</text>
<rect x="590" y="300" width="190" height="130" rx="8" fill="#eefaf2" stroke="#39c86a"/>
<text x="602" y="322" font-size="12" fill="#222">• genau ein aktiver Weg</text>
<text x="602" y="342" font-size="12" fill="#222">  pro Segment</text>
<text x="602" y="364" font-size="12" fill="#222">• blockierter Port hört</text>
<text x="602" y="384" font-size="12" fill="#222">  weiter BPDUs</text>
<text x="602" y="406" font-size="12" fill="#222">• Ausfall → Ersatzweg</text>
<text x="602" y="424" font-size="12" fill="#222">  wird freigeschaltet</text>
</svg>
