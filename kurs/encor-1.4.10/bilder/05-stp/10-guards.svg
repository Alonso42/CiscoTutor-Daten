<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
<title>STP-Schutzfunktionen im Campus</title>
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Wo sitzen PortFast, BPDU Guard, Root Guard, Loop Guard?</text>
<!-- Distribution -->
<rect x="120" y="55" width="120" height="48" rx="6" fill="#39c86a"/>
<text x="180" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">DSW1 Root</text>
<rect x="320" y="55" width="120" height="48" rx="6" fill="#4a9cff"/>
<text x="380" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">DSW2</text>
<line x1="240" y1="79" x2="320" y2="79" stroke="#222" stroke-width="3"/>
<!-- Access -->
<rect x="220" y="215" width="120" height="48" rx="6" fill="#4a9cff"/>
<text x="280" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">ASW</text>
<line x1="180" y1="103" x2="260" y2="215" stroke="#222" stroke-width="3"/>
<line x1="380" y1="103" x2="300" y2="215" stroke="#222" stroke-width="3"/>
<!-- Root guard markers -->
<circle cx="190" cy="118" r="9" fill="#b08aff"/><text x="190" y="122" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">R</text>
<circle cx="370" cy="118" r="9" fill="#b08aff"/><text x="370" y="122" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">R</text>
<!-- Loop guard markers -->
<circle cx="250" cy="200" r="9" fill="#ffd23f"/><text x="250" y="204" text-anchor="middle" font-size="10" fill="#222" font-weight="bold">L</text>
<circle cx="310" cy="200" r="9" fill="#ffd23f"/><text x="310" y="204" text-anchor="middle" font-size="10" fill="#222" font-weight="bold">L</text>
<!-- Hosts -->
<rect x="170" y="340" width="70" height="40" rx="3" fill="#eee" stroke="#222"/><text x="205" y="365" text-anchor="middle" font-size="12" fill="#222">PC</text>
<rect x="320" y="340" width="70" height="40" rx="3" fill="#eee" stroke="#222"/><text x="355" y="365" text-anchor="middle" font-size="12" fill="#222">Server</text>
<line x1="260" y1="263" x2="205" y2="340" stroke="#222" stroke-width="3"/>
<line x1="300" y1="263" x2="355" y2="340" stroke="#222" stroke-width="3"/>
<circle cx="245" cy="283" r="9" fill="#ff6b6b"/><text x="245" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">P</text>
<circle cx="315" cy="283" r="9" fill="#ff6b6b"/><text x="315" y="287" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">P</text>
<rect x="20" y="400" width="420" height="38" rx="6" fill="#fff0f0" stroke="#ff6b6b"/>
<text x="30" y="416" font-size="11" fill="#222">Angreifer/Mini-Switch am Host-Port sendet BPDU mit Prio 0 →</text>
<text x="30" y="431" font-size="11" fill="#222">BPDU Guard: err-disabled · ohne Schutz: neue Root, MitM möglich</text>
<!-- Legende -->
<g font-size="12" fill="#222">
<circle cx="478" cy="62" r="9" fill="#ff6b6b"/><text x="478" y="66" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">P</text>
<text x="495" y="58" font-weight="bold">PortFast + BPDU Guard</text>
<text x="495" y="75">Host-Ports: sofort forwarding;</text>
<text x="495" y="91">jede BPDU → err-disabled</text>
<text x="495" y="107" font-family="monospace" font-size="10">spanning-tree portfast / bpduguard enable</text>
<circle cx="478" cy="145" r="9" fill="#b08aff"/><text x="478" y="149" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">R</text>
<text x="495" y="141" font-weight="bold">Root Guard (Distribution → Access)</text>
<text x="495" y="158">superiore BPDU → root-inconsistent</text>
<text x="495" y="174">(wie listening), Erholung automatisch</text>
<text x="495" y="190" font-family="monospace" font-size="10">spanning-tree guard root</text>
<circle cx="478" cy="228" r="9" fill="#ffd23f"/><text x="478" y="232" text-anchor="middle" font-size="10" fill="#222" font-weight="bold">L</text>
<text x="495" y="224" font-weight="bold">Loop Guard (Root-/Alternate-Ports)</text>
<text x="495" y="241">BPDUs bleiben aus → loop-inconsistent</text>
<text x="495" y="257">statt forwarding, Erholung bei BPDU</text>
<text x="495" y="273" font-family="monospace" font-size="10">spanning-tree guard loop</text>
</g>
<rect x="465" y="295" width="320" height="143" rx="8" fill="#f5f8ff" stroke="#4a9cff"/>
<g font-size="11" fill="#222">
<text x="475" y="314" font-weight="bold" font-size="12">Global (alle passenden Ports)</text>
<text x="475" y="332" font-family="monospace">spanning-tree portfast default</text>
<text x="475" y="348" font-family="monospace">spanning-tree portfast bpduguard default</text>
<text x="475" y="364" font-family="monospace">spanning-tree loopguard default</text>
<text x="475" y="384">Prüfen: show spanning-tree summary,</text>
<text x="475" y="400">show spanning-tree inconsistentports,</text>
<text x="475" y="416">show interfaces status err-disabled</text>
<text x="475" y="432">Erholung: shut/no shut oder errdisable recovery</text>
</g>
</svg>
